// Same interactive slider as the page above, same card frame as everything
// else here. The paragraph explaining it got cut to one line, the live
// math trace stays, that is the part that actually earns trust.
function sensitivityCard(opts){
  const o = opts || {};
  const base = sensBase();
  if (!base){
    const s = computeStatement();
    const note = s.included.length === 0
      ? noRobotNote()
      : 'Every included robot here is priced by the active hour, not by a per-task rate, so there is no throughput assumption to test. This card appears once a per-run or per-pick robot is in the fleet.';
    const none = (o.bare ? '' : '<div style="font-size:13.5px;font-weight:600;color:var(--fg1);margin-bottom:2px">The one input you cannot measure</div>')
      + '<div style="font-size:13px;color:var(--fg2);line-height:1.6">'+note+'</div>';
    return o.bare ? none : '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px;margin-bottom:20px">'+none+'</div>';
  }
  const min = Math.max(1, Math.round(base.benchUnitsPerHour * 0.5));
  const max = Math.max(min + 1, Math.round(base.benchUnitsPerHour * 2));
  const t = Math.min(max, Math.max(min, S.throughput));
  const c = calc(t, base);
  const be = breakEven(base);
  const secs = Math.round(3600 / be);
  const fill = ((t - min) / (max - min) * 100).toFixed(1);
  const unitLabel = base.unit+'s/hr';
  const inner = (o.bare ? '' : '<div style="font-size:13.5px;font-weight:600;color:var(--fg1);margin-bottom:2px">The one input you cannot measure</div>')
    + '<div style="font-size:12px;color:var(--fg3);margin-bottom:18px">Every figure here assumes '+base.benchUnitsPerHour+' '+unitLabel+' for '+esc(base.work.toLowerCase())+' ('+base.domCount+' robot'+(base.domCount===1?'':'s')+'). Drag it and they move with you.</div>'
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:16px">'
      + '<input id="sensRange" class="bl-slider" type="range" min="'+min+'" max="'+max+'" step="1" value="'+t+'" style="flex:1;min-width:120px;--bl-fill:'+fill+'%" aria-label="'+esc(base.unit)+'s a person completes per hour">'
      + '<div style="text-align:right;flex:none">'
        + '<div style="font-variant-numeric:tabular-nums;font-size:13px;color:var(--fg1);white-space:nowrap"><b id="sensT" style="font-weight:600">'+t+'</b> '+unitLabel+'</div>'
        + '<div style="font-size:11px;color:var(--fg3);white-space:nowrap">= <b id="sensCovBig" style="color:var(--fg1);font-weight:600">'+c.cov.toFixed(2)+'x</b> coverage</div>'
      + '</div>'
    + '</div>'
    + '<div style="margin-top:2px;font-size:12.5px;line-height:1.6;color:var(--fg2)">Coverage falls to 1.00x at <b style="color:var(--fg1);font-weight:600">'+be+' '+unitLabel+'</b>'+(secs>0&&secs<3600?', one every '+secs+'s for a whole shift':'')+'.</div>';
  return o.bare ? inner : '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px;margin-bottom:20px">'+inner+'</div>';
}

/** Which robots the cost comparison is about. S.costScope is either
 * "work:<category>" or "robot:<index>"; anything stale (a category that no
 * longer exists, a robot outside the current site scope) falls back to the
 * biggest category rather than rendering an empty card. */
/** The whole fleet, one site, one kind of work, or one robot.
 *
 * Reads from every robot rather than from the site-filtered statement, so
 * this card can go BROADER than the site filter as well as narrower. The
 * site filter still drives it: changing site sets this to that site (see
 * setDashScope), and from there you can drill down without the page moving.
 *
 * `perUnit` is false wherever the scope mixes units. Picks and active hours
 * cannot be averaged into one cost per unit, so those levels compare total
 * dollars instead, which is unit-free and says the same thing. */
function costScope(){
  const all = computeStatement(true, null);
  const rowsOf = (pred) => all.rows.filter(r => !r.excluded && pred(r));
  const unitsOf = (rows) => [...new Set(rows.map(r => r.work))];
  const build = (key, label, rows) => {
    const works = unitsOf(rows);
    const perUnit = works.length === 1;
    return { key, label, rows, perUnit, work: perUnit ? works[0] : null, workCount: works.length };
  };
  const whole = () => build('all', 'Your whole fleet · all 13 robots, every kind of work', rowsOf(() => true));

  const raw = String(S.costScope || '');
  if (raw === 'all') return whole();
  if (raw.startsWith('site:')){
    const n = Number(raw.slice(5));
    const rows = rowsOf(r => CONFIRM[r.i].site === n);
    if (!rows.length) return whole();
    return build(raw, esc(SITES[n].name)+' · all '+rows.length+' robot'+(rows.length===1?'':'s')+' at this site', rows);
  }
  if (raw.startsWith('robot:')){
    const i = Number(raw.slice(6));
    const row = all.rows.find(r => r.i === i && !r.excluded);
    if (!row) return whole();
    return build(raw, esc(row.name)+' · one robot, against a person doing '+esc(row.work.toLowerCase()), [row]);
  }
  if (raw.startsWith('work:')){
    const w = raw.slice(5);
    const rows = rowsOf(r => r.work === w);
    if (!rows.length) return whole();
    return build(raw, esc(w)+' · all '+rows.length+' robot'+(rows.length===1?'':'s')+' doing it', rows);
  }
  return whole();
}

/** Four levels, widest first, so the list reads as zooming in. */
function costScopePicker(scope){
  const all = computeStatement(true, null);
  const live = all.rows.filter(r => !r.excluded);
  const works = [...new Set(live.map(r => r.work))];
  const opt = (val, text) => '<option value="'+esc(val)+'"'+(scope.key === val ? ' selected' : '')+'>'+esc(text)+'</option>';
  return '<select data-cost-scope style="width:100%;font-size:12.5px;color:var(--fg1);background:transparent;padding:7px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-family:inherit;cursor:pointer">'
    + opt('all', 'Your whole fleet')
    + '<optgroup label="One site">'
      + SITES.map((st,i) => live.some(r => CONFIRM[r.i].site === i) ? opt('site:'+i, st.name) : '').join('')
    + '</optgroup>'
    + '<optgroup label="One kind of work">'
      + works.map(w => opt('work:'+w, w)).join('')
    + '</optgroup>'
    + '<optgroup label="One robot">'
      + live.map(r => opt('robot:'+r.i, r.name)).join('')
    + '</optgroup>'
  + '</select>';
}

function costCard(opts){
  const o = opts || {};
  const s = computeStatement();
  if (s.byCategory.length === 0){
    const none = fig('Cost per task','—',noRobotNote(),'','');
    return o.bare ? none : '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'+none+'</div>';
  }
  // The dashboard's biggest category by value, since "cost per task" only
  // means one thing when every included robot bills the same way. A mixed
  // fleet still gets a real number, just for the work that carries it.
  // Whole fleet, one site, one kind of work, or one robot. Per-robot
  // matters because an average hides the one unit that is not paying for
  // itself, which is the finding an owner actually needs.
  const scope = costScope();
  const rows = scope.rows;
  const b = scope.perUnit ? workDef(scope.work) : null;

  // Totals work at every level. Per-unit only works where the scope has one
  // unit: picks and active hours cannot be averaged into a single "cost per
  // unit" without inventing a number.
  const invoiceSum = Math.round(rows.reduce((a,r) => a + r.invoice, 0) * 100) / 100;
  const valueSum = Math.round(rows.reduce((a,r) => a + r.value, 0) * 100) / 100;
  const unitSum = Math.round(rows.reduce((a,r) => a + r.units, 0) * 10) / 10;

  // Reads the owner's own wage and throughput (see wageFor/throughputFor),
  // not the published benchmark, so this agrees with the rate the Numbers
  // page derives rather than quoting our defaults back at them.
  const rc = scope.perUnit ? rateCentsFor(scope.work) : null;
  const human = scope.perUnit ? (rc === null ? null : rc / 100) : valueSum;
  // Robot cost: what was invoiced over what was produced. Deliberately the
  // lease invoice and not the purchase price, so both sides are "cost this
  // period over output this period" and neither needs an assumed useful
  // life on top of everything else.
  // The lease invoice is not what the robots cost. The time the team
  // spends unsticking and hand-driving them is real money, it arrives on
  // no invoice, and any operator who has actually run a fleet knows it is
  // missing — leaving it out is what makes this card read as a brochure.
  // Totals carry it. Per-unit is deliberately left alone: dividing labour
  // by picks would restate the cost-per-unit figure the brand table on
  // Costs defines as invoice over output, and two pages would then answer
  // the same question differently.
  const keep = keepingFor(rows, S.stallMinutes);
  const robot = scope.perUnit ? (unitSum > 0 ? invoiceSum / unitSum : null) : Math.round((invoiceSum + keep.total) * 100) / 100;
  const money2 = (v) => v === null ? '—' : money(v);

  // A bar per side, both scaled to whichever costs more, so the gap is seen
  // before it is read. Two numbers in a column make you do the comparison
  // yourself; two bars do it for you, which matters most for the reader who
  // has no feel yet for whether $0.18 a pick is good.
  const worst = Math.max(human || 0, robot || 0) || 1;
  const line = (who, val, deriv, amount, fill) => {
    const pct = amount === null ? 0 : Math.max(2, (amount / worst) * 100);
    return '<div style="margin-bottom:14px">'
      + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:5px">'
        + '<span style="font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3)">'+who+'</span>'
        + '<span style="font-size:18px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+val+'</span></div>'
      + '<div style="height:7px;background:var(--ghost);border-radius:2px;overflow:hidden;margin-bottom:5px">'
        + '<div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+fill+'"></div></div>'
      + '<div style="font-size:11px;color:var(--fg3);line-height:1.5">'+deriv+'</div>'
    + '</div>';
  };

  // "Your robots" is wrong when the scope is one robot, and the ratio is
  // that robot's coverage, not the whole category's.
  const one = rows.length === 1;
  const subject = one ? 'This robot' : 'Your robots';

  let verdict = '';
  if (human !== null && robot !== null && robot > 0){
    const ratio = human / robot;
    const cheaper = ratio >= 1;
    const gap = Math.round(Math.abs(human - robot) * 100) / 100;
    // Per unit, the gap only means something once multiplied out by what
    // was actually done. At totals it already is the period figure.
    const periodGap = scope.perUnit ? Math.round(gap * unitSum * 100) / 100 : gap;
    // Stated either way round. Robots costing more than people is the
    // finding this product exists to surface, not something to bury by
    // rendering only the flattering case.
    const headline = scope.perUnit
      ? subject+' cost'+(one?'s':'')+' '+money(gap)+' '+(cheaper?'less':'more')+' per '+esc(b.unit)
      : subject+' cost'+(one?'s':'')+' '+money(gap)+' '+(cheaper?'less':'more')+' this period';
    verdict = '<div style="border-top:1px solid var(--hair);padding-top:12px">'
      + '<div style="font-size:13px;color:var(--fg1);font-weight:600;margin-bottom:5px">'+headline+'</div>'
      + (scope.perUnit
        ? '<div style="font-size:12px;color:var(--fg2);line-height:1.6;margin-bottom:8px">'
            + 'Across '+unitSum.toLocaleString('en-US')+' '+esc(b.unitPlural)+' this period, that is <b style="color:var(--fg1);font-weight:600">'+money(periodGap)+'</b> '
            + (cheaper ? 'less than paying people to do it.' : 'more than paying people to do it.')
          + '</div>'
        : '')
      + '<div style="font-size:11px;color:var(--fg3);line-height:1.6">'
        + ratio.toFixed(2)+'x, '
        + (one ? 'this robot&#39;s' : 'this slice&#39;s')+' coverage.'
      + '</div>'
      // Says where the second half of the robots' cost came from, and how
      // to go and check it, rather than asking the reader to notice that
      // the figure is no longer the invoice.
      + ((!scope.perUnit && keep.total > 0)
        ? '<div style="font-size:11px;color:var(--fg3);line-height:1.6;margin-top:5px">Keeping them running is counted here. <span data-act="go" data-view="costs" style="color:var(--fg1);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px">See Costs</span>.</div>'
        : '')
    + '</div>';
  }

  const subtitle = scope.perUnit
    ? 'What one '+esc(b.unit)+' costs each way'
    : 'What this period cost each way, across '+scope.workCount+' kinds of work';

  const inner = '<div style="font-size:13.5px;font-weight:600;color:var(--fg1);margin-bottom:2px">A person vs your robots</div>'
    + '<div style="font-size:12px;color:var(--fg3);margin-bottom:14px">'+subtitle+'</div>'
    // Labelled, and says its reach. Sitting near the site filter, an
    // unlabelled dropdown invites the assumption that it scopes the page;
    // this one only ever changes this card.
    + '<div style="font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3);margin-bottom:5px">Compare</div>'
    + costScopePicker(scope)
    + '<div style="font-size:11px;color:var(--fg3);margin:6px 0 18px;line-height:1.5">'+scope.label+' · this card only</div>'
    + line('A person', money2(human),
        scope.perUnit
          ? (human === null ? 'Set how many '+esc(b.unitPlural)+' a person does in an hour, on Numbers.'
             : 'What you set for this kind of work')
          : 'What people would have been paid for the same work',
        human, 'var(--hatch2)')
    + line(one ? 'This robot' : 'Your robots', money2(robot),
        scope.perUnit
          ? (robot === null ? 'No '+esc(b.unitPlural)+' recorded this period, so there is nothing to divide by.'
             : 'Invoiced across '+unitSum.toLocaleString('en-US')+' '+esc(b.unitPlural))
          : (keep.total > 0
              ? money(invoiceSum)+' leased + '+money(keep.total)+' of your team&#39;s time keeping them running'
              : 'Invoiced across '+rows.length+' robot'+(rows.length===1?'':'s')),
        robot, 'var(--ink)')
    + verdict;
  return o.bare ? inner : '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'+inner+'</div>';
}

/** The fixed top of the Dashboard. One hairline card, two halves: the
 *  coverage figure the page exists to state, and the comparison that says
 *  what it was worth. Neither is reorderable — a dashboard whose first
 *  figure can be dragged out from under the reader has no anchor at all,
 *  which is what the three-column mosaic was. */
function anchorRow(){
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px;margin-bottom:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:30px 36px">'
    + '<div style="min-width:0">'+coverageKpiCard({ bare:true, big:true })+'</div>'
    + '<div style="min-width:0">'+costCard({ bare:true })+'</div>'
  + '</div>';
}

// benchmarkVenueCard lived here: a percentile and a cohort median against
// other operators. Removed. With no customers there is no cohort, so every
// figure on it was a sample dressed as a comparison, and the card had to
// admit that in its own footnote. It comes back when the benchmark is real.

function fig(label, value, note, wrap, noteStyle){
  return '<div style="'+wrap+'">'
    + '<div style="font-size:13px;font-weight:500;color:var(--fg3);margin-bottom:10px">'+label+'</div>'
    + '<div style="font-size:clamp(24px,4.4vw,32px);font-weight:600;letter-spacing:-0.03em;color:var(--fg1);font-variant-numeric:tabular-nums">'+value+'</div>'
    + '<div style="font-size:12.5px;color:var(--fg2);margin-top:8px;line-height:1.5;'+noteStyle+'">'+note+'</div></div>';
}

// Consumable condition. Reported by Gausium; Locus and Fetch send nothing of the
// kind, so their robots say so plainly rather than showing an empty meter — a
// missing input is stated as missing, never rendered as a zero.
function conditionBlock(r){
  if(!r.parts) return '<div style="margin-top:14px;font-family:inherit;font-size:11.5px;color:var(--fg3)">consumable life · not reported by '+(r.model||'').split(' ')[0]+'</div>';
  const spent = r.parts.filter(p => p.left <= 0).length;
  const bars = r.parts.map(p => {
    const past = p.left <= 0;
    // Life remaining reads left to right. A part past its rating has no bar to
    // draw, so the whole track carries the hatch this design already uses for
    // the figure that is going the wrong way.
    const fill = past
      ? 'repeating-linear-gradient(135deg,var(--hatch2) 0 2px,transparent 2px 5px)'
      : 'var(--ink)';
    const width = past ? '100%' : Math.max(0, Math.min(100, p.left)) + '%';
    const label = past ? Math.round(-p.left) + '% over' : Math.round(p.left) + '% left';
    return '<div style="display:flex;align-items:center;gap:12px;margin-bottom:9px">'
      + '<span data-barlabel style="width:104px;flex:none;font-family:inherit;font-size:12px;color:var(--fg2)">'+p.name+'</span>'
      + '<span style="flex:1;min-width:60px;height:8px;border:1px solid var(--hair2);position:relative;display:block">'
        + '<i style="position:absolute;left:0;top:0;bottom:0;width:'+width+';background:'+fill+'"></i></span>'
      + '<span style="width:96px;flex:none;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:'+(past?600:400)+';color:'+(past?'var(--fg1)':'var(--fg2)')+'">'+label+'</span>'
      + '<span style="width:104px;flex:none;text-align:right;font-family:inherit;font-size:11.5px;color:var(--fg3)">'+p.used+'</span></div>';
  }).join('');
  const note = spent
    ? 'A part past its rating is work this machine is still doing on borrowed time. Replacing it is not in the figure above.'
    : 'Every part is inside its rated life.';
  // "4 bars" read as "4 robots" until this said otherwise: made explicit
  // that every bar below belongs to this one robot, r.parts.length
  // separate consumable parts, not a fleet count.
  return '<div style="margin-top:22px;padding-top:18px;border-top:1px dashed var(--hair)">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:14px">'
      + '<span style="font-size:12.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--fg2)">Condition</span>'
      + '<span style="font-size:12.5px;color:var(--fg3)">'+r.parts.length+' parts on this one robot, life remaining against the maker&#39;s rating</span></div>'
    + '<div data-bars style="margin-bottom:12px">'+bars+'</div>'
    + '<div style="font-size:13px;line-height:1.6;color:var(--fg2);max-width:86ch">'+note+'</div>'
    + '<div style="margin-top:10px;font-family:inherit;font-size:11.5px;color:var(--fg3)">also reported · '+r.hand+' of active time hand-driven · battery '+r.temp+'</div>'
    + '</div>';
}

/** The equation behind one robot's number, as a stepped block. Source is
 *  stated per step, because "the robot reported this" and "you typed this"
 *  are different claims and nothing on screen used to say which. */
function robotEquation(s){
  const covLabel = s.cov === null ? '—' : s.cov.toFixed(2)+'x';
  const unitsPhrase = s.basis === 'active_hour' ? s.units.toFixed(1)+' active hours' : s.units.toLocaleString('en-US')+' '+s.unit;
  const step = (label, val, src, srcKind) =>
    '<div style="padding:9px 0;border-top:1px solid var(--hair)">'
    + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">'
      + '<span style="font-size:12.5px;color:var(--fg2)">'+label+'</span>'
      + '<span style="font-size:15px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+val+'</span></div>'
    + '<div style="display:flex;align-items:center;gap:6px;margin-top:4px">'
      + '<span style="flex:none;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:1.5px 5px;border-radius:3px;'
        + (srcKind === 'telemetry' ? 'background:var(--ghost2);color:var(--fg2)'
           : srcKind === 'derived' ? 'background:transparent;color:var(--fg3);border:1px dashed var(--hair2)'
           : 'background:transparent;color:var(--fg3);border:1px solid var(--hair)')
        + '">'+(srcKind === 'telemetry' ? 'from the robot' : srcKind === 'derived' ? 'worked out' : 'you set this')+'</span>'
      + '<span style="font-size:11px;color:var(--fg3);min-width:0">'+src+'</span></div>'
  + '</div>';
  return step('Work the robot did', unitsPhrase, 'Counted by the robot itself, from your usage import', 'telemetry')
    + step('What a person costs for one', s.rate === null ? '—' : money(s.rate), 'What you set for this kind of work', 'set')
    + step('So the work is worth', s.rate === null ? '—' : money(s.value), 'Based on what the robot did and your rate', 'derived')
    + step('You paid to lease it', money(s.invoice), 'Your invoice, charged for the same days', 'set')
    + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 0 0;margin-top:4px;border-top:2px solid var(--fg1)">'
      + '<span style="font-size:12.5px;font-weight:500;color:var(--fg1)">Every $1 of lease bought</span>'
      + '<span style="font-size:19px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+(s.cov === null ? '—' : '$'+s.cov.toFixed(2))+'</span></div>'
    + '<div style="font-size:11px;color:var(--fg3);margin-top:3px">of work a person would have been paid for. That is '+covLabel+'.</div>';
}

/** Time it actually ran against the schedule the owner declared on Numbers. */
function robotDutyBlock(r, i, short){
  const dutyFill = short ? 'repeating-linear-gradient(135deg,var(--hatch2) 0 2px,transparent 2px 5px)' : 'var(--ink)';
  return '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg2);margin-bottom:8px"><span>Time it actually ran</span><span style="font-variant-numeric:tabular-nums">'+r.duty+'</span></div>'
    + '<div style="height:8px;border:1px solid var(--hair2);position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:'+r.dutyPct+';background:'+dutyFill+'"></div></div>'
    + '<div style="display:flex;align-items:center;gap:6px;margin-top:8px">'
      + '<span style="flex:none;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:1.5px 5px;border-radius:3px;background:var(--ghost2);color:var(--fg2)">from the robot</span>'
      + '<span style="font-size:11px;color:var(--fg3)">'+esc(r.hours)+'</span></div>'
    + '<div style="font-size:11px;color:var(--fg3);margin-top:6px;line-height:1.5">Measured against the '+(S.robotHours[i] ?? parseFloat((SETUP[i]||{}).hours||'0'))+' h a day you scheduled it for. Raise the schedule and this reads lower, because the robot ran the same hours either way.</div>';
}

/** One robot's page: the reference's detail shape. A sub-header with the
 *  way back, the name and its status; a tabbed pane on the left holding
 *  the equation, duty and condition blocks the table row used to expand
 *  into; and the robot's figures stacked on the right, each with the one
 *  flag that applies to it. Nothing here is new content — it is the same
 *  blocks, given a page. */
/** The robot's figures stacked, each with the one flag that applies.
 *  Shared by the Fleet robot page and the Numbers robot page, so the two
 *  never disagree about a reading. */
function robotStatsPanel(s, link){
  const i = s.i, r = ROBOTS[i];
  const short = s.cov !== null && s.cov < 1;
  const spentParts = (r.parts || []).filter(p => p.left <= 0).length;
  const covLabel = s.cov === null ? '—' : s.cov.toFixed(2)+'x';
  // The stats stack. Figure, unit, and the one flag that applies. Two of
  // these have a range to be inside or outside of (coverage against 1.00x,
  // parts against rated life); the rest are readings, so they carry none
  // rather than an invented "within range".
  const stat = (label, value, unit, flag, flagIcon) => '<div style="padding:16px 0;border-top:1px solid var(--hair)">'
    + '<div style="font-size:13px;font-weight:500;color:var(--fg2);margin-bottom:6px">'+label+'</div>'
    + '<div style="display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums"><span style="font-size:24px;font-weight:600;letter-spacing:-0.02em;color:var(--fg1)">'+value+'</span>'+(unit?'<span style="font-size:13px;color:var(--fg3)">'+unit+'</span>':'')+'</div>'
    + (flag ? '<div style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--fg2)">'+ic(flagIcon,13,'color:var(--fg1)')+flag+'</div>' : '')
  + '</div>';
  // r.duty is the string "duty 43%", r.hours "155h of 360h": the figure is
  // the percentage, the hours are its unit.
  const dutyPct = String(r.duty).replace(/^duty\s*/, '');
  const dutyHours = String(r.hours || '').replace(/\s*of\s*/, ' of ');
  // Only Gausium reports hand-driving and battery. Everywhere else the row
  // says so, in the same pill Condition uses, never the literal undefined.
  const reported = (v, unit) => v === undefined ? ['—', '', 'not reported', 'help-circle'] : [v, unit, '', ''];
  const hand = reported(r.hand, 'of active time');
  const temp = reported(r.temp, '');
  const condition = !r.parts ? ['—', '', 'not reported', 'help-circle']
    : spentParts ? [String(spentParts), spentParts === 1 ? 'part past life' : 'parts past life', 'past rated life', 'triangle-alert']
    : [String(r.parts.length), 'parts', 'all within rated life', 'check'];
  return '<div id="robotStats-'+i+'" style="border:1px solid var(--hair);border-radius:6px;padding:20px 22px 8px">'
    + '<div style="font-size:15px;font-weight:600;color:var(--fg1);margin-bottom:8px">'+esc(r.name)+' this period</div>'
    + stat('Coverage', covLabel, '', short ? 'under its lease' : 'covered', short ? 'triangle-alert' : 'check')
    + stat('Time it ran', dutyPct, dutyHours, '', '')
    + stat('Hand-driven', hand[0], hand[1], hand[2], hand[3])
    + stat('Battery', temp[0], temp[1], temp[2], temp[3])
    + stat('Condition', condition[0], condition[1], condition[2], condition[3])
    + stat('Change vs July', ROBOT_DELTA[r.name], '', '', '')
    + '<div data-act="'+(link.act||'go')+'" data-view="'+link.view+'" data-i="'+i+'" class="hv-fg1" style="display:flex;align-items:center;gap:6px;padding:16px 0 12px;border-top:1px solid var(--hair);font-size:13px;font-weight:500;color:var(--fg2);cursor:pointer">'+link.label+' '+ic('chevron-right',14)+'</div>'
  + '</div>';

}

function viewRobot(){
  const i = S.detailRobot;
  const stmt = computeStatement(true, null);
  const s = stmt.rows.find(x => x.i === i);
  if (!s) return viewRobots();
  const r = ROBOTS[i];
  const short = s.cov !== null && s.cov < 1;
  const spentParts = (r.parts || []).filter(p => p.left <= 0).length;
  const chip = short ? 'under its lease' : (s.benchmarkWage ? 'benchmark rate' : 'covered');
  const covLabel = s.cov === null ? '—' : s.cov.toFixed(2)+'x';

  const tabs = [{ id:'equation', label:'Equation' }, { id:'duty', label:'Duty' }, { id:'condition', label:'Condition' }];
  const cur = tabs.some(t => t.id === S.robotTab) ? S.robotTab : 'equation';
  const tabBar = '<div style="display:flex;gap:4px;border-bottom:1px solid var(--hair);margin-bottom:22px">'
    + tabs.map(t => { const on = t.id === cur; return '<div data-act="robotTab" data-tab="'+t.id+'" class="'+(on?'':'hv-fg1')+'" style="padding:12px 16px;margin-bottom:-1px;font-size:14px;font-weight:'+(on?600:400)+';color:'+(on?'var(--fg1)':'var(--fg2)')+';border-bottom:2px solid '+(on?'var(--fg1)':'transparent')+';cursor:pointer">'+t.label+'</div>'; }).join('')
  + '</div>';
  const pane = cur === 'equation' ? '<div style="max-width:560px">'+robotEquation(s)+'</div>'
    : cur === 'duty' ? '<div style="max-width:560px">'+robotDutyBlock(r, i, short)+'</div>'
    : conditionBlock(r);

  const stats = robotStatsPanel(s, { view:'setup', act:'openNumbersRobot', label:'Open on Numbers' });

  const subhead = '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:-24px -24px 24px;padding:10px 24px;min-height:56px;background:var(--card);border-bottom:1px solid var(--hair)">'
    + '<div data-act="go" data-view="robots" class="hv-ghost" title="Back to Fleet" style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:6px;cursor:pointer;color:var(--fg1)">'+ic('chevron-right',18,'transform:rotate(180deg)')+'</div>'
    + '<span style="font-size:15px;font-weight:500;color:var(--fg1)">'+esc(r.name)+'</span>'
    + '<span style="width:1px;height:22px;background:var(--hair)"></span>'
    + pill(chip, short ? 'triangle-alert' : (s.benchmarkWage ? 'sliders-horizontal' : 'check'))
    + '<span style="font-size:12.5px;color:var(--fg3)">'+esc(r.model)+'</span>'
    + '<div style="margin-left:auto;display:flex;align-items:center;gap:8px">'
      + '<button type="button" data-act="go" data-view="setup" class="hv-ghost" style="height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--hair2);background:var(--card);cursor:pointer;font-size:13px;font-weight:600;color:var(--fg1)">Check this robot&#39;s inputs</button>'
    + '</div>'
  + '</div>';

  return subhead
    + '<div data-dash-cols style="display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start">'
      + '<div style="border:1px solid var(--hair);border-radius:6px;padding:8px 26px 26px;min-width:0">'+tabBar+pane+'</div>'
      + stats
    + '</div>';
}


/* ─────────────  VIEWS: TABLE / LIST / BOARD / GALLERY / TIMELINE / CALENDAR  ─────────────

   Same rows, same figures, laid out differently. Every view reads the same
   computeStatement rows the table does, and DAILY for anything by day, so
   no view can show a number another view would disagree with. Timeline and
   calendar exist only where there is a real per-day series to draw:
   Fleet has DAILY; Numbers is a set of inputs and has no day axis. */
const FLEET_VIEWS = [{id:'table',label:'Table'},{id:'list',label:'List'},{id:'board',label:'Board'},{id:'tree',label:'Tree'},{id:'gallery',label:'Gallery'},{id:'timeline',label:'Timeline'},{id:'calendar',label:'Calendar'}];
const NUMBERS_VIEWS = [{id:'table',label:'Table'},{id:'list',label:'List'},{id:'board',label:'Board'},{id:'gallery',label:'Gallery'}];

/** The reference's segmented pair, grown to a row. Label only, no icons:
 *  six one-word labels read faster than six glyphs nobody has learned. */
function viewSwitcher(views, current, act){
  // Floating pill: a tinted track, the chosen segment lifted white on it.
  return '<div role="tablist" style="display:inline-flex;align-items:center;height:32px;padding:2px;box-sizing:border-box;border-radius:6px;background:rgba(22,32,74,.07)">'
    + views.map(v => { const on = v.id === current; return '<div data-act="'+act+'" data-v="'+v.id+'" role="tab" aria-selected="'+(on?'true':'false')+'" class="'+(on?'':'hv-ghost')+'" style="display:flex;align-items:center;height:28px;padding:0 12px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:'+(on?600:500)+';color:'+(on?'var(--fg1)':'var(--fg2)')+';background:'+(on?'var(--card)':'transparent')+';box-shadow:'+(on?'0 2px 4px rgba(22,32,74,.08)':'none')+'">'+v.label+'</div>'; }).join('')
  + '</div>';
}

/** Everything a card or row needs about one robot, computed once. */
function robotFacts(s){
  const r = ROBOTS[s.i];
  const short = s.cov !== null && s.cov < 1;
  const spentParts = (r.parts || []).filter(p => p.left <= 0).length;
  return {
    s, r, i: s.i, short,
    covLabel: s.cov === null ? '—' : s.cov.toFixed(2)+'x',
    chip: short ? 'under its lease' : (s.benchmarkWage ? 'benchmark rate' : 'covered'),
    chipIcon: short ? 'triangle-alert' : (s.benchmarkWage ? 'sliders-horizontal' : 'check'),
    dutyPct: String(r.duty).replace(/^duty\s*/, ''),
    condition: !r.parts ? 'not reported' : spentParts ? spentParts+(spentParts === 1 ? ' part past life' : ' parts past life') : 'within rated life',
    condIcon: !r.parts ? '' : spentParts ? 'triangle-alert' : 'check',
    delta: ROBOT_DELTA[r.name] || ''
  };
}

/** Coverage per period for one robot: its own units in that period at its
 *  rate, over its invoice. Derived from DAILY, the same series the day views
 *  draw, so the six bars on a gallery card and the calendar agree. */
function robotPeriodCoverage(s){
  return PERIODS.slice().reverse().map(p => {
    if (s.rate === null || !s.invoice) return null;
    return unitsInRange(s.i, p.start, p.end) * s.rate / s.invoice;
  });
}
function miniPeriodBars(vals){
  const max = Math.max.apply(null, vals.map(v => v || 0).concat([0.01]));
  return '<div title="Coverage over the last 6 periods, oldest first" style="display:flex;align-items:flex-end;gap:3px;height:28px">'
    + vals.map((v, k) => '<div style="flex:1;height:'+(v === null ? 4 : Math.max(4, v / max * 100)).toFixed(0)+'%;background:var(--fg1);opacity:'+(k === vals.length-1 ? 1 : 0.35)+';border-radius:1px"></div>').join('')
  + '</div>';
}

function cardTitle(title, sub, right){
  return '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px">'
    + '<h2 style="font-size:16px;font-weight:600;letter-spacing:-0.01em;margin:0;color:var(--fg1)">'+title+'</h2>'
    + (sub ? '<span style="font-size:13px;color:var(--fg3)">'+sub+'</span>' : '')
    + (right ? '<div style="margin-left:auto;display:flex;align-items:center;gap:8px">'+right+'</div>' : '')
  + '</div>';
}
function groupByControl(){
  const opts = [{k:'status',label:'Status'},{k:'site',label:'Site'},{k:'work',label:'Work'}];
  return '<span style="font-size:12px;color:var(--fg3)">Group by</span>'
    + '<div style="display:inline-flex;padding:2px;border:1px solid var(--hair);border-radius:6px">'
    + opts.map(o => '<div data-act="setBoardGroup" data-g="'+o.k+'" class="hv-ghost" style="padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:'+(S.boardGroup===o.k?600:500)+';color:'+(S.boardGroup===o.k?'var(--fg1)':'var(--fg2)')+';background:'+(S.boardGroup===o.k?'var(--ghost)':'transparent')+'">'+o.label+'</div>').join('')
    + '</div>';
}
/** Columns for a board. Status is the default because it is the one the
 *  page is about; site and work are the other two ways a fleet is talked
 *  about. Empty columns are kept — an empty "under its lease" column is a
 *  finding, not a gap. */
function boardColumns(facts, statusOf){
  const g = S.boardGroup;
  if (g === 'site') return SITES.map((st, n) => ({ label: st.name, items: facts.filter(f => f.r.site === n) }));
  if (g === 'work'){ const works = [...new Set(facts.map(f => f.s.work))]; return works.map(w => ({ label: w, items: facts.filter(f => f.s.work === w) })); }
  return statusOf(facts);
}
function boardCard(inner, act, i){
  return '<div data-act="'+act+'" data-i="'+i+'" class="hv-dim9" style="background:var(--card);border:1px solid var(--hair);border-radius:6px;box-shadow:var(--card-shadow);padding:14px 16px;cursor:pointer">'+inner+'</div>';
}
function board(cols, render, act){
  return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:start">'
    + cols.map(c => '<div style="background:var(--ghost);border-radius:6px;padding:10px">'
      + '<div style="display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-size:13px;font-weight:600;color:var(--fg1)">'+esc(c.label)+'<span style="font-size:11.5px;font-weight:600;color:var(--fg3)">'+c.items.length+'</span></div>'
      + '<div style="display:flex;flex-direction:column;gap:8px;min-height:40px">'+c.items.map(f => boardCard(render(f), act, f.i)).join('')+'</div>'
    + '</div>').join('')
  + '</div>';
}
function dutyBar(f){
  return '<div style="height:6px;background:var(--ghost2);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+f.r.dutyPct+';background:'+(f.short?'repeating-linear-gradient(135deg,var(--hatch2) 0 2px,transparent 2px 5px)':'var(--fg1)')+'"></div></div>';
}

/* ── Fleet ── */
function fleetAltView(shown){
  const facts = shown.map(robotFacts);
  const v = S.fleetView;
  const wrap = (inner, right, sub) => '<div style="border:1px solid var(--hair);border-radius:6px;padding:20px 22px 22px;margin-bottom:24px">'+cardTitle(shown.length+' robot'+(shown.length===1?'':'s'), sub || '', right || '')+inner+'</div>';

  if (v === 'list'){
    return wrap(facts.map(f => '<div data-act="toggleRobot" data-i="'+f.i+'" class="hv-ghost" style="display:flex;align-items:center;gap:14px;min-height:44px;padding:8px 6px;border-top:1px solid var(--hair);cursor:pointer">'
      + '<span style="font-size:14px;font-weight:500;color:var(--fg1)">'+esc(f.r.name)+'</span>'
      + '<span style="font-size:12px;color:var(--fg3)">'+esc(f.r.model)+'</span>'
      + '<span style="margin-left:auto;display:flex;align-items:center;gap:12px">'+pill(f.chip, f.chipIcon)
        + '<span style="min-width:56px;text-align:right;font-size:15px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+f.covLabel+'</span>'
        + ic('chevron-right',16,'color:var(--fg3)')+'</span>'
    + '</div>').join(''), '', 'Open one for the equation and condition behind its number.');
  }
  if (v === 'board'){
    const cols = boardColumns(facts, fs => [
      { label:'Under its lease', items: fs.filter(f => f.short) },
      { label:'Covered',         items: fs.filter(f => !f.short && !f.s.benchmarkWage) },
      { label:'Benchmark rate',  items: fs.filter(f => !f.short && f.s.benchmarkWage) }
    ]);
    return wrap(board(cols, f => '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><span style="font-size:13.5px;font-weight:600;color:var(--fg1)">'+esc(f.r.name)+'</span><span style="font-size:15px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+f.covLabel+'</span></div>'
      + '<div style="font-size:11.5px;color:var(--fg3);margin:2px 0 10px">'+esc(f.r.model)+'</div>'
      + dutyBar(f)
      + '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--fg3);margin-top:6px"><span>duty '+f.dutyPct+'</span><span>'+f.delta+' vs July</span></div>', 'toggleRobot'), groupByControl());
  }
  if (v === 'tree'){
    // The fleet as a structure rather than a list: the scope at the trunk,
    // a site on each branch, its robots on the branch beside it. Elbows are
    // hairlines, not drawn lines, so they survive any reflow. Clicking a
    // site scopes the whole app to it; clicking a robot opens its page.
    const scopedSites = S.dashScope === 'all' ? SITES.map((s, i) => i) : [Number(S.dashScope)];
    const stmt = computeStatement(true, scopeFilter());
    const included = stmt.rows.filter(r => !r.excluded);
    const rootCov = stmt.coverage;
    const siteBlock = (si) => {
      const st = computeStatement(true, si);
      const inc = st.rows.filter(r => r.excluded !== true);
      const mine = facts.filter(f => f.r.site === si);
      const covLabel = st.coverage === null ? '—' : st.coverage.toFixed(2)+'x';
      const short = mine.filter(f => f.short).length;

          + '<span style="font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums">duty '+f.dutyPct+'</span></div>'

      + '<div style="font-size:11.5px;opacity:.72;margin-top:4px;font-variant-numeric:tabular-nums">'+included.length+' robot'+(included.length===1?'':'s')+' · '+money0(stmt.totalValue)+' of work</div>'

  if (v === 'gallery'){    return wrap('<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px">'

  // Day views draw the period actually in view.
  const p = S.dashRange ? S.dashRange : PERIODS[S.period];
  const days = []; for (let k = 0, n = daysBetweenInclusive(p.start, p.end); k < n; k++) days.push(addDaysKey(p.start, k));
  const unitsOn = (i, key) => { const row = DAILY[i].find(d => d.date === key); return row ? row.units : 0; };
  if (v === 'timeline'){
    const max = Math.max.apply(null, facts.map(f => Math.max.apply(null, days.map(d => unitsOn(f.i, d)))).concat([0.1]));
    const dayLabel = (key, k) => (k === 0 || k === days.length-1 || new Date(key+'T00:00:00Z').getUTCDate() === 1 || k % 7 === 0) ? fmtDateShort(key) : '';

      + facts.map(f => '<div data-act="toggleRobot" data-i="'+f.i+'" class="hv-ghost" style="display:grid;grid-template-columns:170px minmax(0,1fr);gap:0 14px;align-items:center;padding:6px 0;cursor:pointer">'
        + '<div style="min-width:0"><div style="font-size:13px;font-weight:500;color:var(--fg1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(f.r.name)+'</div><div style="font-size:11px;color:var(--fg3)">'+f.covLabel+' &middot; '+f.chip+'</div></div>'
        + '<div style="display:grid;grid-template-columns:repeat('+days.length+',1fr);gap:2px;height:22px">'+days.map(d => { const u = unitsOn(f.i, d); return '<div title="'+fmtDateShort(d)+' &middot; '+u.toLocaleString('en-US')+' '+esc(f.s.unit)+'" style="background:var(--fg1);opacity:'+(u > 0 ? (0.1 + 0.85 * u / max).toFixed(2) : 0.04)+';border-radius:2px"></div>'; }).join('')+'</div>'
      + '</div>').join('')
    + '</div></div>'
    + '<div style="font-size:11.5px;color:var(--fg3);margin-top:12px">Each cell is one day; darker is more work done. Counted by the robot itself, from your usage import.</div>',
    '', 'Work done per day, '+fmtDateShort(p.start)+' – '+fmtDateShort(p.end));
  }
  // calendar: one month grid per month the period touches, fleet total per day
  const totals = {}; days.forEach(d => { totals[d] = facts.reduce((a,f) => a + unitsOn(f.i, d), 0); });
  const maxT = Math.max.apply(null, days.map(d => totals[d]).concat([0.1]));
  const months = [...new Set(days.map(d => d.slice(0,7)))];
  const monthGrid = (ym) => {
    const [y, m] = ym.split('-').map(Number);
    const first = new Date(Date.UTC(y, m-1, 1)); const lead = first.getUTCDay(); const n = new Date(Date.UTC(y, m, 0)).getUTCDate();
    let cells = ''; for (let k = 0; k < lead; k++) cells += '<div></div>';
    for (let d = 1; d <= n; d++){
      const key = ym+'-'+String(d).padStart(2,'0'); const inP = totals[key] !== undefined; const t = totals[key] || 0;
      cells += '<div title="'+(inP ? fmtDateShort(key)+' &middot; '+Math.round(t).toLocaleString('en-US')+' units of work' : '')+'" style="aspect-ratio:1;border-radius:6px;display:flex;align-items:flex-start;justify-content:flex-end;padding:5px 6px;font-size:11px;font-variant-numeric:tabular-nums;'
        + (inP ? 'background:rgba(22,32,74,'+(0.05 + 0.75 * t / maxT).toFixed(2)+');color:'+(t / maxT > 0.5 ? '#fff' : 'var(--fg1)') : 'color:var(--fg3);opacity:.45')+'">'+d+'</div>';
    }
    return '<div style="min-width:0"><div style="font-size:13px;font-weight:600;color:var(--fg1);margin-bottom:10px">'+MONTH_NAMES[m-1]+' '+y+'</div>'
      + '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px">'+['S','M','T','W','T','F','S'].map(d => '<div style="text-align:center;font-size:10.5px;font-weight:600;color:var(--fg3)">'+d+'</div>').join('')+'</div>'
      + '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">'+cells+'</div></div>';
  };
  return wrap('<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px">'+months.map(monthGrid).join('')+'</div>'
    + '<div style="font-size:11.5px;color:var(--fg3);margin-top:14px">Each day is shaded by how much work the '+shown.length+' robot'+(shown.length===1?'':'s')+' in view did that day. Days outside the period are dimmed.</div>',
    '', 'Work done per day, '+fmtDateShort(p.start)+' – '+fmtDateShort(p.end));
}
