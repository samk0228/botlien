function setupOwnEdit(s, i){  return S.robotInvoice[i] !== undefined || S.robotHours[i] !== undefined || S.confirmWork[i] !== undefined || !s.benchmarkWage;
}

function viewRobots(){
  // Coverage, chip, and the equation used to be a hardcoded string per
  // robot. Now they're read off computeStatement(), the one calculation
  // Dashboard already trusted, so a wage or invoice edit on Setup moves
  // this page too instead of only moving the page that made the edit.
  // Duty time and condition stay on ROBOTS: telemetry, not something an
  // invoice edit has any business changing.
  //
  // Scope is S.dashScope, the exact same state and control Dashboard
  // uses (see scopeToggle below), not a second Fleet-only filter that
  // could drift out of sync with it. computeStatement(true, scope) skips
  // the manual-estimate and date-range short-circuits (Fleet always
  // shows the current period's real per-robot rows) but still respects
  // whichever site(s) are in view, so "All 3 sites" here is the same 13
  // robots the Tax shield card counts.
  const scope = scopeFilter();
  const stmt = computeStatement(true, scope);
  // Condition used to be its own page, looping these same robots through
  // the same conditionBlock() every row below already calls. Merged in:
  // the per-robot bars stay exactly where they were, in the row, once.
  // What's added here is only the context that page had and no row does,
  // why condition matters and who isn't reporting it.
  const silent = stmt.rows.map(s => ROBOTS[s.i]).filter(r => !r.parts);
  // Only Pier 4's two Gausium scrubbers are wired to the wear feed (see
  // ROBOTS above), so whether the "Scrubber 75 proves it" story below
  // makes sense at all depends on whether Pier 4 is even in the current
  // scope, not on how many robots are showing.
  const hasConditionReporters = stmt.rows.some(s => !!ROBOTS[s.i].parts);
  const silentOtherGausium = silent.filter(r => r.name.indexOf('Scrubber') === 0 && r.site !== 0);
  // Six full rows, equation and condition bars included, all open at
  // once, was everything about every robot on screen at the same time.
  // One row per robot now, closed by default; opening one is the only
  // way to see that robot's equation and condition.
  //
  // No filter toggle anymore either. It split the fleet into two lists
  // for what's really a one-robot-out-of-six case, and needing a
  // separate view to find the flagged robot was more clicks than the
  // problem deserved. The caution mark on its name in the one list does
  // the same job at a glance, without hiding the other five.
  const shown = searchRows(stmt.rows, s => ROBOTS[s.i].name+' '+ROBOTS[s.i].model);
  const rows = shown.map((s) => {
    const r = ROBOTS[s.i];
    const i = s.i;
    const short = s.cov !== null && s.cov < 1;
    const open = S.openRobot === i;
    const spentParts = (r.parts || []).filter(p => p.left <= 0).length;
    const chip = short ? 'under its lease' : (s.benchmarkWage ? 'benchmark rate' : 'covered');
    const chipFg = short ? 'var(--fg1)' : 'var(--fg2)';
    const dutyFill = short ? 'repeating-linear-gradient(135deg,var(--hatch2) 0 2px,transparent 2px 5px)' : 'var(--ink)';
    const covLabel = s.cov === null ? '—' : s.cov.toFixed(2)+'x';
    const unitsPhrase = s.basis === 'active_hour'
      ? s.units.toFixed(1)+' active hours'
      : s.units.toLocaleString('en-US')+' '+s.unit;
    // A stepped block rather than a label column with numbers stranded on
    // the far right: each step is the number first, then where it came
    // from underneath it, so the eye reads down one edge instead of
    // ping-ponging across the card.
    //
    // Source is stated per step, because the difference between "the robot
    // reported this" and "you typed this" is the difference between a
    // measurement and an assumption, and nothing on screen said which.
    const eq = robotEquation(s);

    // Same wording the fully-reported condition block already uses for
    // an all-clear ("Every part is inside its rated life"), and the same
    // per-part count the row header used to show as its own chip, so
    // this line isn't a third way of saying either thing.
    // Eleven of thirteen rows said "condition not reported by Locus", which
    // spent a whole column restating the same absence in a sentence. A tag
    // says the same thing without being read, and leaves the column to the
    // two rows that actually have a reading.
    const conditionLine = !r.parts
      ? pill('not reported')
      : spentParts
        ? spentParts+(spentParts === 1 ? ' part past life' : ' parts past life')
        : 'all parts within rated life';
    const caution = !short ? '' : '<span title="Under its lease" style="display:inline-flex;color:var(--fg1)">'+ic('triangle-alert',15)+'</span>';

    const tile = '<div style="flex:none;width:34px;height:34px;border-radius:7px;background:var(--ghost);display:flex;align-items:center;justify-content:center;color:var(--fg2)">'+ic('boxes',16)+'</div>';
    const summary = '<div data-act="toggleRobot" data-i="'+i+'" data-fleet-row class="hv-ghost" style="display:grid;grid-template-columns:minmax(180px,2fr) minmax(96px,.9fr) minmax(64px,.6fr) minmax(120px,1.1fr) minmax(64px,.6fr) 84px 24px;gap:14px;align-items:center;padding:13px 18px;cursor:pointer;background:'+(open?'var(--ghost)':'transparent')+'">'
      + '<div style="display:flex;align-items:center;gap:12px;min-width:0">'+tile+'<div style="min-width:0"><div style="display:flex;align-items:center;gap:7px;font-size:14px;font-weight:'+(open||short?600:500)+';color:var(--fg1)">'+r.name+caution+'</div>'
        + '<div style="font-size:12px;color:var(--fg3);margin-top:2px">'+r.model+'</div></div></div>'
      + '<div data-row-status>'+pill(chip, short ? 'triangle-alert' : (s.benchmarkWage ? 'sliders-horizontal' : 'check'))+'</div>'
      + '<div data-row-secondary style="font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'+r.duty+'</div>'
      + '<div data-row-secondary style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:'+(spentParts?600:400)+';color:'+(spentParts?'var(--fg1)':'var(--fg3)')+'">'+conditionLine+'</div>'
      + '<div data-row-secondary style="font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'+ROBOT_DELTA[r.name]+'</div>'
      + '<div style="margin-left:auto;text-align:right;font-size:16px;font-weight:600;letter-spacing:-0.01em;color:var(--fg1);font-variant-numeric:tabular-nums">'+covLabel+'</div>'
      // Matches the Costs queue: a chevron that rotates, on a row that is
      // itself the click target, rather than a plus sign that reads as "add".
      + '<span style="flex:none;display:flex;color:var(--fg3);transform:rotate('+(open?'90':'0')+'deg);transition:transform .15s">'+ic('chevron-right',16)+'</span>'
    + '</div>';

    // Phone only: the three columns the summary drops at 390px, restated
    // once here so nothing is merely lost. Duty and condition are already
    // below in full; this is the ranking line the header used to carry.
    const detail = !open ? '' : '<div style="padding:8px 18px 26px">'
      + '<div data-row-restate style="display:none;gap:14px;flex-wrap:wrap;padding:0 0 16px;font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'
        + '<span>'+r.duty+'</span><span>'+ROBOT_DELTA[r.name]+' vs July</span><span>'+conditionLine+'</span>'
      + '</div>'
      + '<div data-split style="display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:28px;align-items:start;margin-bottom:4px">'
        + '<div>'
          + '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg2);margin-bottom:8px"><span>Time it actually ran</span><span style="font-variant-numeric:tabular-nums">'+r.duty+'</span></div>'
          + '<div style="height:8px;border:1px solid var(--hair2);position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:'+r.dutyPct+';background:'+dutyFill+'"></div></div>'
          + '<div style="display:flex;align-items:center;gap:6px;margin-top:8px">'
            + '<span style="flex:none;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:1.5px 5px;border-radius:3px;background:var(--ghost2);color:var(--fg2)">from the robot</span>'
            + '<span style="font-size:11px;color:var(--fg3)">'+esc(r.hours)+'</span></div>'
          // The bar's full width is the schedule the owner declared on
          // Numbers, not anything the robot said, and the two being
          // different things is the whole point of the measure.
          + '<div style="font-size:11px;color:var(--fg3);margin-top:6px;line-height:1.5">Measured against the '+(S.robotHours[i] ?? parseFloat((SETUP[i]||{}).hours||'0'))+' h a day you scheduled it for. Raise the schedule and this reads lower, because the robot ran the same hours either way.</div>'
        + '</div>'
        + '<div style="min-width:0">'+eq+'</div>'
      + '</div>' + conditionBlock(r) + '</div>';

    return '<div style="border-top:1px solid var(--hair)">' + summary + detail + '</div>';
  }).join('');

  // First flagged robot, computed fresh every render instead of a robot
  // name and its dollar figures typed once, so an edit that pushes a
  // different robot under its lease, or pulls this one back over, doesn't
  // leave a paragraph that's still describing whichever robot needed
  // attention when this was written.
  const flagged = stmt.rows.find(s => !s.excluded && s.cov !== null && s.cov < 1);
  const flaggedR = flagged ? ROBOTS[flagged.i] : null;
  const flaggedUnitsPhrase = flagged && (flagged.basis === 'active_hour'
    ? flagged.units.toFixed(1)+' active hours'
    : flagged.units.toLocaleString('en-US')+' '+flagged.unit);

  // Same phrasing the Tax shield card uses for the same S.dashScope, so a
  // "Pier 4, Marina & Airport combined, 13 robots" on one page and this
  // page's own count of rows never say two different things.
  const scopeName = S.dashScope === 'all' ? 'Pier 4, Marina & Airport combined' : SITES[S.dashScope].name+'&#39;s';
  // The count is the useful part. Listing eleven names told the reader
  // nothing the eleven tags in the table above had not already said, and the
  // rows are right there to be looked at.
  const silentNote = !silent.length ? '' : silent.length+' of these robots report nothing about condition. Locus and Fetch do not expose it at all'
    + (silentOtherGausium.length ? ', and Gausium scrubbers outside Pier 4 are not wired to it yet' : '') + ', so those rows carry no bars rather than an estimate guessed from hours run.';

  // A table, the reference's list shape: a tinted header row naming the
  // columns once, then rows that are themselves the click target.
  const fleetCols = 'minmax(180px,2fr) minmax(96px,.9fr) minmax(64px,.6fr) minmax(120px,1.1fr) minmax(64px,.6fr) 84px 24px';
  const th = (t, right) => '<div style="font-size:12.5px;font-weight:500;color:var(--fg2);'+(right?'text-align:right;':'')+'">'+t+'</div>';
  const head = '<div data-fleet-head style="display:grid;grid-template-columns:'+fleetCols+';gap:14px;align-items:center;padding:12px 18px;background:var(--ghost);border-bottom:1px solid var(--hair)">'
    + th('Robot') + th('Status') + th('Duty') + th('Condition') + th('vs July') + th('Coverage', true) + '<div></div>'
  + '</div>';
  const tableCard = '<div style="border:1px solid var(--hair);border-radius:6px;overflow:hidden;margin-bottom:24px">'
      + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;padding:20px 18px 16px">'
        + '<h2 style="font-size:16px;font-weight:600;letter-spacing:-0.01em;margin:0;color:var(--fg1)">'+stmt.rows.length+' robot'+(stmt.rows.length===1?'':'s')+'</h2>'
        + '<span style="font-size:13px;color:var(--fg3)">'+scopeName+'. Open one for the equation and condition behind its number.'+(hasConditionReporters ? '' : ' Gausium&#39;s wear feed isn&#39;t wired up at this site yet, so condition won&#39;t show below.')+'</span></div>'
      + head
      + (shown.length ? rows : '<div style="padding:24px 18px;font-size:13.5px;color:var(--fg3)">'+(S.search && stmt.rows.length ? 'No robot matches &ldquo;'+esc(S.search)+'&rdquo;.' : noRobotNote())+'</div>') + '</div>';
  return (S.fleetView === 'table' || !shown.length ? tableCard : fleetAltView(shown))
    // The essay that used to sit here argued for a design decision the
    // reader had not disputed. One sentence says the only fact they need in
    // order to read the column, and the footnote keeps the count.
    + '<div style="padding:0;margin-bottom:48px">'
      + '<p style="font-size:13px;line-height:1.7;color:var(--fg2);margin:0;max-width:88ch">'
        + (hasConditionReporters
          ? 'Gausium is the only vendor here that reports consumable wear, so only its scrubbers carry a condition reading.'
          : 'No robot at this scope reports consumable wear yet. Pier 4&#39;s two Gausium scrubbers do, so switch scope to include Pier 4 to see them.')
      + '</p>'
      + (silentNote ? '<p style="font-size:13px;line-height:1.7;color:var(--fg3);margin:10px 0 0;max-width:88ch">'+silentNote+'</p>' : '')
    + '</div>'
    + (!flagged ? '' : '<div style="padding:0">'
      + '<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:12px">'
        + '<h2 style="font-size:16px;font-weight:600;letter-spacing:-0.01em;margin:0;color:var(--fg1)">'+esc(flagged.name)+' is under its lease</h2>'
        + '<span style="font-size:13px;color:var(--fg3)">'+flagged.cov.toFixed(2)+'x · '+esc(flaggedR.duty)+' of '+esc(flaggedR.hours.split(' of ')[1])+'</span></div>'
      + '<p style="font-size:14.5px;line-height:1.7;color:var(--fg2);margin:0 0 20px;max-width:86ch">'+flaggedUnitsPhrase+' in 30 days came to '+money(flagged.value)+' of '+esc(flagged.work.toLowerCase())+' against a '+money(flagged.invoice)+' invoice. Either it needs more shifts, or it belongs somewhere else. This is what buying the work costs, not what it earned.</p>'
      + '<button type="button" data-act="go" data-view="setup" class="hv-ghost" style="padding:12px 18px;border-radius:3px;border:1px solid var(--hair2);background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--fg1)">Check this robot&#39;s inputs</button></div>');
}

// The values themselves already apply the moment they're typed, computeStatement()
// reads live state, not a saved copy. This button is reassurance, not a
// commit step: something to press that says "done with this one" and
// answers back, so editing a field doesn't leave you wondering whether it
// took. Resets to "Save" the moment this row is touched again, see the
// setupSaved reset in the input/change handlers below.
/** Every category on offer: the seven we publish numbers for, plus any the
 * owner has already named, so a second robot doing the same custom work is
 * picked from the list rather than retyped. */
function workOptions(){
  const known = new Set(WORK_CATEGORIES);
  Object.keys(S.customWork).forEach(w => known.add(w));
  // Whatever robots actually do stays on the list even if it was removed,
  // so a category can never be in use and unpickable at the same time.
  const inUse = new Set(CONFIRM.map((c,i) => S.confirmWork[i] ?? c.work));
  inUse.forEach(w => { if (w) known.add(w); });
  return [...known].filter(w => inUse.has(w) || !S.hiddenWork.includes(w));
}

/** "What it does": a real dropdown, plus a way out of it.
 *
 * This was briefly a text input with a datalist, which failed the obvious
 * test: a datalist filters its suggestions against what is already in the
 * field, and the field always arrives pre-filled, so opening it showed one
 * option or none and the seven categories were effectively invisible.
 *
 * A select shows every option on click, and the last one swaps in a text
 * field, so naming your own work is discoverable instead of a thing you had
 * to already know you could do. */
function workInput(id, i, value){
  const typing = !!S.workEntry[i];
  const open = S.workMenu === i;
  // A custom menu rather than a <select>, because a native option cannot
  // hold a control and a mistyped category otherwise sticks around in every
  // dropdown forever. Same pattern the site filter already uses.
  const row = (w) => '<div data-act="pickWork" data-i="'+i+'" data-work="'+esc(w)+'" class="hv-ghost" style="display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13px;font-weight:'+(w===value?600:400)+';color:var(--fg1)">'
      + '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(w)+'</span>'
      // Every row, ours included: a warehouse has no use for "Laundry
      // handling" cluttering the list it picks from every time. Removing
      // one of ours only hides it (see S.hiddenWork), so it can come back;
      // removing an owner's own name deletes it. Either way it is refused
      // while a robot still does that work, or those robots would point at
      // a category that no longer exists.
      + '<span data-act="deleteWork" data-work="'+esc(w)+'" title="Remove &quot;'+esc(w)+'&quot; from this list" role="button" aria-label="Remove '+esc(w)+'" class="hv-ghost" style="flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;color:var(--fg3)">'
        + ic('trash-2',13) + '</span>'
    + '</div>';

  return '<div style="position:relative">'
    + '<div id="'+id+'" data-act="toggleWorkMenu" data-i="'+i+'" class="hv-ghost" style="display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid var(--hair2);cursor:pointer;font-size:13.5px;color:var(--fg1)">'
      + '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(value)+'</span>'
      + ic('chevron-down',14,'color:var(--fg3);flex:none')
    + '</div>'
    + (!open ? '' :
        '<div data-pop-back></div><div data-work-menu data-pop style="position:absolute;top:calc(100% + 4px);left:0;right:0;min-width:220px;max-height:280px;overflow-y:auto;background:var(--menu);border:1px solid var(--hair2);border-radius:5px;z-index:60;box-shadow:0 8px 24px rgba(10,10,10,.14)">'
        + workOptions().map(row).join('')
        + '<div data-act="startWorkEntry" data-i="'+i+'" class="hv-ghost" style="padding:9px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--fg1);border-top:1px solid var(--hair)">+ Type my own…</div>'
      + '</div>')
  + '</div>'
    + (!typing ? '' :
        '<input id="workNew-'+i+'" data-work-new="'+i+'" type="text" autocomplete="off" value="" placeholder="Name the work, then press Enter"'
        + ' style="width:100%;margin-top:8px;font-size:13.5px;color:var(--fg1);background:transparent;padding:8px 2px;border:none;border-bottom:1px solid var(--fg1);outline:none;font-family:inherit">');
}

/** The people behind one kind of work's rate, collapsed under its row.
 *
 * Roles rather than names on purpose: the arithmetic needs what a job pays
 * and what it produces, and naming staff would turn a rates table into
 * personal data without making a single figure more accurate.
 *
 * Both halves of the rate come from here when anyone is listed, weighted by
 * hours, so a 40-hour picker moves the blend more than a 4-hour one. */
function rosterBlock(work, b, perLabel, people){
  const open = !!S.rateOpen[work];
  const head = '<div data-act="toggleRoster" data-work="'+esc(work)+'" class="hv-fade" style="display:flex;align-items:center;gap:9px;padding:8px 4px 14px;cursor:pointer">'
    + '<span style="font-size:12px;color:var(--fg3);width:10px;text-align:center">'+(open?'–':'+')+'</span>'
    + '<span style="font-size:12px;font-weight:500;color:var(--fg2)">'
      + (people.length ? people.length+' role'+(people.length===1?'':'s')+' doing this work' : 'No people added, so this rate is still a benchmark')
    + '</span></div>';
  if (!open) return head;

  const cell = (attr, id, value, w, step) =>
    '<input data-emp-'+attr+'="'+id+'" type="'+(attr==='role'?'text':'number')+'"'+(attr==='role'?'':' min="0" step="'+step+'" inputmode="decimal"')
    + ' value="'+esc(value)+'" style="width:'+w+';font-size:12.5px;color:var(--fg1);background:transparent;padding:6px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-family:inherit'+(attr==='role'?'':';font-variant-numeric:tabular-nums')+'">';

  const rows = people.map(e =>
    '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:9px 0;border-top:1px solid var(--hair)">'
    + cell('role', e.id, e.role, '150px', '')
    + '<span style="display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--fg2)">$'+cell('wage', e.id, e.wage, '62px', '0.25')+'<span style="font-size:11px;color:var(--fg3)">/ hr</span></span>'
    + '<span style="display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--fg2)">'+cell('units', e.id, e.unitsPerHour, '54px', 'any')+'<span style="font-size:11px;color:var(--fg3)">'+esc(perLabel)+' / hr</span></span>'
    + '<span style="display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--fg2)">'+cell('hours', e.id, e.hoursWeek, '46px', '1')+'<span style="font-size:11px;color:var(--fg3)">hrs / wk</span></span>'
    + '<button type="button" data-act="removeEmployee" data-id="'+e.id+'" title="Remove this role" class="hv-ghost" style="margin-left:auto;padding:5px 9px;border-radius:4px;border:1px solid var(--hair2);background:transparent;color:var(--fg2);cursor:pointer;font-size:11.5px;font-weight:500">Remove</button>'
  + '</div>').join('');

  return head
    + '<div style="padding:0 4px 18px">'
      + (people.length ? '<div style="display:flex;gap:14px;font-size:10.5px;font-weight:600;color:var(--fg3);padding-bottom:2px"><span style="width:150px">Role</span><span>Loaded wage</span><span>Output</span><span>Hours</span></div>' : '')
      + rows
      + '<button type="button" data-act="addEmployee" data-work="'+esc(work)+'" class="hv-ghost" style="margin-top:12px;padding:8px 14px;border-radius:4px;border:1px dashed var(--hair2);background:transparent;color:var(--fg1);cursor:pointer;font-size:12px;font-weight:500">+ Add a role</button>'
      + '<div style="font-size:11px;color:var(--fg3);margin-top:10px;line-height:1.6">'
        + '<b style="color:var(--fg2);font-weight:500">Loaded wage</b> is pay plus taxes and benefits, what the hour really costs you. '
        + '<b style="color:var(--fg2);font-weight:500">Output</b> is what one person gets through in an hour of this work. '
        // Hours only ever acts as a weight, so with one role it genuinely
        // does nothing and looks broken. Say so rather than leave someone
        // typing into a field that appears dead.
        + '<b style="color:var(--fg2);font-weight:500">Hours</b> decides how much each role counts toward the average: someone on 40 hours moves it more than someone on 4.'
        + (people.length === 1 ? ' With only one role it changes nothing yet, since an average of one is just that one. Add a second and it starts to matter.' : '')
      + '</div>'
    + '</div>';
}

/** One line per work category in use, stating the derived rate without
 * spelling out the arithmetic behind it. */
function rateDerivationLines(works){
  return works.map(work => {
    const b = workDef(work);
    const per = throughputFor(work);
    const rc = rateCentsFor(work);
    const perLabel = b.basis === 'active_hour' ? 'hour' : b.unitPlural;
    if (rc === null) return esc(work)+': set how many '+esc(perLabel)+' a person does in an hour to derive a rate.';
    return esc(work)+': '+money(rc/100)+' per '+esc(b.unit);
  }).join('<br>');
}

/** What one robot costs per unit: its own invoice over its own output.
 * The counterpart to the person figure beside it, and the number an owner
 * assumes "replacement rate" means until told otherwise. */
function robotUnitCost(s){
  return s.units > 0 ? s.invoice / s.units : null;
}
function robotUnitCostLabel(s, b){
  const c = robotUnitCost(s);
  return c === null ? '—' : money(c)+' / '+b.unit;
}
/** Same figure, unit set small beside it, for the stacked stat blocks. */
function robotUnitCostStat(s, b){
  const c = robotUnitCost(s);
  return c === null ? '—' : money(c)+' <span style="font-size:13px;color:var(--fg3)">/ '+esc(b.unit)+'</span>';
}
function robotUnitCostDerivation(s, b){
  const c = robotUnitCost(s);
  if (c === null) return 'No '+b.unitPlural+' recorded yet.';
  return 'Its invoice, spread across what it actually did.';
}

function setupSaveButton(i){
  const saved = !!S.setupSaved[i];
  return '<button type="button" data-act="saveSetupRow" data-i="'+i+'" id="setupSaveBtn-'+i+'" style="display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:4px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:'+(saved?'var(--ghost2)':'var(--ink)')+';color:'+(saved?'var(--fg1)':'var(--ink-fg)')+'">'
    + (saved ? ic('check',14)+'Saved' : 'Save')
  + '</button>';
}

// Same Save/Saved pattern as setupSaveButton above, one flag instead of a
// per-row map since there's only ever one profile photo. Picking a color,
// an icon, or uploading a photo all flip avatarSaved back to false.
function avatarSaveButton(){
  const saved = !!S.avatarSaved;
  return '<button type="button" data-act="saveAvatar" style="display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:4px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:'+(saved?'var(--ghost2)':'var(--ink)')+';color:'+(saved?'var(--fg1)':'var(--ink-fg)')+'">'
    + (saved ? ic('check',14)+'Saved' : 'Save photo')
  + '</button>';
}

// The change-email flow, a real state machine like sign-in's own
// email-link screens, not a "here's what this would do" stub: enter the
// new address, we simulate sending a 6-digit code, entering the right
// shape of code (demo has no real inbox to check against) flips
// S.accountEmail over and every place it's shown reads the new value.
function emailChangeBlock(){
  if (S.emailChangeStage === 'idle') return '';
  if (S.emailChangeStage === 'form'){
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.emailChangeNew.trim());
    const disabled = S.emailChangeSending || !valid;
    return '<div style="margin:0 0 24px;padding:16px 18px;border:1px solid var(--hair2);border-radius:6px;max-width:420px">'
      + '<div style="font-size:12.5px;font-weight:600;color:var(--fg3);margin-bottom:8px">New email</div>'
      + '<input id="emailChangeInput" type="text" inputmode="email" autocomplete="email" placeholder="you@company.com" value="'+esc(S.emailChangeNew)+'" style="width:100%;font-size:14px;color:var(--fg1);background:transparent;padding:10px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;margin-bottom:14px">'
      + '<div style="display:flex;flex-wrap:wrap;gap:10px">'
        + '<button type="button" data-act="sendEmailChangeCode"'+(disabled?' disabled':'')+' style="padding:10px 16px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:'+(disabled?'default':'pointer')+';opacity:'+(disabled?0.5:1)+';font-size:13px;font-weight:600">'+(S.emailChangeSending?'Sending…':'Send verification code')+'</button>'
        + '<button type="button" data-act="cancelEmailChange" style="padding:10px 14px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--fg2)">Cancel</button>'
      + '</div>'
    + '</div>';
  }
  if (S.emailChangeStage === 'code'){
    return '<div style="margin:0 0 24px;padding:16px 18px;border:1px solid var(--hair2);border-radius:6px;max-width:420px">'
      + '<div style="font-size:13px;color:var(--fg2);line-height:1.6;margin-bottom:14px">We sent a 6-digit code to <b style="color:var(--fg1);font-weight:600">'+esc(S.emailChangeNew)+'</b>. Enter it below to confirm the change.</div>'
      + '<input id="emailChangeCodeInput" type="text" inputmode="numeric" maxlength="6" placeholder="123456" value="'+esc(S.emailChangeCode)+'" style="width:100%;font-size:16px;letter-spacing:0.3em;font-variant-numeric:tabular-nums;color:var(--fg1);background:transparent;padding:10px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;margin-bottom:'+(S.emailChangeCodeErr?'6':'14')+'px">'
      + (S.emailChangeCodeErr ? '<div style="font-size:12px;color:var(--fg1);margin-bottom:14px">That code doesn&#39;t look right. It&#39;s 6 digits, check your email and try again.</div>' : '')
      + '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">'
        + '<button type="button" data-act="confirmEmailChangeCode"'+(S.emailChangeVerifying?' disabled':'')+' style="padding:10px 16px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:'+(S.emailChangeVerifying?'default':'pointer')+';opacity:'+(S.emailChangeVerifying?0.5:1)+';font-size:13px;font-weight:600">'+(S.emailChangeVerifying?'Verifying…':'Confirm')+'</button>'
        + '<button type="button" data-act="sendEmailChangeCode" style="padding:10px 12px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--fg2)">Resend code</button>'
        + '<button type="button" data-act="cancelEmailChange" style="padding:10px 12px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--fg2)">Cancel</button>'
      + '</div>'
    + '</div>';
  }
  // 'done'
  return '<div style="margin:0 0 24px;padding:14px 18px;border:1px solid var(--hair2);border-radius:6px;max-width:420px;display:flex;align-items:center;gap:10px">'
    + ic('check',16)
    + '<div style="font-size:13px;color:var(--fg2);line-height:1.6">Email updated to <b style="color:var(--fg1);font-weight:600">'+esc(S.accountEmail)+'</b>.</div>'
  + '</div>';
}

// Setup and Rates used to be two separate nav destinations. Both are the
// same job, what to assume when computing coverage, so they're one page
// now: per-robot inputs first, then the work-type rates those per-robot
// replacement figures are themselves derived from, one Save for the form.
/** The five inputs for one robot. The same form the table row used to
 *  expand into, now the left pane of the robot's own Numbers page. It
 *  reads and writes the per-robot overlays computeStatement() reads, so a
 *  figure typed here is the figure Fleet and Dashboard show. */
function setupRobotForm(s){
  const i = s.i;
  const b = workDef(s.work);
  const r = SETUP[i];
  const hoursVal = S.robotHours[i] ?? parseFloat(r.hours);
  // The same stacked shape as the stats card beside it: a 13px label, the
  // figure large with its unit beside it, one flag or note underneath, a
  // hairline between blocks. The difference is that here the figure IS the
  // input — a bare 24px number field with no box, so the two cards read as
  // one family and the reader can tell at a glance which side they can type
  // into by whether the cursor turns to a caret.
  const label = (t) => '<div style="font-size:13px;font-weight:500;color:var(--fg2);margin-bottom:6px">'+t+'</div>';
  const unit = (t) => '<span style="font-size:13px;color:var(--fg3)">'+t+'</span>';
  const note = (icon, t, id) => '<div'+(id?' id="'+id+'"':'')+' style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--fg2);line-height:1.5">'+(icon?ic(icon,13,'color:var(--fg1);flex:none'):'')+'<span style="min-width:0">'+t+'</span></div>';
  const block = (inner, first) => '<div style="padding:16px 0;'+(first?'':'border-top:1px solid var(--hair)')+'">'+inner+'</div>';
  const numInput = (id, val, step, unitText) => '<div style="display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums">'
    + (unitText === 'prefix' ? '<span style="font-size:24px;font-weight:600;letter-spacing:-0.02em;color:var(--fg1)">$</span>' : '')
    + '<input id="'+id+'" data-i="'+i+'" type="number" min="0"'+(step?' step="'+step+'"':'')+' inputmode="decimal" value="'+val+'" style="width:'+(String(val).length+1.2)+'ch;max-width:100%;font-size:24px;font-weight:600;letter-spacing:-0.02em;line-height:1.2;color:var(--fg1);background:transparent;padding:0;border:none;border-bottom:1px dashed var(--hair2);outline:none;font-variant-numeric:tabular-nums;font-family:inherit">'
    + (unitText && unitText !== 'prefix' ? unit(unitText) : '')
  + '</div>';

  return '<div>'
    + block(label('What it does')
      + workInput('confirmWork-'+i, i, s.work)
      + (S.workDeleteBlocked
          ? note('triangle-alert', '&ldquo;'+esc(S.workDeleteBlocked)+'&rdquo; is still what some robots do. Move them to something else first, then delete it.')
          : note('', isCustomWork(s.work) ? 'Your own category. Set what a unit of it is called, and its rate, on Numbers.' : 'Type your own if none of these fit.')), true)
    + block(label('Monthly invoice')
      + numInput('setupInvoice-'+i, s.invoice.toFixed(2), '', 'prefix')
      + note('user', 'yours to correct &middot; what the lease charges for this robot'))
    // Both sides of the comparison, labelled by WHO, because "rate: $0.40
    // per pick" on a robot's own page reads as what the robot costs. It is
    // the opposite: what a person costs, the thing being replaced.
    + block(label('A person costs')
      + '<div id="setupRate-'+i+'" style="display:flex;align-items:baseline;gap:6px;font-size:24px;font-weight:600;letter-spacing:-0.02em;line-height:1.2;color:var(--fg1);font-variant-numeric:tabular-nums">'+(s.rate === null ? '—' : money(s.rate)+' '+unit('/ '+esc(b.unit)))+'</div>'
      + note('sliders-horizontal', 'What you set for this kind of work, from the people who do it', 'setupDerive-'+i))
    // Derived, not entered: the "worked out" flag says so.
    + block(label('This robot costs')
      + '<div id="setupRobotRate-'+i+'" style="display:flex;align-items:baseline;gap:6px;font-size:24px;font-weight:600;letter-spacing:-0.02em;line-height:1.2;color:var(--fg1);font-variant-numeric:tabular-nums">'+robotUnitCostStat(s, b)+'</div>'
      + note('check', '<span style="font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:1.5px 5px;border-radius:3px;color:var(--fg3);border:1px dashed var(--hair2);margin-right:6px">worked out</span><span id="setupRobotDerive-'+i+'">'+robotUnitCostDerivation(s, b)+'</span>'))
    + block(label('Operating hours / day')
      + numInput('setupHours-'+i, hoursVal, '0.5', 'h / day')
      + note('user', 'yours to correct &middot; what you schedule it for'))
    + '<div style="display:flex;align-items:center;gap:12px;padding:16px 0 4px;border-top:1px solid var(--hair)">'
      + setupSaveButton(i)
      + '<span style="font-size:12.5px;color:var(--fg3)">Saving moves every figure built on these.</span>'
    + '</div>'
  + '</div>';
}

/** One robot's Numbers page: the reference's detail shape, mirrored from
 *  Fleet. Sub-header with the way back, the name, its source pill and
 *  what it does; the five inputs in a card on the left, laid out the way
 *  Settings lays out a form (what the section is on the left, the fields
 *  on the right); the robot's figures stacked on the right so the owner
 *  sees what an edit moves without leaving the page. */
function viewNumbersRobot(){
  const i = S.detailRobot;
  const stmt = computeStatement(true, null);
  const s = stmt.rows.find(x => x.i === i);
  if (!s) return viewSetup();
  const r = SETUP[i];
  const own = setupOwnEdit(s, i);

  const subhead = '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:-24px -24px 24px;padding:10px 24px;min-height:56px;background:var(--card);border-bottom:1px solid var(--hair)">'
    + '<div data-act="go" data-view="setup" class="hv-ghost" title="Back to Numbers" style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:6px;cursor:pointer;color:var(--fg1)">'+ic('chevron-right',18,'transform:rotate(180deg)')+'</div>'
    + '<span style="font-size:15px;font-weight:500;color:var(--fg1)">'+esc(r.name)+'</span>'
    + '<span style="width:1px;height:22px;background:var(--hair)"></span>'
    + pill(own ? 'yours' : 'benchmark', own ? 'user' : 'sliders-horizontal')
    + '<span style="font-size:12.5px;color:var(--fg3)">'+esc(r.model)+' &middot; '+esc(s.work)+'</span>'
    + '<div style="margin-left:auto;display:flex;align-items:center;gap:8px">'
      + '<button type="button" data-act="toggleRobot" data-i="'+i+'" class="hv-ghost" style="height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--hair2);background:var(--card);cursor:pointer;font-size:13px;font-weight:600;color:var(--fg1)">See it on Fleet</button>'
    + '</div>'
  + '</div>';

  const formCard = '<div style="border:1px solid var(--hair);border-radius:6px;padding:20px 22px 12px;min-width:0">'
    + '<div style="font-size:15px;font-weight:600;color:var(--fg1);padding-bottom:12px;border-bottom:1px solid var(--hair)">Five inputs for '+esc(r.name)+'</div>'
    + setupRobotForm(s)
  + '</div>';

  return subhead
    + '<div data-dash-cols style="display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start">'
      + formCard
      + robotStatsPanel(s, { view:'robots', act:'toggleRobot', label:'See it on Fleet' })
    + '</div>';
}

function viewSetup(){
  // Scope follows S.dashScope now, the same control Dashboard and Fleet
  // already share (see scopeToggle below), so editing a robot's wage or
  // invoice here always happens against the same set of robots you can
  // currently see the money for on those pages.
  const scope = scopeFilter();
  const stmt = computeStatement(true, scope);
  // These five fields used to be static divs styled to look like inputs,
  // nothing to click into, nothing typed ever went anywhere. Real inputs
  // now, reading and writing the same per-robot overlays computeStatement()
  // reads, so what's typed here is the number Fleet and Dashboard show,
  // not a second copy of it that only this page believes.
  const shownN = searchRows(stmt.rows, s => (SETUP[s.i]||{}).name+' '+s.name+' '+s.work);
  const rows = shownN.map((s) => {
    const r = SETUP[s.i];
    const i = s.i;
    const open = false;
    const b = workDef(s.work);
    const hoursVal = S.robotHours[i] ?? parseFloat(r.hours);
    // Whether a row is still on our published numbers or on the owner's own
    // is the one thing this page cannot leave implicit: every figure
    // downstream inherits it, and "benchmark" is a different claim from
    // "measured here".
    const ownEdit = S.robotInvoice[i] !== undefined || S.robotHours[i] !== undefined
      || S.confirmWork[i] !== undefined || !s.benchmarkWage;
    const srcTag = '<span style="margin-left:8px;vertical-align:middle">'+pill(ownEdit?'yours':'benchmark', ownEdit?'user':'sliders-horizontal')+'</span>';
    // Cells, not a sentence: the same five facts the summary line carried,
    // one per column, so the table header names them once.
    const cell = (id, html, extra) => '<div id="'+id+'-'+i+'" data-row-secondary style="font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'+(extra||'')+'">'+html+'</div>';
    const cells = cell('setupWork', esc(s.work))
      + cell('setupInv', money(s.invoice)+' <span style="color:var(--fg3)">/ mo</span>')
      + cell('setupPer', s.rate === null ? '—' : money(s.rate)+' <span style="color:var(--fg3)">/ '+esc(b.unit)+'</span>')
      + cell('setupHrs', hoursVal+' <span style="color:var(--fg3)">h / day</span>')
      + '<div data-row-status>'+pill(ownEdit?'yours':'benchmark', ownEdit?'user':'sliders-horizontal')+'</div>';
    // Same table shape as Fleet: icon tile, name over model, one cell per
    // column, the source pill, and a chevron that turns when the row's edit
    // form is open beneath it.
    const tile = '<div style="flex:none;width:34px;height:34px;border-radius:7px;background:var(--ghost);display:flex;align-items:center;justify-content:center;color:var(--fg2)">'+ic('sliders-horizontal',16)+'</div>';
    return '<div style="border-top:1px solid var(--hair)">'
      + '<div data-act="openNumbersRobot" data-i="'+i+'" data-fleet-row class="hv-ghost" style="display:grid;grid-template-columns:minmax(180px,2fr) minmax(110px,1.1fr) minmax(90px,.9fr) minmax(90px,.9fr) minmax(64px,.6fr) 110px 24px;gap:14px;align-items:center;padding:13px 18px;cursor:pointer;background:'+(open?'var(--ghost)':'transparent')+'">'
        + '<div style="display:flex;align-items:center;gap:12px;min-width:0">'+tile+'<div style="min-width:0"><div style="font-size:14px;font-weight:'+(open?600:500)+';color:var(--fg1)">'+r.name+'</div>'
          + '<div style="font-size:12px;color:var(--fg3);margin-top:2px">'+r.model+'</div></div></div>'
        + cells
        + '<span style="flex:none;display:flex;justify-content:flex-end;color:var(--fg3);transform:rotate('+(open?'90':'0')+'deg);transition:transform .15s">'+ic('chevron-right',16)+'</span></div>'
      + '</div>';
  }).join('');

  // Same phrasing Fleet and the Tax shield card use for the same
  // S.dashScope, so all three never say a different count for "how many
  // robots" at the same scope.
  const scopeName = S.dashScope === 'all' ? 'Pier 4, Marina & Airport combined' : SITES[S.dashScope].name+'&#39;s';
  // Only the categories this fleet actually does. The old table listed a
  // fixed two regardless of scope, so a single site with no scrubbers still
  // showed a floor-cleaning rate nothing on the page used.
  const usedWorks = [...new Set(stmt.rows.map(r => r.work))];

  const th = (t) => '<div style="font-size:13px;font-weight:400;color:var(--fg2);white-space:nowrap">'+t+'</div>';
  const head = '<div data-fleet-head style="display:grid;grid-template-columns:minmax(180px,2fr) minmax(110px,1.1fr) minmax(90px,.9fr) minmax(90px,.9fr) minmax(64px,.6fr) 110px 24px;gap:14px;align-items:center;padding:12px 18px;background:var(--ghost);border-bottom:1px solid var(--hair)">'
    + th('Robot') + th('What it does') + th('Monthly invoice') + th('A person costs') + th('Hours / day') + th('Source') + '<div></div>'
  + '</div>';
  const robotsPane = (S.numbersView !== 'table' && shownN.length) ? numbersAltView(shownN) : '<div data-numbers-table style="border:1px solid var(--hair);border-radius:6px;overflow:hidden;margin-bottom:24px">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;padding:20px 18px 16px">'
      + '<h2 style="font-size:16px;font-weight:600;letter-spacing:-0.01em;margin:0;color:var(--fg1)">Five inputs per robot</h2>'
      + '<span style="font-size:13px;color:var(--fg3)">'+scopeName+' '+stmt.rows.length+' robot'+(stmt.rows.length===1?'':'s')+'. Everything is prefilled. Accept it as-is, or correct the two you care about.</span></div>'
    + head
    + (rows || '<div style="padding:24px 18px;font-size:13.5px;color:var(--fg3)">'+(S.search ? 'No robot matches &ldquo;'+esc(S.search)+'&rdquo;.' : noRobotNote())+'</div>')
  + '</div>';

  const ratesPane = '<div style="border:1px solid var(--hair);border-radius:6px;padding:20px 22px 22px;margin-bottom:24px">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:14px">'
      + '<h2 style="font-size:16px;font-weight:600;letter-spacing:-0.01em;margin:0;color:var(--fg1)">Where the rates come from</h2>'
      + '<span style="font-size:13px;color:var(--fg3)">Derived, never asserted. Both inputs are yours: correct either one and every figure built on it moves.</span></div>'
    + '<div data-rate-scroll style="overflow-x:auto;min-width:0"><div data-rate-wide style="min-width:720px">'
      + '<div data-rate-head style="display:grid;grid-template-columns:1.2fr 1fr 1.2fr 1.2fr;gap:20px;padding:0 4px 14px;font-size:11.5px;font-weight:600;color:var(--fg3)"><div>Work</div><div>Loaded wage</div><div>A person does</div><div>So one unit is worth</div></div>'
      + usedWorks.map(work => {
          const b = workDef(work);
          const rc = rateCentsFor(work);
          const own = wageIsOwnSet(work) || throughputIsOwnSet(work);
          const perLabel = b.basis === 'active_hour' ? 'hour' : b.unitPlural;
          const people = employeesFor(work);
          return '<div data-rate-row style="display:grid;grid-template-columns:1.2fr 1fr 1.2fr 1.2fr;gap:20px;padding:18px 4px;border-top:1px solid var(--hair);align-items:center">'
          + '<div><div style="font-size:14.5px;font-weight:500;color:var(--fg1)">'+esc(work)+'</div>'
            + '<div style="font-size:11.5px;color:var(--fg3);margin-top:4px">'+stmt.rows.filter(r => r.work === work).length+' robot'+(stmt.rows.filter(r => r.work === work).length===1?'':'s')+'</div>'
            // A category we publish numbers for already knows what one of
            // its units is called and how it is counted. One the owner named
            // does not, and guessing would put "tasks" on a statement they
            // have to hand a lender, so they name it here.
            + (!isCustomWork(work) ? '' :
                '<div style="margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px">'
                + '<span style="font-size:11px;color:var(--fg3)">one is a</span>'
                + '<input data-work-unit="'+esc(work)+'" type="text" value="'+esc(b.unit)+'" aria-label="Name for one unit of '+esc(work)+'" style="width:78px;font-size:12.5px;color:var(--fg1);background:transparent;padding:4px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-family:inherit">'
                + '<select data-work-basis="'+esc(work)+'" aria-label="How '+esc(work)+' is counted" style="font-size:11.5px;color:var(--fg2);background:transparent;padding:4px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-family:inherit;cursor:pointer">'
                  + '<option value="mission"'+(b.basis==='mission'?' selected':'')+'>counted per task</option>'
                  + '<option value="active_hour"'+(b.basis==='active_hour'?' selected':'')+'>counted per hour</option>'
                + '</select></div>')
            + '</div>'
          // Read-only while a roster defines it: two editable answers to the
          // same question, disagreeing, is worse than one you have to open
          // the roster to change.
          + (wageFromPeople(work)
            ? '<div style="font-size:14px;color:var(--fg1);font-variant-numeric:tabular-nums"><span data-rate-wage-out="'+esc(work)+'">'+money(wageFor(work))+'</span> <span style="color:var(--fg3);font-size:12.5px">/ hr</span>'
              + '<div style="font-size:10.5px;color:var(--fg3);margin-top:3px">averaged from '+people.length+' role'+(people.length===1?'':'s')+'</div></div>'
            : '<div style="display:flex;align-items:center;gap:5px;font-size:14px;color:var(--fg1)">$'
              + '<input data-rate-wage="'+esc(work)+'" type="number" min="0" step="0.25" inputmode="decimal" value="'+wageFor(work).toFixed(2)+'" aria-label="Loaded wage for '+esc(work)+'" style="width:74px;font-size:14px;color:var(--fg1);background:transparent;padding:8px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-variant-numeric:tabular-nums;font-family:inherit">'
              + '<span style="color:var(--fg3);font-size:12.5px">/ hr</span></div>')
          + (throughputFromPeople(work)
            ? '<div style="font-size:14px;color:var(--fg1);font-variant-numeric:tabular-nums"><span data-rate-through-out="'+esc(work)+'">'+throughputFor(work)+'</span> <span style="color:var(--fg3);font-size:12.5px">'+esc(perLabel)+' / hr</span>'
              + '<div style="font-size:10.5px;color:var(--fg3);margin-top:3px">averaged from '+people.length+' role'+(people.length===1?'':'s')+'</div></div>'
            : '<div style="display:flex;align-items:center;gap:5px;font-size:14px;color:var(--fg1)">'
              + '<input data-rate-through="'+esc(work)+'" type="number" min="0" step="any" inputmode="decimal" value="'+throughputFor(work)+'" aria-label="Units a person does per hour for '+esc(work)+'" style="width:64px;font-size:14px;color:var(--fg1);background:transparent;padding:8px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-variant-numeric:tabular-nums;font-family:inherit">'
              + '<span style="color:var(--fg3);font-size:12.5px">'+esc(perLabel)+' / hr</span></div>')
          + '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
            + '<span data-rate-out="'+esc(work)+'" style="font-size:14.5px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+(rc === null ? 'needs a number above' : money(rc/100)+' per '+b.unit)+'</span>'
            + '<span data-rate-src="'+esc(work)+'" style="font-size:11.5px;font-weight:500;color:var(--fg2)">'+(own ? 'your numbers' : 'benchmark')+'</span></div></div>'
          + rosterBlock(work, b, perLabel, people);
        }).join('')
    + '</div></div>'
    + '<div style="margin-top:26px;padding:18px 20px;border:1px solid var(--hair2);border-radius:4px;font-size:13.5px;line-height:1.7;color:var(--fg2)">A rate change applies from the day you make it. The five closed periods keep the rate they were computed with, so a statement you already sent your accountant never changes after the fact.</div>'
    + '<div style="margin-top:20px">'
      + '<div data-act="toggleRateHistory" class="hv-fade" style="display:flex;align-items:center;gap:10px;padding:14px 4px;cursor:pointer;border-top:1px solid var(--hair)">'
        + '<span style="font-size:13.5px;font-weight:600;color:var(--fg1)">Rate history</span>'
        + '<span style="font-size:12.5px;color:var(--fg3)">Every value these figures have ever used, and who set it</span>'
        + '<span style="margin-left:auto;font-size:13px;color:var(--fg3);width:12px;text-align:center">'+(S.rateHistory?'–':'+')+'</span></div>'
      + (S.rateHistory
        ? '<div style="overflow-x:auto;min-width:0"><div style="min-width:700px">'
          + '<div style="display:grid;grid-template-columns:1.1fr 1fr 1.2fr 1.4fr;gap:20px;padding:0 4px 12px;font-size:11.5px;font-weight:600;color:var(--fg3)"><div>Work</div><div>Rate</div><div>In effect</div><div>Set by</div></div>'
          + RATE_HISTORY.map(r => '<div style="display:grid;grid-template-columns:1.1fr 1fr 1.2fr 1.4fr;gap:20px;padding:16px 4px;border-top:1px solid var(--hair);align-items:baseline">'
            + '<div style="font-size:13.5px;font-weight:500;color:'+(r.current?'var(--fg1)':'var(--fg2)')+'">'+r.work+'</div>'
            + '<div style="font-size:13.5px;color:var(--fg1);font-variant-numeric:tabular-nums">'+r.rate+'</div>'
            + '<div style="font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'+r.span+'</div>'
            + '<div><div style="font-size:12.5px;color:var(--fg2)">'+demoify(r.by)+'</div></div></div>').join('')
          + '</div></div>'
        : '')
    + '</div>'
    + (() => {
        // Named live rather than hardcoded to one category: whichever ones
        // are still on our published numbers are the ones to call out.
        const onBench = usedWorks.filter(w => !wageIsOwnSet(w) && !throughputIsOwnSet(w));
        if (!onBench.length) return '<div style="margin-top:24px;padding-top:24px;border-top:1px solid var(--hair);font-size:13.5px;color:var(--fg2)">Every rate above is built from numbers you set. Nothing here is our benchmark any more.</div>';
        return '<div style="margin-top:24px;padding-top:24px;border-top:1px solid var(--hair);font-size:13.5px;color:var(--fg2)">'+onBench.map(esc).join(' and ')+' still use'+(onBench.length===1?'s':'')+' our published benchmark, not your numbers. Every figure '+(onBench.length===1?'it feeds':'they feed')+' is marked <b style="font-weight:600;color:var(--fg1)">benchmark</b> until both inputs above are corrected.</div>';
      })()
    + '<div data-rate-derivations style="margin-top:20px;font-family:inherit;font-size:13.5px;color:var(--fg1);line-height:2">'+rateDerivationLines(usedWorks)+'</div>'
  + '</div>';

  return subNav([
    { id:'robots', label:'Per robot', icon:'boxes' },
    { id:'rates',  label:'Where the rates come from', icon:'sliders-horizontal' },
    { id:'contract', label:'Contract', icon:'file-text' }
  ], S.setupTab, 'setupTab', S.setupTab === 'rates' ? ratesPane : S.setupTab === 'contract' ? contractPane(stmt) : robotsPane)

  + '<div style="padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:16px">'
    + '<button type="button" data-act="save" class="hv-dim press" style="display:inline-flex;align-items:center;gap:9px;padding:14px 22px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:pointer;font-size:14px;font-weight:600;opacity:'+(S.saving?0.8:1)+'">'
      + (S.saving ? spinner(13) : '') + (S.saving ? 'Saving your inputs…' : 'Save and see my numbers') + '</button>'
    + '<span style="font-size:13px;color:var(--fg3)">Wage is optional. It only feeds the derivation shown under each rate.</span></div>';
}

function viewConfirm(){
  const excludedCount = Object.keys(S.excluded).filter(k => S.excluded[k]).length;
  const included = CONFIRM.filter((c,i) => !S.excluded[i]);
  const allSameWork = included.length > 1 && included.every(c => c.work === included[0].work);
  // Reviewing is the one required action, not typing. A robot counts as
  // reviewed the moment its "kind of work" select is opened, whether or not
  // the value changes, because looking is what proves the default was seen,
  // not agreed with by accident. Excluded robots do not need review, they
  // are not being priced.
  const needsReview = CONFIRM.map((c,i) => i).filter(i => !S.excluded[i]);
  const reviewedCount = needsReview.filter(i => S.confirmSeen[i]).length;
  const allReviewed = reviewedCount === needsReview.length;
  const left = needsReview.length - reviewedCount;

  const row = (c,i) => {
    const excl = !!S.excluded[i];
    const seen = !!S.confirmSeen[i];
    const work = S.confirmWork[i] ?? c.work;
    const name = S.confirmName[i] ?? c.name;
    return '<div data-split style="border-top:1px solid var(--hair);padding:20px 4px;display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:28px;align-items:start;opacity:'+(excl?0.5:1)+'">'
      + '<div>'
        + '<label style="display:block;font-size:10.5px;font-weight:600;color:var(--fg3);margin-bottom:4px">Call it</label>'
        + '<input id="confirmName-'+i+'" type="text" value="'+esc(name)+'" style="width:100%;font-size:14px;color:var(--fg1);background:transparent;padding:8px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-family:inherit">'
        + '<div style="font-size:12px;color:var(--fg3);margin-top:6px;font-variant-numeric:tabular-nums">'+c.seen+'</div></div>'
      + '<div style="display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px">'
        + '<div style="min-width:200px">'
          + '<label for="confirmWork-'+i+'" style="display:block;font-size:10.5px;font-weight:600;color:var(--fg3);margin-bottom:4px">Kind of work'+(!excl && !seen ? ' <span style="color:var(--fg1)">· look at this</span>' : '')+'</label>'
          + workInput('confirmWork-'+i, i, work) + '</div>'
        + '<button type="button" data-act="toggleExclude" data-i="'+i+'" style="margin-left:auto;padding:9px 14px;border-radius:3px;border:1px solid var(--hair2);background:'+(excl?'var(--ink)':'transparent')+';color:'+(excl?'var(--ink-fg)':'var(--fg1)')+';cursor:pointer;font-size:12.5px;font-weight:500">'+(excl?'Excluded':'Exclude')+'</button>'
      + '</div></div>';
  };

  return '<div style="padding:0;margin-bottom:40px">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px">'
      + '<h2 style="font-size:20px;font-weight:600;letter-spacing:-0.02em;margin:0;color:var(--fg1)">'+CONFIRM.length+' robots found in that export</h2>'
      + '<span style="font-size:13px;color:var(--fg3)">Rename anything you call something else. Exclude what you don&#39;t lease.</span></div>'
    + (allSameWork ? '<div style="border-left:2px solid var(--fg1);background:var(--ghost2);padding:13px 15px;border-radius:0 4px 4px 0;font-size:13px;color:var(--fg1);line-height:1.6;margin-bottom:22px"><b>All '+included.length+' robots are set to the same kind of work: '+included[0].work+'.</b> That is a default guess, not something read from your export. Fix each one below if this fleet actually does more than one thing.</div>' : '')
    + '<div style="border-left:2px solid '+(allReviewed?'var(--fg3)':'var(--fg1)')+';background:var(--ghost2);padding:13px 15px;border-radius:0 4px 4px 0;font-size:13px;color:var(--fg1);line-height:1.6;margin-bottom:8px">'
      + (allReviewed
        ? 'You&#39;ve looked at all '+needsReview.length+'. Confirm below when ready.'
        + (S.confirmTriedSubmit ? '' : '')
        : '<b>Open the &quot;Kind of work&quot; field for each robot below before confirming.</b> '+left+' left. It decides whether a robot is priced per task or per hour, which changes its number by an order of magnitude, so a glance is required, typing is not.')
    + '</div>'
    + CONFIRM.map(row).join('')
    + '<div style="margin-top:28px;display:flex;flex-wrap:wrap;align-items:center;gap:16px">'
      + '<button type="button" data-act="confirmFleet" class="hv-dim" style="padding:14px 22px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:pointer;font-size:14px;font-weight:600;opacity:'+(allReviewed?1:0.4)+'">Yes, that&#39;s my fleet</button>'
      + '<span style="font-size:13px;color:var(--fg3)">'+(!allReviewed
          ? 'Look at '+left+' more to unlock this.'
          : excludedCount === 0
            ? 'All '+CONFIRM.length+' will be priced. Nothing is computed until you continue.'

/* ─────────────────────────  COSTS VIEW  ─────────────────────────

   Every other card in this product tells the operator their robots were a
   good decision. This screen is the only one that does not, and that is the
   entire reason it earns trust — so it must never overstate the cost, the
   same way the rest of the page must never overstate the benefit.

   Three rules it holds to, everywhere below:
   1. Measured and estimated are never blended into one figure. They get
      different labels, on screen, next to the money.
   2. Every assumption is stated where the number is, never in a footnote,
      and the one that matters most is editable in place.
   3. No hour is charged twice. Stalled robot time is context here and is
      never priced as labour; coverage already counts it.

   One tab, not three. The three sections answer one question between them,
   and two of them can be legitimately absent for a given operator, so as
   separate tabs they would risk being dead tabs. No status colours: ink
   height and ink weight carry every quantity, so this survives being
   printed in black and white and handed to a shift lead. */

function costsTile(label, value, note, valueId, noteId){
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="font-size:13px;font-weight:500;color:var(--fg3);margin-bottom:10px">' + label + '</div>'
    + '<div id="' + valueId + '" style="font-size:clamp(22px,3.4vw,28px);font-weight:600;letter-spacing:-0.03em;color:var(--fg1);font-variant-numeric:tabular-nums">' + value + '</div>'
    + '<div id="' + noteId + '" style="font-size:12.5px;color:var(--fg2);margin-top:8px;line-height:1.5">' + note + '</div>'
  + '</div>';
}

/** Arithmetic line for one robot. Terms that are zero are dropped rather
 * than printed: a robot whose whole cost is hand-driving must not read
 * "0.0 h clearing", and one that never stalled must not carry a trailing
 * "stalled 0.0 h". Hours always carry one decimal even where the prose
 * above rounds — "21 hours x $24.00/h = $504.00" does not survive being
 * checked on paper, "21.0" does. */
function keepingEq(r, wage){
  const eq = [];
  if (r.clearHours > 0) eq.push(r.clearHours.toFixed(1) + ' h clearing &times; ' + money(wage) + '/h');
  if (r.handHours > 0) eq.push(r.handHours.toFixed(1) + ' h driven by hand &times; ' + money(wage) + '/h');
  if (r.stalled > 0) eq.push('robot itself stalled ' + r.stalled.toFixed(1) + ' h');
  return eq.join(' &middot; ');
}

function keepingRow(r, wage){
  const qual = [];
  if (r.stalls > 0) qual.push(r.stalls.toLocaleString('en-US') + ' stall' + (r.stalls === 1 ? '' : 's'));
  if (r.handHours > 0) qual.push('driven by hand');
  return '<div style="border-top:1px solid var(--hair)">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:18px 4px 6px">'
      + '<span style="min-width:180px;font-size:15.5px;font-weight:500;color:var(--fg1)">' + esc(r.name) + '</span>'
      + '<span style="font-size:12.5px;color:var(--fg3)">' + qual.join(' &middot; ') + '</span>'
      + '<span id="keepRowMoney-' + r.i + '" style="margin-left:auto;font-size:18px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">' + money(r.total) + '</span>'
    + '</div>'
    + '<div id="keepRowEq-' + r.i + '" style="padding:0 4px 18px;font-family:inherit;font-size:12.5px;color:var(--fg2);line-height:1.6;overflow-x:auto;white-space:nowrap">' + keepingEq(r, wage) + '</div>'
  + '</div>';
}

function keepingNote(k, minutes){
  return 'The stall count is measured. The ' + minutes + ' minute' + (minutes === 1 ? '' : 's') + ' per stall is not: it is our assumption about how long a person takes to notice, walk over, free the machine and walk back. Halve it and this figure halves. The hours the robot spent stalled are shown for context and are deliberately not charged here as labour, because your coverage figure already counts them as work the robot did not really perform, and billing the same hours twice would flatter this panel.';
}
function keepingClearNote(k, minutes){
  return k.stalls.toLocaleString('en-US') + ' stalls, counted from telemetry, at an assumed ' + minutes + ' minute' + (minutes === 1 ? '' : 's') + ' of someone&#39;s time each';
}
function keepingProse(k){
  return k.stalls.toLocaleString('en-US') + ' stalls cleared by hand, about ' + Math.round(k.clearHours) + ' hours, plus ' + k.handHours.toFixed(1) + ' hours with someone driving the robot directly.';
}

function keepingSection(k){
  const minutes = S.stallMinutes;
  const rows = k.rows.filter(r => r.total > 0).sort((a,b) => b.total - a.total).slice(0,5);
  return '<div style="padding:0;margin-bottom:56px">'
    // An eyebrow, not a heading: inside an expanded row this labels a part,
    // and a 20px heading here competes with the row headline that opened it.
    + '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);margin:0 0 16px">What it costs to keep them running</div>'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:16px;margin-bottom:24px">'
      + costsTile('Clearing stalls', money(k.clearMoney), keepingClearNote(k, minutes), 'keepClearMoney', 'keepClearNote')
      + costsTile('Driving by hand', money(k.handMoney), k.handHours.toFixed(1) + ' hours with a person on the controls, measured directly, no assumption', 'keepHandMoney', 'keepHandNote')
      + costsTile('On top of the lease', money(k.total), 'labour your invoice never shows, over the same period as every other figure here', 'keepTotalMoney', 'keepTotalNote')
    + '</div>'
    + '<p id="keepProse" style="font-size:14.5px;line-height:1.7;color:var(--fg2);margin:0 0 24px;max-width:86ch">' + keepingProse(k) + '</p>'
    + '<div style="margin-bottom:24px">' + rows.map(r => keepingRow(r, k.wage)).join('') + '</div>'
    + '<div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:20px;margin-bottom:16px;padding-top:18px;border-top:1px dashed var(--hair)">'
      + '<div><label for="stallMinutesInput" style="display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3);margin-bottom:6px">Minutes per stall &middot; assumed</label>'
        + '<div style="display:flex;align-items:center;gap:6px;font-size:14px;color:var(--fg1)">'
        + '<input id="stallMinutesInput" type="text" inputmode="decimal" value="' + minutes + '" style="width:44px;font-size:14px;color:var(--fg1);background:transparent;padding:8px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-variant-numeric:tabular-nums">min</div></div>'
      + '<div style="font-size:12.5px;color:var(--fg3);line-height:1.6;max-width:54ch">Move it and every figure above moves with it, this card and the person-versus-robots card both. An assumption you can change is an assumption you can trust.</div>'
    + '</div>'
  + '</div>';
}

/** The strip. 24 columns, midnight to midnight, ink height carrying the
 * stall time that landed in each hour across the period. The operating
 * window gets a faint wash so the quiet hours read as quiet because
 * nothing was running, not because nothing went wrong. Monochrome: no
 * status colours, no red band on the peak — the bracket names it instead.
 *
 * ceiling is shared across every strip on the page (see stuckSection), and
 * that is the whole point. Normalised to its own maximum, the strip for a
 * 1.7-hour problem drew heavier than the strip for a 29.3-hour one, so the
 * picture argued against the sentence printed under it — the same failure
 * the floor map had. Against one ceiling the trivial problem renders as a
 * barely visible sliver, which is the truth.
 *
 * No minimum bar height and no clamping: a near-zero hour draws as
 * near-zero. An always-visible floor is the same lie in a smaller form. */
function stallStrip(t, ceiling){
  const H = 96;
  const peak = ceiling || 1;
  const cell = (h) => {
    const v = t.raw[h];
    const open = v > 0 || STALL_SHAPE[t.work][h] > 0;
    const pct = (v / peak) * 100;
    return '<div style="position:relative;display:flex;align-items:flex-end;height:' + H + 'px;background:' + (open ? 'var(--ghost)' : 'transparent') + '">'
      + (v > 0 ? '<div title="' + hourLabel(h) + ' &middot; ' + t.series[h].toFixed(1) + ' h" style="width:100%;height:' + pct.toFixed(2) + '%;background:var(--ink)"></div>' : '')
    + '</div>';
  };
  const bars = [];
  for (let h = 0; h < 24; h++) bars.push(cell(h));
  // Bracket over the worst contiguous two hours, placed by grid column so
  // it lines up with the bars underneath it rather than being nudged into
  // place with a percentage.
  const bracket = '<div style="grid-column:' + (t.win.start + 1) + ' / span 2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end">'
    + '<div style="font-size:11px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums;margin-bottom:3px">' + t.win.hours.toFixed(1) + 'h</div>'
    + '<div style="width:100%;height:5px;border:1px solid var(--hair3);border-bottom:none"></div></div>';
  const axis = [];
  for (let h = 0; h < 24; h++){
    const label = (h === 0 || h === 6 || h === 12 || h === 18) ? hourLabel(h) : (h === 23 ? '12a' : '');
    axis.push('<div style="font-size:10.5px;color:var(--fg3);text-align:' + (h === 23 ? 'right' : 'left') + ';white-space:nowrap">' + label + '</div>');
  }
  return '<div style="display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:26px;align-items:flex-end;margin-bottom:2px">' + bracket + '</div>'
    + '<div style="display:grid;grid-template-columns:repeat(24,1fr);gap:2px">' + bars.join('') + '</div>'
    + '<div style="display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-top:6px">' + axis.join('') + '</div>';
}

/** Raw stall hours by hour of day mostly reproduce the operating schedule,
 * which tells the operator nothing they did not already know. The finding
 * is the RATE: how much of the time the robots were actually running in
 * that window got lost to being stuck. Both numbers appear. */
function stallReading(t){
  const pctStall = Math.round(t.stallShare * 100);
  const pctHours = Math.round(t.hourShare * 100);
  const t1 = hourLabel(t.win.start), t2 = hourLabel(t.win.start + 2);
  const b = (s) => '<b style="color:var(--fg1);font-weight:600">' + s + '</b>';
  const head = 'Your ' + esc(t.work.toLowerCase()) + ' robots lost ' + b(t.stalled.toFixed(1) + ' hours') + ' to stalls this period. ';
  if (t.ratio !== null && t.ratio >= 1.5){
    return head
      + b(t.win.hours.toFixed(1) + ' of them, ' + pctStall + '%, fell between ' + t1 + ' and ' + t2)
      + ', which is only ' + pctHours + '% of your working hours. Across the whole day those robots lost '
      + (t.allRate * 100).toFixed(1) + '% of their running time to being stuck; in that window it is '
      + (t.winRate * 100).toFixed(1) + '%, so it is ' + b(t.ratio.toFixed(1) + ' times worse than a normal hour')
      + '. That is the shift to go and watch.';
  }
  return head
    + 'The worst two hours, ' + t1 + ' to ' + t2 + ', hold ' + pctStall + '% of it against ' + pctHours
    + '% of the hours' + (t.ratio !== null ? ', only ' + t.ratio.toFixed(1) + ' times a normal hour' : '')
    + '. Stalls spread this evenly across the working day point at the machines or the routes rather than at a moment in the shift, so there is no shift to go and watch here.';
}

function stallCard(t, ceiling, showLegend){
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 20px;margin-bottom:20px">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:18px">'
      + '<span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3)">' + esc(t.work) + '</span>'
      + '<span style="font-size:12px;color:var(--fg3);font-variant-numeric:tabular-nums">' + t.count + ' robot' + (t.count === 1 ? '' : 's') + ' &middot; ' + t.openHours + ' declared operating hours a day &middot; ' + t.active.toFixed(1) + ' hours actually run</span></div>'
    + stallStrip(t, ceiling)
    // The legend is the section's vocabulary, not this strip's, so it is
    // stated once under the last strip rather than repeated under each.
    // Bar height is one hour of stall time; the bracket figure is a two-hour
    // total. Different quantities, so the reader is told what the tallest
    // bar actually is rather than left to merge them.
    + (!showLegend ? '' : '<div style="display:flex;flex-wrap:wrap;gap:18px;margin-top:12px;font-size:11.5px;color:var(--fg3)">'
      + '<span style="display:inline-flex;align-items:center;gap:7px"><span style="width:11px;height:11px;flex:none;background:var(--ink)"></span>stall time landing in that hour</span>'
      + '<span style="display:inline-flex;align-items:center;gap:7px"><span style="width:11px;height:11px;flex:none;background:var(--ghost);border:1px solid var(--hair)"></span>hours this work runs</span>'
      + '<span>bracket marks the worst two hours</span>'
      + '<span style="font-variant-numeric:tabular-nums">tallest bar = ' + ceiling.toFixed(1) + 'h</span>'
    + '</div>')
    + '<p style="font-size:14.5px;line-height:1.7;color:var(--fg2);margin:18px 0 0;max-width:86ch">' + stallReading(t) + '</p>'
  + '</div>';
}

function stuckSection(timings, totalStalled){
  const ceiling = Math.max.apply(null, timings.map(t => t.peak).concat([0])) || 1;
  return '<div style="padding:0;margin-bottom:56px">'
    + '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);margin:0 0 10px">When they get stuck</div>'
    // Everything that used to follow this sentence was our reasoning about
    // how the chart was built. The customer never saw a floor plan and does
    // not care that we rejected one, and "peaks inside one kind of work" is
    // demonstrated by there being separate strips rather than narrated.
    + '<p style="font-size:14.5px;line-height:1.7;color:var(--fg2);margin:0 0 22px;max-width:86ch">Your robots lost <b style="color:var(--fg1);font-weight:600">' + totalStalled.toFixed(1) + ' hours</b> to stalls this period. Here is when.</p>'
    // One ceiling for the page, taken from the tallest single hour on any
    // strip. Only the vertical scale is shared; each strip keeps its own
    // bracket, which is still that strip's own real finding.
    + timings.map((t, i) => stallCard(t, ceiling, i === timings.length - 1)).join('')
  + '</div>';
}

function brandRow(t, b, best){
  const facts = [];
  if (t.basis === 'active_hour'){
    facts.push(b.units.toFixed(1) + ' ' + esc(t.unitPlural));
  } else {
    facts.push(b.units.toLocaleString('en-US') + ' ' + esc(t.unitPlural) + ' started');
    facts.push(b.hours.toFixed(0) + ' active hours');
  }
  facts.push(money(b.invoice) + ' of invoice');
  if (b.cov !== null) facts.push(b.cov.toFixed(2) + 'x coverage');
  return '<div style="border-top:1px solid var(--hair)">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:18px 4px 6px">'
      + '<span style="min-width:110px;font-size:15.5px;font-weight:' + (b === best ? 600 : 500) + ';color:var(--fg1)">' + esc(b.brand) + '</span>'
      + '<span style="font-size:12.5px;color:var(--fg3)">' + b.count + ' robot' + (b.count === 1 ? '' : 's') + '</span>'
      + '<span style="margin-left:auto;font-size:18px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">' + money(b.perUnit) + '</span>'
    + '</div>'
    + '<div style="padding:0 4px 18px;font-family:inherit;font-size:12.5px;color:var(--fg2);line-height:1.6;overflow-x:auto;white-space:nowrap">' + facts.join(' &middot; ') + '</div>'
  + '</div>';
}

function brandTable(t){
  const best = t.brands[0];
  const worst = t.brands[t.brands.length - 1];
  const morePct = best.perUnit > 0 ? Math.round((worst.perUnit - best.perUnit) / best.perUnit * 100) : 0;
  const gap = Math.round((worst.perUnit - best.perUnit) * worst.units);
  // One machine can be a good machine rather than evidence about a brand,
  // so a row resting on a single robot says so by name, visibly, never in
  // a tooltip.
  const singles = t.brands.filter(b => b.count === 1);
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 20px;margin-bottom:20px">'
    + '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3);margin-bottom:12px">' + esc(t.work) + ' &middot; cost per ' + esc(t.unit) + '</div>'
    + '<p style="font-size:14.5px;line-height:1.7;color:var(--fg2);margin:0 0 18px;max-width:86ch">Your ' + esc(best.brand) + ' machines do the same job for ' + money(best.perUnit) + ' per ' + esc(t.unit) + '. Your ' + esc(worst.brand) + ' machines cost ' + money(worst.perUnit) + ', ' + morePct + '% more.</p>'
    + t.brands.map(b => brandRow(t, b, best)).join('')
    + '<div style="font-size:12px;color:var(--fg3);line-height:1.6;margin-top:16px">Cost per ' + esc(t.unit) + ' is invoice divided by work performed, the same definition used everywhere else on the page, so a brand row can be checked against the robot rows it came from. Only ' + esc(t.work.toLowerCase()) + ' is ranked here: cost per ' + esc(t.unit) + ' and cost per hour of a different job are different units, and ranking them together would produce a number with no dimension.</div>'
    + (singles.length ? '<div style="font-size:12.5px;font-weight:500;color:var(--fg1);line-height:1.6;margin-top:12px">' + singles.map(b => esc(b.brand) + ' rests on one machine, ' + esc(b.names[0])).join('. ') + '. One machine can be a good machine rather than evidence about a brand.</div>' : '')
    + '<p style="font-size:13px;line-height:1.7;color:var(--fg3);margin:14px 0 0;max-width:88ch">At the volume your ' + esc(worst.brand) + ' machines actually ran, that gap is worth about $' + gap.toLocaleString('en-US') + ' over this period.</p>'
  + '</div>';
}

function brandSection(tables){
  return '<div style="padding:0;margin-bottom:56px">'
    + '<h2 style="font-size:20px;font-weight:600;letter-spacing:-0.02em;margin:0 0 10px;color:var(--fg1)">Brand against brand</h2>'
    + '<p style="font-size:14.5px;line-height:1.7;color:var(--fg2);margin:0 0 22px;max-width:86ch">A vendor dashboard only ever sees that vendor&#39;s own machines, so this is the one comparison a robot manufacturer structurally cannot ship.</p>'
    + tables.map(brandTable).join('')
  + '</div>';
}

/* ─────────────────────────  THE SCAN LAYER  ─────────────────────────

   This screen used to render 1,002 words. A dashboard screen should be 80
   to 150, and the default view below holds under 60.

   Nothing was deleted to get there. Every sentence, figure and caveat that
   was on the screen moved one layer down: into a row's detail, or into the
   one page-level "how we count" panel. The sections themselves are
   untouched — they are exactly the same functions, rendered inside an
   expansion instead of stacked down the page.

   Why words took over in the first place: the product refuses status
   colours, which was the right call but was never paid for. Colour is a
   signal channel, and giving it up means shape and position have to work
   twice as hard. They did almost nothing, so prose became the only
   channel. This layer spends the budget on shape instead.

   Four conventions, declared once in the legend and never restated in
   prose: paired bars are a money comparison, longer is more; solid fill is
   measured and hatched fill is estimated from a stated assumption; a solid
   left rule is money already spent and a dashed left rule is money
   conditional on doing something; ink density carries magnitude. */

// The scan layer speaks in whole dollars. money() keeps its two decimals
// wherever arithmetic has to be checkable, which is every figure inside a
// detail — a row is for magnitude, not for reconciliation.
function money0(n){ return '$' + Math.round(n).toLocaleString('en-US'); }

// Estimated fill, used wherever a figure rests on a stated assumption
// rather than on something the robot reported. Monochrome hatching, no
// second colour, so the distinction survives being printed in black and
// white.
const HATCH = 'repeating-linear-gradient(135deg,var(--fg1) 0 1.5px,transparent 1.5px 4.5px)';

/** The hero. One figure and one bar: what the robots are really costing
 * against what the invoice says they cost. The labour segment is split by
 * fill, not by label — the hand-driving hours are measured and the stall
 * clearing is estimated from the minutes assumption, and that difference is
 * the whole reason this screen is trusted. */
function costsHero(k, invoiceSum, timings, tables){
  const total = invoiceSum + k.total;
  const pct = (v) => (total > 0 ? (v / total) * 100 : 0);
  const seg = (w, fill, label, id) => '<div' + (id ? ' id="' + id + '"' : '') + ' style="width:' + w.toFixed(2) + '%;background:' + fill + '"' + (label ? ' title="' + label + '"' : '') + '></div>';
  // The stacked-stat card the robot pages use, so the three pages an owner
  // drills into all read the same way: a title, then one block per figure
  // with a 13px label, the figure large, and the one flag that applies.
  // Here the flag is the measured / estimated distinction, which is the
  // whole reason this screen is trusted.
  const stat = (label, value, unit, flag, flagIcon, ids) => '<div style="padding:16px 0;border-top:1px solid var(--hair)">'
    + '<div style="font-size:13px;font-weight:500;color:var(--fg2);margin-bottom:6px">'+label+'</div>'
    + '<div style="display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums"><span'+(ids&&ids.value?' id="'+ids.value+'"':'')+' style="font-size:24px;font-weight:600;letter-spacing:-0.02em;color:var(--fg1)">'+value+'</span>'+(unit?'<span style="font-size:13px;color:var(--fg3)">'+unit+'</span>':'')+'</div>'
