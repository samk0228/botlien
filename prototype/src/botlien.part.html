    + '<div style="font-size:11.5px;color:var(--fg3);margin-top:12px;line-height:1.6">One point per day on record, '+daily.length+' days. The dashed line is 1.00x, where the work is worth exactly what the lease costs; the two upright dashes are the first and last day counted.</div>'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:20px;padding-top:20px;margin-top:18px;border-top:1px solid var(--hair)">'
      + statRow('6-period average', avg.toFixed(2)+'x', 'all six, open included')
      + statRow('Best period', vals[bestIdx].toFixed(2)+'x', ordered[bestIdx].label)
      + statRow('Weakest period', vals[worstIdx].toFixed(2)+'x', ordered[worstIdx].label)
      + statRow('Best day', Math.max.apply(null, daily.map(d => d.cov)).toFixed(2)+'x', fmtDateShort(daily.reduce((a,b) => b.cov > a.cov ? b : a).date))
    + '</div>'
    + breakdown
  + '</div>';

  const pCols = 'minmax(150px,1.6fr) minmax(70px,.7fr) minmax(70px,.7fr) minmax(70px,.7fr) minmax(80px,.8fr) minmax(80px,.8fr) minmax(90px,.9fr)';
  const ph = (t, right, help) => '<div style="display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--fg3);'+(right?'justify-content:flex-end;':'')+'white-space:nowrap">'+t+(help ? '<span title="'+help+'" style="display:inline-flex;cursor:help">'+ic('help-circle',12)+'</span>' : '')+'</div>';
  const periodTable = '<div style="border:1px solid var(--hair);border-radius:6px;padding:20px 22px 22px;margin-bottom:20px">'
    + cardTitle('Every period', 'Each site&#39;s own figure, and the blend across the three.')
    + '<div style="overflow-x:auto;min-width:0"><div style="min-width:680px">'
      + '<div style="display:grid;grid-template-columns:'+pCols+';gap:14px;padding:0 0 10px;border-bottom:1px solid var(--hair)">'
        + ph('Period') + SITES.map(s => ph(s.name)).join('') + ph('All 3 sites', false, 'Every site&#39;s robots in one figure, weighted by how many robots each site runs.') + ph('Utilization', false, 'Duty time against the hours a day each robot is scheduled for.') + ph('vs prior', true, 'Change in this scope&#39;s coverage against the period before it.')
      + '</div>'
      + PERIODS.map((p, idx) => {
          const all = covForPeriod(p, 'all');
          const prior = PERIODS[idx+1] ? covForPeriod(PERIODS[idx+1], S.dashScope) : null;
          const now = covForPeriod(p, S.dashScope);
          const d = prior === null ? null : now - prior;
          return '<div style="display:grid;grid-template-columns:'+pCols+';gap:14px;padding:13px 0;border-bottom:1px solid var(--hair);align-items:center;font-variant-numeric:tabular-nums">'
            + '<div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="font-size:13px;font-weight:500;color:var(--fg1);white-space:nowrap">'+p.label+'</span>'+(p.status === 'open' ? badge('open','open') : '')+'</div>'
            + p.siteCov.map((c, si) => '<div style="font-size:13px;font-weight:'+(String(S.dashScope) === String(si) ? 600 : 400)+';color:'+(String(S.dashScope) === String(si) ? 'var(--fg1)' : 'var(--fg2)')+'">'+(p.status === 'open' ? covForPeriod(p, si).toFixed(2) : c.toFixed(2))+'x</div>').join('')
            + '<div style="font-size:13px;font-weight:'+(S.dashScope === 'all' ? 600 : 400)+';color:'+(S.dashScope === 'all' ? 'var(--fg1)' : 'var(--fg2)')+'">'+all.toFixed(2)+'x</div>'
            + '<div style="font-size:13px;color:var(--fg2)">'+Math.round(utilForPeriod(p, S.dashScope))+'%</div>'
            + '<div style="font-size:13px;color:var(--fg2);text-align:right">'+(d === null ? '' : (d >= 0 ? '+' : '−')+Math.abs(d).toFixed(2))+'</div>'
          + '</div>';
        }).join('')
    + '</div></div>'
    + '<div style="font-size:11.5px;color:var(--fg3);margin-top:12px;line-height:1.6">The open period is computed from the fleet as it is configured right now, so every site column in that row moves with an input change. Closed rows are locked.</div>'
  + '</div>';

  const shown = searchRows(rows, r => r.name+' '+((ROBOTS[r.i]||{}).model || ''));
  const sorted = shown.slice().sort((a, b) => (b.cov === null ? -1 : b.cov) - (a.cov === null ? -1 : a.cov));
  const rCols = 'minmax(0,2fr) minmax(0,.9fr) minmax(0,.7fr) minmax(0,1fr) 24px';
  const moversTable = '<div style="border:1px solid var(--hair);border-radius:6px;padding:20px 22px 22px;margin-bottom:40px">'
    + cardTitle('Which robots moved', 'Six periods each, oldest bar first. Open one for the equation behind its number.')
    + '<div>'
      + '<div style="display:grid;grid-template-columns:'+rCols+';gap:14px;padding:0 0 10px;border-bottom:1px solid var(--hair)">'
        + ph('Robot') + ph('Coverage') + ph('vs July') + ph('Last 6 periods') + '<div></div>'
      + '</div>'
      + sorted.map(r => '<div data-act="toggleRobot" data-i="'+r.i+'" class="hv-ghost" style="display:grid;grid-template-columns:'+rCols+';gap:14px;padding:12px 0;border-bottom:1px solid var(--hair);align-items:center;cursor:pointer;font-variant-numeric:tabular-nums">'
        + '<div style="min-width:0"><div style="font-size:13.5px;font-weight:500;color:var(--fg1)">'+esc(r.name)+'</div>'
          + '<div style="font-size:11.5px;color:var(--fg3);margin-top:2px">'+esc((ROBOTS[r.i]||{}).model || '')+'</div></div>'
        + '<div style="font-size:15px;font-weight:600;color:var(--fg1)">'+(r.cov === null ? '—' : r.cov.toFixed(2)+'x')+'</div>'
        + '<div style="font-size:13px;color:var(--fg2)">'+(ROBOT_DELTA[r.name] || '')+'</div>'
        + '<div style="min-width:0">'+miniPeriodBars(robotPeriodCoverage(r))+'</div>'
        + '<span style="flex:none;display:flex;justify-content:flex-end;color:var(--fg3)">'+ic('chevron-right',16)+'</span>'
      + '</div>').join('')
    + '</div>'
  + '</div>';

  return subhead + chartCard + periodTable + moversTable;
}

/* ─────────────────────────  INCIDENTS  ───────────────────────── */

function viewIncidents(){
  const k = computeIncidents();
  if (!k.rows.length) return noContractCard('Nothing has been logged for this period at this scope. An export with a stuck-or-error column and a timestamp fills this page.');
  const f = S.incidentFilter || { kind:'', site:'', shift:'' };
  const families = [...new Set(k.rows.map(r => r.family))];
  let shown = k.rows.filter(r => (!f.kind || r.family === f.kind) && (!f.site || String(r.site) === f.site) && (!f.shift || r.shift === f.shift));
  shown = searchRows(shown, r => r.name+' '+r.kind+' '+r.siteName+' '+r.safetyNote);
  const tabs = [
    { id:'all',    label:'Incidents',  value: String(k.rows.length), unit: k.downtime+' downtime, '+k.safety+' safety' },
    { id:'hours',  label:'Hours down', value: k.hoursTotal.toFixed(1)+' h', unit:'logged by the robots' },
    { id:'window', label:'Worst hour', value: twelve(k.worst)+(k.worst < 12 ? 'a' : 'p'), unit: Math.round(k.windowShare*100)+'% of stall time' },
    { id:'place',  label:'Repeat spot', value: k.topPlace ? esc(k.topPlace) : 'none', unit: k.topPlaceCount+' incident'+(k.topPlaceCount===1?'':'s') }
  ];
  const current = tabs.some(t => t.id === S.incidentTab) ? S.incidentTab : 'all';
  const chip = (label, key, val) => {
    const on = (S.incidentFilter || {})[key] === val;
    return '<span data-act="incidentFilter" data-k="'+key+'" data-v="'+esc(val)+'" class="hv-dim9" style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;box-sizing:border-box;border-radius:16px;cursor:pointer;font-size:12px;font-weight:500;'
      + (on ? 'background:var(--ink);color:var(--ink-fg);' : 'background:rgba(22,32,74,.08);color:var(--fg2);')+'">'+esc(label)+'</span>';
  };
  const filters = '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px">'
    + chip('All kinds','kind','') + families.map(x => chip(x,'kind',x)).join('')
    + '<span style="width:1px;height:28px;background:var(--hair)"></span>'
    + chip('All sites','site','') + SITES.map((s,i) => chip(s.name,'site',String(i))).join('')
    + '<span style="width:1px;height:28px;background:var(--hair)"></span>'
    + (S.shifts || SHIFTS).map(s => chip(s.label+' · '+shiftSpan(s),'shift',s.label)).join('')
  + '</div>';
  const cols = 'minmax(86px,.8fr) minmax(58px,.5fr) minmax(140px,1.4fr) minmax(140px,1.3fr) minmax(96px,.8fr) minmax(84px,.7fr)';
  const th = (t, help, drop) => '<div'+(drop ? ' data-incident-drop' : '')+' style="display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:var(--fg2)">'+t+(help ? '<span title="'+help+'" style="display:inline-flex;color:var(--fg3);cursor:help">'+ic('help-circle',12)+'</span>' : '')+'</div>';
  const table = '<div style="border:1px solid var(--hair);border-radius:6px;overflow:hidden">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;padding:20px 18px 16px">'
      + '<h2 style="font-size:16px;font-weight:600;letter-spacing:-0.01em;margin:0;color:var(--fg1)">'+shown.length+' incident'+(shown.length===1?'':'s')+'</h2>'
      + '<span style="font-size:13px;color:var(--fg3)">Aug 4 – Sep 3, the open period. '+(k.linked ? 'The collision is also a downtime row and is counted once.' : '')+'</span></div>'
    + '<div data-incident-head style="display:grid;grid-template-columns:'+cols+';gap:14px;align-items:center;padding:12px 18px;background:var(--ghost);border-bottom:1px solid var(--hair)">'
      + th('When') + th('Shift', '', true) + th('Robot') + th('What it reported') + th('Down for')
      + th('Cost', 'Someone\u2019s time clearing a stall, at the assumed minutes per stall set on Costs. Only stalls carry one; hand-driven time is not logged per incident.', true)
    + '</div>'
    + (shown.length ? shown.map(r => '<div data-incident-row style="display:grid;grid-template-columns:'+cols+';gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--hair)">'
        + '<div style="font-size:12.5px;color:var(--fg1);font-variant-numeric:tabular-nums;white-space:nowrap">'+fmtDateShort(r.date).replace(', 2026','')+' <span style="color:var(--fg3)">'+fmtClock(r.time)+'</span></div>'
        + '<div data-incident-drop style="font-size:12.5px;color:var(--fg2)">'+r.shift+'</div>'
        + '<div style="min-width:0"><div style="font-size:13.5px;font-weight:500;color:var(--fg1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.name)+'</div>'
          + '<div style="font-size:11.5px;color:var(--fg3)">'+esc(r.siteName)+'</div></div>'
        + '<div style="min-width:0"><div style="font-size:12.5px;color:var(--fg1)">'+esc(r.kind)+'</div>'
          + (r.safetyNote ? '<div style="font-size:11.5px;color:var(--fg3);line-height:1.45">'+esc(r.safetyNote)+'</div>' : '')+'</div>'
        + '<div style="font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap">'+(r.minutes ? fmtDownFor(r.minutes) : '<span style="color:var(--fg3)">none logged</span>')+'</div>'
        + '<div data-incident-drop style="font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'+(r.cost === null ? '' : '<span title="Assumed '+S.stallMinutes+' minutes of someone\u2019s time" style="display:inline-flex;align-items:center;gap:6px"><span style="width:9px;height:9px;flex:none;background:'+HATCH+'"></span>'+money(r.cost)+'</span>')+'</div>'
      + '</div>').join('')
      : '<div style="padding:24px 18px;font-size:13.5px;color:var(--fg3)">Nothing matches these filters.</div>')
  + '</div>';
  const panel = current === 'window'
    ? '<div>'+barChart(k.hours.map((m, h) => ({ label: twelve(h)+(h < 12 ? 'am' : 'pm'), axis: h % 3 === 0 ? twelve(h)+(h < 12 ? 'a' : 'p') : '', value:m, display: m ? m+' m' : '', current: h === k.worst })), { height:150, gap:3 })
        + '<div style="font-size:12.5px;line-height:1.7;color:var(--fg2);margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)">The worst window is '+twelve(k.worst)+' to '+twelve(k.worst+2)+' '+dayPart(k.worst)+', '+shiftOf(k.worst).label.toLowerCase()+' shift, '+Math.round(k.windowShare*100)+'% of the minutes lost. Hours with no bar had no logged incident at all.</div>'
      + '</div>'
    : filters + table;
  return metricTabs(tabs, current, 'incidentTab')
    + metricPanel(panel)
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:16px 0 40px">'
      + '<button type="button" data-act="downloadIncidents" class="hv-ghost" style="display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--hair2);background:var(--card);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--fg1)">'+ic('download',14)+'Download CSV</button>'
      + '<span style="font-size:11.5px;color:var(--fg3)">The file carries assumed_minutes_per_stall as its own column, so the assumption travels with the data.</span>'
    + '</div>';
}

/* ─────────────────────────  VENDORS  ───────────────────────── */

function viewVendors(){
  const vendors = computeVendors();
  if (!vendors.length) return noContractCard('No make has robots at this scope. Import your export and each vendor gets a column here.');
  const q = String(S.search || '').trim().toLowerCase();
  const shown = q ? vendors.filter(v => v.brand.toLowerCase().indexOf(q) >= 0 || v.robots.some(r => r.name.toLowerCase().indexOf(q) >= 0)) : vendors;
  const list = shown.length ? shown : vendors;
  const cols = 'minmax(170px,1.3fr) '+list.map(() => 'minmax(110px,1fr)').join(' ');
  const best = (vals, dir) => {
    const real = vals.filter(v => v !== null && v !== undefined);
    if (!real.length) return null;
    return dir === 'high' ? Math.max.apply(null, real) : Math.min.apply(null, real);
  };
  const row = (label, help, cells, dir) => {
    const raw = cells.map(c => c.sort);
    const win = dir ? best(raw, dir) : null;
    return '<div style="display:grid;grid-template-columns:'+cols+';gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--hair)">'
      + '<div style="display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--fg2)">'+label
        + (help ? '<span title="'+esc(help)+'" style="display:inline-flex;color:var(--fg3);cursor:help">'+ic('help-circle',12)+'</span>' : '')+'</div>'
      + cells.map(c => '<div style="font-size:13px;font-variant-numeric:tabular-nums;color:'+(c.sort !== null && win !== null && c.sort === win ? 'var(--fg1)' : 'var(--fg2)')+';font-weight:'+(c.sort !== null && win !== null && c.sort === win ? 600 : 400)+'">'+c.html+'</div>').join('')
    + '</div>';
  };
  const yesNo = (ok) => ok ? '<span style="display:inline-flex;align-items:center;gap:6px;color:var(--fg1)">'+ic('check',13)+'yes</span>' : '<span style="color:var(--fg3)">not sent</span>';
  const table = '<div style="border:1px solid var(--hair);border-radius:6px;padding:20px 22px 22px;margin-bottom:20px">'
    + cardTitle(list.length+' make'+(list.length===1?'':'s')+' in view', 'One column per vendor. The strongest figure in each row is in full ink.')
    + '<div style="overflow-x:auto;min-width:0"><div style="min-width:'+(220 + list.length*130)+'px">'
      + '<div style="display:grid;grid-template-columns:'+cols+';gap:14px;align-items:end;padding-bottom:12px">'
        + '<div></div>'
        + list.map(v => '<div><div style="font-size:15px;font-weight:600;color:var(--fg1)">'+esc(v.brand)+'</div>'
          + '<div style="font-size:11.5px;color:var(--fg3);margin-top:2px">'+v.count+' robot'+(v.count===1?'':'s')+'</div></div>').join('')
      + '</div>'
      + row('Uptime delivered', 'Scheduled minutes less logged downtime, across that make\u2019s robots at this scope.', list.map(v => ({ sort: v.delivered, html: v.delivered === null ? '—' : v.delivered.toFixed(2)+'%' })), 'high')
      + row('Uptime promised', '', list.map(v => ({ sort:null, html: v.promised+'%' })))
      + row('Incidents per 100 active hours', 'Logged incidents against the hours the robots actually ran.', list.map(v => ({ sort: v.per100 === null ? null : -v.per100, html: v.per100 === null ? '—' : v.per100.toFixed(1) })), 'high')
      + row('Cost per pick', 'Invoice divided by picks, for that make\u2019s pickers.', list.map(v => ({ sort: v.perPick === null ? null : -v.perPick, html: v.perPick === null ? '<span style="color:var(--fg3)">no picking</span>' : money(v.perPick) })), 'high')
      + row('Cost per cleaning hour', '', list.map(v => ({ sort: v.perHour === null ? null : -v.perHour, html: v.perHour === null ? '<span style="color:var(--fg3)">no cleaning</span>' : money(v.perHour) })), 'high')
      + row('Parts, 90 days', 'Only a make that reports wear can be billed for parts you can see.', list.map(v => ({ sort:null, html: v.partsSpend === null ? '<span style="color:var(--fg3)">not reported</span>' : money0(v.partsSpend) })))
      + row('Credits owed', 'This period, under the uptime clause.', list.map(v => ({ sort: v.credit > 0 ? -v.credit : 0, html: v.credit > 0 ? money(v.credit) : '<span style="color:var(--fg3)">none</span>' })), 'high')
      + row('Support, first reply', 'Median days to a first reply on open tickets.', list.map(v => ({ sort: v.tickets.medianDays === null ? null : -v.tickets.medianDays, html: v.tickets.open === 0 ? '<span style="color:var(--fg3)">no open tickets</span>' : v.tickets.medianDays+' days · '+v.tickets.open+' open' })), 'high')
      + row('Paid back', '', list.map(v => ({ sort: v.paid, html: v.paid+' of '+v.count })), 'high')
      + row('Reports condition', '', list.map(v => ({ sort:null, html: yesNo(v.reports.condition) })))
      + row('Reports battery', '', list.map(v => ({ sort:null, html: yesNo(v.reports.battery) })))
      + row('Reports position', '', list.map(v => ({ sort:null, html: yesNo(v.reports.position) })))
      + '<div style="display:grid;grid-template-columns:'+cols+';gap:14px;align-items:start;padding:16px 0 0;border-top:1px solid var(--hair)">'
        + '<div style="font-size:12.5px;color:var(--fg2)">Take it to them</div>'
        + list.map(v => '<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">'
          + '<button type="button" data-act="openEvidence" data-brand="'+esc(v.brand)+'" class="hv-ghost" style="display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--hair2);background:var(--card);cursor:pointer;font-size:12px;font-weight:600;color:var(--fg1)">'+ic('printer',13)+'Evidence pack</button>'
          + (v.endingSoon.length ? '<button type="button" data-act="renewalBrief" data-i="'+v.endingSoon[0].i+'" class="hv-ghost" style="display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--hair2);background:var(--card);cursor:pointer;font-size:12px;font-weight:600;color:var(--fg1)">'+ic('file-text',13)+'Renewal brief</button>' : '<span style="font-size:11.5px;color:var(--fg3)">no lease ends inside 9 months</span>')
          + '<span style="font-size:11.5px;color:var(--fg3)">'+esc(v.contact)+'</span>'
        + '</div>').join('')
      + '</div>'
    + '</div></div>'
  + '</div>';
  const brief = !S.briefRobot && S.briefRobot !== 0 ? '' : '<div style="border:1px solid var(--hair);border-radius:6px;padding:20px 22px 22px;margin-bottom:20px">'
    + cardTitle('Renewal brief', 'Every figure read from the same calculations the pages show.', '<button type="button" data-act="copyBrief" class="hv-ghost" style="margin-left:auto;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--hair2);background:var(--card);cursor:pointer;font-size:12px;font-weight:600;color:var(--fg1)">'+(S.briefCopied ? 'Copied' : 'Copy')+'</button>')
    + '<pre id="renewalBriefText" style="margin:0;padding:18px 20px;background:var(--ghost);border:1px solid var(--hair);border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.8;color:var(--fg1);white-space:pre-wrap">'+esc(renewalBrief(S.briefRobot))+'</pre>'
  + '</div>';
  return table + brief
    + '<div style="font-size:12.5px;line-height:1.7;color:var(--fg2);margin-bottom:40px;max-width:88ch">The report rows are why a figure elsewhere in the app reads not reported: a make that does not send wear, battery or position cannot be asked about it. Nothing here is a rating, only what each vendor promised, delivered, cost and sent.</div>';
}

/* ─────────────────────────  RENDER  ───────────────────────── */

function render(){
  const active = document.activeElement;
  const keepId = active && active.id ? active.id : null;
  const selStart = keepId && 'selectionStart' in active ? active.selectionStart : null;

  const onAuth = S.stage === 'auth';
  // A first-time owner stays out of the app rail clear through import and
  // confirm: the rail is the product's navigation, and there is nothing to
  // navigate to until a fleet exists. Content still comes from appStage(),
  // since 'start' and 'confirm' are real views with real width needs (a
  // robot table does not fit the 440px sign-in card), just centred in their
  // own wide column instead of sitting next to the rail. It only appears
  // once the fleet is actually confirmed (confirmFleet clears S.onboarding).
  // A returning owner (toApp) never sets it, so they see the rail immediately.
  const inOnboarding = S.stage === 'app' && S.onboarding;
  const inner = onAuth
    ? authStage()
    : inOnboarding
      ? '<div data-stage style="padding:56px 34px 80px;display:flex;justify-content:center"><div style="width:100%;max-width:860px">' + appStage() + '</div></div>'
      : appRail() + appStage();

  /* The app keeps its rail, because navigation between Coverage, Robots, Rates
     and Settings is the product. Auth (and onboarding) has nowhere to
     navigate to, so it gets the whole width and the card centres in it. */
  // 256px / 48px: shadcn's own SIDEBAR_WIDTH / SIDEBAR_WIDTH_ICON, and the
  // real docs demo (variant="sidebar", the default, measured directly off
  // ui.shadcn.com/docs/components/base/sidebar) is flush against the edge,
  // no floating margin to compensate for. That was the wrong variant.
  const cols = (onAuth || inOnboarding) ? 'minmax(0,1fr)' : '64px minmax(0,1fr)';

  document.getElementById('root').innerHTML =
    '<div style="position:relative;min-height:100vh;background:'+(onAuth?'var(--page)':'var(--page-bg)')+';color:var(--fg1)">'
    + '<div data-grid style="position:relative;display:grid;grid-template-columns:'+cols+';align-items:start;min-height:100vh">'
    + inner + '</div></div>';

  // The tab title was one hardcoded string, "Sign-in to statement", left
  // from when this file opened on a sign-in screen. A demo visitor lands on
  // the dashboard and never sees a sign-in, so the tab described a screen
  // that was not on it. Tracks the actual screen now.
  document.title = S.demoMode ? 'Botlien · Demo'
    : onAuth ? 'Botlien · Sign in'
    : (COPY[S.view] ? 'Botlien · '+COPY[S.view][0] : 'Botlien');

  applySensitivity();
  layoutDashMasonry();

  if (keepId){
    const el = document.getElementById(keepId);
    if (el){
      /* selectionStart reads null on input types the selection API does not cover
         (email, number). Without the fallback the caret lands at 0 after every
         re-render and the field fills in backwards. */
      try {
        el.focus();
        if (el.type !== 'range' && 'setSelectionRange' in el){
          const at = selStart != null ? selStart : (el.value ? el.value.length : 0);
          el.setSelectionRange(at, at);
        }
      } catch(e){}
    }
  } else if (S.stage === 'auth' && ['signin','signin-new','signin-failed','signedout'].includes(S.screen)){
    const el = document.getElementById('authEmail');
    if (el) { try { el.focus(); } catch(e){} }
  }

  // Choosing "+ Type my own…" re-renders, and the field it reveals did not
  // exist when focus was captured above, so focus would stay on the select
  // and the new box would look inert. Put the caret in it.
  const openEntry = Object.keys(S.workEntry).find(k => S.workEntry[k]);
  if (openEntry !== undefined){
    const el = document.getElementById('workNew-'+openEntry);
    if (el && document.activeElement !== el) { try { el.focus(); } catch(e){} }
  }
}

/** Patches the "Where the rates come from" row for one work category, and
 * every Setup row priced by it, after a wage or throughput keystroke. Same
 * live-patch reason as applySetupRow: re-rendering would drop focus out of
 * the field being typed into. */
function applyRateRow(work){
  if (S.view !== 'setup') return;
  const b = workDef(work);
  const rc = rateCentsFor(work);
  const out = document.querySelector('[data-rate-out="'+cssEsc(work)+'"]');
  if (out) out.textContent = rc === null ? 'needs a number above' : money(rc/100)+' per '+b.unit;
  const src = document.querySelector('[data-rate-src="'+cssEsc(work)+'"]');
  if (src) src.textContent = (wageIsOwnSet(work) || throughputIsOwnSet(work)) ? 'your numbers' : 'benchmark';
  // The averaged figures shown in place of the inputs when a roster drives
  // them, or editing a role would move the rate and leave the average it
  // supposedly came from unchanged.
  const wOut = document.querySelector('[data-rate-wage-out="'+cssEsc(work)+'"]');
  if (wOut) wOut.textContent = money(wageFor(work));
  const tOut = document.querySelector('[data-rate-through-out="'+cssEsc(work)+'"]');
  if (tOut) tOut.textContent = throughputFor(work);
  // The derivation lines and every per-robot row that prices off this
  // category move with it, or the page would show a new rate above and the
  // old arithmetic below.
  const stmt = computeStatement(true, scopeFilter());
  const derivs = document.querySelector('[data-rate-derivations]');
  if (derivs) derivs.innerHTML = rateDerivationLines([...new Set(stmt.rows.map(r => r.work))]);
  stmt.rows.filter(r => r.work === work).forEach(r => applySetupRow(r.i));
}

/** Escapes a value for use inside a CSS attribute selector. Work categories
 * are known strings today, but building a selector out of unescaped text is
 * the kind of thing that breaks the day one contains a quote. */
function cssEsc(s){
  return String(s).replace(/["\\]/g, '\\$&');
}

// Same live-patch reason as applySensitivity below: a full re-render on
// every keystroke in the rate/interest inputs would blow away focus in the
// very field being typed into. The trace block gets its whole innerHTML
// replaced rather than patched span-by-span, its percentage figures are
// baked into surrounding sentence text, not isolated in their own spans.
// Same live-patch reason as applyTaxShield and applySensitivity: a full
// re-render on every keystroke in the minutes field would blow away focus
// in the very input being typed into. Row ORDER is deliberately not
// re-sorted here — rows jumping around under the cursor mid-keystroke is
// worse than a ranking that settles on the next render.
function applyKeeping(){
  if (S.view !== 'costs') return;
  const put = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
  const minutes = S.stallMinutes;
  const k = computeKeeping(minutes);
  put('keepHeadline', money0(k.total));
  put('heroClearMoney', money(k.clearMoney));
  put('heroClearFlag', 'estimated from '+minutes+' min per stall');
  const tabVal = document.querySelector('[data-tab-value="keep"]');
  if (tabVal) tabVal.textContent = money0(k.total);
  put('rowMagLabour', money0(k.total));
  put('heroLabour', 'labour ' + money0(k.total));
  const base = document.querySelector('[data-hero-invoice]');
  const invoiceSum = base ? parseFloat(base.dataset.heroInvoice) || 0 : 0;
  const total = invoiceSum + k.total;
  const wide = (id, v) => { const el = document.getElementById(id); if (el) el.style.width = (total > 0 ? (v / total) * 100 : 0).toFixed(2) + '%'; };
  wide('heroLease', invoiceSum);
  wide('heroHand', k.handMoney);
  wide('heroClear', k.clearMoney);
  put('keepClearMoney', money(k.clearMoney));
  put('keepTotalMoney', money(k.total));
  put('keepClearNote', keepingClearNote(k, minutes));
  put('keepProse', keepingProse(k));
  k.rows.forEach(r => {
    put('keepRowMoney-' + r.i, money(r.total));
    put('keepRowEq-' + r.i, keepingEq(r, k.wage));
  });
}

function applyTaxShield(){
  const put = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  if (S.view !== 'dashv2') return;
  const t = computeTaxShield();
  const m = (cents) => money(cents / 100);
  put('taxShieldValue', m(t.shieldCents));
  put('taxNetCostValue', m(t.netCostCents));
}

/* The slider patches the statement in place. A full re-render on every input
   event would replace the range element mid-drag and the thumb would stop
   tracking the pointer. */
function applySensitivity(){
  const put = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  if (S.view !== 'dashv2') return;
  const base = sensBase();
  if (!base) return;
  const c = calc(S.throughput, base);
  put('sensT', S.throughput);
  put('sensT2', S.throughput);
  put('sensRate', money(c.rate));
  put('sensRate2', money(c.rate));
  put('sensWork', money(c.total));
  put('sensWork2', money(c.total));
  put('sensCov', c.cov.toFixed(2) + 'x');
  put('sensCovBig', c.cov.toFixed(2) + 'x');
  const slider = document.getElementById('sensRange');
  if (slider) slider.style.setProperty('--bl-fill', ((S.throughput - 15) / (60 - 15) * 100) + '%');
}

// Patches one Setup row's derived rate and summary line in place after a
// wage/invoice/hours/work edit, same reason applySensitivity patches
// instead of calling set(): a full re-render mid-keystroke would blow
// away focus and cursor position in the very input being typed into.
function applySetupRow(i){
  if (S.view !== 'setup' && S.view !== 'numbersRobot') return;
  const put = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
  // .find, not [i]: scope (see scopeFilter) can filter CONFIRM down, so a
  // global index no longer lines up with rows' position in the array.
  const s = computeStatement(true, scopeFilter()).rows.find(row => row.i === i);
  if (!s) return;
  const b = workDef(s.work);
  put('setupRate-'+i, s.rate === null ? '—' : money(s.rate)+' <span style="font-size:13px;color:var(--fg3)">/ '+esc(b.unit)+'</span>');

  const hoursVal = S.robotHours[i] ?? parseFloat(SETUP[i].hours);
  put('setupWork-'+i, esc(s.work));
  put('setupInv-'+i, money(s.invoice)+' <span style="color:var(--fg3)">/ mo</span>');
  put('setupPer-'+i, s.rate === null ? '—' : money(s.rate)+' <span style="color:var(--fg3)">/ '+esc(b.unit)+'</span>');
  put('setupHrs-'+i, hoursVal+' <span style="color:var(--fg3)">h / day</span>');
  // The derived unit cost and, on the robot's own page, the figures on the
  // right: the stats panel exists so an edit's effect is seen in place.
  put('setupRobotRate-'+i, S.view === 'numbersRobot' ? robotUnitCostStat(s, b) : robotUnitCostLabel(s, b));
  put('setupRobotDerive-'+i, robotUnitCostDerivation(s, b));
  const stats = document.getElementById('robotStats-'+i);
  if (stats) stats.outerHTML = robotStatsPanel(s, { view:'robots', act:'toggleRobot', label:'See it on Fleet' });
  // An edit after Save undoes the reassurance: back to "Save" until they
  // confirm this row again.
  delete S.setupSaved[i];
  const btn = document.getElementById('setupSaveBtn-'+i);
  if (btn) btn.outerHTML = setupSaveButton(i);
}

/** Patches everything one contract edit moves, in place. Same live-patch
 * reason as applySetupRow: re-rendering mid-keystroke would blow away the
 * caret in the field being typed into. Payback's tiles, the edited row's
 * verdict, pace and sentence, and the Contract tab's derived end date and
 * source pill all read the one calculation again rather than being nudged
 * by hand. */
function applyContractRow(i){
  const put = (sel, html) => { const el = document.querySelector(sel); if (el) el.innerHTML = html; };
  const ends = document.getElementById('ctEnds-'+i);
  if (ends) ends.textContent = fmtDateShort(leaseEndKey(i));
  const c = contractFor(i);
  const src = document.getElementById('ctSrc-'+i);
  if (src) src.innerHTML = pill(c.edited ? 'yours' : 'from your contract', c.edited ? 'user' : 'file-text');
  if (S.view !== 'payback' && S.view !== 'contract') return;
  if (S.view === 'payback'){
    const p = computePayback();
    const pct = p.priceTotal > 0 ? Math.round(p.earnedTotal / p.priceTotal * 100) : 0;
    put('[data-tab-value="paid"]', p.paid+' of '+p.rows.length);
    put('[data-tab-value="track"]', String(p.track));
    put('[data-tab-value="behind"]', String(p.behind));
    put('[data-tab-value="earned"]', money0(p.earnedTotal)+'');
    const r = p.rows.find(x => x.i === i);
    if (!r) return;
    const v = paybackVerdict(r);
    put('#pbVerdict-'+i, pill(v.label, v.icon));
    put('#pbQuoted-'+i, r.contract.payback+' mo');
    const pace = document.getElementById('pbPace-'+i);
    if (pace) pace.textContent = r.pace === null ? '—' : 'month '+r.pace;
    put('#pbSentence-'+i, paybackSentence(r));
    return;
  }
  const k = computeContract();
  put('[data-tab-value="promised"]', k.modePromise+'%');
  put('[data-tab-value="delivered"]', k.delivered === null ? '—' : k.delivered.toFixed(2)+'%');
  put('[data-tab-value="credit"]', money(k.credit));
}

/* Real masonry for the dashboard grid. Grid and flexbox both size a row by
 * its tallest member, whatever else is in that row either stretches to
 * match it (dead space inside the short card) or stops short of it (dead
 * space below the short card, waiting for the row to clear). Neither is
 * fixable without changing what "a row" means, so this drops rows
 * entirely: each card gets measured at its real width, then placed at the
 * top of whichever column is shortest right now. A short card's neighbor
 * lands right under it, it never waits on a taller card two columns over. */
// Column-packs the EXISTING dash-block nodes in `order` (ids, hidden ones
// filtered out), writing left/top directly rather than touching innerHTML.
// That split is what lets a live drag preview reuse this: reordering mid-
// drag never recreates the node the browser is tracking as the drag
// source, only the plain reflow-on-resize/hide/reset path and the actual
// post-drop render() ever call this through layoutDashMasonry below.
function previewDashOrder(order){
  const container = document.getElementById('dashGrid');
  if (!container) return;
  const cards = order.filter(id => !S.dashHidden.includes(id))
    .map(id => container.querySelector('[data-dash-id="'+id+'"]'))
    .filter(Boolean);
  if (!cards.length){ container.style.height = '0px'; return; }

  const gap = 20, minColWidth = 300;
  const width = container.clientWidth;
  if (!width){ return; } // not laid out yet (display:none ancestor, etc.)
  // One column when the container says so: the dashboard's two cards read
  // as a stack in the owner's own order, and a card that lands beside its
  // neighbour instead of under it is not the order they set.
  const cols = container.hasAttribute('data-dash-single') ? 1
    : Math.max(1, Math.min(cards.length, Math.floor((width + gap) / (minColWidth + gap))));
  const colWidth = (width - gap * (cols - 1)) / cols;

  cards.forEach(card => {
    card.style.position = 'absolute';
    card.style.width = colWidth + 'px';
  });
  const colHeights = new Array(cols).fill(0);
  cards.forEach(card => {
    let ci = 0;
    for (let i = 1; i < cols; i++){ if (colHeights[i] < colHeights[ci]) ci = i; }
    card.style.left = (ci * (colWidth + gap)) + 'px';
    card.style.top = colHeights[ci] + 'px';
    colHeights[ci] = colHeights[ci] + card.offsetHeight + gap;
  });
  container.style.height = (Math.max.apply(null, colHeights) - gap) + 'px';
}
function layoutDashMasonry(){ previewDashOrder(S.dashLayout); }

// Same splice the old single-shot drop handler used, pulled out so the
// live dragover preview can run it repeatedly against a running order
// (not always the last-committed S.dashLayout) as the pointer crosses
// different cards mid-gesture.
function reorderedDashLayout(order, dragged, target){
  const next = order.slice();
  const from = next.indexOf(dragged), to = next.indexOf(target);
  if (from === -1 || to === -1 || from === to) return null;
  next.splice(from, 1);
  next.splice(to, 0, dragged);
  return next;
}
// Column count depends on viewport width, so a resize can change it. No
// masonry library here to subscribe to, a short debounce on window resize
// is the whole mechanism.
let dashResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(dashResizeTimer);
  dashResizeTimer = setTimeout(layoutDashMasonry, 120);
});

/* The phone breakpoint, in one place, because two things now depend on it:
   the sidebar renders differently below it, and the CSS switches menus to
   sheets at the same width. Reading it from matchMedia rather than hard

const PHONE_MQ = window.matchMedia('(max-width:900px)');
function isPhoneLayout(){ return PHONE_MQ.matches; }
// Crossing the breakpoint changes markup, not just layout, so it needs a
// real re-render. Rotating a phone is the case that actually hits this.
PHONE_MQ.addEventListener('change', () => { if (S.stage === 'app') set({}); });

  },
  pickWork: (el) => {
    const i = Number(el.dataset.i);
    S.confirmWork[i] = el.dataset.work;
    S.workEntry = Object.assign({}, S.workEntry, { [i]: false });
    set({ workMenu: null });
  },
  startWorkEntry: (el) => {
    const i = Number(el.dataset.i);
    S.workEntry = Object.assign({}, S.workEntry, { [i]: true });
    set({ workMenu: null });
  },
  deleteWork: (el) => {
    const work = el.dataset.work;
    // Refused while anything still does this work, rather than silently
    // leaving those robots pointing at a category that no longer exists.
    // The owner moves them first, which is a decision only they can make.
    const inUse = CONFIRM.map((c,i) => S.confirmWork[i] ?? c.work).filter(w => w === work).length;
    if (inUse > 0){
      set({ workDeleteBlocked: work, workMenu: null });
      return;
    }
    const custom = Object.assign({}, S.customWork); delete custom[work];
    const wage = Object.assign({}, S.workWage); delete wage[work];
    const through = Object.assign({}, S.workThroughput); delete through[work];
    S.employees = S.employees.filter(e => e.work !== work);
    // One of ours is hidden rather than destroyed, since BENCH is the
    // published table and an owner who removes "Laundry handling" today may
    // want it back. One of theirs is gone with the delete of customWork
    // above; hiding it too keeps workOptions from resurrecting it from a
    // robot that still references it in CONFIRM.
    const hidden = S.hiddenWork.includes(work) ? S.hiddenWork : S.hiddenWork.concat([work]);
    set({ customWork: custom, workWage: wage, workThroughput: through, hiddenWork: hidden, workMenu: null, workDeleteBlocked: '' });
  },
  toggleRoster: (el) => {
    const w = el.dataset.work;
    set({ rateOpen: Object.assign({}, S.rateOpen, { [w]: !S.rateOpen[w] }) });
  },
  addEmployee: (el) => {
    const work = el.dataset.work;
    // Seeded from whatever the rate currently uses, so adding the first
    // role does not lurch the numbers before anything has been typed.
    S.employees = S.employees.concat([{
      id: S.nextEmployeeId, role: '', work,
      wage: wageFor(work), unitsPerHour: throughputFor(work), hoursWeek: 40,
    }]);
    set({ nextEmployeeId: S.nextEmployeeId + 1, rateOpen: Object.assign({}, S.rateOpen, { [work]: true }) });
  },
  removeEmployee: (el) => {
    const id = Number(el.dataset.id);
    S.employees = S.employees.filter(e => e.id !== id);
    set({});
  },
  howTo: (el) => set({ howTo: S.howTo === el.dataset.k ? '' : el.dataset.k }),
  toggleSetup: (el) => { const i = Number(el.dataset.i); set({ openSetup: S.openSetup === i ? -1 : i }); },
  saveSetupRow: (el) => { const i = Number(el.dataset.i); set({ setupSaved: Object.assign({}, S.setupSaved, { [i]: true }) }); },
  save: () => {
    if (S.saving) return;
    set({ saving:true });
    clearTimeout(timers.save);
    timers.save = setTimeout(() => set({ saving:false, view:'dashv2' }), 800);
  },
  uploadGood: () => runUpload(),
  uploadBad: () => set({ upload:'bad' }),
  resetUpload: () => set({ upload:'idle', upPct:0 }),
  startManual: () => set({ manualMode:true, manualStage:'form', manualTouched:false }),
  manualCancel: () => set({ manualMode:false, manualStage:'form', manualTouched:false }),
  manualSubmit: () => {
    const ok = (Number(S.manualCount) || 0) > 0 && (Number(S.manualCost) || 0) > 0;
    if (!ok){ set({ manualTouched:true }); return; }
    set({ manualStage:'result' });
  },
  manualToDash: () => goView('dashv2', { onboarding:false, manualApplied:true }),
  // No onboarding: value set here on purpose, this button is reachable both
  // mid-onboarding (stay chrome-free) and later from the estimate dashboard
  // as an existing owner (keep the rail), so it must not force either way.
  startRealImport: () => goView('start', { manualMode:false, upload:'idle' }),
  toggleExclude: (el) => {
    const i = Number(el.dataset.i);
    const ex = Object.assign({}, S.excluded);
    ex[i] = !ex[i];
    set({ excluded: ex });
  },
  pick: (el) => set({ picked: Number(el.dataset.i) }),
  businessContinue: () => { if (S.picked >= 0) set({ view:'start', upload:'idle' }); },
  sendCreds: () => {
    if (S.credSending) return;
    set({ credSending:true });
    clearTimeout(timers.cred);
    timers.cred = setTimeout(() => set({ credSending:false, credSent:true }), 900);
  }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest && e.target.closest('[data-act]');
  if (!el) {
    // Day cells in the calendar grid have data-cal-day, not data-act (they're
    // driven by the drag listeners below), so a plain click on one falls
    // through to here too. Without this guard that would read as "clicked
    // outside" and close the calendar mid-selection.
    const insideCal = e.target.closest && e.target.closest('[data-cal-root]');
    if (!insideCal && S.stage === 'app' && (S.profileOpen || S.periodMenu || S.dashScopeMenu || S.workMenu !== null)) {
      set({ profileOpen:false, periodMenu:false, dashScopeMenu:false, workMenu:null });
    }
    return;
  }
  const fn = ACTIONS[el.dataset.act];
  if (fn){ e.stopPropagation(); fn(el); }
});

// Calendar range drag: mousedown anchors the start, mouseover while a drag
// is anchored live-updates the end (covers both an actual drag and a
// click-a-day-then-click-another-day range pick, same underlying state),
// mouseup commits whatever's anchored as the real selection and clears the
// anchor so the next mousedown starts a fresh one. A plain single click
// with no second day touched just commits a one-day range, which is a
// legitimate selection, not a no-op.
document.addEventListener('mousedown', (e) => {
  const el = e.target.closest && e.target.closest('[data-cal-day]');
  if (!el) return;
  e.preventDefault();
  const key = el.dataset.calDay;
  set({ calDragStart: key, calDragHover: key });
});
document.addEventListener('mouseover', (e) => {
  if (!S.calDragStart) return;
  const el = e.target.closest && e.target.closest('[data-cal-day]');
  if (!el) return;
  const key = el.dataset.calDay;
  if (key !== S.calDragHover) set({ calDragHover: key });
});
document.addEventListener('mouseup', () => {
  if (!S.calDragStart) return;
  const range = calRangeSorted();
  set({ dashRange: range, calDragStart: null, calDragHover: null });
});

/* The same range picker, for a finger. Dragging across a grid is a mouse
   idiom: on a touch screen holding down and sliding is how you scroll the
   page, so the handlers above can never see a multi-day drag, and the
   synthesized mousedown/mouseup pair a tap produces would commit a
   one-day range on every single tap. Touch gets two taps instead, first
   day then last day, which is also what every native date picker does.
   preventDefault on a real tap stops the synthesized mouse events, so the
   two paths never both fire for one gesture. */
let calTouch = null;
document.addEventListener('touchstart', (e) => {
  const el = e.target.closest && e.target.closest('[data-cal-day]');
  const t = e.touches[0];
  calTouch = el && t ? { x: t.clientX, y: t.clientY, el } : null;
}, { passive: true });
document.addEventListener('touchend', (e) => {
  const start = calTouch;
  calTouch = null;
  if (!start) return;
  const t = e.changedTouches && e.changedTouches[0];
  if (!t) return;
  // A finger that travelled was scrolling the sheet, not picking a day.
  if (Math.abs(t.clientX - start.x) > 10 || Math.abs(t.clientY - start.y) > 10) return;
  e.preventDefault();
  const key = start.el.dataset.calDay;
  if (!S.calDragStart){ set({ calDragStart: key, calDragHover: key }); return; }
  S.calDragHover = key;
  set({ dashRange: calRangeSorted(), calDragStart: null, calDragHover: null });
}, { passive: false });

document.addEventListener('input', (e) => {
  if (!e.target) return;
  if (e.target.id === 'authEmail'){ set({ email: e.target.value, touched:true }); return; }
  // render() restores focus and caret by id, so a full re-render here is
  // what keeps the two lists honest as you type.
  if (e.target.id === 'topSearch'){ set({ search: e.target.value }); return; }
  if (e.target.id === 'siteName'){ S.siteName = e.target.value; return; }
  if (e.target.id === 'ownerName'){ S.ownerName = e.target.value; return; }
  if (e.target.id === 'emailChangeInput'){
    S.emailChangeNew = e.target.value;
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.emailChangeNew.trim());
    const disabled = S.emailChangeSending || !valid;
    const btn = document.querySelector('[data-act="sendEmailChangeCode"]');
    if (btn){ btn.disabled = disabled; btn.style.opacity = disabled ? '0.5' : '1'; btn.style.cursor = disabled ? 'default' : 'pointer'; }
    return;
  }
  if (e.target.id === 'emailChangeCodeInput'){ S.emailChangeCode = e.target.value; return; }
  if (e.target.id === 'businessName'){ S.businessName = e.target.value; return; }
  if (e.target.id === 'settingsTimezone'){ S.timezone = e.target.value; return; }
  if (e.target.id === 'manualCount'){ S.manualCount = e.target.value; return; }
  if (e.target.id === 'manualCost'){ S.manualCost = e.target.value; return; }
  if (e.target.id === 'manualRevenue'){ S.manualRevenue = e.target.value; return; }
  if (/^confirmName-\d+$/.test(e.target.id)){
    S.confirmName[Number(e.target.id.slice(12))] = e.target.value;
    return;
  }
  if (/^invite\d+$/.test(e.target.id)){
    const i = Number(e.target.id.slice(6));
    S.inviteEmail[i] = e.target.value;
    // Only the button label depends on this, so patch it rather than
    // re-rendering and stealing focus mid-typing.
    const cta = document.querySelector('[data-act="firstRun4"]');
    if (cta) cta.textContent = inviteCta();
    return;
  }
  if (e.target.id === 'sensRange'){
    S.throughput = Number(e.target.value);
    applySensitivity();
    return;
  }
  if (e.target.id === 'stallMinutesInput'){
    const v = parseFloat(e.target.value);
    S.stallMinutes = (isFinite(v) && v > 0) ? v : 0;
    applyKeeping();
    return;
  }
  if (e.target.id === 'taxRateInput'){
    S.taxRate = Number(e.target.value) || 0;
    applyTaxShield();
    return;
  }
  if (e.target.id === 'taxInterestInput'){
    S.taxInterestRate = Number(e.target.value) || 0;
    applyTaxShield();
    return;
  }
  // The four contract inputs, and the same promised-payback figure offered
  // inline on Payback's row detail. Blank clears the overlay back to the
  // imported value rather than storing 0, which would read as "this robot
  // was promised nothing".
  const ctm = /^(ctStart|ctTerm|ctPay|ctUp|pbPromised)-(\d+)$/.exec(e.target.id || '');
  if (ctm){
    const key = { ctStart:'start', ctTerm:'term', ctPay:'payback', ctUp:'uptime', pbPromised:'payback' }[ctm[1]];
    const i = Number(ctm[2]);
    const raw = String(e.target.value).trim();
    const own = Object.assign({}, S.contract[i] || {});
    const num = key === 'start' ? raw : Number(raw);
    if (raw === '' || (key !== 'start' && !(num > 0))) delete own[key];
    else own[key] = key === 'start' ? raw : num;
    const next = Object.assign({}, S.contract);
    if (Object.keys(own).length) next[i] = own; else delete next[i];
    S.contract = next;
    applyContractRow(i);
    return;
  }
  if (/^setupInvoice-\d+$/.test(e.target.id)){    const i = Number(e.target.id.slice(13));
    S.robotInvoice[i] = Number(e.target.value) || 0;
    applySetupRow(i);
    return;
  }
  if (/^setupHours-\d+$/.test(e.target.id)){
    const i = Number(e.target.id.slice(11));
    S.robotHours[i] = Number(e.target.value) || 0;
    applySetupRow(i);
    return;
  }
  // The two halves of a category's rate. Blank clears the override back to
  // the published benchmark rather than storing 0, which would otherwise
  // read as "this work is worth nothing" / divide by zero.
  const wageWork = e.target.getAttribute && e.target.getAttribute('data-rate-wage');
  if (wageWork){
    const raw = e.target.value.trim();
    if (raw === '') delete S.workWage[wageWork]; else S.workWage[wageWork] = Number(raw) || 0;
    applyRateRow(wageWork);
    return;
  }
  const throughWork = e.target.getAttribute && e.target.getAttribute('data-rate-through');
  if (throughWork){
    const raw = e.target.value.trim();
    if (raw === '') delete S.workThroughput[throughWork]; else S.workThroughput[throughWork] = Number(raw) || 0;
    applyRateRow(throughWork);
    return;
  }
  // One employee's fields. Patch in place rather than re-render, or the
  // field being typed into is replaced mid-keystroke.
  for (const [attr, key] of [['role','role'],['wage','wage'],['units','unitsPerHour'],['hours','hoursWeek']]){
    const id = e.target.getAttribute && e.target.getAttribute('data-emp-'+attr);
    if (id){
      const emp = S.employees.find(x => x.id === Number(id));
      if (!emp) return;
      emp[key] = attr === 'role' ? e.target.value : (e.target.value.trim() === '' ? 0 : Number(e.target.value) || 0);
      applyRateRow(emp.work);
      return;
    }
  }
});

document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'avatarFileInput'){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => set({ avatarImage: reader.result, avatarSaved: false });
    reader.readAsDataURL(file);
    return;
  }
  // What one unit of an owner-named category is called, and whether it is
  // counted per task or per hour.
  const unitWork = e.target.getAttribute && e.target.getAttribute('data-work-unit');
  if (unitWork){
    const unit = e.target.value.trim() || 'task';
    // Naive plural is right far more often than it is wrong for the words
    // that land here (pick, tote, tray, cycle), and the owner can type the
    // singular they want; nothing derives meaning from the plural.
    setCustomWork(unitWork, { unit, unitPlural: unit.endsWith('s') ? unit : unit + 's' });
    set({});
    return;
  }
  const basisWork = e.target.getAttribute && e.target.getAttribute('data-work-basis');
  if (basisWork){
    setCustomWork(basisWork, { basis: e.target.value });
    set({});
    return;
  }
  if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-cost-scope')){
    set({ costScope: e.target.value });
    return;
  }
  // The name typed into "+ Type my own…".
  const newIdx = e.target.getAttribute && e.target.getAttribute('data-work-new');
  if (newIdx !== null && newIdx !== undefined && newIdx !== ''){
    commitWorkName(Number(newIdx), e.target.value);
    return;
  }
});

/** Commit a name typed into "+ Type my own…". Blank closes the field and
 * leaves the robot on whatever it had, rather than creating a nameless
 * category every downstream figure would key off "". */
function commitWorkName(i, raw){
  const name = String(raw ?? '').trim();
  S.workEntry = Object.assign({}, S.workEntry, { [i]: false });
  if (name){
    S.confirmWork[i] = name;
    // A name we publish no numbers for needs a shape before anything can
    // price it, so the rates table has a row to render immediately.
    if (isCustomWork(name) && !S.customWork[name]) setCustomWork(name, {});
  }
  // Deferred by a tick because this also fires on blur, and re-rendering
  // synchronously inside a blur handler rips out the node the browser is
  // still dispatching against ("node to be removed is no longer a child").
  setTimeout(() => set({}), 0);
}

/** Merge into one owner-named category's shape. */
function setCustomWork(work, patch){
  S.customWork = Object.assign({}, S.customWork, {
    [work]: Object.assign({}, CUSTOM_WORK_DEFAULT, S.customWork[work] || {}, patch),
  });
}

// Opening a "how this is calculated" accordion grows its own card without
// going through render(), a native <details> toggle, not a data-act click,
// so nothing tells the masonry layout a card underneath it needs to move.
// Capture phase because <details> toggle events do not reliably bubble
// across the browsers this needs to work in.
document.addEventListener('toggle', (e) => {
  if (!e.target || !e.target.classList || !e.target.classList.contains('bl-acc')) return;
  requestAnimationFrame(layoutDashMasonry);
}, true);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target && e.target.id === 'authEmail') submitEmail();
  // Enter commits a typed work name. Without this the only way to apply it
  // is to click away, which reads as the field having ignored you.
  if (e.target && e.target.getAttribute && e.target.getAttribute('data-work-new') !== null){
    if (e.key === 'Enter'){ e.preventDefault(); commitWorkName(Number(e.target.getAttribute('data-work-new')), e.target.value); }
    if (e.key === 'Escape'){ e.preventDefault(); commitWorkName(Number(e.target.getAttribute('data-work-new')), ''); }
  }
});

/* Dashboard block reordering, iOS-homescreen style: neighbors slide out of
   the way live as the dragged card crosses them, not a silent reorder that
   only shows up on drop. That still can't go through render()/set() mid-
   drag, this build has no virtual DOM, so a re-render would tear down the
   very node the browser is tracking as the drag source. previewDashOrder
   sidesteps that: it repositions the existing nodes' left/top directly, no
   innerHTML touched, so dashover can call it on every card it crosses.
   dashend is the one moment an actual set() commits the final order. */
let dashDragOrder = null; // the running live-preview order, committed on dragend
let dashOverTarget = null; // last id dragged over, so steady hover over one card doesn't re-pack every event
document.addEventListener('dragstart', (e) => {
  const el = e.target.closest && e.target.closest('.dash-block');
  if (!el) return;
  dashDragId = el.dataset.dashId;
  dashDragOrder = S.dashLayout.slice();
  dashOverTarget = null;
  if (e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dashDragId); } catch(err){} }
});
document.addEventListener('dragover', (e) => {
  if (!dashDragId) return;
  const el = e.target.closest && e.target.closest('.dash-block');
  if (!el) return;
  e.preventDefault();
  const targetId = el.dataset.dashId;
  if (targetId === dashOverTarget || targetId === dashDragId) return;
  dashOverTarget = targetId;
  const next = reorderedDashLayout(dashDragOrder, dashDragId, targetId);
  if (!next) return;
  dashDragOrder = next;
  previewDashOrder(dashDragOrder);
});
document.addEventListener('drop', (e) => {
  if (dashDragId && e.target.closest && e.target.closest('.dash-block')) e.preventDefault();
});
document.addEventListener('dragend', () => {
  if (dashDragId && dashDragOrder) set({ dashLayout: dashDragOrder });
  dashDragId = null; dashDragOrder = null; dashOverTarget = null;
});

// Real drag on the sidebar rail, not just the click it already had. The
// grid column's width is written directly on every mousemove, cheap
// enough to do every pixel and, unlike the dashboard reorder above, has
// no drag-source node that a re-render could tear out from under itself,
// so a live preview is safe here. Releasing snaps to whichever of the
// two states (48px icon rail, 256px full width) the drag ended nearer
// to, then one real set() commits it and lets the normal render rebuild
// the correct markup for that state. A drag under 4px never counts as a
// drag at all, so the rail's own click-to-toggle still works untouched.
(function(){
  let dragging = false, moved = false, startX = 0, startW = 256, currentW = 256;
  const MIN = 48, MAX = 256, THRESHOLD = (MIN + MAX) / 2;
  document.addEventListener('mousedown', (e) => {
    const rail = e.target.closest && e.target.closest('.bl-rail');
    if (!rail) return;
    dragging = true; moved = false; startX = e.clientX;
    startW = S.railCollapsed ? MIN : MAX;
    currentW = startW;
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    if (!moved && Math.abs(dx) > 4){ moved = true; document.body.classList.add('bl-dragging'); }
    if (!moved) return;
    currentW = Math.max(MIN, Math.min(MAX, startW + dx));
    const grid = document.querySelector('[data-grid]');
    if (grid) grid.style.gridTemplateColumns = currentW + 'px minmax(0,1fr)';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('bl-dragging');
    if (!moved) return;
    const collapsed = currentW < THRESHOLD;
    if (collapsed !== S.railCollapsed) set({ railCollapsed: collapsed });
    else render();
  });
})();

/* Every screen the sign-in rail used to list, still addressable, just not
   advertised. `?screen=expired` opens the dead-link screen, `?view=rates` opens
   a page of the app. An unknown key is ignored rather than blanking the page,
   because the one thing a demo link must never do is open to nothing.
   `?screen=` also survives a reload, which the old rail did not. */
function bootScreen(){
  let q;
  try { q = new URLSearchParams(location.search); } catch(e){ return; }

  // '?demo=1' is the direct entry point, useful for testing straight
  // against the Fly app. The real botlien.com/demo route is a server-side
  // proxy, so it can't put that in the visitor's own address bar, it
  // injects a global flag into the HTML instead (see handleDemoPreview in
  // the website Worker) - checked here too, whichever fired wins. Straight
  // into a populated Dashboard, no auth, no onboarding, and it wins over
  // '?screen=' / '?view=' below rather than composing with them, a demo
  // link should never accidentally land somewhere half-configured.
  if (q.get('demo') || window.__botlienDemo){
    S.stage = 'app';
    S.view = 'dashv2';
    S.demoMode = true;
    // The sidebar already swapped its own account/business labels for
    // demo-safe ones (see appSidebar's bizName/demoMode checks), but
    // Settings and Numbers read S.ownerName/accountEmail/siteName
    // directly, no gating of their own, so they were still showing the
    // real underlying default ("Sam Ortega", "sam@harborgrill.com",
    // "Harbor Grill, Pier 4") whenever a demo visitor opened them.
    // Overriding the state itself here, once, fixes every reader instead
    // of gating each one separately.
    S.ownerName = 'Demo Account';
    S.accountEmail = 'demo@botlien.com';
    S.siteName = 'Anchorpoint Fulfillment, Pier 4';
    return;
  }

  const screen = q.get('screen');
  if (screen && AUTH_SCREENS.some(([k]) => k === screen)){
    S.stage = 'auth';
    S.screen = screen;
    return;
  }

  /* COPY is keyed by view, so it is the list of views by construction and a new
     page cannot be added without becoming addressable. */
  const view = q.get('view');
  if (view && Object.prototype.hasOwnProperty.call(COPY, view)){
    S.stage = 'app';
    S.view = view;
  }
}

bootScreen();
render();
</script>
