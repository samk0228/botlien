<script>
const ICONS = __ICONS_JSON__;
const LOGO = "__LOGO__";

function ic(name, size, style){
  const s = size || 18;
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;'+(style||'')+'">'+(ICONS[name]||'')+'</svg>';
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function spinner(size){ const s = size||13; return '<i style="width:'+s+'px;height:'+s+'px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:bl-spin .7s linear infinite;display:inline-block;flex:none"></i>'; }

/* ─────────────────────────  DATA  ───────────────────────── */

/* The path a new owner actually walks, in order. This is the rail by default,
   because a flat list of every state hides the shape of the journey. */
const AUTH_JOURNEY = [
  ['signin','Sign in'],
  ['check','Check your email'],
  ['signingin','Signing you in'],
  ['landed-info','Tell us about you'],
  ['landed-new','What kind of business'],
  ['first-run-2','Where they work'],
  ['first-run-3','Who else needs it'],
  ['first-run-4','Benchmark opt-in']
];

/* Everything the flow can also do: forks, failures and the screens reached from
   inside the product. Real, designed, and not part of the walk. */
const AUTH_STATES = [
  ['signin-new','Sign in · first visit'],
  ['signin-failed','Send failed'],
  ['join','Team already has one'],
  ['expired','Expired or used link'],
  ['landed-returning','Landed · returning'],
  ['already','Already signed in'],
  ['signedout','Signed out'],
  ['profile','Profile menu'],
  ['sessions','Sessions']
];

const AUTH_SCREENS = AUTH_JOURNEY.concat(AUTH_STATES);

const FIRST_RUN_ROLES = [
  ['Manager','Imports usage. Cannot change rates.'],
  ['Accountant','Reads and exports closed statements only.']
];

const ONBOARD_BUSINESSES = [
  ['Restaurant or cafe','tray delivery'],
  ['Warehouse or e-commerce','order picking'],
  ['Hotel','room deliveries'],
  ['Cleaning operation','floor cleaning'],
  ['Something else','you name the work']
];

const SESSIONS = [
  { device:'This browser · Chrome on macOS', last:'Last used today' },
  { device:'iPhone · Safari', last:'Last used Aug 28, 2026' },
  { device:'Back office iPad · Safari', last:'Last used Jul 14, 2026' }
];

const VALID = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

function money(n){ return '$' + n.toLocaleString('en-US',{ minimumFractionDigits:2, maximumFractionDigits:2 }); }

// The one thing no export can ever prove is how many units a PERSON would
// complete in an hour, only what the robot did. Everything else on the
// sensitivity card holds still while this one assumption moves, and it only
// applies to the fleet's biggest per-task category, an all-by-the-hour
// fleet (cleaning, laundry) has no such assumption to test.
function sensBase(){
  const s = computeStatement();
  const missionCats = s.byCategory.filter(k => (BENCH[k.work]||{}).basis === 'mission');
  if (!missionCats.length) return null;
  const dom = missionCats[0];
  const domRows = s.included.filter(r => r.work === dom.work);
  const bench = BENCH[dom.work];
  return {
    work: dom.work, unit: bench.unit, unitPlural: bench.unitPlural,
    wageCentsHour: bench.wageCentsHour, benchUnitsPerHour: bench.humanUnitsPerHour,
    domUnits: domRows.reduce((a,r) => a+r.units, 0),
    domCount: domRows.length,
    fixedWork: Math.round((s.totalValue - dom.value) * 100) / 100,
    totalInvoice: s.totalInvoice,
  };
}
function calc(t, base){
  const rate = Math.round((base.wageCentsHour / 100 / t) * 100) / 100;
  const domWork = Math.round(base.domUnits * rate * 100) / 100;
  const total = Math.round((domWork + base.fixedWork) * 100) / 100;
  return { rate, domWork, total, cov: base.totalInvoice > 0 ? total / base.totalInvoice : null };
}
function breakEven(base){ let t = 1; while (t < 2000 && calc(t, base).cov >= 1) t++; return t - 1; }

// siteCov/siteUtil are [Pier 4, Marina, Airport] for that period, coverage
// ratio and average fleet utilization %. Pier 4's numbers were already
// real (the KPI and period picker read them before this chart existed);
// Marina and Airport's history is new, shaped to land on their current
// live numbers in the open period, same mild month-to-month noise Pier 4
// already had, not a hand-drawn straight line pretending to be six real
// months.
const SITE_ROBOT_COUNTS = [6, 3, 4];
const PERIODS = [
  { label:'Aug 4 – Sep 3, 2026', status:'open',   closed:'',              siteCov:[2.38,1.90,2.60], siteUtil:[36,24,42] },
  { label:'Jul 4 – Aug 3, 2026', status:'closed', closed:'Closed Aug 4',  siteCov:[2.11,1.79,2.48], siteUtil:[33,22,39] },
  { label:'Jun 4 – Jul 3, 2026', status:'closed', closed:'Closed Jul 4',  siteCov:[2.21,1.83,2.53], siteUtil:[35,23,40] },
  { label:'May 4 – Jun 3, 2026', status:'closed', closed:'Closed Jun 4',  siteCov:[2.04,1.71,2.31], siteUtil:[31,20,36] },
  { label:'Apr 4 – May 3, 2026', status:'closed', closed:'Closed May 4',  siteCov:[1.99,1.68,2.22], siteUtil:[29,19,34] },
  { label:'Mar 4 – Apr 3, 2026', status:'closed', closed:'Closed Apr 4',  siteCov:[1.88,1.62,2.15], siteUtil:[27,17,31] }
];
// scope is S.dashScope: a site index (0/1/2) or 'all', which weights by
// each site's current robot count, the same weighting computeStatement()
// itself uses to blend sites for "all 3 sites."
function covForPeriod(p, scope){
  if (scope !== 'all') return p.siteCov[scope];
  const total = SITE_ROBOT_COUNTS.reduce((a,b) => a+b, 0);
  return p.siteCov.reduce((sum,c,i) => sum + c*SITE_ROBOT_COUNTS[i], 0) / total;
}
function utilForPeriod(p, scope){
  if (scope !== 'all') return p.siteUtil[scope];
  const total = SITE_ROBOT_COUNTS.reduce((a,b) => a+b, 0);
  return p.siteUtil.reduce((sum,c,i) => sum + c*SITE_ROBOT_COUNTS[i], 0) / total;
}

// Identity only. Work, invoice, and coverage per site used to be typed
// here as static numbers with nothing behind them, which is exactly why
// the dashboard's site scope filter could only ever show Pier 4's real
// arithmetic and had to degrade everything else to a single total.
// computeStatement() derives all three live from CONFIRM+BENCH now (see
// the site parameter there), same as Pier 4 always has, so this can't
// drift out of sync with the numbers actually shown.
const SITES = [
  { name:'Pier 4' },
  { name:'Marina' },
  { name:'Airport' }
];

/* "What to fix first". Ported from src/tips.mjs, which allows a tip to claim
   only work this same robot has already demonstrated, in this same window.
   Every value is (recoverable hours) x (the rate per active hour it actually
   earned), never a vendor throughput spec. */
/* Consumable life lives on the robot itself, in ROBOTS[].parts, so the inline
   block and the Condition page cannot drift apart. */

const BENCHMARK = { median:'1.84x', n:214, percentile:'78th', cohort:'full service, 4 to 6 robots, US' };

const RATE_HISTORY = [
  { work:'Tray delivery', rate:'$0.73 per run', span:'In effect since Jul 1, 2026', basis:'$22.00 / hr ÷ 30 runs per hour', by:'Sam Ortega, Jun 28, 2026', current:true },
  { work:'Tray delivery', rate:'$0.68 per run', span:'Jan 1 – Jun 30, 2026', basis:'$20.50 / hr ÷ 30 runs per hour', by:'Sam Ortega, Jan 2, 2026', current:false },
  { work:'Floor cleaning', rate:'$25.00 per hour', span:'In effect since Jan 1, 2026', basis:'Botlien benchmark wage, never edited', by:'Not set by you', current:true }
];

const ALERT_RULES = [
  { name:'A robot falls under its lease', trigger:'Coverage below 1.00x for a full period', to:'Sam', when:'When the period closes', last:'Sent Sep 4 · Servi 2 (patio)' },
  { name:'A consumable runs out', trigger:'Life remaining at or under 15% on any reported part', to:'Sam, Dana', when:'Daily at most', last:'Sent Aug 30 · Scrubber 75, all 4 parts' },
  { name:'Maintenance is being deferred', trigger:'A part past its rating while the robot keeps running', to:'Sam', when:'Weekly', last:'Sent Sep 1 · Scrubber 75, side brush' },
  { name:'Duty time collapses', trigger:'Below 20% of declared hours for 7 days running', to:'Sam', when:'Weekly', last:'Sent Aug 19 · Servi 2 (patio)' },
  { name:'Statement ready', trigger:'A period closes and figures are frozen', to:'Sam, Priya', when:'On the 1st', last:'Sent Aug 4' },
  { name:'An import fails', trigger:'A file is unreadable or a sync errors', to:'Sam', when:'Immediately', last:'Never sent' }
];

const PEOPLE = [
  { name:'Sam Ortega', email:'sam@harborgrill.com', role:'Owner', scope:'All 3 sites', can:'Edits rates and invoices, closes periods' },
  { name:'Dana Reyes', email:'dana@harborgrill.com', role:'Manager', scope:'Pier 4', can:'Imports usage, cannot change rates' },
  { name:'Priya Shah', email:'priya@bayledger.com', role:'Accountant', scope:'All 3 sites, view only', can:'Reads and exports closed statements' }
];

// Per-robot coverage change vs the prior period, shown on the robots page.
const ROBOT_DELTA = {
  'Servi 1 (front)':'+0.10', 'Servi 2 (patio)':'−0.19', 'P3 runner':'+0.31',
  'Servi 3 (banquet)':'+0.74', 'Scrubber 50':'+0.08', 'Scrubber 75 (nights)':'+0.61'
};

// Coverage, "under its lease," "benchmark rate," and the equation string
// used to be typed here per robot. All four are computeStatement() output
// now (see viewRobots), read live off CONFIRM/BENCH and Setup's overlays,
// so this only carries what an invoice edit has no business changing:
// name, model, duty telemetry, and condition.
const ROBOTS = [
  { name:'Servi 1 (front)', model:'Bear Servi', duty:'duty 43%', dutyPct:'43%', hours:'155h of 360h' },
  { name:'Servi 2 (patio)', model:'Bear Servi', duty:'duty 11%', dutyPct:'11%', hours:'40h of 360h' },
  { name:'P3 runner', model:'Pudu P3', duty:'duty 46%', dutyPct:'46%', hours:'166h of 360h' },
  { name:'Servi 3 (banquet)', model:'Bear Servi', duty:'duty 40%', dutyPct:'40%', hours:'142h of 360h' },
  { name:'Scrubber 50', model:'Gausium S50 · priced by the hour', duty:'duty 50%', dutyPct:'50%', hours:'120h of 240h',
    parts:[
      { name:'squeegee', left:71, used:'73h of 250h' },
      { name:'filter', left:67, used:'99h of 300h' },
      { name:'rolling brush', left:75, used:'100h of 400h' },
      { name:'side brush', left:64, used:'180h of 500h' }
    ],
    hand:'6%', temp:'31°C' },
  { name:'Scrubber 75 (nights)', model:'Gausium S75 · priced by the hour', duty:'duty 26%', dutyPct:'26%', hours:'61.2h of 240h',
    parts:[
      { name:'squeegee', left:4, used:'240h of 250h' },
      { name:'filter', left:1, used:'297h of 300h' },
      { name:'rolling brush', left:8, used:'368h of 400h' },
      { name:'side brush', left:-3, used:'515h of 500h' }
    ],
    hand:'34%', temp:'28°C' }
];

const RATES = [
  { work:'Tray delivery', wage:'$22.00 / hr', does:'30 runs / hr', rate:'$0.73 per run', source:'your wage' },
  { work:'Floor cleaning', wage:'$25.00 / hr', does:'1 hour / hr', rate:'$25.00 per hour', source:'benchmark' }
];

// Work, invoice, rate, and wage used to be typed here as static strings,
// duplicate copies of numbers computeStatement() already knows from
// CONFIRM/BENCH. Setup's rows read those live now (see viewSetup), so this
// only still needs to carry what's genuinely specific to Setup: the robot's
// display name and model, and its operating-hours-per-day default.
const SETUP = [
  { name:'Servi 1 (front)', model:'Bear Servi', hours:'12.0 h' },
  { name:'Servi 2 (patio)', model:'Bear Servi', hours:'12.0 h' },
  { name:'P3 runner', model:'Pudu P3', hours:'12.0 h' },
  { name:'Servi 3 (banquet)', model:'Bear Servi', hours:'12.0 h' },
  { name:'Scrubber 50', model:'Gausium S50', hours:'8.0 h' },
  { name:'Scrubber 75 (nights)', model:'Gausium S75', hours:'8.0 h' }
];

const WORK_CATEGORIES = [
  'Tray delivery', 'Bussing and dish return', 'Floor cleaning',
  'Order picking', 'Putaway and replenishment',
  'Room and guest delivery', 'Laundry handling'
];

// units is the number the rest of the dashboard actually computes from
// (runs started, or active hours, whichever the category's basis is). seen
// is that same number pre-formatted for display, kept in sync by hand here
// since there are only six rows, not derived, so a units edit and a seen
// edit are two edits, not one, if this table is ever hand-edited again.
//
// site indexes into SITES (0 Pier 4, 1 Marina, 2 Airport). All 13 robots
// live in one table so computeStatement() can filter to one site, or skip
// the filter for "all 3 sites," instead of Pier 4 being the only site with
// real robots behind it and every other scope degrading to a single
// pre-typed total.
const CONFIRM = [
  { name:'Servi 1 (front)', units:3780, seen:'3,780 runs started · Aug 4 – Sep 3', work:'Tray delivery', site:0 },
  { name:'Servi 2 (patio)', units:900, seen:'900 runs started · Aug 4 – Sep 3', work:'Tray delivery', site:0 },
  { name:'P3 runner', units:3900, seen:'3,900 runs started · Aug 4 – Sep 3', work:'Tray delivery', site:0 },
  { name:'Servi 3 (banquet)', units:3480, seen:'3,480 runs started · Aug 4 – Sep 3', work:'Tray delivery', site:0 },
  { name:'Scrubber 50', units:120.0, seen:'120.0 active hours · Aug 4 – Sep 3', work:'Floor cleaning', site:0 },
  { name:'Scrubber 75 (nights)', units:61.2, seen:'61.2 active hours · Aug 4 – Sep 3', work:'Floor cleaning', site:0 },
  { name:'Servi 1 (Marina)', units:2600, seen:'2,600 runs started · Aug 4 – Sep 3', work:'Tray delivery', site:1 },
  { name:'Servi 2 (Marina)', units:2100, seen:'2,100 runs started · Aug 4 – Sep 3', work:'Tray delivery', site:1 },
  { name:'Scrubber (Marina)', units:75.0, seen:'75.0 active hours · Aug 4 – Sep 3', work:'Floor cleaning', site:1 },
  { name:'Servi 1 (Airport)', units:3700, seen:'3,700 runs started · Aug 4 – Sep 3', work:'Tray delivery', site:2 },
  { name:'Servi 2 (Airport)', units:3550, seen:'3,550 runs started · Aug 4 – Sep 3', work:'Tray delivery', site:2 },
  { name:'Servi 3 (Airport)', units:3200, seen:'3,200 runs started · Aug 4 – Sep 3', work:'Tray delivery', site:2 },
  { name:'Scrubber (Airport)', units:90.0, seen:'90.0 active hours · Aug 4 – Sep 3', work:'Floor cleaning', site:2 }
];

// Same seven categories and the same rates as the real backend's
// src/rates.mjs BENCHMARKS table, kept in sync by hand: this prototype and
// the real product must never quote two different numbers for the same
// "tray delivery" rate. wageCentsHour / humanUnitsPerHour is the whole
// derivation, on purpose, so it can be checked by hand, same rule as there.

// The one calculation the whole dashboard reads from. Every card below is a
// different view of this same result, never its own arithmetic, so a
// category or exclude change on the confirm screen can only ever move every
// card in agreement with every other one.
//
// full=true skips the manualApplied and dashScope short-circuits below and
// goes straight to the per-robot computation. Fleet needs that: it is
// always Pier 4's six robots, same as before dashScope or a manual
// estimate ever existed, so it can't be at the mercy of a Dashboard-only
// scope filter or estimate mode that happens to be active on a page Fleet
// isn't even showing.
function computeStatement(full){
  // A manually-typed estimate has no per-robot rows behind it, just a count
  // and two dollar figures, so it cannot honestly fill in byCategory,
  // attention, or work-split. Those cards already know how to say "no
  // robots included yet" for an empty fleet; returning empty here reuses
  // that same honest state instead of inventing rows to fill them.
  if (!full && S.manualApplied){
    const count = Number(S.manualCount) || 0;
    const cost = Number(S.manualCost) || 0;
    const revenue = Number(S.manualRevenue) || 0;
    const totalInvoice = Math.round(count * cost * 100) / 100;
    const totalValue = Math.round(count * revenue * 100) / 100;
    const coverage = revenue > 0 && totalInvoice > 0 ? totalValue / totalInvoice : null;
    return {
      rows: [], included: [], totalValue, totalInvoice, coverage, byCategory: [],
      mode: 'estimate', manualCount: count, manualCost: cost, manualRevenue: revenue,
    };
  }
  // Which site's robots feed the computation below. full is always Pier 4
  // (Fleet and Setup are single-site pages, not at the mercy of whatever
  // scope Dashboard happens to have selected). Otherwise it's whatever
  // Dashboard's own scope filter says, including no filter at all for
  // "all 3 sites," every site's robots used to live in this same table
  // together, now they actually do.
  const siteFilter = full ? 0 : (S.dashScope === 'all' ? null : S.dashScope);
  const entries = siteFilter === null ? CONFIRM.map((c,i) => ({c,i})) : CONFIRM.map((c,i) => ({c,i})).filter(({c}) => c.site === siteFilter);
  const rows = entries.map(({c,i}) => {
    const work = S.confirmWork[i] ?? c.work;
    const b = BENCH[work] ?? BENCH['Tray delivery'];
    // Wage and invoice come from Setup's per-robot overrides when one
    // exists, the category benchmark otherwise, this is what makes an edit
    // on Setup actually move the number here instead of just saving text
    // nobody reads back.
    const wage = S.robotWage[i] ?? (b.wageCentsHour / 100);
    const benchmarkWage = S.robotWage[i] === undefined;
    // Rounded to the cent BEFORE multiplying by units, matching the real
    // backend's derivedRateCents: the rate is what an owner checks on a
    // napkin ("$22.00 ÷ 30 = $0.73"), so it has to be the same $0.73 that
    // gets multiplied, not an unrounded 73.33 that quietly drifts the total.
    const rateCents = Math.round((wage * 100) / b.humanUnitsPerHour);
    const value = Math.round(c.units * rateCents) / 100;
    const invoice = S.robotInvoice[i] ?? (b.invoiceCentsMonth / 100);
    const excluded = !!S.excluded[i];
    return {
      i, name: (S.confirmName[i] ?? c.name) || c.name, work, basis:b.basis,
      units: c.units, unit: c.units === 1 ? b.unit : b.unitPlural,
      rate: rateCents / 100, value, invoice, excluded, wage, benchmarkWage,
      cov: invoice > 0 ? value / invoice : null,
    };
  });
  const included = rows.filter(r => !r.excluded);
  const totalValue = Math.round(included.reduce((s,r) => s+r.value, 0) * 100) / 100;
  const totalInvoice = Math.round(included.reduce((s,r) => s+r.invoice, 0) * 100) / 100;
  const coverage = totalInvoice > 0 ? totalValue / totalInvoice : null;
  const byCategory = {};
  included.forEach(r => {
    (byCategory[r.work] = byCategory[r.work] || { work:r.work, count:0, value:0 }).count++;
    byCategory[r.work].value += r.value;
  });
  return {
    rows, included, totalValue, totalInvoice, coverage,
    byCategory: Object.values(byCategory).sort((a,b) => b.value - a.value),
    mode: 'full',
  };
}

/* ─────────────────────────  APP VIEW  ───────────────────────── */

// Menu button sizing/spacing/color below matches shadcn/ui's
// sidebarMenuButtonVariants exactly (rounded-md, p-2, gap-2, text-sm,
// size-4 icons; group-data-[collapsible=icon]:size-8 when collapsed),
// pulled from `shadcn view sidebar`, not eyeballed off a screenshot.
function appRail(){
  const collapsed = S.railCollapsed;
  const nav = (k) => ({
    bg: S.view === k ? 'var(--sb-accent)' : 'transparent',
    fg: S.view === k ? 'var(--sb-accent-fg)' : 'var(--sb-fg)',
    fw: S.view === k ? 600 : 500
  });
  const item = (k, icon, label, extra) => {
    const n = nav(k);
    const justify = collapsed ? 'justify-content:center;' : '';
    const dot = (collapsed && extra) ? '<span style="position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--sb-accent-fg)"></span>' : '';
    return '<div data-act="go" data-view="'+k+'" class="hv-sb" title="'+(collapsed?label:'')+'" style="position:relative;display:flex;align-items:center;box-sizing:border-box;width:100%;height:32px;'+justify+'gap:8px;padding:8px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:'+n.fw+';color:'+n.fg+';background:'+n.bg+'">'
      + ic(icon,16)
      + (collapsed ? '' : label+(extra||''))
      + dot
    + '</div>';
  };
  // Live count, not a number typed once: an edit on Setup that pushes a
  // robot under its lease, or pulls it back over, has to show up here too,
  // the same instant it shows up as a caution mark on Fleet.
  const attnCount = computeStatement(true).rows.filter(r => !r.excluded && r.cov !== null && r.cov < 1).length;
  const badge = !attnCount ? '' : '<span data-act="attention" style="margin-left:auto;font-size:12px;font-weight:700;color:var(--sb-accent-fg)">'+attnCount+'</span>';

  // Which site is in view already lives in the dashboard's own scope
  // filter (All 3 sites / Pier 4 / Marina / Airport, next to Customize),
  // so a second site switcher up here was showing the same choice twice.
  // The brand block is identity, not a site picker, no dropdown. Its icon
  // is still a control though: it's the sidebar collapse toggle now (see
  // brandIcon below), not a separate permanent button.

  // shadcn's SidebarRail: an invisible 4px drag-strip along the border, a
  // second way to collapse besides the brand badge, cursor swaps to a
  // resize cursor and the border itself highlights on hover.
  const rail = '<button type="button" data-act="toggleRail" class="bl-rail" aria-label="Toggle Sidebar" title="Toggle Sidebar" style="position:absolute;top:0;bottom:0;right:-2px;width:4px;padding:0;border:none;background:transparent;cursor:ew-resize;z-index:20"></button>';

  // The collapse/expand control used to also live as a bordered chevron
  // button that sat in the header permanently (see appHeader). Now it's
  // just this badge: hover swaps the logo for a sidebar glyph (reads as
  // "toggle the sidebar" more directly than a bare arrow did), click
  // toggles, unhover swaps it back. One control instead of two.
  const brandIcon = '<div data-act="toggleRail" class="bl-brand-toggle" title="'+(collapsed?'Expand sidebar':'Collapse sidebar')+'" style="position:relative;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;flex:none">'
    + '<img class="bl-brand-logo" src="'+LOGO+'" alt="Botlien" style="width:18px;height:22px;object-fit:contain;filter:brightness(0)">'
    + '<span class="bl-brand-chev" style="align-items:center;justify-content:center;color:var(--sb-fg)">'+ic('panel-left',15)+'</span>'
  + '</div>';
  const brand = collapsed
    ? '<div title="Harbor Grill Group" style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px">'
      + brandIcon
    + '</div>'
    : '<div style="flex:1;min-width:0;height:48px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px">'
      + brandIcon
      + '<span style="font-size:14px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sb-fg)">Harbor Grill Group</span>'
      + '</div>';

  // Hamburger only exists below 900px (.bl-mobile-toggle), everything it
  // opens is the same nav and account rows that already render for desktop,
  // just hidden by default at that width until this flips the open class.
  const mobileToggle = '<div data-act="toggleMobileNav" class="bl-mobile-toggle hv-sb" title="'+(S.mobileNavOpen?'Close menu':'Menu')+'" style="align-items:center;justify-content:center;width:32px;height:32px;flex:none;border:1px solid var(--sb-border);border-radius:8px;cursor:pointer;color:var(--sb-fg)">'
    + ic('equal', 16, S.mobileNavOpen ? 'transform:rotate(90deg)' : '') + '</div>';

  // variant="sidebar" (the default): flush against the edge, no rounding,
  // no shadow, no margin, just a hairline right border. Measured directly
  // off the real component at ui.shadcn.com/docs/components/base/sidebar
  // (padding:0, border-radius:0, box-shadow:none on the container), the
  // floating look from a prior pass was the wrong variant.
  // No padding on the aside itself: the header row, nav, and footer each
  // carry their own 8px (matching shadcn's real SidebarHeader/Content/
  // Footer, each p-2 independently, container itself at padding:0). Aside
  // ALSO having 8px was doubling the inset to 16px a side, which is what
  // was quietly halving every collapsed icon's box and reading as shoved
  // toward the right edge, not a centering bug at all, a padding bug.
  // z-index here, not just on the popups inside it: `sticky` gives the
  // aside its own stacking context, but with none on the aside itself the
  // dashboard's masonry cards (position:relative, later in the DOM inside
  // data-main) win ties in the parent context and paint over it, popups
  // included, so the profile dropdown or period picker read as translucent
  // with the chart bleeding through even though z-index:50 sits right on
  // them. That z-index only wins comparisons inside the aside's own
  // context; it can't out-rank a sibling context that has none at all.
  return '<aside data-side class="'+(S.mobileNavOpen?'bl-mobile-open':'')+'" style="position:sticky;top:0;z-index:10;display:flex;flex-direction:column;height:100vh;background:var(--sb-bg);color:var(--sb-fg);border-right:1px solid var(--sb-border)">'
    + rail
    + '<div style="position:relative;display:flex;gap:8px;align-items:stretch;padding:8px 8px 4px">' + brand + mobileToggle + '</div>'
    // Plain block stacking, not flex: a flex child's cross-axis width is
    // subject to the flex sizing algorithm no matter what display the
    // child itself declares, which is what was quietly shrinking the ul to
    // a fraction of nav's width and pushing every icon toward the right
    // edge instead of centering it. Block guarantees full-width, no quirk.
    // Flattened: no <ul> wrapper. It measured itself as a fraction of
    // nav's own width no matter how explicitly it was told to fill 100%
    // (nav is itself a flex child of the aside, and something about that
    // nesting kept resolving the ul's width against the wrong box), which
    // left every fixed-width collapsed icon overflowing out of a too-narrow
    // ul and reading as shoved toward the right edge. One fewer box in the
    // chain removes the whole problem instead of chasing it.
    + '<nav data-nav style="display:block;width:100%;box-sizing:border-box;padding:8px;overflow-y:auto;overflow-x:hidden">'
      + item('dashv2','equal','Dashboard')
      + item('robots','boxes','Fleet', badge)
      + item('setup','sliders-horizontal','Numbers')
    + '</nav>'
    // shadcn's NavUser pattern: the footer is ONE SidebarMenuButton (the
    // account trigger), not a stack of separate rows. Notifications and
    // Settings used to each get their own permanent row down here; the real
    // component instead folds everything but the account row itself into a
    // dropdown that opens off the trigger, so collapsed mode is one icon,
    // not four.
    + '<div data-side-foot style="margin-top:auto;padding:8px">'
      + '<div style="position:relative">'
      + '<div data-act="toggleProfile" class="hv-sb" style="position:relative;display:flex;align-items:center;'+(collapsed?'justify-content:center;width:32px;height:32px;padding:8px':'height:48px;box-sizing:border-box;padding:8px')+';gap:8px;border-radius:8px;cursor:pointer;background:'+(S.profileOpen?'var(--sb-accent)':'transparent')+';color:'+(S.profileOpen?'var(--sb-accent-fg)':'var(--sb-fg)')+'">'
        + '<div style="position:relative;flex:none">'
          + avatarBadge(32)
          + '<i style="position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--sb-primary);border:2px solid var(--sb-bg)"></i>'
        + '</div>'
        + (collapsed ? '' : '<div style="display:flex;flex-direction:column;line-height:1.25;min-width:0;overflow:hidden;flex:1"><span style="font-size:13.5px;font-weight:600;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Sam Ortega</span><span style="font-size:11px;color:var(--sb-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(S.accountEmail)+'</span></div>')
        + (collapsed ? '' : ic('chevron-down',14,'color:inherit;flex:none'))
      + '</div>'
      + (S.profileOpen
        ? '<div style="position:absolute;bottom:calc(100% + 8px);'+(collapsed?'left:0':'left:0;right:0')+';width:240px;background:var(--menu);border:1px solid var(--hair2);border-radius:8px;z-index:50;box-shadow:0 8px 24px rgba(10,10,10,.14);padding:4px;box-sizing:border-box">'
          + '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px 10px">'
            + avatarBadge(32)
            + '<div style="display:flex;flex-direction:column;line-height:1.25;min-width:0;overflow:hidden"><span style="font-size:13.5px;font-weight:600;color:var(--fg1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Sam Ortega</span><span style="font-size:11.5px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(S.accountEmail)+'</span></div>'
          + '</div>'
          + '<div style="height:1px;background:var(--hair);margin:2px 0"></div>'
          + '<div data-act="go" data-view="alerts" class="hv-ghost" style="position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--fg1)">'

          + '</div>'
          + '<div data-act="go" data-view="settings" class="hv-ghost" style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--fg1)">'+ic('settings',15,'color:var(--fg3)')+'Settings</div>'
          + '<div style="height:1px;background:var(--hair);margin:2px 0"></div>'
          + '<div data-act="logOut" class="hv-ghost" style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--fg1)">'+ic('log-out',15,'color:var(--fg3)')+'Log out</div>'

// Badge, shadcn's small status-pill pattern: a filled variant for the state

function statRow(label, value, note){
