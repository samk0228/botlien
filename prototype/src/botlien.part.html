// Smooth curve through points, cubic Bezier via Catmull-Rom (tension 1/6),
// the same "natural" interpolation a real charting library defaults to.
// No library here to import that curve math from, so it's reproduced by
// hand, same as every other visual this app draws itself.
function smoothPath(pts){
  if (pts.length < 2) return '';
  if (pts.length === 2) return 'M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1)+' L'+pts[1][0].toFixed(1)+','+pts[1][1].toFixed(1);
  let d = 'M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
  for (let i=0; i<pts.length-1; i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1x = p1[0]+(p2[0]-p0[0])/6, c1y = p1[1]+(p2[1]-p0[1])/6;
    const c2x = p2[0]-(p3[0]-p1[0])/6, c2y = p2[1]-(p3[1]-p1[1])/6;
    d += ' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);
  }
  return d;
}

// One inline chart, hand-drawn SVG, same as every other visual in this
// app (duty bars, condition bars, the sensitivity slider), not a
// charting dependency for six points. points is oldest-to-newest,
// {value, label, current}. opts.reference draws a dashed line at that
// value (coverage's 1.0x breakeven). opts.area fills a gradient under a
// dot-free curve instead, for the area-chart look; without it this
// draws the dotted line-chart look.
function sparklineChart(points, opts){
  opts = opts || {};
  const W = 560, H = 100, padX = 10, padY = 14;
  const vals = points.map(p => p.value);
  const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  const span = (max - min) || 1;
  const lo = min - span*0.3, hi = max + span*0.3;
  const plotH = H - padY*2;
  const baseY = padY + plotH;
  const x = (i) => padX + (i/(points.length-1)) * (W - padX*2);
  const y = (v) => padY + plotH - ((v - lo)/(hi - lo)) * plotH;
  const coords = points.map((p,i) => [x(i), y(p.value)]);
  const linePath = smoothPath(coords);
  const refLine = (opts.reference == null || opts.reference < lo || opts.reference > hi) ? '' :
    '<line x1="'+padX+'" y1="'+y(opts.reference).toFixed(1)+'" x2="'+(W-padX)+'" y2="'+y(opts.reference).toFixed(1)+'" stroke="var(--hair2)" stroke-width="1" stroke-dasharray="3,4"/>';
  const area = !opts.area ? '' :
    '<defs><linearGradient id="'+opts.gradientId+'" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="5%" stop-color="var(--ink)" stop-opacity="0.32"/>'
      + '<stop offset="95%" stop-color="var(--ink)" stop-opacity="0.03"/>'
    + '</linearGradient></defs>'
    + '<path d="'+linePath+' L'+x(points.length-1).toFixed(1)+','+baseY.toFixed(1)+' L'+x(0).toFixed(1)+','+baseY.toFixed(1)+' Z" fill="url(#'+opts.gradientId+')" stroke="none"/>';
  const dots = opts.dots === false ? '' : points.map((p,i) => '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.value).toFixed(1)+'" r="'+(p.current?4:2.5)+'" fill="'+(p.current?'var(--ink)':'var(--fg3)')+'"/>').join('');
  const svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:100px;display:block;overflow:visible">'
    + area + refLine
    + '<path d="'+linePath+'" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    + dots
  + '</svg>';
  // Labels are plain HTML below the SVG, not text inside it. The SVG
  // stretches non-uniformly (preserveAspectRatio="none") to fill
  // whatever width the card ends up at, fine for a line's shape, but it
  // warps SVG text into something too wide at a full-screen viewport and
  // too narrow at a small one. Flexbox gives every label its own real,
  // correctly-proportioned font size regardless of chart width.
  const labels = '<div style="display:flex;justify-content:space-between;margin-top:6px">'
    + points.map((p,i) => {
      const end = i === 0 || i === points.length-1;
      return '<div style="text-align:'+(i===0?'left':i===points.length-1?'right':'center')+';min-width:0">'
        + (end ? '<div style="font-size:11px;font-weight:700;color:var(--fg1);white-space:nowrap">'+esc(opts.formatValue(p.value))+'</div>' : '')
        + '<div style="font-size:10.5px;color:var(--fg3);white-space:nowrap">'+esc(p.label)+'</div>'
      + '</div>';
    }).join('')
  + '</div>';
  return svg + labels;
}

// Pier 4's 6 periods were always real, the card just refused to chart
// them, one point looked like a fake trend even though five closed
// periods already sat in PERIODS. Marina and Airport now carry the same
// history (see PERIODS above), so every site scope, and "all 3 sites,"
// gets the real chart instead of only Pier 4 qualifying. Dotted line,
// grid, and a trend footer, the shadcn line-chart look.
function recapCard(){
  const s = computeStatement();
  if (s.mode === 'estimate'){
    return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
      + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:8px">Coverage over time</div>'
      + '<div style="font-size:13px;color:var(--fg2);line-height:1.6">A typed estimate has no period history behind it. Import your export and six months of real periods fill in here.</div>'
    + '</div>';
  }
  const points = PERIODS.slice().reverse().map(p => ({
    value: covForPeriod(p, S.dashScope), label: p.label.slice(0,3), current: p.status === 'open'
  }));
  const avg = points.reduce((a,p) => a+p.value, 0) / points.length;
  const first = points[0].value, last = points[points.length-1].value;
  const pctChange = first ? ((last - first) / first) * 100 : 0;
  const up = pctChange >= 0;
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 0;overflow:hidden">'
    + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px">'
      + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1)">Coverage over time</div>'
      + '<span style="font-size:12px;color:var(--fg3)">6-month average '+avg.toFixed(2)+'x</span>'
    + '</div>'
    + sparklineChart(points, { reference:1, formatValue: v => v.toFixed(2)+'x' })
    + '<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--fg1);padding:14px 0 4px;border-top:1px solid var(--hair);margin-top:4px">'
      + ic(up?'trending-up':'trending-down',14)
      + 'Trending '+(up?'up':'down')+' '+Math.abs(pctChange).toFixed(1)+'% over 6 months'
    + '</div>'
    + '<div style="font-size:11.5px;color:var(--fg3);padding-bottom:14px">Showing coverage for the last 6 periods</div>'
  + '</div>';
}

// Same data shape as coverage, average fleet duty against declared
// operating hours instead of work against lease cost. Gradient-filled
// area instead of a dotted line, the shadcn area-chart look, no 1.0x
// reference either, utilization has no breakeven, just a rate.
function utilizationCard(){
  const s = computeStatement();
  if (s.mode === 'estimate'){
    return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
      + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:2px">Utilization</div>'
      + '<div style="font-size:13px;color:var(--fg2);line-height:1.6">Needs the robot&#39;s reported duty hours, not just its task count. Available once your export or live connection includes it.</div>'
    + '</div>';
  }
  const points = PERIODS.slice().reverse().map(p => ({
    value: utilForPeriod(p, S.dashScope), label: p.label.slice(0,3), current: p.status === 'open'
  }));
  const avg = points.reduce((a,p) => a+p.value, 0) / points.length;
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px">'
      + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1)">Utilization</div>'
      + '<span style="font-size:12px;color:var(--fg3)">6-month average '+Math.round(avg)+'%</span>'
    + '</div>'
    + sparklineChart(points, { formatValue: v => Math.round(v)+'%', area:true, gradientId:'utilAreaFill', dots:false })
  + '</div>';
}

// The coverage number, its delta, and its methodology, as one dashboard
// card in the same family as Coverage over time, Utilization, Needs
// attention, and Where the work is, not free-floating hero text sitting
// above the grid it belongs in.
function coverageKpiCard(){
  const s = computeStatement();
  const covLabel = s.coverage === null ? '—' : s.coverage.toFixed(2)+'x';
  const tag = s.mode === 'estimate'
    ? '<span style="font-size:12.5px;font-weight:700;color:var(--fg3);background:var(--ghost);padding:3px 8px;border-radius:3px">estimate, not measured</span>'
    : '<span style="font-size:12.5px;font-weight:700;color:var(--fg3);background:var(--ghost);padding:3px 8px;border-radius:3px">open period, still moving</span>';
  const subhead = s.mode === 'estimate'
    ? (s.manualRevenue > 0
      ? money(s.totalValue)+' of estimated work vs. '+money(s.totalInvoice)+' leased, from '+s.manualCount+' robot'+(s.manualCount===1?'':'s')+' at the numbers you typed in'
      : money(s.totalInvoice)+' of lease cost from '+s.manualCount+' robot'+(s.manualCount===1?'':'s')+'. Add what the work is worth per robot to see a coverage ratio.')
    : money(s.totalValue)+' of work performed vs. '+money(s.totalInvoice)+' leased';
  const detail = s.mode === 'estimate'
    ? 'One number spread evenly across '+s.manualCount+' robot'+(s.manualCount===1?'':'s')+', not what any one robot actually did. Import your export any time and this becomes a real, per-robot statement, priced at category benchmarks until you set your own numbers.'
    : 'Replacement cost of the work performed, divided by the lease. Not revenue, not profit, not labor you stopped paying for, just what it would have cost to buy this work another way, priced at category benchmarks until you set your own numbers. Change a robot&#39;s kind of work or exclude one on the confirm screen and this recalculates from those '+s.included.length+' robots, nothing here is fixed.';
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px">'
      + '<div style="font-size:clamp(28px,4.6vw,36px);font-weight:700;letter-spacing:-0.03em;color:var(--fg1);font-variant-numeric:tabular-nums">'+covLabel+'</div>'
      + tag
    + '</div>'
    + '<div style="font-size:13px;color:var(--fg2);margin-bottom:14px">'+subhead+'</div>'
    + '<details class="bl-acc">'
      + '<summary style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--fg3)">'
        + '<span class="chev" style="display:inline-flex">'+ic('chevron-down',13)+'</span>How this number is calculated'
      + '</summary>'
      + '<div style="margin-top:10px;font-size:13px;line-height:1.65;color:var(--fg2)">'+detail+'</div>'
    + '</details>'
    + (s.mode === 'estimate' ? '<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--hair)"><button type="button" data-act="startRealImport" class="hv-dim" style="padding:11px 18px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:pointer;font-size:13px;font-weight:700">Import my export</button></div>' : '')
  + '</div>';
}

// A robot-level card with nothing to show has two honestly different
// reasons: no robots imported yet, or this demo simply not tracking that
// site per robot. Saying "No robots included yet" for the latter would
// read as if the site has no fleet at all, which is not true.
function noRobotNote(){
  return 'No robots included yet.';
}

function attentionCard(){
  const s = computeStatement();
  const withCov = s.included.filter(r => r.cov !== null);
  const sorted = withCov.slice().sort((a,b) => b.cov - a.cov);
  const max = sorted.length ? Math.max.apply(null, sorted.map(r => r.cov)) * 1.05 : 1;
  const rows = sorted.map(r => {
    const short = r.cov < 1;
    const pct = Math.min(100, (r.cov / max) * 100);
    return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0">'
      + '<span style="width:118px;flex:none;font-size:12.5px;font-weight:600;color:'+(short?'var(--fg1)':'var(--fg2)')+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.name)+'</span>'
      + '<div style="flex:1;height:8px;background:var(--ghost);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+(short?'var(--fg1)':'var(--hair3)')+'"></div></div>'
      + '<span style="width:44px;flex:none;text-align:right;font-size:12.5px;font-weight:700;color:var(--fg1);font-variant-numeric:tabular-nums">'+r.cov.toFixed(2)+'x</span>'
    + '</div>';
  }).join('');
  const flagged = sorted.find(r => r.cov < 1);
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px">'
      + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1)">Needs attention</div>'
      + '<button type="button" data-act="go" data-view="robots" class="hv-ghost" style="font-size:12px;font-weight:600;color:var(--fg2);background:none;border:none;cursor:pointer">All robots →</button>'
    + '</div>'
    + (flagged ? '<div style="font-size:12px;color:var(--fg3);margin-bottom:12px">'+esc(flagged.name)+' is running under its lease</div>' : '')
    + '<div style="margin-top:6px">'+(rows || '<div style="font-size:13px;color:var(--fg3);padding:6px 0">'+noRobotNote()+'</div>')+'</div>'
  + '</div>';
}

function workSplitCard(){
  const s = computeStatement();
  const total = s.totalValue;
  const rows = s.byCategory.map((k, i) => {
    const pct = total > 0 ? (k.value / total) * 100 : 0;
    return '<div style="margin-bottom:14px">'
      + '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px"><span style="font-weight:600;color:var(--fg1)">'+esc(k.work)+' · '+k.count+' '+(k.count===1?'robot':'robots')+'</span><span style="color:var(--fg2);font-variant-numeric:tabular-nums">'+money(k.value)+'</span></div>'
      + '<div style="height:8px;background:var(--ghost);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+(i===0?'var(--fg1)':'var(--hair3)')+'"></div></div>'
    + '</div>';
  }).join('');
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:2px">Where the work is</div>'
    + '<div style="font-size:12px;color:var(--fg3);margin-bottom:16px">Share of work serviced, by kind, this period</div>'
    + (rows || '<div style="font-size:13px;color:var(--fg3)">'+noRobotNote()+'</div>')
  + '</div>';
}

// Every block on the dashboard, keyed once, so the dashboard is just "which
// keys, in what order, hidden or not" rather than a hardcoded page. Adding a
// block anywhere else in the app later means adding one entry here.
const DASH_BLOCKS = {
  kpi:       { label: 'Coverage number',      render: coverageKpiCard },
  cost:      { label: 'Cost per run',         render: costCard },
  recap:     { label: 'Coverage over time',   render: recapCard },
  util:      { label: 'Utilization',          render: utilizationCard },
  attn:      { label: 'Needs attention',      render: attentionCard },
  work:      { label: 'Where the work is',    render: workSplitCard },
  sens:      { label: 'Rate assumption',      render: sensitivityCard },
  venuebench:{ label: 'Benchmark vs other venues', render: benchmarkVenueCard },
};
const DASH_ORDER_DEFAULT = ['kpi','cost','recap','util','attn','work','sens','venuebench'];
const DASH_HIDDEN_DEFAULT = [];
let dashDragId = null; // which block is mid-drag; ephemeral, does not need a render (see dragstart/dragover/dragend below)

// The one unified dashboard: which site's telemetry it reads is the scope
// filter next to Customize (S.dashScope), Pier 4, Marina, and Airport all
// carry the same real per-robot detail now, "all 3 sites" sums across
// whichever aren't excluded rather than reading one site's total three
// times over.
function viewDashV2(){
  const hidden = S.dashLayout.filter(id => S.dashHidden.includes(id));
  const visible = S.dashLayout.filter(id => !S.dashHidden.includes(id));
  // Real masonry (see layoutDashMasonry below), not a row/column layout.
  // Grid and flexbox both size a whole row by its tallest member, so a
  // short card next to a tall one always leaves a gap somewhere, inside
  // itself if the row stretches, or below it if the row doesn't. A short
  // card's neighbor below has to wait for the tall card to end either way.
  // Masonry places each card in whichever column is shortest right now, so
  // nothing ever waits on a taller sibling. width/position get set by JS
  // after layout; this starting size is just what paints before that runs.
  return '<div style="padding:0 0 8px;margin-bottom:56px">'
    + dashToolbar(hidden)
    + '<div id="dashGrid" style="position:relative">'
      + visible.map(dashBlockWrap).join('')
    + '</div>'
  + '</div>';
}

// One filter button with a dropdown, same pattern as the period picker up
// top: current selection on the button face, chevron, click opens a list
// of every option below it. Filters the Dashboard only, Fleet and Numbers
// stay Pier 4 always, by choice, not because the other two sites lack
// data behind them now. Loads on "All 3 sites," the combined figure, not
// any one site's own.
function scopeToggle(){
  const scopes = [{k:'all', label:'All 3 sites'}].concat(SITES.map((s,i) => ({k:String(i), label:s.name})));
  const current = scopes.find(sc => sc.k === String(S.dashScope));
  return '<div style="position:relative">'
    + '<div data-act="toggleDashScope" class="hv-ghost" style="display:flex;align-items:center;gap:9px;padding:8px 14px;border:1px solid var(--hair);border-radius:4px;font-size:12.5px;font-weight:700;color:var(--fg1);cursor:pointer">'
      + ic('sliders-horizontal',13,'color:var(--fg3)') + current.label + ic('chevron-down',14,'color:var(--fg3)')
    + '</div>'
    + (S.dashScopeMenu
      ? '<div style="position:absolute;top:42px;left:0;width:200px;background:var(--menu);border:1px solid var(--hair2);border-radius:4px;z-index:45">'
        + scopes.map((sc,i) => '<div data-act="setDashScope" data-scope="'+sc.k+'" class="hv-ghost" style="padding:11px 14px;cursor:pointer;font-size:13px;font-weight:'+(sc.k===String(S.dashScope)?700:500)+';color:var(--fg1);border-bottom:'+(i<scopes.length-1?'1px solid var(--hair)':'none')+'">'+sc.label+'</div>').join('')
      + '</div>'
      : '')
  + '</div>';
}

function dashToolbar(hidden){
  return '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:16px">'
    + scopeToggle()
    + (S.dashEdit ? hidden.map(id => '<button type="button" data-act="dashShow" data-id="'+id+'" class="hv-ghost" style="font-size:12px;font-weight:600;color:var(--fg2);background:var(--ghost);border:1px dashed var(--hair2);border-radius:5px;padding:7px 12px;cursor:pointer">+ '+DASH_BLOCKS[id].label+'</button>').join('') : '')
    + (S.dashEdit ? '<button type="button" data-act="dashReset" class="hv-ghost" style="font-size:12px;font-weight:600;color:var(--fg3);background:none;border:none;cursor:pointer;padding:8px 6px">Reset layout</button>' : '')
    + '<button type="button" data-act="toggleDashEdit" class="hv-dim press" style="font-size:12.5px;font-weight:700;color:'+(S.dashEdit?'var(--ink-fg)':'var(--fg1)')+';background:'+(S.dashEdit?'var(--ink)':'transparent')+';border:1px solid var(--hair2);border-radius:5px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px">'
      + ic('sliders-horizontal',14) + (S.dashEdit?'Done':'Customize')
    + '</button>'
  + '</div>';
}

// Native HTML5 drag-and-drop, drag handle is the whole card in edit mode.
// Reorder happens once, on drop, not live while dragging over neighbors,
// that is the version that does not fight its own re-render mid-gesture.
function dashBlockWrap(id){
  const block = DASH_BLOCKS[id];
  if (!block) return '';
  const edit = S.dashEdit;
  // Width and position are set by layoutDashMasonry after this paints, not
  // here. A real strip above the card, not floated on top of it, is what
  // fixed the other overlap: absolute positioning over the corner was
  // landing on whatever the card already had there, "All robots →", the
  // Day/Week/Month tabs, take your pick, this pushes the card down instead.
  return '<div class="dash-block" data-dash-id="'+id+'" draggable="'+(edit?'true':'false')+'" style="box-sizing:border-box;'+(edit?'cursor:grab;':'')+'">'
    + (edit
      ? '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;margin-bottom:8px;background:var(--ghost);border:1px dashed var(--hair2);border-radius:6px">'
        + '<span style="display:inline-flex;align-items:center;gap:7px;color:var(--fg3);font-size:11.5px;font-weight:600">'+ic('equal',14)+'Drag to reorder</span>'
        + '<button type="button" data-act="dashHide" data-id="'+id+'" title="Remove from dashboard" style="flex:none;width:24px;height:24px;border-radius:5px;border:1px solid var(--hair2);background:var(--menu);cursor:pointer;font-size:14px;line-height:1;color:var(--fg2)">&times;</button>'
      + '</div>'
      : '')
    + '<div style="'+(edit?'pointer-events:none;':'')+'">'+block.render()+'</div>'
  + '</div>';
}

// Same interactive slider as the page above, same card frame as everything
// else here. The paragraph explaining it got cut to one line, the live
// math trace stays, that is the part that actually earns trust.
function sensitivityCard(){
  const base = sensBase();
  if (!base){
    const s = computeStatement();
    const note = s.included.length === 0
      ? noRobotNote()
      : 'Every included robot here is priced by the active hour, not by a per-task rate, so there is no throughput assumption to test. This card appears once a per-run or per-pick robot is in the fleet.';
    return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px;margin-bottom:20px">'
      + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:2px">The one input you cannot measure</div>'
      + '<div style="font-size:13px;color:var(--fg2);line-height:1.6">'+note+'</div>'
    + '</div>';
  }
  const min = Math.max(1, Math.round(base.benchUnitsPerHour * 0.5));
  const max = Math.max(min + 1, Math.round(base.benchUnitsPerHour * 2));
  const t = Math.min(max, Math.max(min, S.throughput));
  const c = calc(t, base);
  const be = breakEven(base);
  const secs = Math.round(3600 / be);
  const fill = ((t - min) / (max - min) * 100).toFixed(1);
  const unitLabel = base.unit+'s/hr';
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px;margin-bottom:20px">'
    + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:2px">The one input you cannot measure</div>'
    + '<div style="font-size:12px;color:var(--fg3);margin-bottom:18px">Every figure here assumes '+base.benchUnitsPerHour+' '+unitLabel+' for '+esc(base.work.toLowerCase())+' ('+base.domCount+' robot'+(base.domCount===1?'':'s')+'). Drag it and they move with you.</div>'
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:16px">'
      + '<input id="sensRange" class="bl-slider" type="range" min="'+min+'" max="'+max+'" step="1" value="'+t+'" style="flex:1;min-width:120px;--bl-fill:'+fill+'%" aria-label="'+esc(base.unit)+'s a person completes per hour">'
      + '<div style="text-align:right;flex:none">'
        + '<div style="font-variant-numeric:tabular-nums;font-size:13px;color:var(--fg1);white-space:nowrap"><b id="sensT" style="font-weight:700">'+t+'</b> '+unitLabel+'</div>'
        + '<div style="font-size:11px;color:var(--fg3);white-space:nowrap">= <b id="sensCovBig" style="color:var(--fg1);font-weight:700">'+c.cov.toFixed(2)+'x</b> coverage</div>'
      + '</div>'
    + '</div>'
    + '<div style="padding:12px 14px;border-radius:6px;background:var(--ghost);font-family:inherit;font-size:12px;color:var(--fg1);line-height:1.85;overflow-x:auto;white-space:nowrap">'
      + money(base.wageCentsHour/100)+' / hr ÷ <span id="sensT2">'+t+'</span> '+esc(base.unitPlural)+' = <span id="sensRate">'+money(c.rate)+'</span> per '+esc(base.unit)+'<br>'
      + base.domUnits.toLocaleString('en-US')+' '+esc(base.unitPlural)+' x <span id="sensRate2">'+money(c.rate)+'</span> + '+money(base.fixedWork)+' other work = <span id="sensWork">'+money(c.total)+'</span><br>'
      + '<span id="sensWork2">'+money(c.total)+'</span> / '+money(base.totalInvoice)+' invoiced = <span id="sensCov">'+c.cov.toFixed(2)+'x</span></div>'
    + '<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--hair);font-size:12.5px;line-height:1.6;color:var(--fg2)">Coverage falls to 1.00x at <b style="color:var(--fg1);font-weight:700">'+be+' '+unitLabel+'</b>'+(secs>0&&secs<3600?', one every '+secs+'s for a whole shift':'')+'.</div>'
  + '</div>';
}

function costCard(){
  const s = computeStatement();
  if (s.byCategory.length === 0) return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'+fig('Cost per task','—',noRobotNote(),'','')+'</div>';
  // The dashboard's biggest category by value, since "cost per task" only
  // means one thing when every included robot bills the same way. A mixed
  // fleet still gets a real number, just for the work that carries it.
  const top = s.byCategory[0];
  const b = BENCH[top.work];
  const rate = money(b.wageCentsHour / b.humanUnitsPerHour / 100);
  const label = 'Cost per '+b.unit;
  const note = top.count+' '+(top.count===1?'robot':'robots')+' · '+b.unit+' = $'+(b.wageCentsHour/100).toFixed(2)+'/hr ÷ '+b.humanUnitsPerHour;
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'+fig(label, rate, note, '', '')+'</div>';
}

// The percentile, median, and cohort size are inherently about OTHER
// venues' anonymized data, not derivable from this owner's own onboarding
// answers, so those stay illustrative of the feature. "You" is not: that
// half is always the real computed number, never the frozen 2.38x.
function benchmarkVenueCard(){
  const s = computeStatement();
  const covLabel = s.coverage === null ? '—' : s.coverage.toFixed(2)+'x';
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
      + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:14px">Against venues like yours</div>'
      + '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">'
        + '<span style="font-size:22px;font-weight:700;letter-spacing:-0.03em;color:var(--fg1);font-variant-numeric:tabular-nums">'+BENCHMARK.percentile+'</span>'
        + '<span style="font-size:12.5px;color:var(--fg2)">percentile</span></div>'
      + '<div style="font-size:12px;color:var(--fg2);line-height:1.6;margin-top:10px;font-variant-numeric:tabular-nums">You '+covLabel+' · median '+BENCHMARK.median+' · '+BENCHMARK.n+' venues, '+BENCHMARK.cohort+'</div>'
      + '<div style="font-size:12px;color:var(--fg3);line-height:1.6;margin-top:10px">Illustrative: the median and cohort size shown are a sample, not computed from your fleet, opting in is what would make this real. A lease at your price is normal for this cohort either way.</div>'
    + '</div>';
}

function fig(label, value, note, wrap, noteStyle){
  return '<div style="'+wrap+'">'
    + '<div style="font-size:13px;font-weight:600;color:var(--fg3);margin-bottom:10px">'+label+'</div>'
    + '<div style="font-size:clamp(24px,4.4vw,32px);font-weight:700;letter-spacing:-0.03em;color:var(--fg1);font-variant-numeric:tabular-nums">'+value+'</div>'
    + '<div style="font-size:12.5px;color:var(--fg2);margin-top:8px;line-height:1.5;'+noteStyle+'">'+note+'</div></div>';
}

// Consumable condition. Reported by Gausium; Bear and Pudu send nothing of the
// kind, so their robots say so plainly rather than showing an empty meter — a
// missing input is stated as missing, never rendered as a zero.
function conditionBlock(r){
  if(!r.parts) return '<div style="margin-top:14px;font-family:inherit;font-size:11.5px;color:var(--fg3)">consumable life · not reported by '+(r.model||'').split(' ')[0]+'</div>';
  const spent = r.parts.filter(p => p.left <= 0).length;
  const bars = r.parts.map(p => {
    const past = p.left <= 0;
    // Life remaining reads left to right. A part past its rating has no bar to
    // draw, so the whole track carries the hatch this design already uses for
    // the figure that is going the wrong way.
    const fill = past
      ? 'repeating-linear-gradient(135deg,var(--hatch2) 0 2px,transparent 2px 5px)'
      : 'var(--ink)';
    const width = past ? '100%' : Math.max(0, Math.min(100, p.left)) + '%';
    const label = past ? Math.round(-p.left) + '% over' : Math.round(p.left) + '% left';
    return '<div style="display:flex;align-items:center;gap:12px;margin-bottom:9px">'
      + '<span data-barlabel style="width:104px;flex:none;font-family:inherit;font-size:12px;color:var(--fg2)">'+p.name+'</span>'
      + '<span style="flex:1;min-width:60px;height:8px;border:1px solid var(--hair2);position:relative;display:block">'
        + '<i style="position:absolute;left:0;top:0;bottom:0;width:'+width+';background:'+fill+'"></i></span>'
      + '<span style="width:96px;flex:none;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:'+(past?700:400)+';color:'+(past?'var(--fg1)':'var(--fg2)')+'">'+label+'</span>'
      + '<span style="width:104px;flex:none;text-align:right;font-family:inherit;font-size:11.5px;color:var(--fg3)">'+p.used+'</span></div>';
  }).join('');
  const note = spent
    ? 'A part past its rating is work this machine is still doing on borrowed time. Replacing it is not in the figure above.'
    : 'Every part is inside its rated life.';
  return '<div style="margin-top:22px;padding-top:18px;border-top:1px dashed var(--hair)">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:14px">'
      + '<span style="font-size:12.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--fg2)">Condition</span>'
      + '<span style="font-size:12.5px;color:var(--fg3)">life remaining against the maker&#39;s rating</span></div>'
    + '<div data-bars style="margin-bottom:12px">'+bars+'</div>'
    + '<div style="font-size:13px;line-height:1.6;color:var(--fg2);max-width:86ch">'+note+'</div>'
    + '<div style="margin-top:10px;font-family:inherit;font-size:11.5px;color:var(--fg3)">also reported · '+r.hand+' of active time hand-driven · battery '+r.temp+'</div>'
    + '</div>';
}

function viewRobots(){
  // Coverage, chip, and the equation used to be a hardcoded string per
  // robot. Now they're read off computeStatement(), the one calculation
  // Dashboard already trusted, so a wage or invoice edit on Setup moves
  // this page too instead of only moving the page that made the edit.
  // Duty time and condition stay on ROBOTS: telemetry, not something an
  // invoice edit has any business changing.
  const stmt = computeStatement(true);
  // Condition used to be its own page, looping these same robots through
  // the same conditionBlock() every row below already calls. Merged in:
  // the per-robot bars stay exactly where they were, in the row, once.
  // What's added here is only the context that page had and no row does,
  // why condition matters and who isn't reporting it.
  const silent = ROBOTS.filter(r => !r.parts);
  // Six full rows, equation and condition bars included, all open at
  // once, was everything about every robot on screen at the same time.
  // One row per robot now, closed by default; opening one is the only
  // way to see that robot's equation and condition.
  //
  // No filter toggle anymore either. It split the fleet into two lists
  // for what's really a one-robot-out-of-six case, and needing a
  // separate view to find the flagged robot was more clicks than the
  // problem deserved. The caution mark on its name in the one list does
  // the same job at a glance, without hiding the other five.
  const rows = ROBOTS.map((r,i) => {
    const s = stmt.rows[i];
    const short = s.cov !== null && s.cov < 1;
    const open = S.openRobot === i;
    const spentParts = (r.parts || []).filter(p => p.left <= 0).length;
    const chip = short ? 'under its lease' : (s.benchmarkWage ? 'benchmark rate' : 'covered');
    const chipFg = short ? 'var(--fg1)' : 'var(--fg2)';
    const dutyFill = short ? 'repeating-linear-gradient(135deg,var(--hatch2) 0 2px,transparent 2px 5px)' : 'var(--ink)';
    const covLabel = s.cov === null ? '—' : s.cov.toFixed(2)+'x';
    const unitsPhrase = s.basis === 'active_hour'
      ? s.units.toFixed(1)+' active hours'
      : s.units.toLocaleString('en-US')+' '+s.unit+' started';
    const eq = unitsPhrase+' x '+money(s.rate)+' = '+money(s.value)+' / invoice '+money(s.invoice)+' = '+covLabel;
    // Same wording the fully-reported condition block already uses for
    // an all-clear ("Every part is inside its rated life"), and the same
    // per-part count the row header used to show as its own chip, so
    // this line isn't a third way of saying either thing.
    const conditionLine = !r.parts
      ? 'condition not reported by '+(r.model||'').split(' ')[0]
      : spentParts
        ? spentParts+(spentParts === 1 ? ' part past life' : ' parts past life')
        : 'all parts within rated life';
    const caution = !short ? '' : '<span title="Under its lease" style="display:inline-flex;color:var(--fg1)">'+ic('triangle-alert',15)+'</span>';

    const summary = '<div data-act="toggleRobot" data-i="'+i+'" class="hv-fade" style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:20px 4px;cursor:pointer">'
      + '<div style="min-width:180px"><div style="display:flex;align-items:center;gap:7px;font-size:15.5px;font-weight:'+(open||short?700:600)+';color:var(--fg1)">'+r.name+caution+'</div>'
        + '<div style="font-size:12px;color:var(--fg3);margin-top:3px">'+r.model+'</div></div>'
      + '<div style="min-width:130px"><span style="font-size:11.5px;font-weight:700;color:'+chipFg+'">'+chip+'</span></div>'
      + '<div style="min-width:80px;font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'+r.duty+'</div>'
      + '<div style="min-width:170px;font-size:12.5px;font-weight:'+(spentParts?700:500)+';color:'+(spentParts?'var(--fg1)':'var(--fg3)')+'">'+conditionLine+'</div>'
      + '<span style="margin-left:auto;display:flex;align-items:baseline;gap:10px">'
        + '<span style="font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'+ROBOT_DELTA[r.name]+' vs July</span>'
        + '<span style="font-size:22px;font-weight:700;letter-spacing:-0.02em;color:var(--fg1);font-variant-numeric:tabular-nums">'+covLabel+'</span></span>'
      + '<span style="font-size:13px;color:var(--fg3);width:12px;text-align:center">'+(open?'–':'+')+'</span>'
    + '</div>';

    const detail = !open ? '' : '<div style="padding:0 4px 26px">'
      + '<div data-split style="display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:4px">'
        + '<div><div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg2);margin-bottom:8px"><span>duty time</span><span style="font-variant-numeric:tabular-nums">'+r.duty+' · '+r.hours+'</span></div>'
          + '<div style="height:8px;border:1px solid var(--hair2);position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:'+r.dutyPct+';background:'+dutyFill+'"></div></div></div>'
        + '<div style="font-family:inherit;font-size:13px;color:var(--fg1);line-height:1.6;overflow-x:auto;min-width:0;white-space:nowrap">'+eq+'</div>'
      + '</div>' + conditionBlock(r) + '</div>';

    return '<div style="border-top:1px solid var(--hair)">' + summary + detail + '</div>';
  }).join('');

  // First flagged robot, computed fresh every render instead of a robot
  // name and its dollar figures typed once, so an edit that pushes a
  // different robot under its lease, or pulls this one back over, doesn't
  // leave a paragraph that's still describing whichever robot needed
  // attention when this was written.
  const flagged = stmt.rows.find(s => !s.excluded && s.cov !== null && s.cov < 1);
  const flaggedR = flagged ? ROBOTS[flagged.i] : null;
  const flaggedUnitsPhrase = flagged && (flagged.basis === 'active_hour'
    ? flagged.units.toFixed(1)+' active hours'
    : flagged.units.toLocaleString('en-US')+' '+flagged.unit);

  return '<div style="padding:0;margin-bottom:56px">'
      + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:26px">'
        + '<h2 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--fg1)">Fleet</h2>'
        + '<span style="font-size:13px;color:var(--fg3)">Open a robot for the equation and condition behind its number.</span></div>'
      + rows + '</div>'
    + '<div style="padding:0;margin-bottom:48px">'
      + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:8px">'
        + '<h2 style="font-size:18px;font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--fg1)">Why condition sits next to the money</h2></div>'
      + '<p style="font-size:14px;line-height:1.7;color:var(--fg2);margin:0 0 16px;max-width:88ch">Gausium is the only vendor that reports consumable wear directly, the difference between a scrubber that cleans and one pushing dirty water around while still logging active hours. Scrubber 75 proves it: all four parts under 8% of rating, and the lowest coverage of your two scrubbers, a connection the invoice alone wouldn&#39;t show. It&#39;s also what a lender reads for resale value, visible here months before it shows up in a payment.</p>'
      + '<p style="font-size:13px;line-height:1.7;color:var(--fg3);margin:0;max-width:88ch">'+silent.length+' of your robots report nothing about condition: '+silent.map(r => r.name).join(', ')+'. Bear and Pudu do not expose it, so those rows carry no bars rather than an estimate guessed from hours run.</p>'
    + '</div>'
    + (!flagged ? '' : '<div style="padding:0">'
      + '<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:12px">'
        + '<h2 style="font-size:18px;font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--fg1)">'+esc(flagged.name)+' is under its lease</h2>'
        + '<span style="font-size:13px;color:var(--fg3)">'+flagged.cov.toFixed(2)+'x · '+esc(flaggedR.duty)+' of '+esc(flaggedR.hours.split(' of ')[1])+'</span></div>'
      + '<p style="font-size:14.5px;line-height:1.7;color:var(--fg2);margin:0 0 20px;max-width:86ch">'+flaggedUnitsPhrase+' in 30 days came to '+money(flagged.value)+' of '+esc(flagged.work.toLowerCase())+' against a '+money(flagged.invoice)+' invoice. Either it needs more shifts, or it belongs somewhere else. This is what buying the work costs, not what it earned.</p>'
      + '<button type="button" data-act="go" data-view="setup" class="hv-ghost" style="padding:12px 18px;border-radius:3px;border:1px solid var(--hair2);background:transparent;cursor:pointer;font-size:13px;font-weight:700;color:var(--fg1)">Check this robot&#39;s inputs</button></div>');
}

// The values themselves already apply the moment they're typed, computeStatement()
// reads live state, not a saved copy. This button is reassurance, not a
// commit step: something to press that says "done with this one" and
// answers back, so editing a field doesn't leave you wondering whether it
// took. Resets to "Save" the moment this row is touched again, see the
// setupSaved reset in the input/change handlers below.
function setupSaveButton(i){
  const saved = !!S.setupSaved[i];
  return '<button type="button" data-act="saveSetupRow" data-i="'+i+'" id="setupSaveBtn-'+i+'" style="display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:4px;border:none;cursor:pointer;font-size:13px;font-weight:700;background:'+(saved?'var(--ghost2)':'var(--ink)')+';color:'+(saved?'var(--fg1)':'var(--ink-fg)')+'">'
    + (saved ? ic('check',14)+'Saved' : 'Save')
  + '</button>';
}

// Same Save/Saved pattern as setupSaveButton above, one flag instead of a
// per-row map since there's only ever one profile photo. Picking a color,
// an icon, or uploading a photo all flip avatarSaved back to false.
function avatarSaveButton(){
  const saved = !!S.avatarSaved;
  return '<button type="button" data-act="saveAvatar" style="display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:4px;border:none;cursor:pointer;font-size:13px;font-weight:700;background:'+(saved?'var(--ghost2)':'var(--ink)')+';color:'+(saved?'var(--fg1)':'var(--ink-fg)')+'">'
    + (saved ? ic('check',14)+'Saved' : 'Save photo')
  + '</button>';
}

// The change-email flow, a real state machine like sign-in's own
// email-link screens, not a "here's what this would do" stub: enter the
// new address, we simulate sending a 6-digit code, entering the right
// shape of code (demo has no real inbox to check against) flips
// S.accountEmail over and every place it's shown reads the new value.
function emailChangeBlock(){
  if (S.emailChangeStage === 'idle') return '';
  if (S.emailChangeStage === 'form'){
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.emailChangeNew.trim());
    const disabled = S.emailChangeSending || !valid;
    return '<div style="margin:0 0 24px;padding:16px 18px;border:1px solid var(--hair2);border-radius:6px;max-width:420px">'
      + '<div style="font-size:12.5px;font-weight:700;color:var(--fg3);margin-bottom:8px">New email</div>'
      + '<input id="emailChangeInput" type="text" inputmode="email" autocomplete="email" placeholder="you@company.com" value="'+esc(S.emailChangeNew)+'" style="width:100%;font-size:14px;color:var(--fg1);background:transparent;padding:10px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;margin-bottom:14px">'
      + '<div style="display:flex;flex-wrap:wrap;gap:10px">'
        + '<button type="button" data-act="sendEmailChangeCode"'+(disabled?' disabled':'')+' style="padding:10px 16px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:'+(disabled?'default':'pointer')+';opacity:'+(disabled?0.5:1)+';font-size:13px;font-weight:700">'+(S.emailChangeSending?'Sending…':'Send verification code')+'</button>'
        + '<button type="button" data-act="cancelEmailChange" style="padding:10px 14px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--fg2)">Cancel</button>'
      + '</div>'
    + '</div>';
  }
  if (S.emailChangeStage === 'code'){
    return '<div style="margin:0 0 24px;padding:16px 18px;border:1px solid var(--hair2);border-radius:6px;max-width:420px">'
      + '<div style="font-size:13px;color:var(--fg2);line-height:1.6;margin-bottom:14px">We sent a 6-digit code to <b style="color:var(--fg1);font-weight:700">'+esc(S.emailChangeNew)+'</b>. Enter it below to confirm the change.</div>'
      + '<input id="emailChangeCodeInput" type="text" inputmode="numeric" maxlength="6" placeholder="123456" value="'+esc(S.emailChangeCode)+'" style="width:100%;font-size:16px;letter-spacing:0.3em;font-variant-numeric:tabular-nums;color:var(--fg1);background:transparent;padding:10px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;margin-bottom:'+(S.emailChangeCodeErr?'6':'14')+'px">'
      + (S.emailChangeCodeErr ? '<div style="font-size:12px;color:var(--fg1);margin-bottom:14px">That code doesn&#39;t look right. It&#39;s 6 digits, check your email and try again.</div>' : '')
      + '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">'
        + '<button type="button" data-act="confirmEmailChangeCode"'+(S.emailChangeVerifying?' disabled':'')+' style="padding:10px 16px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:'+(S.emailChangeVerifying?'default':'pointer')+';opacity:'+(S.emailChangeVerifying?0.5:1)+';font-size:13px;font-weight:700">'+(S.emailChangeVerifying?'Verifying…':'Confirm')+'</button>'
        + '<button type="button" data-act="sendEmailChangeCode" style="padding:10px 12px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--fg2)">Resend code</button>'
        + '<button type="button" data-act="cancelEmailChange" style="padding:10px 12px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--fg2)">Cancel</button>'
      + '</div>'
    + '</div>';
  }
  // 'done'
  return '<div style="margin:0 0 24px;padding:14px 18px;border:1px solid var(--hair2);border-radius:6px;max-width:420px;display:flex;align-items:center;gap:10px">'
    + ic('check',16)
    + '<div style="font-size:13px;color:var(--fg2);line-height:1.6">Email updated to <b style="color:var(--fg1);font-weight:700">'+esc(S.accountEmail)+'</b>.</div>'
  + '</div>';
}

// Setup and Rates used to be two separate nav destinations. Both are the
// same job, what to assume when computing coverage, so they're one page
// now: per-robot inputs first, then the work-type rates those per-robot
// replacement figures are themselves derived from, one Save for the form.
function viewSetup(){
  const stmt = computeStatement(true);
  // These five fields used to be static divs styled to look like inputs,
  // nothing to click into, nothing typed ever went anywhere. Real inputs
  // now, reading and writing the same per-robot overlays computeStatement()
  // reads, so what's typed here is the number Fleet and Dashboard show,
  // not a second copy of it that only this page believes.
  const rows = SETUP.map((r,i) => {
    const open = S.openSetup === i;
    const s = stmt.rows[i];
    const b = BENCH[s.work];
    const hoursVal = S.robotHours[i] ?? parseFloat(r.hours);
    const summary = s.work+' · '+money(s.invoice)+' / mo · '+money(s.rate)+' / '+b.unit+' · '+hoursVal+' h / day';
    let panel = '';
    if (open){
      panel = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:24px;padding:4px 4px 28px">'
        + '<div><label for="confirmWork-'+i+'" style="display:block;font-size:11.5px;font-weight:700;color:var(--fg3);margin-bottom:6px">What it does</label>'
          + '<select id="confirmWork-'+i+'" data-i="'+i+'" style="width:100%;font-size:13.5px;color:var(--fg1);background:transparent;padding:10px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-family:inherit;cursor:pointer">'
            + WORK_CATEGORIES.map(w => '<option value="'+esc(w)+'"'+(w===s.work?' selected':'')+'>'+esc(w)+'</option>').join('')
          + '</select></div>'
        + '<div><label for="setupInvoice-'+i+'" style="display:block;font-size:11.5px;font-weight:700;color:var(--fg3);margin-bottom:6px">Monthly invoice</label>'
          + '<input id="setupInvoice-'+i+'" data-i="'+i+'" type="number" min="0" inputmode="decimal" value="'+s.invoice.toFixed(2)+'" style="width:100%;font-size:13.5px;color:var(--fg1);background:transparent;padding:10px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-variant-numeric:tabular-nums"></div>'
        + '<div><div style="font-size:11.5px;font-weight:700;color:var(--fg3);margin-bottom:6px">Replacement rate</div>'
          + '<div id="setupRate-'+i+'" style="font-size:13.5px;color:var(--fg1);padding:10px 2px;border-bottom:1px solid var(--hair2);font-variant-numeric:tabular-nums">'+money(s.rate)+' / '+b.unit+'</div>'
          + '<div id="setupDerive-'+i+'" style="font-family:inherit;font-size:11.5px;color:var(--fg3);margin-top:6px">'+money(s.wage)+'/hr ÷ '+b.humanUnitsPerHour+' '+b.unitPlural+' per hour</div></div>'
        + '<div><label for="setupWage-'+i+'" style="display:block;font-size:11.5px;font-weight:700;color:var(--fg3);margin-bottom:6px">Loaded wage</label>'
          + '<input id="setupWage-'+i+'" data-i="'+i+'" type="number" min="0" inputmode="decimal" value="'+s.wage.toFixed(2)+'" style="width:100%;font-size:13.5px;color:var(--fg1);background:transparent;padding:10px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-variant-numeric:tabular-nums"></div>'
        + '<div><label for="setupHours-'+i+'" style="display:block;font-size:11.5px;font-weight:700;color:var(--fg3);margin-bottom:6px">Operating hours / day</label>'
          + '<input id="setupHours-'+i+'" data-i="'+i+'" type="number" min="0" step="0.5" inputmode="decimal" value="'+hoursVal+'" style="width:100%;font-size:13.5px;color:var(--fg1);background:transparent;padding:10px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-variant-numeric:tabular-nums"></div>'
        + '<div><div style="font-size:11.5px;font-weight:700;color:var(--fg3);margin-bottom:6px">&nbsp;</div>'
          + setupSaveButton(i)
        + '</div>'
      + '</div>';
    }
    return '<div style="border-top:1px solid var(--hair)">'
      + '<div data-act="toggleSetup" data-i="'+i+'" class="hv-fade" style="display:flex;align-items:center;gap:16px;padding:20px 4px;cursor:pointer">'
        + '<div style="min-width:180px"><div style="font-size:14.5px;font-weight:'+(open?700:600)+';color:var(--fg1)">'+r.name+'</div>'
          + '<div style="font-size:12px;color:var(--fg3);margin-top:3px">'+r.model+'</div></div>'
        + '<div id="setupSummary-'+i+'" style="font-size:13.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'+summary+'</div>'
        + '<span style="margin-left:auto;font-size:12.5px;font-weight:600;color:var(--fg3)">'+(open?'editing':'edit')+'</span>'
        + '<span style="font-size:13px;color:var(--fg3);width:12px;text-align:center">'+(open?'–':'+')+'</span></div>'
      + panel + '</div>';
  }).join('');

  return '<div style="padding:0;margin-bottom:48px">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:26px">'
      + '<h2 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--fg1)">Five inputs per robot</h2>'
      + '<span style="font-size:13px;color:var(--fg3)">Everything is prefilled. Accept it as-is, or correct the two you care about.</span></div>'
    + rows
  + '</div>'

  + '<div style="padding:0;margin-bottom:56px">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:26px">'
      + '<h2 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--fg1)">Where the rates come from</h2>'
      + '<span style="font-size:13px;color:var(--fg3)">Derived, never asserted. Change a robot&#39;s Loaded wage above to move its rate.</span></div>'
    + '<div style="overflow-x:auto;min-width:0"><div style="min-width:720px">'
      + '<div style="display:grid;grid-template-columns:1.2fr 1fr 1.2fr 1.2fr;gap:20px;padding:0 4px 14px;font-size:11.5px;font-weight:700;color:var(--fg3)"><div>Work</div><div>Loaded wage</div><div>A person does</div><div>So one unit is worth</div></div>'
      + RATES.map((v,i) => '<div style="display:grid;grid-template-columns:1.2fr 1fr 1.2fr 1.2fr;gap:20px;padding:20px 4px;border-top:1px solid var(--hair);align-items:baseline">'
        + '<div><div style="font-size:14.5px;font-weight:600;color:var(--fg1)">'+v.work+'</div>'
        + '<div style="font-size:11.5px;color:var(--fg3);margin-top:4px">'+RATE_HISTORY[i===0?0:2].span+'</div></div>'
        + '<div style="font-size:14px;color:var(--fg2);font-variant-numeric:tabular-nums">'+v.wage+'</div>'
        + '<div style="font-size:14px;color:var(--fg2);font-variant-numeric:tabular-nums">'+v.does+'</div>'
        + '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font-size:14.5px;font-weight:700;color:var(--fg1);font-variant-numeric:tabular-nums">'+v.rate+'</span>'
        + '<span style="font-size:11.5px;font-weight:600;color:var(--fg2)">'+v.source+'</span></div></div>').join('')
    + '</div></div>'
    + '<div style="margin-top:26px;padding:18px 20px;border:1px solid var(--hair2);border-radius:4px;font-size:13.5px;line-height:1.7;color:var(--fg2)">A rate change applies from the day you make it. The five closed periods keep the rate they were computed with, so a statement you already sent your accountant never changes after the fact.</div>'
    + '<div style="margin-top:20px">'
      + '<div data-act="toggleRateHistory" class="hv-fade" style="display:flex;align-items:center;gap:10px;padding:14px 4px;cursor:pointer;border-top:1px solid var(--hair)">'
        + '<span style="font-size:13.5px;font-weight:700;color:var(--fg1)">Rate history</span>'
        + '<span style="font-size:12.5px;color:var(--fg3)">Every value these figures have ever used, and who set it</span>'
        + '<span style="margin-left:auto;font-size:13px;color:var(--fg3);width:12px;text-align:center">'+(S.rateHistory?'–':'+')+'</span></div>'
      + (S.rateHistory
        ? '<div style="overflow-x:auto;min-width:0"><div style="min-width:700px">'
          + '<div style="display:grid;grid-template-columns:1.1fr 1fr 1.2fr 1.4fr;gap:20px;padding:0 4px 12px;font-size:11.5px;font-weight:700;color:var(--fg3)"><div>Work</div><div>Rate</div><div>In effect</div><div>Set by</div></div>'
          + RATE_HISTORY.map(r => '<div style="display:grid;grid-template-columns:1.1fr 1fr 1.2fr 1.4fr;gap:20px;padding:16px 4px;border-top:1px solid var(--hair);align-items:baseline">'
            + '<div style="font-size:13.5px;font-weight:600;color:'+(r.current?'var(--fg1)':'var(--fg2)')+'">'+r.work+'</div>'
            + '<div style="font-size:13.5px;color:var(--fg1);font-variant-numeric:tabular-nums">'+r.rate+'</div>'
            + '<div style="font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'+r.span+'</div>'
            + '<div><div style="font-size:12.5px;color:var(--fg2)">'+r.by+'</div>'
            + '<div style="font-family:inherit;font-size:11.5px;color:var(--fg3);margin-top:3px">'+r.basis+'</div></div></div>').join('')
          + '</div></div>'
        : '')
    + '</div>'
    + '<div style="margin-top:24px;padding-top:24px;border-top:1px solid var(--hair);font-size:13.5px;color:var(--fg2)">Floor cleaning still uses our published benchmark wage, not yours. Every figure it feeds is marked <b style="font-weight:700;color:var(--fg1)">benchmark</b> until the input above is corrected.</div>'

function viewConfirm(){
  const excludedCount = Object.keys(S.excluded).filter(k => S.excluded[k]).length;
  const included = CONFIRM.filter((c,i) => !S.excluded[i]);
  const allSameWork = included.length > 1 && included.every(c => c.work === included[0].work);
  // Reviewing is the one required action, not typing. A robot counts as
  // reviewed the moment its "kind of work" select is opened, whether or not
  // the value changes, because looking is what proves the default was seen,
  // not agreed with by accident. Excluded robots do not need review, they
  // are not being priced.
  const needsReview = CONFIRM.map((c,i) => i).filter(i => !S.excluded[i]);
  const reviewedCount = needsReview.filter(i => S.confirmSeen[i]).length;
  const allReviewed = reviewedCount === needsReview.length;
  const left = needsReview.length - reviewedCount;

  const row = (c,i) => {
    const excl = !!S.excluded[i];
    const seen = !!S.confirmSeen[i];
    const work = S.confirmWork[i] ?? c.work;
    const name = S.confirmName[i] ?? c.name;
    return '<div data-split style="border-top:1px solid var(--hair);padding:20px 4px;display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:28px;align-items:start;opacity:'+(excl?0.5:1)+'">'
      + '<div>'
        + '<label style="display:block;font-size:10.5px;font-weight:700;color:var(--fg3);margin-bottom:4px">Call it</label>'
        + '<input id="confirmName-'+i+'" type="text" value="'+esc(name)+'" style="width:100%;font-size:14px;color:var(--fg1);background:transparent;padding:8px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-family:inherit">'
        + '<div style="font-size:12px;color:var(--fg3);margin-top:6px;font-variant-numeric:tabular-nums">'+c.seen+'</div></div>'
      + '<div style="display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px">'
        + '<div style="min-width:200px">'
          + '<label for="confirmWork-'+i+'" style="display:block;font-size:10.5px;font-weight:700;color:var(--fg3);margin-bottom:4px">Kind of work'+(!excl && !seen ? ' <span style="color:var(--fg1)">· look at this</span>' : '')+'</label>'
          + '<select id="confirmWork-'+i+'" data-i="'+i+'" style="width:100%;font-size:13.5px;color:var(--fg1);background:transparent;padding:8px 2px;border:none;border-bottom:1px solid '+(!excl && !seen ? 'var(--fg1)' : 'var(--hair2)')+';outline:none;font-family:inherit;cursor:pointer">'
            + WORK_CATEGORIES.map(w => '<option value="'+esc(w)+'"'+(w===work?' selected':'')+'>'+esc(w)+'</option>').join('')
          + '</select></div>'
        + '<button type="button" data-act="toggleExclude" data-i="'+i+'" style="margin-left:auto;padding:9px 14px;border-radius:3px;border:1px solid var(--hair2);background:'+(excl?'var(--ink)':'transparent')+';color:'+(excl?'var(--ink-fg)':'var(--fg1)')+';cursor:pointer;font-size:12.5px;font-weight:600">'+(excl?'Excluded':'Exclude')+'</button>'
      + '</div></div>';
  };

  return '<div style="padding:0;margin-bottom:40px">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px">'
      + '<h2 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--fg1)">'+CONFIRM.length+' robots found in that export</h2>'
      + '<span style="font-size:13px;color:var(--fg3)">Rename anything you call something else. Exclude what you don&#39;t lease.</span></div>'
    + (allSameWork ? '<div style="border-left:2px solid var(--fg1);background:var(--ghost2);padding:13px 15px;border-radius:0 4px 4px 0;font-size:13px;color:var(--fg1);line-height:1.6;margin-bottom:22px"><b>All '+included.length+' robots are set to the same kind of work: '+included[0].work+'.</b> That is a default guess, not something read from your export. Fix each one below if this fleet actually does more than one thing.</div>' : '')
    + '<div style="border-left:2px solid '+(allReviewed?'var(--fg3)':'var(--fg1)')+';background:var(--ghost2);padding:13px 15px;border-radius:0 4px 4px 0;font-size:13px;color:var(--fg1);line-height:1.6;margin-bottom:8px">'
      + (allReviewed
        ? 'You&#39;ve looked at all '+needsReview.length+'. Confirm below when ready.'
        + (S.confirmTriedSubmit ? '' : '')
        : '<b>Open the &quot;Kind of work&quot; field for each robot below before confirming.</b> '+left+' left. It decides whether a robot is priced per task or per hour, which changes its number by an order of magnitude, so a glance is required, typing is not.')
    + '</div>'
    + CONFIRM.map(row).join('')
    + '<div style="margin-top:28px;display:flex;flex-wrap:wrap;align-items:center;gap:16px">'
      + '<button type="button" data-act="confirmFleet" class="hv-dim" style="padding:14px 22px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:pointer;font-size:14px;font-weight:700;opacity:'+(allReviewed?1:0.4)+'">Yes, that&#39;s my fleet</button>'
      + '<span style="font-size:13px;color:var(--fg3)">'+(!allReviewed
          ? 'Look at '+left+' more to unlock this.'
          : excludedCount === 0
            ? 'All '+CONFIRM.length+' will be priced. Nothing is computed until you continue.'
            : excludedCount+' excluded, so they stay out of every total instead of reading as $0.00.')+'</span></div>'
    + (S.confirmTriedSubmit && !allReviewed ? '<div style="margin-top:12px;font-size:12.5px;font-weight:600;color:var(--fg1)">Look at the highlighted fields above first, then confirm.</div>' : '')
    + '<div style="margin-top:18px;font-size:12.5px;color:var(--fg3)">Want to type your own rate, invoice, or wage instead of the benchmark guess? <span data-act="go" data-view="setup" style="color:var(--fg1);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Set your numbers</span>, any time, not required now.</div>'
  + '</div>';
}

function viewBusiness(){

/* ─────────────────────────  RENDER  ───────────────────────── */

function render(){
  const active = document.activeElement;
  const keepId = active && active.id ? active.id : null;
  const selStart = keepId && 'selectionStart' in active ? active.selectionStart : null;

  const onAuth = S.stage === 'auth';
  // A first-time owner stays out of the app rail clear through import and
  // confirm: the rail is the product's navigation, and there is nothing to
  // navigate to until a fleet exists. Content still comes from appStage(),
  // since 'start' and 'confirm' are real views with real width needs (a
  // robot table does not fit the 440px sign-in card), just centred in their
  // own wide column instead of sitting next to the rail. It only appears
  // once the fleet is actually confirmed (confirmFleet clears S.onboarding).
  // A returning owner (toApp) never sets it, so they see the rail immediately.
  const inOnboarding = S.stage === 'app' && S.onboarding;
  const inner = onAuth
    ? authStage()
    : inOnboarding
      ? '<div data-stage style="padding:56px 34px 80px;display:flex;justify-content:center"><div style="width:100%;max-width:860px">' + appStage() + '</div></div>'
      : appRail() + appStage();

  /* The app keeps its rail, because navigation between Coverage, Robots, Rates
     and Settings is the product. Auth (and onboarding) has nowhere to
     navigate to, so it gets the whole width and the card centres in it. */
  // 256px / 48px: shadcn's own SIDEBAR_WIDTH / SIDEBAR_WIDTH_ICON, and the
  // real docs demo (variant="sidebar", the default, measured directly off
  // ui.shadcn.com/docs/components/base/sidebar) is flush against the edge,
  // no floating margin to compensate for. That was the wrong variant.
  const cols = (onAuth || inOnboarding) ? 'minmax(0,1fr)' : (S.railCollapsed ? '48px minmax(0,1fr)' : '256px minmax(0,1fr)');

  document.getElementById('root').innerHTML =
    '<div style="position:relative;min-height:100vh;background:var(--page);color:var(--fg1)">'
    + '<div data-grid style="position:relative;display:grid;grid-template-columns:'+cols+';align-items:start;min-height:100vh">'
    + inner + '</div></div>';

  applySensitivity();
  layoutDashMasonry();

  if (keepId){
    const el = document.getElementById(keepId);
    if (el){
      /* selectionStart reads null on input types the selection API does not cover
         (email, number). Without the fallback the caret lands at 0 after every
         re-render and the field fills in backwards. */
      try {
        el.focus();
        if (el.type !== 'range' && 'setSelectionRange' in el){
          const at = selStart != null ? selStart : (el.value ? el.value.length : 0);
          el.setSelectionRange(at, at);
        }
      } catch(e){}
    }
  } else if (S.stage === 'auth' && ['signin','signin-new','signin-failed','signedout'].includes(S.screen)){
    const el = document.getElementById('authEmail');
    if (el) { try { el.focus(); } catch(e){} }
  }
}

/* The slider patches the statement in place. A full re-render on every input
   event would replace the range element mid-drag and the thumb would stop
   tracking the pointer. */
function applySensitivity(){
  const put = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  if (S.view !== 'dashv2') return;
  const base = sensBase();
  if (!base) return;
  const c = calc(S.throughput, base);
  put('sensT', S.throughput);
  put('sensT2', S.throughput);
  put('sensRate', money(c.rate));
  put('sensRate2', money(c.rate));
  put('sensWork', money(c.total));
  put('sensWork2', money(c.total));
  put('sensCov', c.cov.toFixed(2) + 'x');
  put('sensCovBig', c.cov.toFixed(2) + 'x');
  const slider = document.getElementById('sensRange');
  if (slider) slider.style.setProperty('--bl-fill', ((S.throughput - 15) / (60 - 15) * 100) + '%');
}

// Patches one Setup row's derived rate and summary line in place after a
// wage/invoice/hours/work edit, same reason applySensitivity patches
// instead of calling set(): a full re-render mid-keystroke would blow
// away focus and cursor position in the very input being typed into.
function applySetupRow(i){
  if (S.view !== 'setup') return;
  const put = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
  const s = computeStatement(true).rows[i];
  if (!s) return;
  const b = BENCH[s.work];
  put('setupRate-'+i, money(s.rate)+' / '+b.unit);
  put('setupDerive-'+i, money(s.wage)+'/hr ÷ '+b.humanUnitsPerHour+' '+b.unitPlural+' per hour');
  const hoursVal = S.robotHours[i] ?? parseFloat(SETUP[i].hours);
  put('setupSummary-'+i, s.work+' · '+money(s.invoice)+' / mo · '+money(s.rate)+' / '+b.unit+' · '+hoursVal+' h / day');
  // An edit after Save undoes the reassurance: back to "Save" until they
  // confirm this row again.
  delete S.setupSaved[i];
  const btn = document.getElementById('setupSaveBtn-'+i);
  if (btn) btn.outerHTML = setupSaveButton(i);
}

/* Real masonry for the dashboard grid. Grid and flexbox both size a row by
 * its tallest member, whatever else is in that row either stretches to
 * match it (dead space inside the short card) or stops short of it (dead
 * space below the short card, waiting for the row to clear). Neither is
 * fixable without changing what "a row" means, so this drops rows
 * entirely: each card gets measured at its real width, then placed at the
 * top of whichever column is shortest right now. A short card's neighbor
 * lands right under it, it never waits on a taller card two columns over. */
// Column-packs the EXISTING dash-block nodes in `order` (ids, hidden ones
// filtered out), writing left/top directly rather than touching innerHTML.
// That split is what lets a live drag preview reuse this: reordering mid-
// drag never recreates the node the browser is tracking as the drag
// source, only the plain reflow-on-resize/hide/reset path and the actual
// post-drop render() ever call this through layoutDashMasonry below.
function previewDashOrder(order){
  const container = document.getElementById('dashGrid');
  if (!container) return;
  const cards = order.filter(id => !S.dashHidden.includes(id))
    .map(id => container.querySelector('[data-dash-id="'+id+'"]'))
    .filter(Boolean);
  if (!cards.length){ container.style.height = '0px'; return; }

  const gap = 20, minColWidth = 320;
  const width = container.clientWidth;
  if (!width){ return; } // not laid out yet (display:none ancestor, etc.)
  const cols = Math.max(1, Math.min(cards.length, Math.floor((width + gap) / (minColWidth + gap))));
  const colWidth = (width - gap * (cols - 1)) / cols;

  cards.forEach(card => {
    card.style.position = 'absolute';
    card.style.width = colWidth + 'px';
  });
  const colHeights = new Array(cols).fill(0);
  cards.forEach(card => {
    let ci = 0;
    for (let i = 1; i < cols; i++){ if (colHeights[i] < colHeights[ci]) ci = i; }
    card.style.left = (ci * (colWidth + gap)) + 'px';
    card.style.top = colHeights[ci] + 'px';
    colHeights[ci] = colHeights[ci] + card.offsetHeight + gap;
  });
  container.style.height = (Math.max.apply(null, colHeights) - gap) + 'px';
}
function layoutDashMasonry(){ previewDashOrder(S.dashLayout); }

// Same splice the old single-shot drop handler used, pulled out so the
// live dragover preview can run it repeatedly against a running order
// (not always the last-committed S.dashLayout) as the pointer crosses
// different cards mid-gesture.
function reorderedDashLayout(order, dragged, target){
  const next = order.slice();
  const from = next.indexOf(dragged), to = next.indexOf(target);
  if (from === -1 || to === -1 || from === to) return null;
  next.splice(from, 1);
  next.splice(to, 0, dragged);
  return next;
}
// Column count depends on viewport width, so a resize can change it. No
// masonry library here to subscribe to, a short debounce on window resize
// is the whole mechanism.
let dashResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(dashResizeTimer);
  dashResizeTimer = setTimeout(layoutDashMasonry, 120);
});

function startResendClock(){
  clearInterval(timers.resend);
  S.resendLeft = 30;
  timers.resend = setInterval(() => {
    if (S.resendLeft <= 1){ clearInterval(timers.resend); set({ resendLeft: 0 }); return; }
    set({ resendLeft: S.resendLeft - 1 });
  }, 1000);
}

function toCheck(again){
  set({ screen:'check', sending:false, sentAgain: !!again });
  startResendClock();
}

function signInAs(kind){
  clearTimeout(timers.signin);
  set({ screen:'signingin' });
  timers.signin = setTimeout(() => set({ screen: kind === 'new' ? 'landed-info' : 'landed-returning' }), 1400);
}

function submitEmail(){
  const email = S.email.trim();
  const valid = VALID.test(email);
  if (!valid || S.sending){ set({ touched:true }); return; }
  set({ sending:true, screen:'signin' });
  clearTimeout(timers.send);
  timers.send = setTimeout(() => {
    if (S.failNext) set({ sending:false, screen:'signin-failed', failNext:false });

function runUpload(){
  clearInterval(timers.upload);

// Every page-scoped disclosure, dropdown, and edit-mode toggle resets to
// its default closed state here, and again on logout below. Data the user
// actually entered (rates, wages, settings, avatar, dashboard layout...)
// is never in this list, only the transient stuff nobody wants to find
// still open three pages, or one login, later. One shared object so the
// two reset sites can't quietly drift apart.

// initial 0 is the nice first-ever-visit touch, Servi 1 (front) pre-

// Opening a "how this is calculated" accordion grows its own card without
// going through render(), a native <details> toggle, not a data-act click,
// so nothing tells the masonry layout a card underneath it needs to move.
// Capture phase because <details> toggle events do not reliably bubble
// across the browsers this needs to work in.
document.addEventListener('toggle', (e) => {
  if (!e.target || !e.target.classList || !e.target.classList.contains('bl-acc')) return;
  requestAnimationFrame(layoutDashMasonry);
}, true);

document.addEventListener('keydown', (e) => {

/* Dashboard block reordering, iOS-homescreen style: neighbors slide out of
   the way live as the dragged card crosses them, not a silent reorder that
   only shows up on drop. That still can't go through render()/set() mid-
   drag, this build has no virtual DOM, so a re-render would tear down the
   very node the browser is tracking as the drag source. previewDashOrder
   sidesteps that: it repositions the existing nodes' left/top directly, no
   innerHTML touched, so dashover can call it on every card it crosses.
   dashend is the one moment an actual set() commits the final order. */
let dashDragOrder = null; // the running live-preview order, committed on dragend
let dashOverTarget = null; // last id dragged over, so steady hover over one card doesn't re-pack every event
document.addEventListener('dragstart', (e) => {
  const el = e.target.closest && e.target.closest('.dash-block');
  if (!el) return;
  dashDragId = el.dataset.dashId;
  dashDragOrder = S.dashLayout.slice();
  dashOverTarget = null;
  if (e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dashDragId); } catch(err){} }
});
document.addEventListener('dragover', (e) => {
  if (!dashDragId) return;
  const el = e.target.closest && e.target.closest('.dash-block');
  if (!el) return;
  e.preventDefault();
  const targetId = el.dataset.dashId;
  if (targetId === dashOverTarget || targetId === dashDragId) return;
  dashOverTarget = targetId;
  const next = reorderedDashLayout(dashDragOrder, dashDragId, targetId);
  if (!next) return;
  dashDragOrder = next;
  previewDashOrder(dashDragOrder);
});
document.addEventListener('drop', (e) => {
  if (dashDragId && e.target.closest && e.target.closest('.dash-block')) e.preventDefault();
});
document.addEventListener('dragend', () => {
  if (dashDragId && dashDragOrder) set({ dashLayout: dashDragOrder });
  dashDragId = null; dashDragOrder = null; dashOverTarget = null;
});

// Real drag on the sidebar rail, not just the click it already had. The
// grid column's width is written directly on every mousemove, cheap
// enough to do every pixel and, unlike the dashboard reorder above, has
// no drag-source node that a re-render could tear out from under itself,
// so a live preview is safe here. Releasing snaps to whichever of the
// two states (48px icon rail, 256px full width) the drag ended nearer
// to, then one real set() commits it and lets the normal render rebuild
// the correct markup for that state. A drag under 4px never counts as a
// drag at all, so the rail's own click-to-toggle still works untouched.
(function(){
  let dragging = false, moved = false, startX = 0, startW = 256, currentW = 256;
  const MIN = 48, MAX = 256, THRESHOLD = (MIN + MAX) / 2;
  document.addEventListener('mousedown', (e) => {
    const rail = e.target.closest && e.target.closest('.bl-rail');
    if (!rail) return;
    dragging = true; moved = false; startX = e.clientX;
    startW = S.railCollapsed ? MIN : MAX;
    currentW = startW;
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    if (!moved && Math.abs(dx) > 4){ moved = true; document.body.classList.add('bl-dragging'); }
    if (!moved) return;
    currentW = Math.max(MIN, Math.min(MAX, startW + dx));
    const grid = document.querySelector('[data-grid]');
    if (grid) grid.style.gridTemplateColumns = currentW + 'px minmax(0,1fr)';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('bl-dragging');
    if (!moved) return;
    const collapsed = currentW < THRESHOLD;
    if (collapsed !== S.railCollapsed) set({ railCollapsed: collapsed });
    else render();
  });
})();

/* Every screen the sign-in rail used to list, still addressable, just not
   advertised. `?screen=expired` opens the dead-link screen, `?view=rates` opens
   a page of the app. An unknown key is ignored rather than blanking the page,
   because the one thing a demo link must never do is open to nothing.
   `?screen=` also survives a reload, which the old rail did not. */
function bootScreen(){
  let q;
  try { q = new URLSearchParams(location.search); } catch(e){ return; }

  const screen = q.get('screen');
  if (screen && AUTH_SCREENS.some(([k]) => k === screen)){
    S.stage = 'auth';
    S.screen = screen;
    return;
  }

  /* COPY is keyed by view, so it is the list of views by construction and a new
     page cannot be added without becoming addressable. */
  const view = q.get('view');
  if (view && Object.prototype.hasOwnProperty.call(COPY, view)){
    S.stage = 'app';
    S.view = view;
  }
}

bootScreen();
render();
</script>
