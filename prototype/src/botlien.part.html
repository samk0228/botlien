    + (flag ? '<div style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--fg2)">'+(flagIcon === 'hatch' ? '<span style="width:12px;height:12px;flex:none;background:'+HATCH+'"></span>' : flagIcon === 'solid' ? '<span style="width:12px;height:12px;flex:none;background:var(--fg1)"></span>' : ic(flagIcon,13,'color:var(--fg1)'))+flag+'</div>' : '')
  + '</div>';
  const totalStalled = timings ? Math.round(timings.reduce((a,t) => a + t.stalled, 0) * 10) / 10 : 0;
  const t0 = tables && tables[0];
  const brandGap = t0 ? Math.round((t0.brands[t0.brands.length-1].perUnit - t0.brands[0].perUnit) * t0.brands[t0.brands.length-1].units) : 0;
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:20px 22px 4px">'
    + '<div data-hero-invoice="' + invoiceSum + '"></div>'
    + '<div style="font-size:15px;font-weight:600;color:var(--fg1);padding-bottom:12px;border-bottom:1px solid var(--hair)">Beyond the lease this period</div>'
    + '<div style="padding:16px 0">'
      + '<div style="font-size:13px;font-weight:500;color:var(--fg2);margin-bottom:6px">Labour the invoice never shows</div>'
      + '<div id="keepHeadline" style="font-size:32px;font-weight:600;letter-spacing:-0.03em;line-height:1.1;color:var(--fg1);font-variant-numeric:tabular-nums">' + money0(k.total) + '</div>'
      + '<div style="display:flex;height:14px;gap:2px;margin-top:14px;border-radius:2px;overflow:hidden">'
        + seg(pct(invoiceSum), 'var(--ghost2)', 'lease, invoiced', 'heroLease')
        + seg(pct(k.handMoney), 'var(--fg1)', 'driving by hand, measured', 'heroHand')
        + seg(pct(k.clearMoney), HATCH, 'clearing stalls, estimated', 'heroClear')
      + '</div>'
      + '<div style="display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums">'
        + '<span>lease ' + money0(invoiceSum) + '</span>'
        + '<span id="heroLabour">labour ' + money0(k.total) + '</span>'
      + '</div>'
    + '</div>'
    + stat('Clearing stalls', money(k.clearMoney), '', '<span id="heroClearFlag">estimated from '+S.stallMinutes+' min per stall</span>', 'hatch', { value:'heroClearMoney' })
    + stat('Driving by hand', money(k.handMoney), '', 'measured', 'solid')
    + (timings && timings.length ? stat('Lost to stalls', totalStalled.toFixed(1), 'h', 'shown, never billed as labour', 'check') : '')
    + (t0 ? stat('Brand gap', '$'+brandGap.toLocaleString('en-US'), '', 'if it is the machine, not the route', 'help-circle') : '')
  + '</div>';
}

/** The shape on a cost row: the 24-hour strip at 110 by 24, no axis, no
 * labels, no legend. It carries the pattern and nothing else; the full
 * chart with its scale and its bracket lives one click down. */
function miniStrip(t){
  const peak = t.peak || 1;
  const bars = [];
  for (let h = 0; h < 24; h++){
    const v = t.raw[h];
    const inWin = h >= t.win.start && h < t.win.start + 2;
    bars.push('<div style="display:flex;align-items:flex-end;height:18px">'
      + (v > 0 ? '<div style="width:100%;height:' + ((v / peak) * 100).toFixed(1) + '%;background:var(--fg1)"></div>' : '')
    + '</div>');
  }
  const mark = '<div style="grid-column:' + (t.win.start + 1) + ' / span 2;height:2px;background:var(--fg1)"></div>';
  return '<div style="width:110px;flex:none">'
    + '<div style="display:grid;grid-template-columns:repeat(24,1fr);gap:1px">' + bars.join('') + '</div>'
    + '<div style="display:grid;grid-template-columns:repeat(24,1fr);gap:1px;margin-top:2px">' + mark + '</div>'
  + '</div>';
}

/** The shape on an opportunity row: paired bars, cheapest first. Same
 * convention everywhere on the page — longer is more money. */
function miniBars(t){
  const best = t.brands[0], worst = t.brands[t.brands.length - 1];
  const bar = (b, fill) => '<div style="display:flex;align-items:center;gap:5px">'
    + '<div style="width:' + ((b.perUnit / worst.perUnit) * 100).toFixed(1) + '%;height:7px;background:' + fill + '"></div></div>';
  return '<div style="width:110px;flex:none;display:flex;flex-direction:column;gap:4px">'
    + bar(best, 'var(--ghost2)') + bar(worst, 'var(--fg1)')
  + '</div>';
}

/** One row. Rank, a headline that instructs, the magnitude, the shape, a
 * chevron. Plus one subline carrying the single qualifying fact. Nothing
 * else: no method, no arithmetic, no caveat — those are all one click
 * down, which is the entire point of the layer. */
// Today, short. The queue is about this period, so a full date on a row
// would be the only absolute date on the screen.
function triedStamp(){
  return new Date().toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function costsRow(f, n, open){
  return '<div style="border-top:1px solid var(--hair)">'
    + '<div data-act="costsToggle" data-row="' + f.id + '" class="hv-ghost" role="button" tabindex="0" aria-expanded="' + (open ? 'true' : 'false') + '" style="display:flex;align-items:center;gap:18px;padding:16px 14px 16px 15px;cursor:pointer;'
      // The convention tips.mjs already established: money already spent
      // gets a solid rule, money conditional on the operator doing
      // something gets a dashed one. It is what stops the brand row
      // reading as a bill.
      + 'border-left:2px ' + (f.kind === 'cost' ? 'solid' : 'dashed') + ' var(--fg1)">'
      + '<span style="flex:none;width:14px;font-size:11.5px;font-weight:500;color:var(--fg3);font-variant-numeric:tabular-nums">' + n + '</span>'
      + '<span style="flex:1;min-width:0">'
        + '<span style="display:block;font-size:15.5px;font-weight:500;color:var(--fg1);letter-spacing:-0.01em">' + f.head + '</span>'
        + '<span style="display:block;font-size:12.5px;color:var(--fg3);margin-top:3px">' + f.sub
          + (S.costsTried.indexOf(f.id) >= 0 ? ' &middot; <span style="font-weight:500;color:var(--fg2)">tried ' + triedStamp() + '</span>' : '')
        + '</span>'
      + '</span>'
      + '<span' + (f.magId ? ' id="' + f.magId + '"' : '') + ' style="flex:none;font-size:17px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">' + f.mag + '</span>'
      + f.shape
      + '<span style="flex:none;display:flex;color:var(--fg3);transform:rotate(' + (open ? '90' : '0') + 'deg);transition:transform .15s">' + ic('chevron-right', 16) + '</span>'
    + '</div>'
    // Indented to sit under the headline rather than under the rank
    // numeral, so the detail reads as belonging to the row.
    + (open ? '<div style="padding:6px 2px 30px 28px">' + f.detail()
        + '<div style="margin-top:18px"><button type="button" data-act="costsTried" data-row="' + f.id + '" class="hv-ghost" style="min-height:44px;padding:11px 16px;border-radius:4px;border:1px solid var(--hair2);background:transparent;color:var(--fg1);cursor:pointer;font-size:12.5px;font-weight:500">'
          + (S.costsTried.indexOf(f.id) >= 0 ? 'Tried ' + triedStamp() : 'Mark as tried') + '</button></div>'
      + '</div>' : '')
  + '</div>';
}

/** Rows must never describe the same money twice, and this is the part
 * that is easy to get wrong in a way that makes the screen dishonest in a
 * new direction. The 2pm peak is not money separate from the $948, it is
 * where the $948 concentrates; the worst single robot is not separate
 * money either, it is a slice of the same total. Listing all three as rows
 * would triple-count one problem and make the fleet look busier than it
 * is. So the labour cost and its timing collapse into ONE row, with the
 * timing as the instruction for acting on the cost, and the brand gap
 * stands alone because it genuinely is separate money.
 *
 * Ordering is costs before opportunities, then by size. Money already
 * spent is certain; money conditional on an action is not, so $2,533 of
 * conditional upside must not outrank $948 of spent labour just because
 * the number is bigger.
 *
 * The queue is never padded to three. One finding renders one row. */
function costsFindings(k, hasKeeping, timings, tables){
  const costs = [], opps = [];

  if (hasKeeping && k.total > 0){
    const lead = timings.filter(t => t.ratio !== null && t.ratio >= 1.5).sort((a,b) => b.stalled - a.stalled)[0];
    const flat = timings.slice().sort((a,b) => b.stalled - a.stalled)[0];
    const t = lead || flat;
    costs.push({
      id: 'labour', kind: 'cost',
      head: lead ? 'Go watch the ' + hourLabel(lead.win.start) + ' shift' : 'Cut the time robots sit stuck',
      sub: lead
        ? Math.round(lead.stallShare * 100) + '% of it lands between ' + hourLabel(lead.win.start) + ' and ' + hourLabel(lead.win.start + 2)
        : 'spread evenly, no shift to go and watch',
      mag: money0(k.total), magId: 'rowMagLabour',
      size: k.total,
      shape: t ? miniStrip(t) : '<div style="width:110px;flex:none"></div>',
      detail: () => keepingSection(k) + (timings.length ? stuckSection(timings, Math.round(timings.reduce((a,x) => a + x.stalled, 0) * 10) / 10) : '')
    });
  }

  tables.forEach(t => {
    const best = t.brands[0], worst = t.brands[t.brands.length - 1];
    const gap = Math.round((worst.perUnit - best.perUnit) * worst.units);
    if (gap <= 0) return;
    opps.push({
      id: 'brand-' + t.work.replace(/\s+/g, '-').toLowerCase(), kind: 'opportunity',
      head: 'Try ' + esc(worst.brand) + ' on the ' + esc(best.brand) + ' routes',
      sub: 'if the difference is the machine and not the route',
      mag: money0(gap), size: gap,
      shape: miniBars(t),
      detail: () => brandTable(t)
    });
  });

  const bySize = (a,b) => b.size - a.size;
  return costs.sort(bySize).concat(opps.sort(bySize));
}

/** The three method paragraphs used to sit in three places on this screen,
 * each teaching the reader how we think at the moment they were trying to
 * read a number. Each is correct and each is kept — collected here, once,
 * behind a page-level link, alongside the minutes assumption and the note
 * that stalled hours are shown but never billed.
 *
 * The minutes-per-stall control itself does NOT move here. It stays inside
 * the labour detail, next to the figure it changes: an assumption the
 * reader can move is the one piece of method that earns its place beside
 * the number. */
function methodItems(){
  const item = (h, b) => '<div style="padding:18px 2px;border-top:1px solid var(--hair)">'
    + '<div style="font-size:13px;font-weight:600;color:var(--fg1);margin-bottom:5px">' + h + '</div>'
    + '<div style="font-size:13px;line-height:1.7;color:var(--fg2);max-width:88ch">' + b + '</div></div>';
  return ''
      + item('The minutes per stall are assumed, not measured',
          'The stall count is measured. The minutes per stall are not: that is our assumption about how long a person takes to notice, walk over, free the machine and walk back. Halve it and the figure halves. It is editable next to the figure it changes.')
      + item('Stalled robot hours are never billed as labour',
          'The hours the robot spent stalled are shown for context and are deliberately not priced here, because your coverage figure already counts them as work the robot did not really perform. Billing the same hours twice would flatter this screen.')
      + item('Peaks are found inside one kind of work, never across the fleet',
          'A night scrubber scored against the day shift&#39;s picking peak would read as permanently idle, and the screen would confidently send you to fix a robot doing exactly what it should at exactly the right hour. Each kind of work gets its own strip.')
      + item('The share of running time inside the bracket is assumed',
          'The stall hours and the hours actually run are both measured. The share of running time falling inside the worst two hours is not: it is assumed to be that window&#39;s proportional share of the operating day, because a timestamp says when a robot got stuck and not how busy it was that hour.')
      + item('A brand gap is an observation, not an experiment',
          'Two brands in one fleet are rarely given the same routes, shifts or floors, so a gap only becomes a verdict on the machines once they have run the same work. Swapping them for a fortnight settles it, and that is a thing you can do that nobody else can measure for you.');
}

/* The "how we count" link is gone from Costs. The panel lives on Settings,
   under its own heading, where an owner reads it once rather than being
   offered it again beside every figure. The one piece of method that does
   belong next to its number, the minutes-per-stall control, stayed in the
   labour detail. */

function viewCosts(){
  const k = computeKeeping(S.stallMinutes);
  // Absent has to look absent, never like zero. Two stalls in a month is a
  // Tuesday, not a staffing cost, so the section does not render at all
  // rather than drawing a $9.60 finding and a zero-length bar.
  const hasKeeping = k.stalls >= 3;
  const timings = computeStallTiming();
  const tables = computeBrands();
  const stmt = computeStatement(true, scopeFilter()).rows.filter(r => !r.excluded);
  const invoiceSum = Math.round(stmt.reduce((a,r) => a + r.invoice, 0) * 100) / 100;
  const head = '';

  if (!hasKeeping && !timings.length && !tables.length){
    return head
      + '<div style="border:1px solid var(--hair);border-radius:6px;padding:26px 24px">'
        + '<div style="font-size:15.5px;font-weight:600;color:var(--fg1);margin-bottom:10px">Nothing on this page can be computed from what has been imported</div>'
        + '<p style="font-size:14px;line-height:1.7;color:var(--fg2);margin:0 0 16px;max-width:82ch">Each of the three sections needs one field your export is not carrying. Naming them is more use to you than an empty chart frame waiting to be filled.</p>'
        + '<div style="font-size:13.5px;line-height:2;color:var(--fg2)">'
          + 'a stuck or error column &mdash; unlocks what it costs to keep them running<br>'
          + 'a timestamp on those rows &mdash; unlocks when they get stuck<br>'
          + 'a second make, priced &mdash; unlocks brand against brand</div>'
      + '</div>';
  }

  // The three sections as tiles on a strip, one panel below. Only sections
  // the data supports get a tile: absent still looks absent, never like a
  // zero on a tab.
  const totalStalled = Math.round(timings.reduce((a,t) => a + t.stalled, 0) * 10) / 10;
  const t0 = tables[0];
  const brandGap = t0 ? Math.round((t0.brands[t0.brands.length-1].perUnit - t0.brands[0].perUnit) * t0.brands[t0.brands.length-1].units) : 0;
  const tabs = []
    .concat(hasKeeping ? [{ id:'keep',  label:'What it costs to keep them running', value: money0(k.total), unit:'beyond the lease' }] : [])
    .concat(timings.length ? [{ id:'stuck', label:'When they get stuck', value: totalStalled.toFixed(1)+' h', unit:'lost to stalls' }] : [])
    .concat(tables.length ? [{ id:'brand', label:'Brand against brand', value: '$'+brandGap.toLocaleString('en-US'), unit:'gap this period' }] : []);
  const current = tabs.some(t => t.id === S.costsTab) ? S.costsTab : tabs[0].id;
  const panel = current === 'keep' ? keepingSection(k)
    : current === 'stuck' ? stuckSection(timings, totalStalled)
    : brandSection(tables);
  const findings = [];

  // A period with nothing worth chasing is a real and good result, so it
  // has to read as one rather than as a screen that failed to load. The
  // detail stays reachable: nothing here is hidden, it is just not worth
  // leading with.
  const queue = findings.length
    ? '<div style="border:1px solid var(--hair);border-radius:6px;padding:20px 24px 4px;margin-bottom:8px">'
        + '<div style="font-size:18px;font-weight:600;letter-spacing:-0.02em;color:var(--fg1);margin-bottom:14px">What to do</div>'
        + findings.map((f,i) => costsRow(f, i + 1, S.costsOpen === f.id)).join('')
        + '<div style="border-top:1px solid var(--hair)"></div>'
      + '</div>'
    : '<div style="border-top:1px solid var(--hair);padding:20px 0 4px">'
        + '<div style="font-size:15.5px;font-weight:600;color:var(--fg1);margin-bottom:6px">Nothing to chase this period.</div>'
        + '<div style="font-size:13.5px;line-height:1.7;color:var(--fg2);max-width:80ch">Your robots cost ' + money0(k.total) + ' in staff time, which is noise. The detail is still here if you want it.</div>'
        + (hasKeeping || timings.length ? '<div style="margin-top:22px">' + (hasKeeping ? keepingSection(k) : '') + (timings.length ? stuckSection(timings, Math.round(timings.reduce((a,t) => a + t.stalled, 0) * 10) / 10) : '') + '</div>' : '')
      + '</div>';

  const left = '<div style="min-width:0">'
    + metricTabs(tabs, current, 'costsTab')
    + metricPanel(panel)
  + '</div>';
  return head
    + (hasKeeping
        ? '<div data-dash-cols style="display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start">' + left + costsHero(k, invoiceSum, timings, tables) + '</div>'
        : left)
    // The four conventions, stated once. Once a reader has learned them
    // they stop reading and start scanning, which is the whole objective.
    + '<div style="display:flex;flex-wrap:wrap;gap:18px;margin-top:14px;font-size:11px;color:var(--fg3)">'
      + '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:11px;height:11px;flex:none;background:var(--fg1)"></span>measured</span>'
      + '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:11px;height:11px;flex:none;background:' + HATCH + '"></span>estimated</span>'
    + '</div>'
    ;
}

/* ─────────────────────────  PAYBACK  ───────────────────────── */

/** Both new statement pages need the same "there is no contract behind a
 *  typed estimate" state, and it has to read as a missing input, not as a
 *  page that failed. */
function noContractCard(line){
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:26px 24px;margin-bottom:24px">'
    + '<div style="font-size:15.5px;font-weight:600;color:var(--fg1);margin-bottom:8px">Nothing here can be worked out yet</div>'
    + '<p style="font-size:14px;line-height:1.7;color:var(--fg2);margin:0 0 18px;max-width:80ch">'+line+'</p>'
    + '<button type="button" data-act="go" data-view="setup" class="hv-ghost" style="padding:12px 18px;border-radius:3px;border:1px solid var(--hair2);background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--fg1)">Open Numbers</button>'
  + '</div>';
}
function paybackVerdict(r){
  if (r.verdict === 'paid') return { label:'paid back', icon:'check' };
  if (r.missed) return { label:'promise missed', icon:'triangle-alert' };
  if (r.verdict === 'track') return { label:'on track', icon:'sliders-horizontal' };
  return { label:'behind by '+r.behindBy, icon:'triangle-alert' };
}
function paybackSentence(r){
  const c = r.contract;
  if (r.crossed !== null) return 'You were told '+c.payback+' months. It crossed in month '+r.crossed+'.';
  if (r.pace === null) return 'You were told '+c.payback+' months. It is '+r.elapsed+' month'+(r.elapsed===1?'':'s')+' in and has earned back '+Math.round(r.pct*100)+'%. Nothing in the last three months priced any work, so there is no pace to project from.';
  const late = r.pace > c.term ? ', '+countWord(r.pace - c.term).toLowerCase()+' month'+(r.pace - c.term === 1 ? '' : 's')+' after the lease ends' : '';
  return 'You were told this robot would pay for itself in '+c.payback+' months. It is '+r.elapsed+' month'+(r.elapsed===1?'':'s')+' in and has earned back '+Math.round(r.pct*100)+'%. At the pace of the last three months it breaks even in month '+r.pace+late+'.';
}
function paybackBar(r){
  const pct = Math.max(0, Math.min(1, r.pct));
  return '<div style="display:flex;align-items:center;gap:10px;min-width:0">'
    + '<div style="flex:1;min-width:40px;height:8px;border:1px solid var(--hair2);position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:'+(pct*100).toFixed(1)+'%;background:'+(r.verdict === 'paid' ? 'var(--ink)' : 'repeating-linear-gradient(135deg,var(--hatch2) 0 2px,transparent 2px 5px)')+'"></div></div>'
    + '<span style="flex:none;font-size:12.5px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+Math.round(r.pct*100)+'%</span>'
  + '</div>';
}
function paybackRowDetail(r){
  const c = r.contract;
  const points = r.cum.map((v, idx) => ({
    value: v,
    label: (idx === 0 || idx === r.cum.length-1) ? 'month '+(idx+1) : (idx+1 === c.payback ? 'quoted' : ''),
    current: idx === r.cum.length-1
  }));
  const chart = points.length >= 2
    ? sparklineChart(points, { reference: r.price, formatValue: v => money0(v), area:true, gradientId:'pbRow'+r.i, dots:false, forceReference:true })
    : '<div style="font-size:13px;color:var(--fg3);line-height:1.7">One month of history is not a curve. This fills in as the periods close.</div>';
  return '<div style="padding:8px 18px 26px">'
    + '<div data-row-restate style="display:none;gap:14px;flex-wrap:wrap;padding:0 0 16px;font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'
      + '<span>started '+fmtDateShort(c.start)+'</span><span>quoted '+c.payback+' mo</span><span>earned '+Math.round(r.pct*100)+'%</span>'
    + '</div>'
    + '<div data-split style="display:grid;grid-template-columns:minmax(260px,1.1fr) minmax(0,1fr);gap:28px;align-items:start">'
      + '<div style="min-width:0">'+chart
        + '<div style="font-size:11.5px;color:var(--fg3);margin-top:10px;line-height:1.6">running total of work at your rate &middot; dashed line is what the robot cost &middot; 0.55, 0.78, 0.92 ramp assumed on the first three months</div>'
      + '</div>'
      + '<div style="min-width:0">'
        + '<p id="pbSentence-'+r.i+'" style="font-size:14px;line-height:1.7;color:var(--fg2);margin:0 0 20px">'+paybackSentence(r)+'</p>'
        + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;margin-bottom:22px">'
          + statRow('Earned back', money0(r.earned), 'of '+money0(r.price))
          + statRow('Paid in so far', money0(r.paidIn), r.elapsed+' invoice'+(r.elapsed===1?'':'s')+' at '+money(r.invoice))
          + statRow('Lease ends', fmtDateShort(r.endKey), r.monthsLeft+' month'+(r.monthsLeft===1?'':'s')+' left')
        + '</div>'
        + '<div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px">'
          + '<div><label for="pbPromised-'+r.i+'" style="display:block;font-size:11.5px;font-weight:600;color:var(--fg3);margin-bottom:6px">Promised payback</label>'
            + '<span style="display:inline-flex;align-items:baseline;gap:6px">'
            + '<input id="pbPromised-'+r.i+'" type="number" min="1" inputmode="numeric" value="'+c.payback+'" style="width:64px;font-size:15px;color:var(--fg1);background:transparent;padding:6px 2px;border:none;border-bottom:1px dashed var(--hair3);outline:none;font-family:inherit;font-variant-numeric:tabular-nums">'
            + '<span style="font-size:12.5px;color:var(--fg3)">mo</span></span></div>'
          + '<div style="font-size:11.5px;color:var(--fg3);line-height:1.6;padding-bottom:8px">yours to correct &middot; what the quote said</div>'
        + '</div>'
      + '</div>'
    + '</div>'
  + '</div>';
}
function viewPayback(){
  const p = computePayback();
  if (p.mode === 'estimate' || !p.rows.length){
    return noContractCard('A typed estimate has no contract behind it. Import your export and set the start date and quoted payback on Numbers.');
  }
  const pctTotal = p.priceTotal > 0 ? Math.round(p.earnedTotal / p.priceTotal * 100) : 0;
  const tabs = [
    { id:'paid',   label:'Paid back',        value: p.paid+' of '+p.rows.length, unit:'ahead of the quote' },
    { id:'track',  label:'On track',         value: String(p.track), unit:'will beat the quote' },
    { id:'behind', label:'Behind the quote', value: String(p.behind), unit: p.missedCount ? (p.missedCount === 1 ? 'one past its promise' : p.missedCount+' past their promise') : 'still inside the quote' },
    { id:'earned', label:'Earned back',      value: money0(p.earnedTotal), unit:'of '+money0(p.priceTotal)+' · '+pctTotal+'%' }
  ];
  const current = tabs.some(t => t.id === S.paybackTab) ? S.paybackTab : 'behind';
  const rank = { behind:0, track:1, paid:2 };
  const shown = searchRows(p.rows, r => r.name+' '+r.model+' '+r.work);
  const sorted = shown.slice().sort((a, b) => {
    const sel = (r) => r.verdict === current ? 0 : 1;
    if (sel(a) !== sel(b)) return sel(a) - sel(b);
    if (rank[a.verdict] !== rank[b.verdict]) return rank[a.verdict] - rank[b.verdict];
    return a.pct - b.pct;
  });
  const cols = 'minmax(180px,2fr) minmax(110px,1.05fr) minmax(90px,.8fr) minmax(64px,.55fr) minmax(130px,1.2fr) minmax(80px,.7fr) 24px';
  const th = (t, right, help) => '<div style="display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:var(--fg2);'+(right?'justify-content:flex-end;':'')+'">'+t+(help ? '<span title="'+help+'" style="display:inline-flex;color:var(--fg3);cursor:help">'+ic('help-circle',12)+'</span>' : '')+'</div>';
  const head = '<div data-fleet-head style="display:grid;grid-template-columns:'+cols+';gap:14px;align-items:center;padding:12px 18px;background:var(--ghost);border-bottom:1px solid var(--hair)">'
    + th('Robot') + th('Verdict') + th('Started') + th('Quoted', false, 'The payback the quote promised, in months from the contract start. Yours to correct on Numbers.')
    + th('Earned back', false, 'Work this robot has done at your own rate, added up since the contract started, against what the robot cost to buy.')
    + th('At your pace', true, 'The month it breaks even if the last three months repeat. A robot that already crossed shows the month it crossed.') + '<div></div>'
  + '</div>';
  const rows = sorted.map(r => {
    const open = S.openPayback === r.i;
    const v = paybackVerdict(r);
    const tile = '<div style="flex:none;width:34px;height:34px;border-radius:7px;background:var(--ghost);display:flex;align-items:center;justify-content:center;color:var(--fg2)">'+ic('coins',16)+'</div>';
    const caution = r.verdict === 'paid' ? '' : '<span title="'+v.label+'" style="display:inline-flex;color:var(--fg1)">'+ic('triangle-alert',15)+'</span>';
    return '<div style="border-top:1px solid var(--hair)">'
      + '<div data-act="togglePayback" data-i="'+r.i+'" data-fleet-row class="hv-ghost" style="display:grid;grid-template-columns:'+cols+';gap:14px;align-items:center;padding:13px 18px;cursor:pointer;background:'+(open?'var(--ghost)':'transparent')+'">'
        + '<div style="display:flex;align-items:center;gap:12px;min-width:0">'+tile+'<div style="min-width:0"><div style="display:flex;align-items:center;gap:7px;font-size:14px;font-weight:'+(open || r.verdict !== 'paid' ? 600 : 500)+';color:var(--fg1)">'+esc(r.name)+(r.verdict === 'behind' || r.missed ? caution : '')+'</div>'
          + '<div style="font-size:12px;color:var(--fg3);margin-top:2px">'+esc(r.model)+'</div></div></div>'
        + '<div data-row-status id="pbVerdict-'+r.i+'">'+pill(v.label, v.icon)+'</div>'
        + '<div data-row-secondary style="font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap">'+fmtDateShort(r.contract.start)+'</div>'
        + '<div data-row-secondary id="pbQuoted-'+r.i+'" style="font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'+r.contract.payback+' mo</div>'
        + '<div data-row-secondary style="min-width:0">'+paybackBar(r)+'</div>'
        + '<div id="pbPace-'+r.i+'" style="margin-left:auto;text-align:right;font-size:13.5px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums;white-space:nowrap">'+(r.pace === null ? '—' : 'month '+r.pace)+'</div>'
        + '<span style="flex:none;display:flex;color:var(--fg3);transform:rotate('+(open?'90':'0')+'deg);transition:transform .15s">'+ic('chevron-right',16)+'</span>'
      + '</div>'
      + (open ? paybackRowDetail(r) : '')
    + '</div>';
  }).join('');
  const table = '<div style="border:1px solid var(--hair);border-radius:6px;overflow:hidden">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;padding:20px 18px 16px">'
      + '<h2 style="font-size:16px;font-weight:600;letter-spacing:-0.01em;margin:0;color:var(--fg1)">'+shown.length+' robot'+(shown.length===1?'':'s')+'</h2>'
      + '<span style="font-size:13px;color:var(--fg3)">Sorted by how far each one is from what the salesperson quoted. Open one for its curve.</span></div>'
    + head
    + (sorted.length ? rows : '<div style="padding:24px 18px;font-size:13.5px;color:var(--fg3)">No robot matches &ldquo;'+esc(S.search)+'&rdquo;.</div>')
  + '</div>';
  const fleetPoints = p.fleetCum.map((v, idx) => ({ value:v, label:(idx === 0 || idx === p.fleetCum.length-1) ? 'month '+(idx+1) : '', current: idx === p.fleetCum.length-1 }));
  const fleetPanel = '<div data-split style="display:grid;grid-template-columns:minmax(260px,1.2fr) minmax(0,1fr);gap:30px;align-items:start">'
    + '<div style="min-width:0">'
      + (fleetPoints.length >= 2 ? sparklineChart(fleetPoints, { reference:p.priceTotal, formatValue: v => money0(v), area:true, gradientId:'pbFleet', dots:false, forceReference:true }) : '')
      + '<div style="font-size:11.5px;color:var(--fg3);margin-top:10px;line-height:1.6">running total for every robot in view &middot; dashed line is what they cost &middot; months counted from '+fmtDateShort(p.firstStart)+', the first contract</div>'
    + '</div>'
    + '<div style="min-width:0">'
      + '<p style="font-size:14.5px;line-height:1.7;color:var(--fg2);margin:0 0 20px">Across all '+p.rows.length+' robots you have earned back '+money0(p.earnedTotal)+' of the '+money0(p.priceTotal)+' they cost.'
        + (p.fleetPace === null ? '' : ' At the pace of the last three months the fleet as a whole crosses its price in month '+p.fleetPace+' from the first contract.')+'</p>'
      + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:20px">'
        + statRow('Earned back', money0(p.earnedTotal), pctTotal+'% of price')
        + statRow('Still to earn', money0(Math.max(0, p.priceTotal - p.earnedTotal)), 'across '+p.rows.length+' robots')
      + '</div>'
    + '</div>'
  + '</div>';
  return metricTabs(tabs, current, 'paybackTab')
    + metricPanel(current === 'earned' ? fleetPanel : table)
    + '<div style="display:flex;flex-wrap:wrap;gap:18px;margin:14px 0 40px;font-size:11px;color:var(--fg3)">'
      + '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:11px;height:11px;flex:none;background:var(--fg1)"></span>earned, priced at your own rate</span>'
      + '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:11px;height:11px;flex:none;background:'+HATCH+'"></span>still short of the price</span>'
    + '</div>';
}

/* ─────────────────────────  CONTRACT  ───────────────────────── */

const CREDIT_CLAUSE = 'Worked out as one percent of the month&#39;s invoice for every point under the promise, the usual shape of a service credit. If your clause reads differently, change the promised figure on Numbers and read the incident list as the evidence.';

function contractRowDetail(r){
  const head = (t, right) => '<div style="font-size:11.5px;font-weight:600;color:var(--fg3);'+(right?'text-align:right;':'')+'">'+t+'</div>';
  const cols = 'minmax(90px,.9fr) minmax(70px,.7fr) minmax(80px,.8fr) minmax(140px,1.6fr)';
  return '<div style="padding:4px 18px 26px">'
    + '<div data-row-restate style="display:none;gap:14px;flex-wrap:wrap;padding:0 0 14px;font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'
      + '<span>promised '+r.promised+'%</span>'+(r.gap ? '<span>gap '+r.gap.toFixed(2)+' pts</span><span>credit '+money(r.credit)+'</span>' : '')
    + '</div>'
    + '<div style="font-size:12px;color:var(--fg3);margin-bottom:10px">Aug 4 – Sep 3, the open period</div>'
    + '<div style="overflow-x:auto;min-width:0"><div style="min-width:480px">'
      + '<div style="display:grid;grid-template-columns:'+cols+';gap:14px;padding:0 0 10px;border-bottom:1px solid var(--hair)">'
        + head('Date') + head('Started') + head('Down for') + head('What the robot reported')
      + '</div>'
      + r.incidents.map(x => '<div style="display:grid;grid-template-columns:'+cols+';gap:14px;padding:11px 0;border-bottom:1px solid var(--hair);font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums">'
        + '<div style="color:var(--fg1)">'+fmtDateShort(x.date)+'</div>'
        + '<div>'+fmtClock(x.start)+'</div>'
        + '<div>'+fmtDownFor(x.minutes)+'</div>'
        + '<div style="font-variant-numeric:normal">'+esc(x.cause)+'</div>'
      + '</div>').join('')
    + '</div></div>'
    + '<div style="font-size:13px;line-height:1.7;color:var(--fg2);margin-top:14px;max-width:80ch">'
      + countWord(r.incidents.length)+' incident'+(r.incidents.length===1?'':'s')+', '+r.hoursDown.toFixed(1)+' hours.'
      + (r.pattern ? ' '+countWord(r.pattern.count)+' of them are the same spot, '+esc(r.pattern.place)+', between '+twelve(r.pattern.lo)+' and '+twelve(r.pattern.hi)+' '+dayPart(r.pattern.lo)+'.' : '')
    + '</div>'
  + '</div>';
}

function creditLedger(c){
  if (!c.owed.length){
    return '<div style="font-size:14px;line-height:1.7;color:var(--fg2);max-width:80ch">Every robot in view delivered at or above its promise this period, so there is no credit to claim. The incident lists are still on the uptime tab.</div>';
  }
  const cols = 'minmax(160px,2fr) minmax(80px,.8fr) minmax(90px,.9fr) minmax(90px,.9fr)';
  const head = (t, right) => '<div style="font-size:11.5px;font-weight:600;color:var(--fg3);'+(right?'text-align:right;':'')+'">'+t+'</div>';
  const draft = c.owed.map(r => 'To: '+brandOf(r.model)+' · Re: service credit, Aug 4 – Sep 3 2026\n\n'
    + 'Your agreement promises '+r.promised+'% uptime on '+r.name+'. Delivered uptime for the period was '+r.delivered.toFixed(2)+'% across '+r.incidents.length+' logged incident'+(r.incidents.length===1?'':'s')+' totalling '+r.hoursDown.toFixed(1)+' hours (list attached). Under the credit clause that is '+money(r.credit)+' against the '+money(r.invoice)+' invoice for the period.').join('\n\n');
  return '<div>'
    + '<div style="overflow-x:auto;min-width:0"><div style="min-width:460px">'
      + '<div style="display:grid;grid-template-columns:'+cols+';gap:14px;padding:0 0 10px;border-bottom:1px solid var(--hair)">'
        + head('Robot') + head('Gap') + head('Invoice') + head('Credit', true)
      + '</div>'
      + c.owed.map(r => '<div style="display:grid;grid-template-columns:'+cols+';gap:14px;padding:13px 0;border-bottom:1px solid var(--hair);align-items:center;font-variant-numeric:tabular-nums">'
        + '<div style="font-size:13.5px;font-weight:500;color:var(--fg1)">'+esc(r.name)+'</div>'
        + '<div style="font-size:13px;color:var(--fg2)">'+r.gap.toFixed(2)+' pts</div>'
        + '<div style="font-size:13px;color:var(--fg2)">'+money(r.invoice)+'</div>'
        + '<div style="font-size:14px;font-weight:600;color:var(--fg1);text-align:right">'+money(r.credit)+'</div>'
      + '</div>').join('')
      + '<div style="display:grid;grid-template-columns:'+cols+';gap:14px;padding:13px 0;align-items:center;font-variant-numeric:tabular-nums">'
        + '<div style="font-size:13.5px;font-weight:600;color:var(--fg1)">Owed this period</div><div></div><div></div>'
        + '<div style="font-size:16px;font-weight:600;color:var(--fg1);text-align:right">'+money(c.credit)+'</div>'
      + '</div>'
    + '</div></div>'
    + '<p style="font-size:12.5px;line-height:1.7;color:var(--fg3);margin:14px 0 20px;max-width:84ch">'+CREDIT_CLAUSE+'</p>'
    + '<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">'
      + '<button type="button" data-act="draftCredit" class="hv-dim press" style="padding:12px 18px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:pointer;font-size:13.5px;font-weight:600">'+(S.creditDraftOpen ? 'Hide the credit request' : 'Draft the credit request')+'</button>'
      + (S.creditDraftOpen ? '<button type="button" data-act="copyCredit" class="hv-ghost" style="padding:12px 16px;border-radius:3px;border:1px solid var(--hair2);background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--fg1)">'+(S.creditCopied ? 'Copied' : 'Copy')+'</button>' : '')
    + '</div>'
    + (!S.creditDraftOpen ? '' : '<pre id="creditDraft" style="margin:16px 0 0;padding:18px 20px;background:var(--ghost);border:1px solid var(--hair);border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.75;color:var(--fg1);white-space:pre-wrap">'+esc(draft)+'</pre>')
  + '</div>';
}

function viewContract(){
  const c = computeContract();
  const p = computePayback();
  if (c.mode === 'estimate' || !c.rows.length){
    return noContractCard('A typed estimate has no contract and no incident log behind it. Import your export and set the promised uptime on Numbers.');
  }
  const exception = c.exceptions.length
    ? c.exceptions.map(e => e.promised+'% on the '+brandOf(e.model)).filter((v, i, a) => a.indexOf(v) === i).join(', ')
    : 'the same clause on every robot';
  const tabs = [
    { id:'promised',  label:'Promised uptime', value: c.modePromise+'%', unit: exception },
    { id:'delivered', label:'Delivered',       value: c.delivered === null ? '—' : c.delivered.toFixed(2)+'%', unit:'scheduled-hours weighted' },
    { id:'credit',    label:'Credit owed',     value: money(c.credit), unit:'this period · '+money0(c.credit * 12)+' a year at this rate' },
    { id:'incidents', label:'Incidents',       value: String(c.incidents), unit: c.minutesTotal.toLocaleString('en-US')+' minutes down' }
  ];
  const current = tabs.some(t => t.id === S.contractTab) ? S.contractTab : 'delivered';
  const cols = 'minmax(180px,2fr) minmax(100px,.95fr) minmax(80px,.7fr) minmax(80px,.7fr) minmax(110px,1fr) minmax(90px,.8fr) 24px';
  const th = (t, right, help) => '<div style="display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:var(--fg2);'+(right?'justify-content:flex-end;':'')+'">'+t+(help ? '<span title="'+help+'" style="display:inline-flex;color:var(--fg3);cursor:help">'+ic('help-circle',12)+'</span>' : '')+'</div>';
  const head = '<div data-fleet-head style="display:grid;grid-template-columns:'+cols+';gap:14px;align-items:center;padding:12px 18px;background:var(--ghost);border-bottom:1px solid var(--hair)">'
    + th('Robot')
    + th('Credit', false, 'One percent of the month&#39;s invoice for every point under the promise. Blank when the robot met it.')
    + th('Promised') + th('Gap', false, 'Percentage points between the promise and what was delivered, floored at zero.')
    + th('Incidents') + th('Delivered', true, 'Scheduled minutes less logged downtime, for the open period. Scheduled comes from the hours a day you set on Numbers.') + '<div></div>'
  + '</div>';
  const shown = searchRows(c.rows, r => r.name+' '+r.model+' '+r.work);
  const sorted = shown.slice().sort((a, b) => (b.gap - a.gap) || (b.incidents.length - a.incidents.length));
  const rows = sorted.map(r => {
    const open = S.openContract === r.i;
    const short = r.gap > 0;
    const has = r.incidents.length > 0;
    const tile = '<div style="flex:none;width:34px;height:34px;border-radius:7px;background:var(--ghost);display:flex;align-items:center;justify-content:center;color:var(--fg2)">'+ic('file-text',16)+'</div>';
    const caution = !short ? '' : '<span title="Under its promised uptime" style="display:inline-flex;color:var(--fg1)">'+ic('triangle-alert',15)+'</span>';
    return '<div style="border-top:1px solid var(--hair)">'
      + '<div '+(has ? 'data-act="toggleContract" data-i="'+r.i+'" class="hv-ghost"' : '')+' data-fleet-row style="display:grid;grid-template-columns:'+cols+';gap:14px;align-items:center;padding:13px 18px;'+(has?'cursor:pointer;':'')+'background:'+(open?'var(--ghost)':'transparent')+'">'
        + '<div style="display:flex;align-items:center;gap:12px;min-width:0">'+tile+'<div style="min-width:0"><div style="display:flex;align-items:center;gap:7px;font-size:14px;font-weight:'+(open||short?600:500)+';color:var(--fg1)">'+esc(r.name)+caution+'</div>'
          + '<div style="font-size:12px;color:var(--fg3);margin-top:2px">'+esc(r.model)+'</div></div></div>'
        + '<div data-row-status style="font-size:13.5px;font-weight:'+(short?600:400)+';color:'+(short?'var(--fg1)':'var(--fg3)')+';font-variant-numeric:tabular-nums">'+(short ? money(r.credit) : '—')+'</div>'
        + '<div data-row-secondary style="font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'+r.promised+'%</div>'
        + '<div data-row-secondary style="font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'+(short ? r.gap.toFixed(2)+' pts' : '')+'</div>'
        + '<div data-row-secondary style="font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'+(has ? r.incidents.length+' · '+r.hoursDown.toFixed(1)+' h' : 'none')+'</div>'
        + '<div style="margin-left:auto;text-align:right;font-size:15px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+(r.delivered === null ? '—' : r.delivered.toFixed(2)+'%')+'</div>'
        + (has ? '<span style="flex:none;display:flex;color:var(--fg3);transform:rotate('+(open?'90':'0')+'deg);transition:transform .15s">'+ic('chevron-right',16)+'</span>' : '<span></span>')
      + '</div>'
      + (open && has ? contractRowDetail(r) : '')
    + '</div>';
  }).join('');
  const uptimeTable = '<div style="border:1px solid var(--hair);border-radius:6px;overflow:hidden">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;padding:20px 18px 16px">'
      + '<h2 style="font-size:16px;font-weight:600;letter-spacing:-0.01em;margin:0;color:var(--fg1)">'+shown.length+' robot'+(shown.length===1?'':'s')+'</h2>'
      + '<span style="font-size:13px;color:var(--fg3)">Delivered uptime is scheduled minutes less logged downtime, Aug 4 – Sep 3. Open a row for the incidents behind it.</span></div>'
    + head
    + (sorted.length ? rows : '<div style="padding:24px 18px;font-size:13.5px;color:var(--fg3)">No robot matches &ldquo;'+esc(S.search)+'&rdquo;.</div>')
  + '</div>';
  const leaseCols = 'minmax(180px,2fr) minmax(100px,1fr) minmax(70px,.6fr) minmax(100px,1fr) minmax(90px,.9fr)';
  const lh = (t) => '<div style="font-size:11.5px;font-weight:600;color:var(--fg3)">'+t+'</div>';
  const leases = '<div style="border:1px solid var(--hair);border-radius:6px;padding:20px 22px 22px;margin-top:20px">'
    + cardTitle('Lease terms', 'Read from the four inputs on Numbers.', '<span data-act="go" data-view="setup" class="hv-fade" style="margin-left:auto;font-size:12.5px;font-weight:600;color:var(--fg1);cursor:pointer">Edit on Numbers &rarr;</span>')
    + '<div style="overflow-x:auto;min-width:0"><div style="min-width:560px">'
      + '<div style="display:grid;grid-template-columns:'+leaseCols+';gap:14px;padding:0 0 10px;border-bottom:1px solid var(--hair)">'
        + lh('Robot') + lh('Started') + lh('Term') + lh('Ends') + lh('Months left')
      + '</div>'
      + p.rows.map(r => '<div style="display:grid;grid-template-columns:'+leaseCols+';gap:14px;padding:12px 0;border-bottom:1px solid var(--hair);align-items:center;font-variant-numeric:tabular-nums">'
        + '<div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="font-size:13.5px;font-weight:500;color:var(--fg1)">'+esc(r.name)+'</span>'+(r.monthsLeft <= 9 ? pill('ends soon','triangle-alert') : '')+'</div>'
        + '<div style="font-size:13px;color:var(--fg2)">'+fmtDateShort(r.contract.start)+'</div>'
        + '<div style="font-size:13px;color:var(--fg2)">'+r.contract.term+' mo</div>'
        + '<div style="font-size:13px;color:var(--fg2)">'+fmtDateShort(r.endKey)+'</div>'
        + '<div style="font-size:13px;color:var(--fg2)">'+r.monthsLeft+'</div>'
      + '</div>').join('')
    + '</div></div></div>';
  return metricTabs(tabs, current, 'contractTab')
    + metricPanel(current === 'credit' ? creditLedger(c) : uptimeTable)
    + leases
    + '<div style="display:flex;flex-wrap:wrap;gap:18px;margin:14px 0 40px;font-size:11px;color:var(--fg3)">'
      + '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:11px;height:11px;flex:none;background:var(--fg1)"></span>logged by the robot</span>'
      + '<span>scheduled minutes come from the hours a day you set on Numbers</span>'
    + '</div>';
}

/* ─────────────────────────  DECISIONS  ───────────────────────── */

function viewDecisions(){
  const d = computeDecisions();
  if (!d.rows.length) return noContractCard('A typed estimate has no per-robot rows to sort. Import your export and every robot lands in one of the three piles.');
  const col = (c) => {
    const sum = c.items.reduce((a, r) => a + r.invoice, 0);
    return '<div style="background:var(--ghost);border-radius:6px;padding:12px">'
      + '<div style="padding:4px 6px 12px">'
        + '<div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--fg1)">'+c.label+'<span style="font-size:15px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+c.items.length+'</span></div>'
        + '<div style="font-size:11.5px;color:var(--fg3);margin-top:3px;font-variant-numeric:tabular-nums">'+money0(sum)+' / mo</div>'
      + '</div>'
      + '<div style="display:flex;flex-direction:column;gap:8px;min-height:44px">'
        + (c.items.length
          ? c.items.map(r => '<div data-act="toggleRobot" data-i="'+r.i+'" class="hv-dim9" style="background:var(--card);border:1px solid var(--hair);border-radius:6px;box-shadow:var(--card-shadow);padding:14px 16px;cursor:pointer">'
            + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:2px"><span style="font-size:13.5px;font-weight:600;color:var(--fg1)">'+esc(r.name)+'</span>'+pill(c.label === 'Keep' ? 'keep' : c.label === 'Move' ? 'move' : 'return', c.label === 'Keep' ? 'check' : c.label === 'Move' ? 'route' : 'triangle-alert')+'</div>'
            + '<div style="font-size:11.5px;color:var(--fg3);margin-bottom:10px">'+esc(r.model)+' &middot; '+esc(r.siteName)+'</div>'
            + '<div style="font-size:12.5px;line-height:1.7;color:var(--fg2)">'+r.reason+'</div>'
            + '<div style="font-size:11.5px;color:var(--fg3);margin-top:10px;font-variant-numeric:tabular-nums">lease ends '+fmtDateShort(r.endKey)+'</div>'
          + '</div>').join('')
          : '<div style="padding:10px 6px;font-size:12.5px;color:var(--fg3)">Nothing to '+(c.key === 'move' ? 'move' : c.key === 'return' ? 'return' : 'keep')+'</div>')
      + '</div>'
    + '</div>';
  };
  // Three tracks, pinned. auto-fit fitted only two at a normal preview
  // width, which pushed the third pile onto its own row nearly 2,000px
  // below the other two and left the canvas beside Keep empty. Three piles
  // that cannot be seen together are not a board. Below 900px they stack
  // (see the media rule above).
  return '<div data-decision-board style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start">'+d.piles.map(col).join('')+'</div>'
    + '<p style="font-size:13px;line-height:1.7;color:var(--fg2);margin:16px 0 40px;max-width:92ch">Rules: under its lease with the same work running over 2x elsewhere is a move. A lease ending inside nine months on a thin or slipping margin is a return. Everything else is a keep.</p>';
}

/* ─────────────────────────  BENCHMARK  ───────────────────────── */

function viewBenchmark(){
  const rows = computeStatement(true, scopeFilter()).rows.filter(r => !r.excluded);
  if (!rows.length) return noContractCard('A typed estimate has no per-unit cost to compare. Import your export and your own figure fills in here.');
  const groups = {};
  rows.forEach(r => {
    const brand = brandOf((ROBOTS[r.i] || {}).model);
    const key = r.work+'|'+brand;
    const g = groups[key] || (groups[key] = { work:r.work, brand, units:0, invoice:0, count:0 });
    g.units += r.units; g.invoice += r.invoice; g.count++;
  });
  const cards = Object.values(groups).filter(g => g.units > 0).sort((a, b) => b.count - a.count).map(g => {
    const b = workDef(g.work);
    const perUnit = g.invoice / g.units;
    const bar = (label, width, hatched, value, tag) => '<div style="margin-bottom:14px">'
      + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px">'
        + '<span style="font-size:12.5px;color:var(--fg2)">'+label+'</span>'
        + '<span style="display:inline-flex;align-items:center;gap:8px"><span style="font-size:13.5px;font-weight:600;color:'+(hatched?'var(--fg3)':'var(--fg1)')+';font-variant-numeric:tabular-nums">'+value+'</span>'+(tag||'')+'</span>'
      + '</div>'
      + '<div style="height:10px;border:1px solid var(--hair2);position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:'+width+';background:'+(hatched?HATCH:'var(--ink)')+'"></div></div>'
    + '</div>';
    return '<div style="border:1px solid var(--hair);border-radius:6px;padding:20px 22px 12px">'
      + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">'
        + '<h2 style="font-size:15.5px;font-weight:600;margin:0;color:var(--fg1)">'+esc(g.work)+' on '+esc(g.brand)+'</h2>'
        + '<span style="margin-left:auto;display:flex;color:var(--fg3)">'+ic('lock',15)+'</span>'
      + '</div>'
      + bar('Your figure, measured', '62%', false, money(perUnit)+' per '+esc(b.unit), pill(g.count+' robot'+(g.count===1?'':'s')))
      + bar('Middle of fleets we watch', '62%', true, '&bull;&bull;&bull;&bull;', pill('locked','lock'))
      + bar('Top third', '62%', true, '&bull;&bull;&bull;&bull;', pill('locked','lock'))
    + '</div>';
  }).join('');
  const opted = S.benchOptIn ? 4 : 3;
  return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start">'+cards+'</div>'
    + '<div style="border:1px solid var(--hair);border-radius:6px;padding:20px 22px;margin-top:18px">'
      + '<div style="font-size:14px;line-height:1.7;color:var(--fg2);margin-bottom:16px;max-width:80ch">Unlocks at 10 opted-in fleets running the same brand on the same work. '+opted+' have opted in so far'+(S.benchOptIn ? ', counting you' : '')+'.</div>'
      + '<div data-act="toggleBenchOptIn" role="switch" aria-checked="'+(S.benchOptIn?'true':'false')+'" class="hv-ghost" style="display:inline-flex;align-items:center;gap:12px;padding:8px 10px;margin:-8px -10px;border-radius:6px;cursor:pointer">'
        + '<span style="flex:none;width:38px;height:22px;border-radius:999px;background:'+(S.benchOptIn?'var(--ink)':'rgba(22,32,74,.16)')+';position:relative;transition:background .15s"><span style="position:absolute;top:3px;left:'+(S.benchOptIn?'19px':'3px')+';width:16px;height:16px;border-radius:50%;background:var(--card);transition:left .15s"></span></span>'
        + '<span style="font-size:13.5px;font-weight:500;color:var(--fg1)">Share our anonymised figures and see everyone else&#39;s</span>'
      + '</div>'
    + '</div>'
    + '<div style="font-size:11.5px;line-height:1.7;color:var(--fg3);margin:14px 0 40px;max-width:88ch">Figures are pooled by brand and kind of work only. No fleet, site or company is identifiable, including yours.</div>';
}

/** A dense line: one point per day on record, not one per period. Small
 *  differences only read at this resolution, and the six-period line is
 *  the same arithmetic summarised, so the two cannot disagree. Axis
 *  labels are HTML over the plot rather than SVG text: the SVG stretches
 *  non-uniformly to fill the card, which would warp any text inside it. */
function denseChart(points, opts){
  opts = opts || {};
  const W = 900, H = 170, padL = 40, padR = 10, padY = 18;
  const vals = points.map(p => p.value);
  const dataLo = Math.min.apply(null, vals), dataHi = Math.max.apply(null, vals);
  let lo = dataLo, hi = dataHi;
  if (opts.reference != null){ lo = Math.min(lo, opts.reference); hi = Math.max(hi, opts.reference); }
  const span = (hi - lo) || 1;
  lo -= span * 0.12; hi += span * 0.12;
  const plotH = H - padY * 2;
  const x = (i) => padL + (i / Math.max(1, points.length - 1)) * (W - padL - padR);
  const y = (v) => padY + plotH - ((v - lo) / (hi - lo)) * plotH;
  const line = points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(p.value).toFixed(1)).join(' ');
  const ticks = [dataHi, (dataHi + dataLo) / 2, dataLo];
  const grid = ticks.map(v => '<line x1="'+padL+'" y1="'+y(v).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y(v).toFixed(1)+'" stroke="var(--hair)" stroke-width="1"/>').join('');
  const ref = opts.reference == null ? '' :
    '<line x1="'+padL+'" y1="'+y(opts.reference).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y(opts.reference).toFixed(1)+'" stroke="var(--hair3)" stroke-width="1" stroke-dasharray="4,4"/>';
  const edge = (i) => '<line x1="'+x(i).toFixed(1)+'" y1="'+padY+'" x2="'+x(i).toFixed(1)+'" y2="'+(padY+plotH)+'" stroke="var(--hair3)" stroke-width="1" stroke-dasharray="3,4"/>'
    + '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(points[i].value).toFixed(1)+'" r="3" fill="var(--ink)"/>';
  const svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:'+H+'px;display:block;overflow:visible">'
    + grid + ref
    + '<defs><linearGradient id="'+opts.gradientId+'" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="5%" stop-color="var(--ink)" stop-opacity="0.22"/>'
      + '<stop offset="95%" stop-color="var(--ink)" stop-opacity="0.02"/>'
    + '</linearGradient></defs>'
    + '<path d="'+line+' L'+x(points.length-1).toFixed(1)+','+(padY+plotH)+' L'+x(0).toFixed(1)+','+(padY+plotH)+' Z" fill="url(#'+opts.gradientId+')" stroke="none"/>'
    + '<path d="'+line+'" fill="none" stroke="var(--ink)" stroke-width="1.25" stroke-linejoin="round"/>'
    + edge(0) + edge(points.length-1)
  + '</svg>';
  const axis = ticks.map(v => '<div style="position:absolute;left:0;top:'+((y(v) / H) * 100).toFixed(2)+'%;transform:translateY(-50%);font-size:10.5px;font-weight:600;color:var(--fg3);font-variant-numeric:tabular-nums;background:var(--card);padding-right:6px">'+esc(opts.formatValue(v))+'</div>').join('');
  return '<div style="position:relative">'+svg+axis+'</div>'
    + '<div style="display:flex;justify-content:space-between;gap:12px;margin-top:8px;padding-left:'+((padL / W) * 100).toFixed(2)+'%">'
      + '<span style="font-size:11px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+esc(opts.startLabel || '')+'</span>'
      + '<span style="font-size:11px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+esc(opts.endLabel || '')+'</span>'
    + '</div>';
}

/** One row of the breakdown under a dense chart: what this slice is, what
 *  share of the whole it is, its own figure, and a bar with a dashed mark
 *  at the figure it usually runs at. The dashed mark is the same "this is
 *  a reference, not a measurement" convention the charts use. */
function rangeBar(o){
  const frac = Math.max(0, Math.min(100, o.frac * 100));
  return '<div style="margin-bottom:18px">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:8px">'
      + '<span style="font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg1)">'+esc(o.label)+'</span>'
      + (o.share ? '<span style="font-size:11.5px;font-weight:600;color:var(--fg3);font-variant-numeric:tabular-nums">'+o.share+'</span>' : '')
      + '<span style="margin-left:auto;font-size:15px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+o.value+'</span>'
    + '</div>'
    + '<div style="position:relative;height:10px;background:var(--ghost2);border-radius:2px">'
      + '<div style="position:absolute;left:0;top:0;bottom:0;width:'+frac.toFixed(1)+'%;background:var(--ink);border-radius:2px"></div>'
      + (o.avgFrac == null ? '' : '<span title="'+esc(o.avgTitle || 'Usual figure')+'" style="position:absolute;left:'+(Math.max(0, Math.min(100, o.avgFrac * 100))).toFixed(1)+'%;top:-4px;bottom:-4px;border-left:1px dashed var(--fg1)"></span>')
    + '</div>'
    + (o.note ? '<div style="font-size:11px;color:var(--fg3);margin-top:7px;line-height:1.5">'+o.note+'</div>' : '')
  + '</div>';
}

/* ─────────────────────────  TRENDS  ─────────────────────────

   Every chart here is a view of a calculation that already exists
   (computeStatement, computeBrands, computeContract, computePayback,
   KEEPING/DOWNTIME). None of them is a second copy of the arithmetic, and
   none of them introduces a colour: a slice or a bar is ink at a density,
   hatched only where the figure rests on an assumption. */

// Category fills, densest first. Ink at four densities, so a printed page
// in black and white keeps the same reading order as the screen.
const SLICE_FILLS = ['var(--ink)', 'rgba(22,32,74,.55)', 'rgba(22,32,74,.32)', 'rgba(22,32,74,.16)'];

/** Vertical bars with the period in view lifted out of the row, the
 *  reference's shape: the current column sits on a tinted band with its
 *  figure above it, the rest are quiet. average draws the dashed mark. */
function barChart(bars, opts){
  opts = opts || {};
  const max = Math.max.apply(null, bars.map(b => b.value).concat([0.0001])) * 1.1;
  const H = opts.height || 150;
  const col = (b) => {
    const pct = Math.max(0, b.value / max * 100);
    return '<div style="position:relative;flex:1 1 0;min-width:0;height:100%">'
      + (b.current ? '<div style="position:absolute;inset:-6px -2px -6px -2px;background:var(--ghost);border-radius:4px"></div>' : '')
      + (b.value > 0 ? '<div title="'+esc(b.label+' · '+b.display)+'" style="position:absolute;left:12%;right:12%;bottom:0;height:'+pct.toFixed(1)+'%;min-height:2px;background:'+(b.hatched ? HATCH : (b.current ? 'var(--ink)' : 'rgba(22,32,74,.32)'))+';border-radius:2px 2px 0 0"></div>' : '')
      + ((b.current || opts.labelAll) && b.display ? '<div style="position:absolute;left:0;right:0;bottom:calc('+pct.toFixed(1)+'% + 6px);text-align:center;font-size:11.5px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums;white-space:nowrap">'+esc(b.display)+'</div>' : '')
    + '</div>';
  };
  // The bars and the average mark share one plot box: the label headroom is
  // inside each column, not padding on the row, or the mark's percentage
  // would resolve against a taller box than the bars do and land above
  // periods it is supposed to sit below.
  return '<div style="position:relative;height:'+H+'px;display:flex;align-items:flex-end;gap:'+(opts.gap || 6)+'px;box-sizing:border-box">'
      + '<div style="position:absolute;left:0;right:0;top:20px;bottom:0">'
        + (opts.average == null ? '' : '<span title="Average '+esc(opts.averageLabel || '')+'" style="position:absolute;left:0;right:0;bottom:'+(opts.average / max * 100).toFixed(1)+'%;border-top:1px dashed var(--fg1)"></span>')
      + '</div>'
      + '<div style="position:relative;flex:1 1 auto;display:flex;align-items:flex-end;gap:'+(opts.gap || 6)+'px;height:calc(100% - 20px);min-width:0">'
        + bars.map(col).join('')
      + '</div>'
    + '</div>'
    + '<div style="display:flex;gap:'+(opts.gap || 6)+'px;margin-top:8px">'
      + bars.map(b => '<div style="flex:1 1 0;min-width:0;text-align:center;font-size:10.5px;font-weight:'+(b.current?600:400)+';color:'+(b.current?'var(--fg1)':'var(--fg3)')+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(b.axis || b.label)+'</div>').join('')
    + '</div>';
}

/** Horizontal bars for a ranked list: label, track, figure. Hatched where
 *  the row is under its lease, the same meaning the Fleet duty bar has. */
function hBars(rows, opts){
  opts = opts || {};
  const max = Math.max.apply(null, rows.map(r => r.value).concat([0.0001]));
  return '<div style="display:flex;flex-direction:column;gap:'+(opts.gap || 10)+'px">'
    + rows.map(r => '<div style="display:grid;grid-template-columns:minmax(0,'+(opts.labelWidth || '150px')+') minmax(0,1fr) auto;gap:12px;align-items:center">'
      + '<div style="font-size:12.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.label)+'</div>'
      + '<div style="height:8px;background:var(--ghost2);border-radius:2px;position:relative">'
        + '<div style="position:absolute;left:0;top:0;bottom:0;width:'+(r.value / max * 100).toFixed(1)+'%;background:'+(r.hatched ? HATCH : 'var(--ink)')+';border-radius:2px"></div>'
        + (r.mark == null ? '' : '<span title="'+esc(r.markTitle || '')+'" style="position:absolute;left:'+(r.mark / max * 100).toFixed(1)+'%;top:-3px;bottom:-3px;border-left:1px dashed var(--fg1)"></span>')
      + '</div>'
      + '<div style="font-size:12.5px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums;white-space:nowrap">'+esc(r.display)+'</div>'
    + '</div>').join('')
  + '</div>';
}

/** A donut and its legend. Slices are ink at four densities; every legend
 *  row carries the share and the figure, so no slice is a bare wedge. */
function donut(slices, opts){
  opts = opts || {};
  const total = slices.reduce((a, s) => a + s.value, 0);
  const R = 54, SW = 16, C = 2 * Math.PI * R;
  let at = 0;
  const arcs = slices.map((s, i) => {
    const frac = total > 0 ? s.value / total : 0;
    const dash = (frac * C).toFixed(2);
    const arc = '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+(s.hatched ? 'var(--fg3)' : SLICE_FILLS[i % SLICE_FILLS.length])+'" stroke-width="'+SW+'" stroke-dasharray="'+dash+' '+(C - frac * C).toFixed(2)+'" stroke-dashoffset="'+(-at * C).toFixed(2)+'" transform="rotate(-90 70 70)"><title>'+esc(s.label+' · '+s.display)+'</title></circle>';
    at += frac;
    return arc;
  }).join('');
  return '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:22px">'
    + '<div style="position:relative;flex:none;width:140px;height:140px">'
      + '<svg viewBox="0 0 140 140" style="width:140px;height:140px;display:block"><circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--ghost2)" stroke-width="'+SW+'"/>'+arcs+'</svg>'
      + '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">'
        + '<span style="font-size:19px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums;line-height:1.1">'+esc(opts.center || '')+'</span>'
        + (opts.centerNote ? '<span style="font-size:10.5px;color:var(--fg3);margin-top:3px;max-width:86px;line-height:1.35">'+esc(opts.centerNote)+'</span>' : '')
      + '</div>'
    + '</div>'
    + '<div style="flex:1 1 170px;min-width:0;display:flex;flex-direction:column;gap:10px">'
      + slices.map((s, i) => '<div style="display:flex;align-items:baseline;gap:9px;min-width:0">'
        + '<span style="flex:none;width:12px;height:12px;border-radius:2px;background:'+(s.hatched ? HATCH : SLICE_FILLS[i % SLICE_FILLS.length])+'"></span>'
        + '<span style="font-size:12.5px;line-height:1.35;color:var(--fg2);min-width:0">'+esc(s.label)+'</span>'
        + '<span style="margin-left:auto;display:inline-flex;align-items:baseline;gap:8px;white-space:nowrap">'
          + '<span style="font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums">'+(total > 0 ? Math.round(s.value / total * 100) : 0)+'%</span>'
          + '<span style="font-size:12.5px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+esc(s.display)+'</span>'
        + '</span>'
      + '</div>').join('')
    + '</div>'
  + '</div>';
}

/** One Trends card: what the chart is, its headline figure, the chart, and
 *  one sentence of reading underneath. The sentence is computed, never
 *  typed, so it cannot describe a figure the chart is no longer showing. */
function trendCard(o){
  return '<div style="'+(o.wide ? 'grid-column:1/-1;' : '')+'border:1px solid var(--hair);border-radius:6px;padding:20px 22px 20px;min-width:0">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:16px">'
      + '<span style="font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg3)">'+esc(o.label)+'</span>'
      + (o.help ? '<span title="'+esc(o.help)+'" style="display:inline-flex;color:var(--fg3);cursor:help;margin-left:-6px">'+ic('help-circle',12)+'</span>' : '')
      + '<span style="margin-left:auto;display:inline-flex;align-items:baseline;gap:7px">'
        + '<span style="font-size:20px;font-weight:600;letter-spacing:-0.02em;color:var(--fg1);font-variant-numeric:tabular-nums">'+o.value+'</span>'
        + (o.unit ? '<span style="font-size:12px;color:var(--fg3)">'+esc(o.unit)+'</span>' : '')
      + '</span>'
    + '</div>'
    + o.chart
    + (o.reading ? '<div style="font-size:12.5px;line-height:1.7;color:var(--fg2);margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)">'+o.reading+'</div>' : '')
  + '</div>';
}

function viewTrends(){
  const scope = scopeFilter();
  const stmt = computeStatement(true, scope);
  const rows = stmt.rows.filter(r => !r.excluded);
  if (!rows.length) return noContractCard('A typed estimate has no per-robot history to chart. Import your export and every figure below fills in.');
  const cards = [];

  // 1. Coverage, period by period.
  const ordered = PERIODS.slice().reverse();
  const covs = ordered.map(p => covForPeriod(p, S.dashScope));
  const covAvg = covs.reduce((a, b) => a + b, 0) / covs.length;
  const last = covs[covs.length-1];
  cards.push(trendCard({
    label:'Coverage by period', value:last.toFixed(2)+'x', unit:'this period',
    help:'Work valued at your own rate, against the lease charged for the same days.',
    chart: barChart(ordered.map((p, i) => ({ label:p.label, axis:p.label.split(' ')[0], value:covs[i], display:covs[i].toFixed(2)+'x', current: p.status === 'open' })), { average:covAvg, averageLabel:covAvg.toFixed(2)+'x' }),
    reading: last >= covAvg
      ? 'This period is running '+(last - covAvg).toFixed(2)+'x above the six-period average of '+covAvg.toFixed(2)+'x, the dashed mark. It is still open, so it moves with every input you change.'
      : 'This period is '+(covAvg - last).toFixed(2)+'x below the six-period average of '+covAvg.toFixed(2)+'x, the dashed mark. It is still open, so it can still recover.'
  }));

  // 2. Payback, where the fleet stands against the quote.
  const pay = computePayback();
  if (pay.rows.length){
    cards.push(trendCard({
      label:'Against the quote', value: pay.paid+' of '+pay.rows.length, unit:'paid back',
      help:'Each robot\u2019s earned-back total against the purchase price, read at the payback month the quote promised.',
      chart: donut([
        { label:'Paid back', value: pay.paid, display: String(pay.paid) },
        { label:'On track', value: pay.track, display: String(pay.track) },
        { label:'Behind the quote', value: pay.behind, display: String(pay.behind) }
      ], { center: Math.round(pay.earnedTotal / pay.priceTotal * 100)+'%', centerNote:'of price earned back' }),
      reading: money0(pay.earnedTotal)+' of the '+money0(pay.priceTotal)+' these robots cost has been earned back'
        + (pay.fleetPace === null ? '.' : ', and at the pace of the last three months the fleet crosses its price in month '+pay.fleetPace+' from the first contract.')
        + (pay.missedCount ? ' '+countWord(pay.missedCount)+' has already passed its promised month.' : '')
    }));
  }

  // 3. Where the money comes from.
  const byWork = stmt.byCategory.slice();
  if (byWork.length){
    cards.push(trendCard({
      label:'Where the work is', value: money0(stmt.totalValue), unit:'this period',
      help:'What a person would have been paid for the work each kind of robot did.',
      chart: donut(byWork.map(k => ({ label:k.work, value:k.value, display: money0(k.value) })), { center: byWork.length+'', centerNote: byWork.length === 1 ? 'kind of work' : 'kinds of work' }),
      reading: byWork[0].work+' is '+Math.round(byWork[0].value / stmt.totalValue * 100)+'% of the money your robots earned, across '+byWork[0].count+' robot'+(byWork[0].count===1?'':'s')+'.'
        + (byWork.length > 1 ? ' '+byWork[byWork.length-1].work+' is the smallest at '+Math.round(byWork[byWork.length-1].value / stmt.totalValue * 100)+'%.' : '')
    }));
  }

  // 4. Cost per unit, make against make. Only when two makes do the same
  // work at this scope, same rule computeBrands already applies.
  const tables = computeBrands();
  if (tables.length){
    const t = tables[0];
    const cheap = t.brands[0], dear = t.brands[t.brands.length-1];
    cards.push(trendCard({
      label:'Cost per '+t.unit+', make against make', value: money(cheap.perUnit), unit:'best, '+cheap.brand,
      help:'Invoice divided by units of work, for every make doing the same job at this scope.',
      chart: hBars(t.brands.map(b => ({ label:b.brand+' · '+b.count+' robot'+(b.count===1?'':'s'), value:b.perUnit, display: money(b.perUnit)+' / '+t.unit })), { labelWidth:'170px' }),
      reading: dear.brand+' costs '+money(dear.perUnit - cheap.perUnit)+' more per '+t.unit+' than '+cheap.brand+'. At '+dear.brand+'\u2019s volume this period that difference is '+money0((dear.perUnit - cheap.perUnit) * dear.units)+'.'
    }));
  }

  // 5. Duty, robot by robot.
  const duty = rows.map(r => {
    const rb = ROBOTS[r.i] || {};
    return { label: r.name, value: parseFloat(rb.dutyPct) || 0, display: (parseFloat(rb.dutyPct) || 0)+'%', hatched: r.cov !== null && r.cov < 1 };
  }).sort((a, b) => b.value - a.value);
  const dutyAvg = duty.reduce((a, r) => a + r.value, 0) / duty.length;
  cards.push(trendCard({
    wide:true, label:'Time it actually ran, robot by robot', value: Math.round(dutyAvg)+'%', unit:'fleet average',
    help:'Duty time against the hours a day you scheduled each robot for, on Numbers.',
    chart: hBars(duty.map(r => Object.assign({}, r, { mark: dutyAvg, markTitle:'Fleet average '+Math.round(dutyAvg)+'%' })), { labelWidth:'170px', gap:9 }),
    reading: duty[0].label+' runs the most at '+duty[0].display+' and '+duty[duty.length-1].label+' the least at '+duty[duty.length-1].display+'. Hatched bars are robots under their lease; the dashed mark is the fleet average.'
  }));

  // 6. Downtime by cause, from the incident log.
  const con = computeContract();
  const causeOf = (c) => c.indexOf('stuck') === 0 ? 'Stuck' : c.indexOf('error') === 0 ? 'Error E-217' : c.indexOf('offline') === 0 ? 'Offline' : 'Low battery';
  const causes = {};
  const places = {};
  const hours = new Array(24).fill(0);
  con.rows.forEach(r => r.incidents.forEach(x => {
    const k = causeOf(x.cause);
    causes[k] = (causes[k] || 0) + x.minutes;
    if (x.cause.indexOf('stuck · ') === 0){ const p = x.cause.slice(8); places[p] = (places[p] || 0) + x.minutes; }
    hours[Number(String(x.start).split(':')[0])] += x.minutes;
  }));
  const causeList = Object.keys(causes).sort((a, b) => causes[b] - causes[a]);
  if (causeList.length){
    const topPlace = Object.keys(places).sort((a, b) => places[b] - places[a])[0];
    cards.push(trendCard({
      label:'Downtime by cause', value: con.minutesTotal.toLocaleString('en-US'), unit:'minutes, '+con.incidents+' incidents',
      help:'Every incident the robots logged this period, grouped by what they reported.',
      chart: donut(causeList.map(k => ({ label:k, value:causes[k], display: (causes[k]/60).toFixed(1)+' h' })), { center: (con.minutesTotal/60).toFixed(0)+' h', centerNote:'lost this period' }),
      reading: causeList[0]+' accounts for '+Math.round(causes[causeList[0]] / con.minutesTotal * 100)+'% of the minutes lost'
        + (topPlace ? ', and '+esc(topPlace)+' alone is '+Math.round(places[topPlace] / con.minutesTotal * 100)+'% of the total' : '')+'.'
    }));

    // 7. When it happens. 24 bars is the densest honest resolution the
    // incident log supports, and the shape is the finding.
    const peak = hours.indexOf(Math.max.apply(null, hours));
    cards.push(trendCard({
      wide:true, label:'When the downtime happens', value: twelve(peak)+(peak < 12 ? 'am' : 'pm'), unit:'worst hour',
      help:'Minutes of downtime by the hour the incident started, across every robot at this scope.',
      chart: barChart(hours.map((m, h) => ({ label: twelve(h)+(h < 12 ? 'am' : 'pm'), axis: h % 3 === 0 ? twelve(h)+(h < 12 ? 'a' : 'p') : '', value:m, display: m ? m+' m' : '', current: h === peak })), { height:130, gap:3 }),
      reading: 'The worst hour is '+twelve(peak)+(peak < 12 ? ' in the morning' : peak < 17 ? ' in the afternoon' : ' in the evening')+', with '+hours[peak]+' minutes lost across the period. Hours with no bar had no logged incident at all.'
    }));
  }

  return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;align-items:start;margin-bottom:16px">'+cards.join('')+'</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:18px;margin-bottom:40px;font-size:11px;color:var(--fg3)">'
      + '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:11px;height:11px;flex:none;background:var(--fg1)"></span>measured</span>'
      + '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:11px;height:11px;flex:none;background:'+HATCH+'"></span>under its lease, or resting on an assumption</span>'
      + '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:14px;height:10px;flex:none;border-left:1px dashed var(--fg1);border-right:1px dashed var(--fg1)"></span>average</span>'
    + '</div>';
}

/* ─────────────────────────  COVERAGE OVER TIME  ───────────────────────── */

/** The card on Dashboard opened up. Same six periods, same covForPeriod /
 *  utilForPeriod the card and the Utilization tile already read, given the
 *  room to be read per site and per robot instead of as one line. Nothing
 *  here is a second calculation. */
function viewCoverage(){
  const stmt = computeStatement(true, scopeFilter());
  const rows = stmt.rows.filter(r => !r.excluded);
  if (!rows.length || computeStatement().mode === 'estimate'){
    return noContractCard('A typed estimate has no period history behind it. Import your export and six months of real periods fill in here.');
  }
  const ordered = PERIODS.slice().reverse();
  const points = ordered.map(p => ({ value: covForPeriod(p, S.dashScope), label: p.label.slice(0,3), current: p.status === 'open' }));
  const vals = points.map(p => p.value);
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const first = vals[0], last = vals[vals.length-1];
  const change = first ? ((last - first) / first) * 100 : 0;
  const bestIdx = vals.indexOf(Math.max.apply(null, vals));
  const worstIdx = vals.indexOf(Math.min.apply(null, vals));
  const scopeName = S.dashScope === 'all' ? 'Pier 4, Marina and Airport combined' : SITES[S.dashScope].name;

  const subhead = '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:-24px -24px 24px;padding:10px 24px;min-height:56px;background:var(--card);border-bottom:1px solid var(--hair)">'
    + '<div data-act="go" data-view="dashv2" class="hv-ghost" title="Back to Dashboard" style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:6px;cursor:pointer;color:var(--fg1)">'+ic('chevron-right',18,'transform:rotate(180deg)')+'</div>'
    + '<span style="font-size:15px;font-weight:500;color:var(--fg1)">Coverage over time</span>'
    + '<span style="width:1px;height:22px;background:var(--hair)"></span>'
    + '<span style="font-size:12.5px;color:var(--fg3)">'+esc(scopeName)+' &middot; 6 periods</span>'
  + '</div>';

  const daily = dailyCoverageSeries(scopeFilter());
  const dense = daily.length > 2 ? denseChart(daily.map(d => ({ value: d.cov })), {
    reference: 1, formatValue: v => v.toFixed(2)+'x', gradientId:'covDense',
    startLabel: fmtDateShort(daily[0].date), endLabel: fmtDateShort(daily[daily.length-1].date)
  }) : sparklineChart(points, { reference:1, formatValue: v => v.toFixed(2)+'x', area:true, gradientId:'covPage', forceReference:true });
  // The breakdown under the line, the reference pattern: one row per slice
  // of the fleet, its share of the money, its own figure, and a dashed mark
  // at the figure it usually runs at.
  const scoped = S.dashScope === 'all' ? [0,1,2] : [Number(S.dashScope)];
  const slices = scoped.map(si => {
    const st = computeStatement(true, si);
    const cov = covForPeriod(PERIODS[0], si);
    const avgSite = PERIODS.reduce((a, p) => a + covForPeriod(p, si), 0) / PERIODS.length;
    return { site: si, label: SITES[si].name, value: st.totalValue, invoice: st.totalInvoice, robots: st.rows.length, cov, avg: avgSite };
  });
  const sliceMax = Math.max.apply(null, slices.map(s => Math.max(s.cov, s.avg)).concat([1])) * 1.12;
  const breakdown = '<div style="padding-top:20px;margin-top:20px;border-top:1px solid var(--hair)">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px">'
      + '<span style="display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg3)">'
        + '<span style="width:14px;height:10px;flex:none;border-left:1px dashed var(--fg1);border-right:1px dashed var(--fg1)"></span>6-period average</span>'
      + '<span style="margin-left:auto;display:inline-flex;align-items:baseline;gap:8px"><span style="font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg3)">This period</span>'
        + '<span style="font-size:15px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+last.toFixed(2)+'x</span></span>'
    + '</div>'
    + slices.map(s => rangeBar({
        label: s.label,
        share: stmt.totalValue > 0 ? Math.round(s.value / stmt.totalValue * 100)+'% of the work' : '',
        value: s.cov.toFixed(2)+'x',
        frac: s.cov / sliceMax,
        avgFrac: s.avg / sliceMax,
        avgTitle: '6-period average '+s.avg.toFixed(2)+'x',
        note: s.robots+' robot'+(s.robots===1?'':'s')+' &middot; '+money0(s.value)+' of work against '+money0(s.invoice)+' invoiced &middot; '+(s.cov >= s.avg ? 'above' : 'below')+' its own average of '+s.avg.toFixed(2)+'x'
      })).join('')
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;padding-top:16px;border-top:1px solid var(--hair)">'
      + '<span style="font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg1)">Work valued</span>'
      + '<span style="font-size:11.5px;color:var(--fg3)">against '+money0(stmt.totalInvoice)+' invoiced</span>'
      + '<span style="margin-left:auto;font-size:18px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+money0(stmt.totalValue)+'</span>'
    + '</div>'
  + '</div>';

  const chartCard = '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 26px 22px;margin-bottom:20px">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin-bottom:18px">'
      + '<span style="font-size:36px;font-weight:600;letter-spacing:-0.03em;line-height:1;color:var(--fg1);font-variant-numeric:tabular-nums">'+last.toFixed(2)+'x</span>'
      + '<span style="font-size:13px;color:var(--fg3)">this period, still moving until it closes</span>'
      + '<span style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--fg1)">'+ic(change >= 0 ? 'trending-up' : 'trending-down',14)+(change >= 0 ? 'Up ' : 'Down ')+Math.abs(change).toFixed(1)+'% over 6 periods</span>'
    + '</div>'
    + dense
