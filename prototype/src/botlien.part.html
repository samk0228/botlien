// The one thing no export can ever prove is how many units a PERSON would
// complete in an hour, only what the robot did. Everything else on the
// sensitivity card holds still while this one assumption moves, and it only
// applies to the fleet's biggest per-task category, an all-by-the-hour
// fleet (cleaning, laundry) has no such assumption to test.
function sensBase(){
  const s = computeStatement();
  const missionCats = s.byCategory.filter(k => (BENCH[k.work]||{}).basis === 'mission');
  if (!missionCats.length) return null;
  const dom = missionCats[0];
  const domRows = s.included.filter(r => r.work === dom.work);
  const bench = BENCH[dom.work];
  return {
    work: dom.work, unit: bench.unit, unitPlural: bench.unitPlural,
    wageCentsHour: bench.wageCentsHour, benchUnitsPerHour: bench.humanUnitsPerHour,
    domUnits: domRows.reduce((a,r) => a+r.units, 0),
    domCount: domRows.length,
    fixedWork: Math.round((s.totalValue - dom.value) * 100) / 100,
    totalInvoice: s.totalInvoice,
  };
}
function calc(t, base){
  const rate = Math.round((base.wageCentsHour / 100 / t) * 100) / 100;
  const domWork = Math.round(base.domUnits * rate * 100) / 100;
  const total = Math.round((domWork + base.fixedWork) * 100) / 100;
  return { rate, domWork, total, cov: base.totalInvoice > 0 ? total / base.totalInvoice : null };
}
function breakEven(base){ let t = 1; while (t < 2000 && calc(t, base).cov >= 1) t++; return t - 1; }

];

// units is the number the rest of the dashboard actually computes from
// (runs started, or active hours, whichever the category's basis is). seen
// is that same number pre-formatted for display, kept in sync by hand here
// since there are only six rows, not derived, so a units edit and a seen
// edit are two edits, not one, if this table is ever hand-edited again.
const CONFIRM = [
  { name:'Servi 1 (front)', units:3780, seen:'3,780 runs started · Aug 4 – Sep 3', work:'Tray delivery' },
  { name:'Servi 2 (patio)', units:900, seen:'900 runs started · Aug 4 – Sep 3', work:'Tray delivery' },
  { name:'P3 runner', units:3900, seen:'3,900 runs started · Aug 4 – Sep 3', work:'Tray delivery' },

// Same seven categories and the same rates as the real backend's
// src/rates.mjs BENCHMARKS table, kept in sync by hand: this prototype and
// the real product must never quote two different numbers for the same

// derivation, on purpose, so it can be checked by hand, same rule as there.
const BENCH = {
  'Tray delivery':          { wageCentsHour:2200, humanUnitsPerHour:30, invoiceCentsMonth:99900, unit:'run',         unitPlural:'runs',         basis:'mission' },
  'Bussing and dish return':{ wageCentsHour:2200, humanUnitsPerHour:25, invoiceCentsMonth:99900, unit:'run',         unitPlural:'runs',         basis:'mission' },
  'Floor cleaning':         { wageCentsHour:2500, humanUnitsPerHour:1,  invoiceCentsMonth:80000, unit:'active hour', unitPlural:'active hours', basis:'active_hour' },
  'Order picking':          { wageCentsHour:2400, humanUnitsPerHour:60, invoiceCentsMonth:150000,unit:'pick',        unitPlural:'picks',        basis:'mission' },
  'Putaway and replenishment':{wageCentsHour:2400, humanUnitsPerHour:40, invoiceCentsMonth:150000,unit:'move',        unitPlural:'moves',        basis:'mission' },

};

// The one calculation the whole dashboard reads from. Every card below is a
// different view of this same result, never its own arithmetic, so a
// category or exclude change on the confirm screen can only ever move every
// card in agreement with every other one.
function computeStatement(){
  // A manually-typed estimate has no per-robot rows behind it, just a count
  // and two dollar figures, so it cannot honestly fill in byCategory,
  // attention, or work-split. Those cards already know how to say "no
  // robots included yet" for an empty fleet; returning empty here reuses
  // that same honest state instead of inventing rows to fill them.
  if (S.manualApplied){
    const count = Number(S.manualCount) || 0;
    const cost = Number(S.manualCost) || 0;
    const revenue = Number(S.manualRevenue) || 0;
    const totalInvoice = Math.round(count * cost * 100) / 100;
    const totalValue = Math.round(count * revenue * 100) / 100;
    const coverage = revenue > 0 && totalInvoice > 0 ? totalValue / totalInvoice : null;
    return {
      rows: [], included: [], totalValue, totalInvoice, coverage, byCategory: [],
      estimate: true, manualCount: count, manualCost: cost, manualRevenue: revenue,
    };
  }
  const rows = CONFIRM.map((c,i) => {
    const work = S.confirmWork[i] ?? c.work;
    const b = BENCH[work] ?? BENCH['Tray delivery'];
    // Rounded to the cent BEFORE multiplying by units, matching the real
    // backend's derivedRateCents: the rate is what an owner checks on a
    // napkin ("$22.00 ÷ 30 = $0.73"), so it has to be the same $0.73 that
    // gets multiplied, not an unrounded 73.33 that quietly drifts the total.
    const rateCents = Math.round(b.wageCentsHour / b.humanUnitsPerHour);
    const value = Math.round(c.units * rateCents) / 100;
    const invoice = b.invoiceCentsMonth / 100;
    const excluded = !!S.excluded[i];
    return {
      i, name: (S.confirmName[i] ?? c.name) || c.name, work, basis:b.basis,
      units: c.units, unit: c.units === 1 ? b.unit : b.unitPlural,
      rate: rateCents / 100, value, invoice, excluded,
      cov: invoice > 0 ? value / invoice : null,
    };
  });
  const included = rows.filter(r => !r.excluded);
  const totalValue = Math.round(included.reduce((s,r) => s+r.value, 0) * 100) / 100;
  const totalInvoice = Math.round(included.reduce((s,r) => s+r.invoice, 0) * 100) / 100;
  const coverage = totalInvoice > 0 ? totalValue / totalInvoice : null;
  const byCategory = {};
  included.forEach(r => {
    (byCategory[r.work] = byCategory[r.work] || { work:r.work, count:0, value:0 }).count++;
    byCategory[r.work].value += r.value;
  });
  return {
    rows, included, totalValue, totalInvoice, coverage,
    byCategory: Object.values(byCategory).sort((a,b) => b.value - a.value),
    estimate: false,
  };

}

// Badge, shadcn's small status-pill pattern: a filled variant for the state
// that needs attention, an outlined one for everything settled.
function badge(text, tone){
  const filled = tone === 'open';
  return '<span style="display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2.5px 7px;border-radius:3px;'
    + (filled ? 'background:var(--ink);color:var(--ink-fg)' : 'border:1px solid var(--hair2);color:var(--fg3)')
    + '">'+text+'</span>';
}

// Closed periods only, the open one is still moving and would misstate an
// average or a "best" claim while it settles.
function periodStats(){
  const closed = PERIODS.filter(p => p.status === 'closed');
  const avg = closed.reduce((s,p) => s + p.cov, 0) / closed.length;
  const best = closed.reduce((a,b) => b.cov > a.cov ? b : a);
  return { avg, best, open: PERIODS[0] };
}

function statRow(label, value, note){
  return '<div><div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--fg3);margin-bottom:4px">'+label+'</div>'
    + '<div style="font-size:18px;font-weight:700;color:var(--fg1);font-variant-numeric:tabular-nums;line-height:1.2">'+value+'</div>'
    + (note ? '<div style="font-size:11.5px;color:var(--fg3);margin-top:2px">'+note+'</div>' : '')
  + '</div>';
}

// A day-by-day trend needs days, plural, on record, which a fleet confirmed
// moments ago does not have. Faking a shape here would be worse than the
// old hardcoded chart, since it would look freshly computed and still be
// invented. This shows the one real number honestly instead: today's.
// Says "no history yet" once, here, and nowhere else, the coverage number
// itself already lives on the KPI card above. Repeating it here too was the
// redundant version of this card, not an improvement on the fake chart it

function recapCard(){

// Utilization needs duration, how many hours a robot actually ran, which is

// The coverage number, its delta, and its methodology, as one dashboard
// card in the same family as Coverage over time, Utilization, Needs
// attention, and Where the work is, not free-floating hero text sitting
// above the grid it belongs in.
function coverageKpiCard(){
  const s = computeStatement();
  const covLabel = s.coverage === null ? '—' : s.coverage.toFixed(2)+'x';
  const tag = s.estimate
    ? '<span style="font-size:12.5px;font-weight:700;color:var(--fg3);background:var(--ghost);padding:3px 8px;border-radius:3px">estimate, not measured</span>'
    : '<span style="font-size:12.5px;font-weight:700;color:var(--fg3);background:var(--ghost);padding:3px 8px;border-radius:3px">first period, no trend yet</span>';
  const subhead = s.estimate
    ? (s.manualRevenue > 0
      ? money(s.totalValue)+' of estimated work vs. '+money(s.totalInvoice)+' leased, from '+s.manualCount+' robot'+(s.manualCount===1?'':'s')+' at the numbers you typed in'
      : money(s.totalInvoice)+' of lease cost from '+s.manualCount+' robot'+(s.manualCount===1?'':'s')+'. Add what the work is worth per robot to see a coverage ratio.')
    : money(s.totalValue)+' of work performed vs. '+money(s.totalInvoice)+' leased';
  const detail = s.estimate
    ? 'One number spread evenly across '+s.manualCount+' robot'+(s.manualCount===1?'':'s')+', not what any one robot actually did. Import your export any time and this becomes a real, per-robot statement, priced at category benchmarks until you set your own numbers.'
    : 'Replacement cost of the work performed, divided by the lease. Not revenue, not profit, not labor you stopped paying for, just what it would have cost to buy this work another way, priced at category benchmarks until you set your own numbers. Change a robot&#39;s kind of work or exclude one on the confirm screen and this recalculates from those '+s.included.length+' robots, nothing here is fixed.';
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px">'
      + '<div style="font-size:clamp(28px,4.6vw,36px);font-weight:700;letter-spacing:-0.03em;color:var(--fg1);font-variant-numeric:tabular-nums">'+covLabel+'</div>'
      + tag
    + '</div>'
    + '<div style="font-size:13px;color:var(--fg2);margin-bottom:14px">'+subhead+'</div>'
    + '<details class="bl-acc">'
      + '<summary style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--fg3)">'
        + '<span class="chev" style="display:inline-flex">'+ic('chevron-down',13)+'</span>How this number is calculated'
      + '</summary>'
      + '<div style="margin-top:10px;font-size:13px;line-height:1.65;color:var(--fg2)">'+detail+'</div>'
    + '</details>'
    + (s.estimate ? '<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--hair)"><button type="button" data-act="startRealImport" class="hv-dim" style="padding:11px 18px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:pointer;font-size:13px;font-weight:700">Import my export</button></div>' : '')
  + '</div>';
}

function attentionCard(){
  const s = computeStatement();
  const withCov = s.included.filter(r => r.cov !== null);
  const sorted = withCov.slice().sort((a,b) => b.cov - a.cov);
  const max = sorted.length ? Math.max.apply(null, sorted.map(r => r.cov)) * 1.05 : 1;
  const rows = sorted.map(r => {
    const short = r.cov < 1;
    const pct = Math.min(100, (r.cov / max) * 100);
    return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0">'
      + '<span style="width:118px;flex:none;font-size:12.5px;font-weight:600;color:'+(short?'var(--fg1)':'var(--fg2)')+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.name)+'</span>'
      + '<div style="flex:1;height:8px;background:var(--ghost);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+(short?'var(--fg1)':'var(--hair3)')+'"></div></div>'
      + '<span style="width:44px;flex:none;text-align:right;font-size:12.5px;font-weight:700;color:var(--fg1);font-variant-numeric:tabular-nums">'+r.cov.toFixed(2)+'x</span>'
    + '</div>';
  }).join('');
  const flagged = sorted.find(r => r.cov < 1);
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px">'
      + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1)">Needs attention</div>'
      + '<button type="button" data-act="go" data-view="robots" class="hv-ghost" style="font-size:12px;font-weight:600;color:var(--fg2);background:none;border:none;cursor:pointer">All robots →</button>'
    + '</div>'
    + (flagged ? '<div style="font-size:12px;color:var(--fg3);margin-bottom:12px">'+esc(flagged.name)+' is running under its lease</div>' : '')
    + '<div style="margin-top:6px">'+(rows || '<div style="font-size:13px;color:var(--fg3);padding:6px 0">No robots included yet.</div>')+'</div>'
  + '</div>';
}

function workSplitCard(){
  const s = computeStatement();
  const total = s.totalValue;
  const rows = s.byCategory.map((k, i) => {
    const pct = total > 0 ? (k.value / total) * 100 : 0;
    return '<div style="margin-bottom:14px">'
      + '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px"><span style="font-weight:600;color:var(--fg1)">'+esc(k.work)+' · '+k.count+' '+(k.count===1?'robot':'robots')+'</span><span style="color:var(--fg2);font-variant-numeric:tabular-nums">'+money(k.value)+'</span></div>'
      + '<div style="height:8px;background:var(--ghost);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+(i===0?'var(--fg1)':'var(--hair3)')+'"></div></div>'
    + '</div>';
  }).join('');
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:2px">Where the work is</div>'
    + '<div style="font-size:12px;color:var(--fg3);margin-bottom:16px">Share of work serviced, by kind, this period</div>'
    + (rows || '<div style="font-size:13px;color:var(--fg3)">No robots included yet.</div>')
  + '</div>';
}

// Every block on the dashboard, keyed once, so the dashboard is just "which
// keys, in what order, hidden or not" rather than a hardcoded page. Adding a
// block anywhere else in the app later means adding one entry here.
const DASH_BLOCKS = {
  kpi:       { label: 'Coverage number',      render: coverageKpiCard },
  cost:      { label: 'Cost per run',         render: costCard },
  recap:     { label: 'Coverage over time',   render: recapCard },
  util:      { label: 'Utilization',          render: utilizationCard },
  attn:      { label: 'Needs attention',      render: attentionCard },
  work:      { label: 'Where the work is',    render: workSplitCard },
  sens:      { label: 'Rate assumption',      render: sensitivityCard },
  ownbench:  { label: 'Trend vs your own past', render: benchmarkOwnCard },
  venuebench:{ label: 'Benchmark vs other venues', render: benchmarkVenueCard },
};
const DASH_ORDER_DEFAULT = ['kpi','cost','recap','util','attn','work','sens','ownbench','venuebench'];
// 'ownbench' (trend vs your own past) starts hidden, not removed: with one
// period on record it would say the exact same "no history yet" thing recap
// already says, right next to it. Reachable any time from Customize, just
// not cluttering the first look with a duplicate.
const DASH_HIDDEN_DEFAULT = ['ownbench'];
let dashDragId = null; // which block is mid-drag; ephemeral, does not need a render

function viewDashV2(){
  if (S.site !== 0) return viewDash();
  const hidden = S.dashLayout.filter(id => S.dashHidden.includes(id));
  const visible = S.dashLayout.filter(id => !S.dashHidden.includes(id));
  // Real masonry (see layoutDashMasonry below), not a row/column layout.
  // Grid and flexbox both size a whole row by its tallest member, so a
  // short card next to a tall one always leaves a gap somewhere, inside
  // itself if the row stretches, or below it if the row doesn't. A short
  // card's neighbor below has to wait for the tall card to end either way.
  // Masonry places each card in whichever column is shortest right now, so
  // nothing ever waits on a taller sibling. width/position get set by JS
  // after layout; this starting size is just what paints before that runs.
  return '<div style="padding:0 0 8px;margin-bottom:56px">'
    + dashToolbar(hidden)
    + '<div id="dashGrid" style="position:relative">'
      + visible.map(dashBlockWrap).join('')
    + '</div>'
  + '</div>';
}

function dashToolbar(hidden){
  return '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:16px">'
    + (S.dashEdit ? hidden.map(id => '<button type="button" data-act="dashShow" data-id="'+id+'" class="hv-ghost" style="font-size:12px;font-weight:600;color:var(--fg2);background:var(--ghost);border:1px dashed var(--hair2);border-radius:5px;padding:7px 12px;cursor:pointer">+ '+DASH_BLOCKS[id].label+'</button>').join('') : '')
    + (S.dashEdit ? '<button type="button" data-act="dashReset" class="hv-ghost" style="font-size:12px;font-weight:600;color:var(--fg3);background:none;border:none;cursor:pointer;padding:8px 6px">Reset layout</button>' : '')
    + '<button type="button" data-act="toggleDashEdit" class="hv-dim press" style="font-size:12.5px;font-weight:700;color:'+(S.dashEdit?'var(--ink-fg)':'var(--fg1)')+';background:'+(S.dashEdit?'var(--ink)':'transparent')+';border:1px solid var(--hair2);border-radius:5px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px">'
      + ic('sliders-horizontal',14) + (S.dashEdit?'Done':'Customize')
    + '</button>'
  + '</div>';
}

// Native HTML5 drag-and-drop, drag handle is the whole card in edit mode.
// Reorder happens once, on drop, not live while dragging over neighbors,
// that is the version that does not fight its own re-render mid-gesture.
function dashBlockWrap(id){
  const block = DASH_BLOCKS[id];
  if (!block) return '';
  const edit = S.dashEdit;
  // Width and position are set by layoutDashMasonry after this paints, not
  // here. A real strip above the card, not floated on top of it, is what
  // fixed the other overlap: absolute positioning over the corner was
  // landing on whatever the card already had there, "All robots →", the
  // Day/Week/Month tabs, take your pick, this pushes the card down instead.
  return '<div class="dash-block" data-dash-id="'+id+'" draggable="'+(edit?'true':'false')+'" style="box-sizing:border-box;'+(edit?'cursor:grab;':'')+'">'
    + (edit
      ? '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;margin-bottom:8px;background:var(--ghost);border:1px dashed var(--hair2);border-radius:6px">'
        + '<span style="display:inline-flex;align-items:center;gap:7px;color:var(--fg3);font-size:11.5px;font-weight:600">'+ic('equal',14)+'Drag to reorder</span>'
        + '<button type="button" data-act="dashHide" data-id="'+id+'" title="Remove from dashboard" style="flex:none;width:24px;height:24px;border-radius:5px;border:1px solid var(--hair2);background:var(--menu);cursor:pointer;font-size:14px;line-height:1;color:var(--fg2)">&times;</button>'
      + '</div>'
      : '')
    + '<div style="'+(edit?'pointer-events:none;':'')+'">'+block.render()+'</div>'
  + '</div>';
}

// Same interactive slider as the page above, same card frame as everything
// else here. The paragraph explaining it got cut to one line, the live
// math trace stays, that is the part that actually earns trust.
function sensitivityCard(){
  const base = sensBase();
  if (!base){
    return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px;margin-bottom:20px">'
      + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:2px">The one input you cannot measure</div>'
      + '<div style="font-size:13px;color:var(--fg2);line-height:1.6">Every included robot here is priced by the active hour, not by a per-task rate, so there is no throughput assumption to test. This card appears once a per-run or per-pick robot is in the fleet.</div>'
    + '</div>';
  }
  const min = Math.max(1, Math.round(base.benchUnitsPerHour * 0.5));
  const max = Math.max(min + 1, Math.round(base.benchUnitsPerHour * 2));
  const t = Math.min(max, Math.max(min, S.throughput));
  const c = calc(t, base);
  const be = breakEven(base);
  const secs = Math.round(3600 / be);
  const fill = ((t - min) / (max - min) * 100).toFixed(1);
  const unitLabel = base.unit+'s/hr';
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px;margin-bottom:20px">'
    + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:2px">The one input you cannot measure</div>'
    + '<div style="font-size:12px;color:var(--fg3);margin-bottom:18px">Every figure here assumes '+base.benchUnitsPerHour+' '+unitLabel+' for '+esc(base.work.toLowerCase())+' ('+base.domCount+' robot'+(base.domCount===1?'':'s')+'). Drag it and they move with you.</div>'
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:16px">'
      + '<input id="sensRange" class="bl-slider" type="range" min="'+min+'" max="'+max+'" step="1" value="'+t+'" style="flex:1;min-width:120px;--bl-fill:'+fill+'%" aria-label="'+esc(base.unit)+'s a person completes per hour">'
      + '<div style="text-align:right;flex:none">'
        + '<div style="font-variant-numeric:tabular-nums;font-size:13px;color:var(--fg1);white-space:nowrap"><b id="sensT" style="font-weight:700">'+t+'</b> '+unitLabel+'</div>'
        + '<div style="font-size:11px;color:var(--fg3);white-space:nowrap">= <b id="sensCovBig" style="color:var(--fg1);font-weight:700">'+c.cov.toFixed(2)+'x</b> coverage</div>'
      + '</div>'
    + '</div>'
    + '<div style="padding:12px 14px;border-radius:6px;background:var(--ghost);font-family:inherit;font-size:12px;color:var(--fg1);line-height:1.85;overflow-x:auto;white-space:nowrap">'
      + money(base.wageCentsHour/100)+' / hr ÷ <span id="sensT2">'+t+'</span> '+esc(base.unitPlural)+' = <span id="sensRate">'+money(c.rate)+'</span> per '+esc(base.unit)+'<br>'
      + base.domUnits.toLocaleString('en-US')+' '+esc(base.unitPlural)+' x <span id="sensRate2">'+money(c.rate)+'</span> + '+money(base.fixedWork)+' other work = <span id="sensWork">'+money(c.total)+'</span><br>'
      + '<span id="sensWork2">'+money(c.total)+'</span> / '+money(base.totalInvoice)+' invoiced = <span id="sensCov">'+c.cov.toFixed(2)+'x</span></div>'
    + '<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;align-items:center;gap:16px">'
      + '<div style="flex:1;min-width:260px;font-size:12.5px;line-height:1.6;color:var(--fg2)">Coverage falls to 1.00x at <b style="color:var(--fg1);font-weight:700">'+be+' '+unitLabel+'</b>'+(secs>0&&secs<3600?', one every '+secs+'s for a whole shift':'')+'.</div>'
      + '<button type="button" data-act="saveThroughput" class="hv-ghost" style="padding:9px 15px;border-radius:5px;border:1px solid var(--hair2);background:transparent;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--fg1);white-space:nowrap">Use '+t+' as my number</button>'
    + '</div>'
    + (S.savedThroughput
      ? '<div id="savedNote" style="margin-top:14px;padding:12px 14px;border:1px solid var(--hair2);border-radius:5px;font-size:12.5px;line-height:1.6;color:var(--fg2)">Saved. '+t+' '+unitLabel+' applies to '+esc(base.work.toLowerCase())+' going forward.</div>'
      : '')
  + '</div>';
}

function costCard(){
  const s = computeStatement();
  if (s.byCategory.length === 0) return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'+fig('Cost per task','—','no robots included yet','','')+'</div>';
  // The dashboard's biggest category by value, since "cost per task" only
  // means one thing when every included robot bills the same way. A mixed
  // fleet still gets a real number, just for the work that carries it.
  const top = s.byCategory[0];
  const b = BENCH[top.work];
  const rate = money(b.wageCentsHour / b.humanUnitsPerHour / 100);
  const label = 'Cost per '+b.unit;
  const note = top.count+' '+(top.count===1?'robot':'robots')+' · '+b.unit+' = $'+(b.wageCentsHour/100).toFixed(2)+'/hr ÷ '+b.humanUnitsPerHour;
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'+fig(label, rate, note, '', '')+'</div>';
}

// Same reason as Coverage over time: a trend against your own past needs a

function benchmarkOwnCard(){

}

function fig(label, value, note, wrap, noteStyle){
  return '<div style="'+wrap+'">'
    + '<div style="font-size:13px;font-weight:600;color:var(--fg3);margin-bottom:10px">'+label+'</div>'
    + '<div style="font-size:clamp(24px,4.4vw,32px);font-weight:700;letter-spacing:-0.03em;color:var(--fg1);font-variant-numeric:tabular-nums">'+value+'</div>'
    + '<div style="font-size:12.5px;color:var(--fg2);margin-top:8px;line-height:1.5;'+noteStyle+'">'+note+'</div></div>';

// Consumable condition. Reported by Gausium; Bear and Pudu send nothing of the
// kind, so their robots say so plainly rather than showing an empty meter — a
// missing input is stated as missing, never rendered as a zero.
function conditionBlock(r){
  if(!r.parts) return '<div style="margin-top:14px;font-family:inherit;font-size:11.5px;color:var(--fg3)">consumable life · not reported by '+(r.model||'').split(' ')[0]+'</div>';
  const spent = r.parts.filter(p => p.left <= 0).length;
  const bars = r.parts.map(p => {
    const past = p.left <= 0;
    // Life remaining reads left to right. A part past its rating has no bar to
    // draw, so the whole track carries the hatch this design already uses for
    // the figure that is going the wrong way.
    const fill = past
      ? 'repeating-linear-gradient(135deg,var(--hatch2) 0 2px,transparent 2px 5px)'
      : 'var(--ink)';
    const width = past ? '100%' : Math.max(0, Math.min(100, p.left)) + '%';
    const label = past ? Math.round(-p.left) + '% over' : Math.round(p.left) + '% left';
    return '<div style="display:flex;align-items:center;gap:12px;margin-bottom:9px">'
      + '<span data-barlabel style="width:104px;flex:none;font-family:inherit;font-size:12px;color:var(--fg2)">'+p.name+'</span>'
      + '<span style="flex:1;min-width:60px;height:8px;border:1px solid var(--hair2);position:relative;display:block">'
        + '<i style="position:absolute;left:0;top:0;bottom:0;width:'+width+';background:'+fill+'"></i></span>'
      + '<span style="width:96px;flex:none;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:'+(past?700:400)+';color:'+(past?'var(--fg1)':'var(--fg2)')+'">'+label+'</span>'
      + '<span style="width:104px;flex:none;text-align:right;font-family:inherit;font-size:11.5px;color:var(--fg3)">'+p.used+'</span></div>';
  }).join('');
  const note = spent
    ? 'A part past its rating is work this machine is still doing on borrowed time. Replacing it is not in the figure above.'
    : 'Every part is inside its rated life.';
  return '<div style="margin-top:22px;padding-top:18px;border-top:1px dashed var(--hair)">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:14px">'
      + '<span style="font-size:12.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--fg2)">Condition</span>'
      + '<span style="font-size:12.5px;color:var(--fg3)">life remaining against the maker&#39;s rating</span></div>'
    + '<div data-bars style="margin-bottom:12px">'+bars+'</div>'
    + '<div style="font-size:13px;line-height:1.6;color:var(--fg2);max-width:86ch">'+note+'</div>'
    + '<div style="margin-top:10px;font-family:inherit;font-size:11.5px;color:var(--fg3)">also reported · '+r.hand+' of active time hand-driven · battery '+r.temp+'</div>'
    + '</div>';
}

function viewRobots(){

    const spentParts = (r.parts || []).filter(p => p.left <= 0).length;

        + '<span style="margin-left:auto;display:flex;align-items:baseline;gap:10px">'

      + '<button type="button" data-act="attention" style="padding:9px 16px;border-radius:3px;border:none;cursor:pointer;font-size:13px;font-weight:700;background:'+(attention?'var(--ink)':'var(--ghost2)')+';color:'+(attention?'var(--ink-fg)':'var(--fg2)')+'">Needs attention · 1</button></div>'
    + '<div style="padding:0;margin-bottom:56px">'
      + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:26px">'
        + '<h2 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--fg1)">Robot by robot</h2>'
        + '<span style="font-size:13px;color:var(--fg3)">Each row carries the equation that produced its number.</span></div>'
      + rows + '</div>'
    + '<div style="padding:0">'
      + '<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:12px">'

        + '<span style="font-size:13px;color:var(--fg3)">0.66x · duty 11% of 360h</span></div>'

}

function viewRates(){

function viewConfirm(){
  const excludedCount = Object.keys(S.excluded).filter(k => S.excluded[k]).length;
  const included = CONFIRM.filter((c,i) => !S.excluded[i]);
  const allSameWork = included.length > 1 && included.every(c => c.work === included[0].work);
  // Reviewing is the one required action, not typing. A robot counts as
  // reviewed the moment its "kind of work" select is opened, whether or not
  // the value changes, because looking is what proves the default was seen,
  // not agreed with by accident. Excluded robots do not need review, they
  // are not being priced.
  const needsReview = CONFIRM.map((c,i) => i).filter(i => !S.excluded[i]);
  const reviewedCount = needsReview.filter(i => S.confirmSeen[i]).length;
  const allReviewed = reviewedCount === needsReview.length;
  const left = needsReview.length - reviewedCount;

  const row = (c,i) => {
    const excl = !!S.excluded[i];
    const seen = !!S.confirmSeen[i];
    const work = S.confirmWork[i] ?? c.work;
    const name = S.confirmName[i] ?? c.name;
    return '<div data-split style="border-top:1px solid var(--hair);padding:20px 4px;display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:28px;align-items:start;opacity:'+(excl?0.5:1)+'">'
      + '<div>'
        + '<label style="display:block;font-size:10.5px;font-weight:700;color:var(--fg3);margin-bottom:4px">Call it</label>'
        + '<input id="confirmName-'+i+'" type="text" value="'+esc(name)+'" style="width:100%;font-size:14px;color:var(--fg1);background:transparent;padding:8px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-family:inherit">'
        + '<div style="font-size:12px;color:var(--fg3);margin-top:6px;font-variant-numeric:tabular-nums">'+c.seen+'</div></div>'
      + '<div style="display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px">'
        + '<div style="min-width:200px">'
          + '<label for="confirmWork-'+i+'" style="display:block;font-size:10.5px;font-weight:700;color:var(--fg3);margin-bottom:4px">Kind of work'+(!excl && !seen ? ' <span style="color:var(--fg1)">· look at this</span>' : '')+'</label>'
          + '<select id="confirmWork-'+i+'" data-i="'+i+'" style="width:100%;font-size:13.5px;color:var(--fg1);background:transparent;padding:8px 2px;border:none;border-bottom:1px solid '+(!excl && !seen ? 'var(--fg1)' : 'var(--hair2)')+';outline:none;font-family:inherit;cursor:pointer">'
            + WORK_CATEGORIES.map(w => '<option value="'+esc(w)+'"'+(w===work?' selected':'')+'>'+esc(w)+'</option>').join('')
          + '</select></div>'
        + '<button type="button" data-act="toggleExclude" data-i="'+i+'" style="margin-left:auto;padding:9px 14px;border-radius:3px;border:1px solid var(--hair2);background:'+(excl?'var(--ink)':'transparent')+';color:'+(excl?'var(--ink-fg)':'var(--fg1)')+';cursor:pointer;font-size:12.5px;font-weight:600">'+(excl?'Excluded':'Exclude')+'</button>'
      + '</div></div>';
  };

  return '<div style="padding:0;margin-bottom:40px">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px">'
      + '<h2 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--fg1)">'+CONFIRM.length+' robots found in that export</h2>'
      + '<span style="font-size:13px;color:var(--fg3)">Rename anything you call something else. Exclude what you don&#39;t lease.</span></div>'
    + (allSameWork ? '<div style="border-left:2px solid var(--fg1);background:var(--ghost2);padding:13px 15px;border-radius:0 4px 4px 0;font-size:13px;color:var(--fg1);line-height:1.6;margin-bottom:22px"><b>All '+included.length+' robots are set to the same kind of work: '+included[0].work+'.</b> That is a default guess, not something read from your export. Fix each one below if this fleet actually does more than one thing.</div>' : '')
    + '<div style="border-left:2px solid '+(allReviewed?'var(--fg3)':'var(--fg1)')+';background:var(--ghost2);padding:13px 15px;border-radius:0 4px 4px 0;font-size:13px;color:var(--fg1);line-height:1.6;margin-bottom:8px">'
      + (allReviewed
        ? 'You&#39;ve looked at all '+needsReview.length+'. Confirm below when ready.'
        + (S.confirmTriedSubmit ? '' : '')
        : '<b>Open the &quot;Kind of work&quot; field for each robot below before confirming.</b> '+left+' left. It decides whether a robot is priced per task or per hour, which changes its number by an order of magnitude, so a glance is required, typing is not.')
    + '</div>'
    + CONFIRM.map(row).join('')
    + '<div style="margin-top:28px;display:flex;flex-wrap:wrap;align-items:center;gap:16px">'
      + '<button type="button" data-act="confirmFleet" class="hv-dim" style="padding:14px 22px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:pointer;font-size:14px;font-weight:700;opacity:'+(allReviewed?1:0.4)+'">Yes, that&#39;s my fleet</button>'
      + '<span style="font-size:13px;color:var(--fg3)">'+(!allReviewed
          ? 'Look at '+left+' more to unlock this.'
          : excludedCount === 0
            ? 'All '+CONFIRM.length+' will be priced. Nothing is computed until you continue.'
            : excludedCount+' excluded, so they stay out of every total instead of reading as $0.00.')+'</span></div>'
    + (S.confirmTriedSubmit && !allReviewed ? '<div style="margin-top:12px;font-size:12.5px;font-weight:600;color:var(--fg1)">Look at the highlighted fields above first, then confirm.</div>' : '')
    + '<div style="margin-top:18px;font-size:12.5px;color:var(--fg3)">Want to type your own rate, invoice, or wage instead of the benchmark guess? <span data-act="go" data-view="setup" style="color:var(--fg1);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Set your numbers</span>, any time, not required now.</div>'
  + '</div>';
}

// Card language matches dashv2 (the Coverage page): bordered rounded cards,
// a chip-labeled KPI, real buttons for navigation instead of underlined
// inline text. This page used to be its own older hero-plus-equals-sign
// template; that template is gone everywhere else now, so this should not
// be the one place it still shows up.
function viewSites(){
  const work = SITES.reduce((a,s) => a + s.work, 0);
  const inv = SITES.reduce((a,s) => a + s.invoice, 0);
  const robots = SITES.reduce((a,s) => a + s.robots, 0);
  const groupCov = work / inv;
  // Best to worst, same convention as Needs attention on the Coverage page,
  // so the weakest site is easy to spot without reading every card.
  const ranked = SITES.map((s,i) => Object.assign({}, s, { i, cov: s.work / s.invoice })).sort((a,b) => b.cov - a.cov);
  const max = ranked[0].cov;
  const best = ranked[0], worst = ranked[ranked.length - 1];
  const spread = (best.cov - worst.cov).toFixed(2);
  return '<div style="padding:0 0 8px;margin-bottom:56px">'
    + '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px;margin-bottom:20px">'
      + '<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px">'
        + '<div style="font-size:clamp(28px,4.6vw,36px);font-weight:700;letter-spacing:-0.03em;color:var(--fg1);font-variant-numeric:tabular-nums">'+groupCov.toFixed(2)+'x</div>'
        + '<span style="font-size:12.5px;font-weight:700;color:var(--fg3);background:var(--ghost);padding:3px 8px;border-radius:3px">group coverage · '+robots+' robots · 3 sites</span>'
      + '</div>'
      + '<div style="font-size:13px;color:var(--fg2);margin-bottom:14px">'+money(work)+' of work performed vs. '+money(inv)+' leased, summed across all 3 sites. '+esc(worst.name)+' runs lowest of the three at '+worst.cov.toFixed(2)+'x, below the '+groupCov.toFixed(2)+'x group figure.</div>'
      + '<details class="bl-acc">'
        + '<summary style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--fg3)">'
          + '<span class="chev" style="display:inline-flex">'+ic('chevron-down',13)+'</span>How this number is calculated'
        + '</summary>'
        + '<div style="margin-top:10px;font-size:13px;line-height:1.65;color:var(--fg2)">The sum of every site&#39;s work performed, over the sum of every site&#39;s lease, never an average of the three sites&#39; own ratios. A site with more robots weighs the group figure by exactly that much more.</div>'
      + '</details>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:20px">'
      + ranked.map((s) => {
        const belowAvg = s.cov < groupCov;
        return '<div data-act="pickSite" data-i="'+s.i+'" class="hv-ghost" style="cursor:pointer;border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
          + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:2px">'
            + '<span style="font-size:13.5px;font-weight:700;color:var(--fg1)">'+s.name+'</span>'
            + (S.site===s.i ? '<span style="font-size:11px;font-weight:700;color:var(--fg3);background:var(--ghost);padding:2px 7px;border-radius:3px">you are here</span>' : '')
            + (belowAvg ? '<span style="font-size:11px;font-weight:700;color:var(--fg3);background:var(--ghost);padding:2px 7px;border-radius:3px">below group average</span>' : '')
          + '</div>'
          + '<div style="font-size:12px;color:var(--fg3);margin-bottom:14px">'+s.robots+' robots</div>'
          + '<div style="font-size:26px;font-weight:700;letter-spacing:-0.03em;color:var(--fg1);font-variant-numeric:tabular-nums;margin-bottom:10px">'+s.cov.toFixed(2)+'x</div>'
          + '<div style="height:8px;background:var(--ghost);border-radius:2px;overflow:hidden;margin-bottom:12px"><div style="height:100%;width:'+((s.cov/max)*100).toFixed(1)+'%;background:var(--fg1)"></div></div>'
          + '<div style="font-size:12.5px;color:var(--fg2);margin-bottom:8px">'+money(s.work)+' of work performed vs. '+money(s.invoice)+' leased</div>'
          + '<div style="font-family:inherit;font-size:12px;color:var(--fg3);overflow-x:auto;white-space:nowrap;margin-bottom:14px">'+money(s.work)+' / '+money(s.invoice)+' = '+s.cov.toFixed(2)+'x</div>'
          + '<span style="font-size:12px;font-weight:600;color:var(--fg2)">'+(S.site===s.i?'Viewing this site':'View this site')+' →</span>'
        + '</div>'; }).join('')
    + '</div>'
    + '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
      + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:8px">The spread between sites</div>'
      + '<div style="font-size:13px;color:var(--fg2);line-height:1.65">'+esc(best.name)+' runs highest at '+best.cov.toFixed(2)+'x. '+esc(worst.name)+' runs lowest at '+worst.cov.toFixed(2)+'x, a spread of '+spread+'x between them. Coverage compares work performed against lease cost, not headcount or hours directly, two similarly-sized sites can still land in different places on this scale.</div>'
    + '</div>'
  + '</div>';
}

/* ─────────────────────────  RENDER  ───────────────────────── */

function render(){
  const active = document.activeElement;
  const keepId = active && active.id ? active.id : null;
  const selStart = keepId && 'selectionStart' in active ? active.selectionStart : null;

  const onAuth = S.stage === 'auth';
  // A first-time owner stays out of the app rail clear through import and
  // confirm: the rail is the product's navigation, and there is nothing to
  // navigate to until a fleet exists. Content still comes from appStage(),
  // since 'start' and 'confirm' are real views with real width needs (a
  // robot table does not fit the 440px sign-in card), just centred in their
  // own wide column instead of sitting next to the rail. It only appears
  // once the fleet is actually confirmed (confirmFleet clears S.onboarding).
  // A returning owner (toApp) never sets it, so they see the rail immediately.
  const inOnboarding = S.stage === 'app' && S.onboarding;
  const inner = onAuth
    ? authStage()
    : inOnboarding
      ? '<div data-stage style="padding:56px 34px 80px;display:flex;justify-content:center"><div style="width:100%;max-width:860px">' + appStage() + '</div></div>'
      : appRail() + appStage();

  /* The app keeps its rail, because navigation between Coverage, Robots, Rates
     and Settings is the product. Auth (and onboarding) has nowhere to
     navigate to, so it gets the whole width and the card centres in it. */
  const cols = (onAuth || inOnboarding) ? 'minmax(0,1fr)' : (S.railCollapsed ? '72px minmax(0,1fr)' : '264px minmax(0,1fr)');

  document.getElementById('root').innerHTML =
    '<div style="position:relative;min-height:100vh;background:var(--page);color:var(--fg1)">'
    + '<div data-grid style="position:relative;display:grid;grid-template-columns:'+cols+';align-items:start;min-height:100vh">'
    + inner + '</div></div>';

  applySensitivity();
  layoutDashMasonry();

  if (keepId){
    const el = document.getElementById(keepId);
    if (el){
      /* selectionStart reads null on input types the selection API does not cover
         (email, number). Without the fallback the caret lands at 0 after every
         re-render and the field fills in backwards. */
      try {
        el.focus();
        if (el.type !== 'range' && 'setSelectionRange' in el){
          const at = selStart != null ? selStart : (el.value ? el.value.length : 0);
          el.setSelectionRange(at, at);
        }
      } catch(e){}
    }
  } else if (S.stage === 'auth' && ['signin','signin-new','signin-failed','signedout'].includes(S.screen)){
    const el = document.getElementById('authEmail');
    if (el) { try { el.focus(); } catch(e){} }
  }
}

/* The slider patches the statement in place. A full re-render on every input
   event would replace the range element mid-drag and the thumb would stop
   tracking the pointer. */
function applySensitivity(){
  const put = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  if (S.view !== 'dashv2') return;
  const base = sensBase();
  if (!base) return;
  const c = calc(S.throughput, base);
  put('sensT', S.throughput);
  put('sensT2', S.throughput);
  put('sensRate', money(c.rate));
  put('sensRate2', money(c.rate));
  put('sensWork', money(c.total));
  put('sensWork2', money(c.total));
  put('sensCov', c.cov.toFixed(2) + 'x');
  put('sensCovBig', c.cov.toFixed(2) + 'x');
  const slider = document.getElementById('sensRange');
  if (slider) slider.style.setProperty('--bl-fill', ((S.throughput - 15) / (60 - 15) * 100) + '%');
  const btn = document.querySelector('[data-act="saveThroughput"]');
  if (btn) btn.textContent = 'Use ' + S.throughput + ' as my number';
}

/* Real masonry for the dashboard grid. Grid and flexbox both size a row by
 * its tallest member, whatever else is in that row either stretches to
 * match it (dead space inside the short card) or stops short of it (dead
 * space below the short card, waiting for the row to clear). Neither is
 * fixable without changing what "a row" means, so this drops rows
 * entirely: each card gets measured at its real width, then placed at the
 * top of whichever column is shortest right now. A short card's neighbor
 * lands right under it, it never waits on a taller card two columns over. */
function layoutDashMasonry(){
  const container = document.getElementById('dashGrid');
  if (!container) return;
  const cards = Array.prototype.slice.call(container.children);
  if (!cards.length){ container.style.height = '0px'; return; }

  const gap = 20, minColWidth = 320;
  const width = container.clientWidth;
  if (!width){ return; } // not laid out yet (display:none ancestor, etc.)
  const cols = Math.max(1, Math.min(cards.length, Math.floor((width + gap) / (minColWidth + gap))));
  const colWidth = (width - gap * (cols - 1)) / cols;

  cards.forEach(card => {
    card.style.position = 'absolute';
    card.style.width = colWidth + 'px';
  });
  const colHeights = new Array(cols).fill(0);
  cards.forEach(card => {
    let ci = 0;
    for (let i = 1; i < cols; i++){ if (colHeights[i] < colHeights[ci]) ci = i; }
    card.style.left = (ci * (colWidth + gap)) + 'px';
    card.style.top = colHeights[ci] + 'px';
    colHeights[ci] = colHeights[ci] + card.offsetHeight + gap;
  });
  container.style.height = (Math.max.apply(null, colHeights) - gap) + 'px';
}
// Column count depends on viewport width, so a resize can change it. No
// masonry library here to subscribe to, a short debounce on window resize
// is the whole mechanism.
let dashResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(dashResizeTimer);
  dashResizeTimer = setTimeout(layoutDashMasonry, 120);
});

function startResendClock(){
  clearInterval(timers.resend);
  S.resendLeft = 30;
  timers.resend = setInterval(() => {
    if (S.resendLeft <= 1){ clearInterval(timers.resend); set({ resendLeft: 0 }); return; }
    set({ resendLeft: S.resendLeft - 1 });
  }, 1000);
}

function toCheck(again){
  set({ screen:'check', sending:false, sentAgain: !!again });
  startResendClock();
}

function signInAs(kind){
  clearTimeout(timers.signin);
  set({ screen:'signingin' });
  timers.signin = setTimeout(() => set({ screen: kind === 'new' ? 'landed-info' : 'landed-returning' }), 1400);
}

function submitEmail(){
  const email = S.email.trim();
  const valid = VALID.test(email);
  if (!valid || S.sending){ set({ touched:true }); return; }
  set({ sending:true, screen:'signin' });
  clearTimeout(timers.send);
  timers.send = setTimeout(() => {
    if (S.failNext) set({ sending:false, screen:'signin-failed', failNext:false });
    else toCheck(false);
  }, 1000);
}

function runUpload(){
  clearInterval(timers.upload);
  set({ view:'start', upload:'loading', upPct:0 });
  timers.upload = setInterval(() => {
    const next = S.upPct + 12;
    if (next >= 100){ clearInterval(timers.upload); set({ upPct:100, upload:'read' }); return; }
    set({ upPct: next });
  }, 260);
}

function download(kind){
  clearTimeout(timers.export);
  set({ exportMenu:false, exporting:true, exportDone:false, exportFailed:false });
  timers.export = setTimeout(() => {
    if (kind === 'pdf' && !pdfRetried){
      pdfRetried = true;
      set({ exporting:false, exportFailed:true });
    } else {
      set({ exporting:false, exportDone:true, exportFile: kind === 'pdf' ? 'harbor-grill-coverage-aug-2026.pdf' : 'harbor-grill-coverage-aug-2026.csv' });
    }
  }, 900);
}

  saveThroughput: () => set({ savedThroughput:true }),
  toggleExport: () => { if (!S.exporting) set({ exportMenu: !S.exportMenu, profileOpen:false, siteMenu:false, periodMenu:false }); },
  exportCsv: () => download('csv'),
  exportPdf: () => download('pdf'),
  dismissExport: () => set({ exportDone:false, exportFailed:false }),
  toggleSetup: (el) => { const i = Number(el.dataset.i); set({ openSetup: S.openSetup === i ? -1 : i }); },
  save: () => {
    if (S.saving) return;
    set({ saving:true });
    clearTimeout(timers.save);
    timers.save = setTimeout(() => set({ saving:false, view:'dashv2' }), 800);
  },
  uploadGood: () => runUpload(),
  uploadBad: () => set({ upload:'bad' }),
  resetUpload: () => set({ upload:'idle', upPct:0 }),
  startManual: () => set({ manualMode:true, manualStage:'form', manualTouched:false }),
  manualCancel: () => set({ manualMode:false, manualStage:'form', manualTouched:false }),
  manualSubmit: () => {
    const ok = (Number(S.manualCount) || 0) > 0 && (Number(S.manualCost) || 0) > 0;
    if (!ok){ set({ manualTouched:true }); return; }
    set({ manualStage:'result' });
  },
  manualToDash: () => goView('dashv2', { onboarding:false, manualApplied:true }),
  // No onboarding: value set here on purpose, this button is reachable both
  // mid-onboarding (stay chrome-free) and later from the estimate dashboard
  // as an existing owner (keep the rail), so it must not force either way.
  startRealImport: () => goView('start', { manualMode:false, upload:'idle' }),
  toggleExclude: (el) => {
    const i = Number(el.dataset.i);
    const ex = Object.assign({}, S.excluded);
    ex[i] = !ex[i];
    set({ excluded: ex });
  },
  pick: (el) => set({ picked: Number(el.dataset.i) }),
  businessContinue: () => { if (S.picked >= 0) set({ view:'start', upload:'idle' }); },
  sendCreds: () => {
    if (S.credSending) return;
    set({ credSending:true });
    clearTimeout(timers.cred);
    timers.cred = setTimeout(() => set({ credSending:false, credSent:true }), 900);
  }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest && e.target.closest('[data-act]');
  if (!el) {
    if (S.stage === 'app' && (S.profileOpen || S.exportMenu)) set({ profileOpen:false, exportMenu:false });
    return;
  }
  const fn = ACTIONS[el.dataset.act];
  if (fn){ e.stopPropagation(); fn(el); }
});

document.addEventListener('input', (e) => {
  if (!e.target) return;
  if (e.target.id === 'authEmail'){ set({ email: e.target.value, touched:true }); return; }
  if (e.target.id === 'siteName'){ S.siteName = e.target.value; return; }
  if (e.target.id === 'ownerName'){ S.ownerName = e.target.value; return; }
  if (e.target.id === 'businessName'){ S.businessName = e.target.value; return; }
  if (e.target.id === 'manualCount'){ S.manualCount = e.target.value; return; }
  if (e.target.id === 'manualCost'){ S.manualCost = e.target.value; return; }
  if (e.target.id === 'manualRevenue'){ S.manualRevenue = e.target.value; return; }
  if (/^confirmName-\d+$/.test(e.target.id)){
    S.confirmName[Number(e.target.id.slice(12))] = e.target.value;
    return;
  }
  if (/^invite\d+$/.test(e.target.id)){
    const i = Number(e.target.id.slice(6));
    S.inviteEmail[i] = e.target.value;
    // Only the button label depends on this, so patch it rather than
    // re-rendering and stealing focus mid-typing.
    const cta = document.querySelector('[data-act="firstRun4"]');
    if (cta) cta.textContent = inviteCta();
    return;
  }
  if (e.target.id === 'sensRange'){
    S.throughput = Number(e.target.value);
    S.savedThroughput = false;
    const note = document.getElementById('savedNote');
    if (note) note.remove();
    applySensitivity();
  }
});

// A robot's "kind of work" counts as reviewed the moment its select opens,
// value changed or not, that is what proves a human looked, not that they
// happened to agree. focusin (bubbles), not focus (does not), is what lets
// one listener catch every row instead of one per select.
document.addEventListener('focusin', (e) => {
  if (!e.target || !/^confirmWork-\d+$/.test(e.target.id)) return;
  const i = Number(e.target.id.slice(12));
  if (!S.confirmSeen[i]) set({ confirmSeen: Object.assign({}, S.confirmSeen, { [i]: true }) });
});

document.addEventListener('change', (e) => {
  if (!e.target || !/^confirmWork-\d+$/.test(e.target.id)) return;
  const i = Number(e.target.id.slice(12));
  S.confirmWork[i] = e.target.value;
});

// Opening a "how this is calculated" accordion grows its own card without
// going through render(), a native <details> toggle, not a data-act click,
// so nothing tells the masonry layout a card underneath it needs to move.
// Capture phase because <details> toggle events do not reliably bubble
// across the browsers this needs to work in.
document.addEventListener('toggle', (e) => {
  if (!e.target || !e.target.classList || !e.target.classList.contains('bl-acc')) return;
  requestAnimationFrame(layoutDashMasonry);
}, true);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target && e.target.id === 'authEmail') submitEmail();
});

/* Dashboard block reordering. Reorder happens once, on drop, not live on
   every dragover, this build has no virtual DOM so a re-render mid-drag
   would tear down the very node the browser is tracking as the drag
   source. One render at the end is the version that cannot get that wrong. */
document.addEventListener('dragstart', (e) => {
  const el = e.target.closest && e.target.closest('.dash-block');
  if (!el) return;
  dashDragId = el.dataset.dashId;
  if (e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dashDragId); } catch(err){} }
});
document.addEventListener('dragover', (e) => {
  if (!dashDragId) return;
  if (e.target.closest && e.target.closest('.dash-block')) e.preventDefault();
});
document.addEventListener('drop', (e) => {
  const dragged = dashDragId;
  dashDragId = null;
  if (!dragged) return;
  const el = e.target.closest && e.target.closest('.dash-block');
  if (!el) return;
  e.preventDefault();
  const targetId = el.dataset.dashId;
  if (targetId === dragged) return;
  const order = S.dashLayout.slice();
  const from = order.indexOf(dragged);
  const to = order.indexOf(targetId);
  if (from === -1 || to === -1) return;
  order.splice(from, 1);
  order.splice(to, 0, dragged);
  set({ dashLayout: order });
});
document.addEventListener('dragend', () => { dashDragId = null; });

/* Every screen the sign-in rail used to list, still addressable, just not
   advertised. `?screen=expired` opens the dead-link screen, `?view=rates` opens
   a page of the app. An unknown key is ignored rather than blanking the page,
   because the one thing a demo link must never do is open to nothing.
   `?screen=` also survives a reload, which the old rail did not. */
function bootScreen(){
  let q;
  try { q = new URLSearchParams(location.search); } catch(e){ return; }

  const screen = q.get('screen');
  if (screen && AUTH_SCREENS.some(([k]) => k === screen)){
    S.stage = 'auth';
    S.screen = screen;
    return;
  }

  /* COPY is keyed by view, so it is the list of views by construction and a new
     page cannot be added without becoming addressable. */
  const view = q.get('view');
  if (view && Object.prototype.hasOwnProperty.call(COPY, view)){
    S.stage = 'app';
    S.view = view;
  }
}

bootScreen();
render();
</script>
