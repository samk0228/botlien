        + '<div style="font-size:14px;font-weight:500;color:var(--fg1)">Harbor Grill Group</div>'
        + '<div style="font-size:12.5px;color:var(--fg3);margin-top:4px">Owner Sam Ortega · Pier 4, Marina, Airport · 13 robots</div></div>'
      + '<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">'
        + '<button type="button" data-act="requestAccess" class="hv-dim9 press9" style="padding:15px 22px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:pointer;font-size:14.5px;font-weight:600">Ask Sam for access</button>'
        + '<button type="button" data-act="authScreen" data-key="landed-new" style="padding:14px 20px;border-radius:4px;border:none;background:transparent;color:var(--fg2);cursor:pointer;font-size:13.5px;font-weight:500;text-decoration:underline;text-underline-offset:3px">Start a separate workspace</button></div>'
      + '<p style="font-size:12.5px;line-height:1.6;color:var(--fg3);margin:28px 0 0">We match on the part of your email after the @. A separate workspace is sometimes right, for a franchisee who does not share a lease, so it stays available.</p>';
  }

  if (sc === 'expired'){
    body += '<img src="'+LOGO+'" alt="Botlien" style="width:26px;height:32px;object-fit:contain;filter:var(--mark);margin-bottom:28px">'
      + '<h1 style="font-size:clamp(26px,4.6vw,34px);font-weight:600;letter-spacing:-0.03em;line-height:1.15;margin:0 0 12px">That link has expired</h1>'
      + '<p style="font-size:14.5px;line-height:1.65;color:var(--fg2);margin:0 0 36px">They last 15 minutes and work once.</p>'
      + '<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">'
        + '<button type="button" data-act="sendNewLink" class="hv-dim9 press9" style="padding:15px 22px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:pointer;font-size:14.5px;font-weight:600">Send a new link</button>'
        + '<button type="button" data-act="differentEmail" style="padding:14px 20px;border-radius:4px;border:none;background:transparent;color:var(--fg2);cursor:pointer;font-size:13.5px;font-weight:500;text-decoration:underline;text-underline-offset:3px">Use a different email</button>'
      + '</div>';
  }

  if (sc === 'profile'){
    body += '<div style="font-size:11.5px;font-weight:600;color:var(--fg3);margin-bottom:14px">In the statement header</div>'
      + '<h1 style="font-size:clamp(24px,4.2vw,30px);font-weight:600;letter-spacing:-0.03em;line-height:1.15;margin:0 0 32px">Profile menu</h1>'
      + '<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><div style="width:42px;height:42px;border-radius:4px;background:var(--ink);color:var(--ink-fg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600">HG</div></div>'
      + '<div style="border:1px solid var(--hair2);border-radius:4px;max-width:280px;margin-left:auto">'
        + '<div style="padding:16px 18px;border-bottom:1px solid var(--hair)"><div style="font-size:14px;font-weight:500;color:var(--fg1)">Sam Ortega</div><div style="font-size:12.5px;color:var(--fg3);margin-top:3px">sam@harborgrill.com</div></div>'
        + '<div data-act="authScreen" data-key="sessions" class="hv-ghost" style="padding:13px 18px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--fg1)">Settings</div>'
        + '<div data-act="logOut" class="hv-ghost" style="padding:13px 18px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--fg1);border-top:1px solid var(--hair)">Log out</div>'
      + '</div>'
      + '<p style="font-size:12.5px;line-height:1.6;color:var(--fg3);margin:24px 0 0;text-align:right">Three items. It is a menu, not a page.</p>';
  }

  if (sc === 'sessions'){
    body += '<div style="font-size:11.5px;font-weight:600;color:var(--fg3);margin-bottom:14px">Settings · Account</div>'
      + '<h1 style="font-size:clamp(24px,4.2vw,30px);font-weight:600;letter-spacing:-0.03em;line-height:1.15;margin:0 0 12px">Signed in on these devices</h1>'
      + '<p style="font-size:14.5px;line-height:1.65;color:var(--fg2);margin:0 0 24px">Signing out one device leaves you here. Signing out everywhere returns you to sign in.</p>'
      + S.authSessions.map((d,i) =>
        '<div style="display:flex;align-items:center;gap:16px;padding:18px 2px;border-top:1px solid var(--hair)">'
        + '<div><div style="font-size:14px;font-weight:500;color:var(--fg1)">'+d.device+'</div><div style="font-size:12.5px;color:var(--fg3);margin-top:3px;font-variant-numeric:tabular-nums">'+d.last+'</div></div>'
        + '<button type="button" data-act="dropSession" data-i="'+i+'" class="hv-ghost" style="margin-left:auto;padding:9px 14px;border-radius:4px;border:1px solid var(--hair2);background:transparent;color:var(--fg1);cursor:pointer;font-size:12.5px;font-weight:500">Sign out</button></div>').join('')
      + (S.authSessions.length === 0 ? '<div style="border-top:1px solid var(--hair);padding:22px 2px;font-size:13.5px;color:var(--fg2)">Only this device is signed in now.</div>' : '')
      + '<button type="button" data-act="logOut" class="hv-dim9" style="margin-top:28px;padding:14px 20px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:pointer;font-size:13.5px;font-weight:600">Sign out everywhere</button>';
  }

  if (sc === 'already'){
    body += '<div style="min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center">'
      + '<img src="'+LOGO+'" alt="Botlien" style="width:26px;height:32px;object-fit:contain;filter:var(--mark)">'
      + '<span data-act="toApp" style="font-size:13.5px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Coverage statement</span>'
      + '<p style="font-size:12.5px;color:var(--fg3);margin:0;max-width:44ch;line-height:1.6">A signed-in visit to sign in never renders. It resolves to the statement before anything paints, with no "already logged in" message.</p></div>';
  }

  return '<div data-stage style="padding:72px 40px 80px;display:flex;justify-content:center">'
    + '<div style="width:100%;max-width:440px">' + body
    + '<div style="margin-top:56px;padding-top:24px;border-top:1px solid var(--hair);font-size:12px;color:var(--fg3);line-height:1.6">Nothing is charged until you choose a paid plan. Botlien prices the work your robots performed against what you pay to lease them, and makes no other claim.</div>'
    + '</div></div>';
}

/* ─────────────────────────  APP VIEW  ───────────────────────── */

// Menu button sizing/spacing/color below matches shadcn/ui's
// sidebarMenuButtonVariants exactly (rounded-md, p-2, gap-2, text-sm,
// size-4 icons; group-data-[collapsible=icon]:size-8 when collapsed),
// pulled from `shadcn view sidebar`, not eyeballed off a screenshot.
function appRail(){
  // A collapsed icon rail is a desktop idea: it trades labels for width on
  // a screen that has width to trade. Below 900px the sidebar is not a rail
  // at all, it is a topbar behind a hamburger, so a collapsed flag carried
  // over from a desktop session would strip every label and leave a row of
  // unlabelled icons stretched across the full width. Ignored here.
  // Icon-only on every desktop width now: the top bar carries the page
  // title, so the rail has nothing left to say in words. Below 900px it is
  // still the hamburger topbar, where labels are the whole point.
  const collapsed = !isPhoneLayout();
  const nav = (k) => {
    const on = S.view === k || (k === 'robots' && S.view === 'robot') || (k === 'setup' && S.view === 'numbersRobot');
    return { bg: on ? 'var(--sb-accent)' : 'transparent', fg: on ? 'var(--sb-accent-fg)' : 'var(--sb-fg)', fw: on ? 500 : 400 };
  };
  const item = (k, icon, label, extra) => {
    const n = nav(k);
    // The label is always in the markup. At 64px the rail hides it; while
    // the rail is hovered (it widens to 240px over the page) it shows.
    const dot = (collapsed && extra) ? '<span data-rail-dot style="position:absolute;top:8px;left:27px;width:7px;height:7px;border-radius:50%;background:var(--sb-accent-fg)"></span>' : '';
    return '<div data-act="go" data-view="'+k+'" class="hv-sb" title="'+(collapsed?label:'')+'" style="position:relative;display:flex;align-items:center;box-sizing:border-box;'+(collapsed?'width:100%;height:40px;margin:0 0 4px;padding:0 11px;gap:12px;':'width:100%;height:36px;gap:8px;padding:8px;')+'border-radius:6px;cursor:pointer;font-size:14px;font-weight:'+n.fw+';color:'+n.fg+';background:'+n.bg+'">'
      + ic(icon,collapsed?18:16)
      + '<span data-rail-label style="display:flex;align-items:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+label+(extra||'')+'</span>'
      + dot
    + '</div>';
  };
  // Live count, not a number typed once: an edit on Setup that pushes a
  // robot under its lease, or pulls it back over, has to show up here too,
  // the same instant it shows up as a caution mark on Fleet.
  const attnCount = computeStatement(true, scopeFilter()).rows.filter(r => !r.excluded && r.cov !== null && r.cov < 1).length;
  const badge = !attnCount ? '' : '<span data-act="attention" style="margin-left:auto;font-size:12px;font-weight:600;color:var(--sb-accent-fg)">'+attnCount+'</span>';

  // Which site is in view already lives in the dashboard's own scope
  // filter (All 3 sites / Pier 4 / Marina / Airport, next to Customize),
  // so a second site switcher up here was showing the same choice twice.
  // The brand block is identity, not a site picker, no dropdown. Its icon
  // is still a control though: it's the sidebar collapse toggle now (see
  // brandIcon below), not a separate permanent button.

  // shadcn's SidebarRail: an invisible 4px drag-strip along the border, a
  // second way to collapse besides the brand badge, cursor swaps to a
  // resize cursor and the border itself highlights on hover.
  // Nothing to drag any more: the rail has one width.
  const rail = '';

  // The collapse/expand control used to also live as a bordered chevron
  // button that sat in the header permanently (see appHeader). Now it's
  // just this badge: hover swaps the logo for a sidebar glyph (reads as
  // "toggle the sidebar" more directly than a bare arrow did), click
  // toggles, unhover swaps it back. One control instead of two.
  // Identity only. It used to double as the collapse toggle; there is
  // nothing to collapse now, so hovering it no longer offers an action.
  const brandIcon = '<div data-act="go" data-view="dashv2" title="Botlien" style="position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:6px;flex:none;background:rgba(255,255,255,.12);cursor:pointer">'
    + '<img class="bl-brand-logo" src="'+LOGO+'" alt="Botlien" style="width:18px;height:22px;object-fit:contain;filter:brightness(0) invert(1)">'
  + '</div>';
  const bizName = S.demoMode ? 'Anchorpoint Fulfillment' : 'Harbor Grill Group';
  const brand = collapsed
    ? '<div title="'+bizName+'" style="display:flex;align-items:center;gap:10px;width:100%;height:48px;padding:0 4px;box-sizing:border-box">'
      + brandIcon
      + '<span data-rail-label style="font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sb-accent-fg)">'+bizName+'</span>'
    + '</div>'
    : '<div style="flex:1;min-width:0;height:48px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px">'
      + brandIcon
      + '<span style="font-size:14px;font-weight:500;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sb-fg)">'+bizName+'</span>'
      + '</div>';

  // Hamburger only exists below 900px (.bl-mobile-toggle), everything it
  // opens is the same nav and account rows that already render for desktop,
  // just hidden by default at that width until this flips the open class.
  const mobileToggle = '<div data-act="toggleMobileNav" class="bl-mobile-toggle hv-sb" title="'+(S.mobileNavOpen?'Close menu':'Menu')+'" style="align-items:center;justify-content:center;width:32px;height:32px;flex:none;border:1px solid var(--sb-border);border-radius:6px;cursor:pointer;color:var(--sb-fg)">'
    + ic('equal', 16, S.mobileNavOpen ? 'transform:rotate(90deg)' : '') + '</div>';

  // variant="sidebar" (the default): flush against the edge, no rounding,
  // no shadow, no margin, just a hairline right border. Measured directly
  // off the real component at ui.shadcn.com/docs/components/base/sidebar
  // (padding:0, border-radius:0, box-shadow:none on the container), the
  // floating look from a prior pass was the wrong variant.
  // No padding on the aside itself: the header row, nav, and footer each
  // carry their own 8px (matching shadcn's real SidebarHeader/Content/
  // Footer, each p-2 independently, container itself at padding:0). Aside
  // ALSO having 8px was doubling the inset to 16px a side, which is what
  // was quietly halving every collapsed icon's box and reading as shoved
  // toward the right edge, not a centering bug at all, a padding bug.
  // z-index here, not just on the popups inside it: `sticky` gives the
  // aside its own stacking context, but with none on the aside itself the
  // dashboard's masonry cards (position:relative, later in the DOM inside
  // data-main) win ties in the parent context and paint over it, popups
  // included, so the profile dropdown or period picker read as translucent
  // with the chart bleeding through even though z-index:50 sits right on
  // them. That z-index only wins comparisons inside the aside's own
  // context; it can't out-rank a sibling context that has none at all.
  // Sits above the brand row, not inside it: this is about leaving the
  // demo entirely, a different action than the brand badge's own click
  // (which just toggles the sidebar). '/' is relative to wherever this
  // is served, botlien.com/demo → botlien.com/, so it always resolves to
  // the real marketing site regardless of host.
  const demoBanner = !S.demoMode ? '' : '<a href="/" title="Exit demo, back to botlien.com" style="display:flex;align-items:center;gap:7px;justify-content:'+(collapsed?'center':'flex-start')+';margin:8px 8px 0;padding:7px 8px;border:1px solid var(--sb-border);border-radius:6px;font-size:11px;font-weight:600;color:var(--sb-fg);text-decoration:none;cursor:pointer">'
    + ic('home',14) + (collapsed ? '' : '<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Demo &middot; Home</span>')
  + '</a>';

  return '<aside data-side class="'+(S.mobileNavOpen?'bl-mobile-open':'')+'" style="position:sticky;top:0;z-index:10;display:flex;flex-direction:column;height:100vh;background:var(--sb-bg);color:var(--sb-fg);border-right:1px solid var(--sb-border)">'
    + rail
    + demoBanner
    + '<div style="position:relative;display:flex;gap:8px;align-items:stretch;padding:'+(collapsed?'8px 8px 10px':'8px 8px 4px')+'">' + brand + mobileToggle + '</div>'
    // Plain block stacking, not flex: a flex child's cross-axis width is
    // subject to the flex sizing algorithm no matter what display the
    // child itself declares, which is what was quietly shrinking the ul to
    // a fraction of nav's width and pushing every icon toward the right
    // edge instead of centering it. Block guarantees full-width, no quirk.
    // Flattened: no <ul> wrapper. It measured itself as a fraction of
    // nav's own width no matter how explicitly it was told to fill 100%
    // (nav is itself a flex child of the aside, and something about that
    // nesting kept resolving the ul's width against the wrong box), which
    // left every fixed-width collapsed icon overflowing out of a too-narrow
    // ul and reading as shoved toward the right edge. One fewer box in the
    // chain removes the whole problem instead of chasing it.
    + '<nav data-nav style="display:block;width:100%;box-sizing:border-box;padding:'+(collapsed?'4px 12px':'8px')+';overflow-y:auto;overflow-x:hidden">'
      + item('dashv2','equal','Dashboard')
      + item('robots','boxes','Fleet', badge)
      + item('costs','ruler','Costs')
      + item('trends','trending-up','Trends')
      + item('payback','coins','Payback')
      + item('contract','file-text','Contract')
      + item('decisions','route','Decisions')
      + item('benchmark','users','Benchmark')
      + '<div style="height:1px;background:var(--sb-border);margin:8px 6px"></div>'
      + item('incidents','list','Incidents')
      + item('vendors','building','Vendors')
      + item('setup','sliders-horizontal','Numbers')
    + '</nav>'
    // shadcn's NavUser pattern: the footer is ONE SidebarMenuButton (the
    // account trigger), not a stack of separate rows. Notifications and
    // Settings used to each get their own permanent row down here; the real
    // component instead folds everything but the account row itself into a
    // dropdown that opens off the trigger, so collapsed mode is one icon,
    // not four.
    // The account trigger lives in the top bar now (see accountMenu). The
    // rail's foot is Settings alone, the reference's one fixed anchor.
    + '<div data-side-foot style="margin-top:auto;padding:'+(collapsed?'8px 12px 14px':'8px')+'">'
      + item('settings','settings','Settings')
    + '</div></aside>';
}

/** The account trigger and its menu, in the top bar. Same rows the rail
 *  footer used to hold, same popover; it anchors down from the avatar
 *  instead of up from the rail. */
function accountMenu(){
  return '<div style="position:relative">'
      + '<div data-act="toggleProfile" class="hv-ghost" title="Account" style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:6px;cursor:pointer;background:'+(S.profileOpen?'var(--ghost)':'transparent')+'">'
        + avatarBadge(32)
      + '</div>'
      + (S.profileOpen
        ? '<div data-pop-back></div><div data-pop style="position:absolute;top:calc(100% + 8px);right:0;width:240px;background:var(--menu);border:1px solid var(--hair2);border-radius:6px;z-index:50;box-shadow:0 8px 24px rgba(10,10,10,.14);padding:4px;box-sizing:border-box">'
          + '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px 10px">'
            + avatarBadge(32)
            + '<div style="display:flex;flex-direction:column;line-height:1.25;min-width:0;overflow:hidden"><span style="font-size:13.5px;font-weight:500;color:var(--fg1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(S.demoMode?'Demo Account':'Sam Ortega')+'</span><span style="font-size:11.5px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(S.demoMode?'demo@botlien.com':S.accountEmail)+'</span></div>'
          + '</div>'
          + '<div style="height:1px;background:var(--hair);margin:2px 0"></div>'
          + '<div data-act="go" data-view="alerts" class="hv-ghost" style="position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--fg1)">'
            + ic('bell',15,'color:var(--fg3)') + 'Notifications'
            + '<i style="margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--ink)"></i>'
          + '</div>'
          // Settings is safe to expose in demo mode now: every destructive
          // control on it (delete account, invite someone, import usage)
          // already routes through notInDemo, an info-only toggle, not the
          // real action, same pattern used everywhere else in this app.
          // Log out stays gated, that one still drops a visitor into the
          // real sign-in/onboarding flow, exactly what demo mode skips.
          + '<div data-act="go" data-view="settings" class="hv-ghost" style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--fg1)">'+ic('settings',15,'color:var(--fg3)')+'Settings</div>'
          + (S.demoMode ? '' : '<div style="height:1px;background:var(--hair);margin:2px 0"></div><div data-act="logOut" class="hv-ghost" style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--fg1)">'+ic('log-out',15,'color:var(--fg3)')+'Log out</div>')
        + '</div>'
        : '')
    + '</div>';
}

/** The launcher: a grid button that opens grouped shortcuts to things the
 *  app already does. Nothing here is new behaviour, only a second door to
 *  actions that otherwise live three clicks deep on other pages. */
function appsMenu(){
  const tile = (icon, label, attrs) => '<div '+attrs+' class="hv-ghost" style="display:flex;flex-direction:column;align-items:center;gap:9px;width:104px;padding:10px 4px 8px;border-radius:6px;cursor:pointer;text-align:center">'
    + '<span style="width:40px;height:40px;border-radius:6px;background:var(--ghost);display:flex;align-items:center;justify-content:center;color:var(--fg1)">'+ic(icon,18)+'</span>'
    + '<span style="font-size:12.5px;line-height:1.35;color:var(--fg2)">'+label+'</span></div>';
  const group = (title, tiles) => '<div style="padding:12px 14px 10px">'
    + '<div style="font-size:12.5px;font-weight:600;color:var(--fg2);margin:0 0 8px 4px">'+title+'</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:4px">'+tiles+'</div></div>';
  return '<div style="position:relative">'
    + '<div data-act="toggleApps" class="hv-ghost" title="Shortcuts" style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:6px;cursor:pointer;color:var(--fg2);background:'+(S.appsOpen?'var(--ghost)':'transparent')+'">'+ic('grid-3x3',18)+'</div>'
    + (!S.appsOpen ? '' : '<div data-pop-back></div><div data-pop style="position:absolute;top:calc(100% + 8px);right:0;width:372px;background:var(--menu);border:1px solid var(--hair2);border-radius:12px;z-index:50;box-shadow:0 8px 24px rgba(10,10,10,.14);box-sizing:border-box">'
      + group('Data', tile('upload-cloud','Import usage','data-act="go" data-view="start"'))
      + '<div style="height:1px;background:var(--hair)"></div>'

// No export entry point anywhere yet (header button, the account-settings
// download section) until there is a real, curated export experience to
// send people to. A button that opens a "CSV or PDF" menu was standing in
// for a page that does not exist; better to have no export affordance at
// all than one that promises more than a demo download.
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
// The calendar can't navigate past what DAILY actually has data for.
const CAL_MIN = { y:2026, m:2 }; // March 2026, PERIODS[5].start
const CAL_MAX = { y:2026, m:8 }; // September 2026, PERIODS[0].end

function fmtDateShort(key){
  const d = new Date(key+'T00:00:00Z');
  return MONTH_NAMES[d.getUTCMonth()].slice(0,3)+' '+d.getUTCDate()+', '+d.getUTCFullYear();
}

// Start/end in chronological order regardless of which day the drag
// started on, dragging right-to-left is just as valid as left-to-right.
function calRangeSorted(){
  if (!S.calDragStart) return null;
  const a = S.calDragStart, b = S.calDragHover || S.calDragStart;
  return a <= b ? { start:a, end:b } : { start:b, end:a };
}

// One shape for "what period are we looking at" whether it came from a
// PERIODS preset or a custom calendar drag, so appHeader and the picker's
// own label never need two separate code paths.
function effectivePeriod(){
  if (S.dashRange){
    const days = daysBetweenInclusive(S.dashRange.start, S.dashRange.end);
    const isOpen = S.dashRange.end >= PERIODS[0].end;
    return {
      label: S.dashRange.start === S.dashRange.end ? fmtDateShort(S.dashRange.start) : fmtDateShort(S.dashRange.start)+' – '+fmtDateShort(S.dashRange.end),
      status: isOpen ? 'open' : 'closed',
      closed: isOpen ? '' : 'Closed '+fmtDateShort(addDaysKey(S.dashRange.end,1)),
      days, isCustom: true,
    };
  }
  const p = PERIODS[S.period];
  return { label:p.label, status:p.status, closed:p.closed, days:daysBetweenInclusive(p.start,p.end), isCustom:false };
}

// The calendar dropdown: a real month grid you can drag a range across,
// plus the 6 fixed periods kept underneath as one-click shortcuts. Replaces
// what used to be just that flat list.
function renderCalendar(){
  const y = S.calYear, m = S.calMonth;
  const startDow = new Date(Date.UTC(y,m,1)).getUTCDay();
  const daysInMonth = new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const todayKey = PERIODS[0].end;
  const active = calRangeSorted() || S.dashRange;
  const atMin = y === CAL_MIN.y && m === CAL_MIN.m;
  const atMax = y === CAL_MAX.y && m === CAL_MAX.m;

  let cells = '';
  for (let i = 0; i < startDow; i++) cells += '<div></div>';
  for (let d = 1; d <= daysInMonth; d++){
    const key = dateKey(new Date(Date.UTC(y,m,d)));
    const isFuture = key > todayKey;
    const inRange = !isFuture && active && key >= active.start && key <= active.end;
    const isEdge = inRange && (key === active.start || key === active.end);
    const bg = isEdge ? 'var(--ink)' : (inRange ? 'var(--ghost2)' : 'transparent');
    const fg = isEdge ? 'var(--ink-fg)' : 'var(--fg1)';
    cells += '<div'+(isFuture?'':' data-cal-day="'+key+'"')+' style="text-align:center;padding:7px 0;font-size:12.5px;font-variant-numeric:tabular-nums;border-radius:4px;background:'+bg+';color:'+fg+';user-select:none;'+(isFuture?'opacity:0.3;':'cursor:pointer;')+'">'+d+'</div>';
  }

  const rangeLabel = active ? (active.start === active.end ? fmtDateShort(active.start) : fmtDateShort(active.start)+' – '+fmtDateShort(active.end)) : '<span data-hint-fine>Drag across days to pick a range</span><span data-hint-coarse>Tap the first day, then the last</span>';

  return '<div style="width:320px;background:var(--menu);border:1px solid var(--hair2);border-radius:6px;padding:16px" data-cal-root>'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'
      + '<button type="button" data-act="calPrevMonth"'+(atMin?' disabled':'')+' style="border:none;background:transparent;cursor:'+(atMin?'default':'pointer')+';opacity:'+(atMin?'0.3':'1')+';padding:4px;display:flex;color:var(--fg2)">'+ic('chevron-down',15,'transform:rotate(90deg)')+'</button>'
      + '<div style="font-size:13px;font-weight:600;color:var(--fg1)">'+MONTH_NAMES[m]+' '+y+'</div>'
      + '<button type="button" data-act="calNextMonth"'+(atMax?' disabled':'')+' style="border:none;background:transparent;cursor:'+(atMax?'default':'pointer')+';opacity:'+(atMax?'0.3':'1')+';padding:4px;display:flex;color:var(--fg2)">'+ic('chevron-down',15,'transform:rotate(-90deg)')+'</button>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px">'
      + ['S','M','T','W','T','F','S'].map(d => '<div style="text-align:center;font-size:10.5px;font-weight:600;color:var(--fg3);padding:4px 0">'+d+'</div>').join('')
    + '</div>'
    + '<div data-cal-grid style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px">'+cells+'</div>'
    + '<div style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--hair);font-size:12px;color:var(--fg2)">'
      + '<span style="font-variant-numeric:tabular-nums">'+rangeLabel+'</span>'
      + (S.dashRange ? '<span data-act="calClear" class="hv-fade" style="cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:2px">Clear</span>' : '')
    + '</div>'
  + '</div>';
}

// Smooth curve through points, cubic Bezier via Catmull-Rom (tension 1/6),
// the same "natural" interpolation a real charting library defaults to.
// No library here to import that curve math from, so it's reproduced by
// hand, same as every other visual this app draws itself.
function smoothPath(pts){
  if (pts.length < 2) return '';
  if (pts.length === 2) return 'M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1)+' L'+pts[1][0].toFixed(1)+','+pts[1][1].toFixed(1);
  let d = 'M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
  for (let i=0; i<pts.length-1; i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1x = p1[0]+(p2[0]-p0[0])/6, c1y = p1[1]+(p2[1]-p0[1])/6;
    const c2x = p2[0]-(p3[0]-p1[0])/6, c2y = p2[1]-(p3[1]-p1[1])/6;
    d += ' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);
  }
  return d;
}

// One inline chart, hand-drawn SVG, same as every other visual in this
// app (duty bars, condition bars, the sensitivity slider), not a
// charting dependency for six points. points is oldest-to-newest,
// {value, label, current}. opts.reference draws a dashed line at that
// value (coverage's 1.0x breakeven). opts.area fills a gradient under a
// dot-free curve instead, for the area-chart look; without it this
// draws the dotted line-chart look.
function sparklineChart(points, opts){
  opts = opts || {};
  const W = 560, H = 100, padX = 10, padY = 14;
  const vals = points.map(p => p.value);
  const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  const span0 = (max - min) || 1;
  // A reference line above (or below) every point is the whole finding on
  // the payback curves: the price a robot has not earned back yet. Widen
  // the plot to hold it rather than silently dropping it.
  const refIn = opts.forceReference && opts.reference != null;
  const minV = refIn ? Math.min(min, opts.reference) : min;
  const maxV = refIn ? Math.max(max, opts.reference) : max;
  const span = (maxV - minV) || span0;
  const lo = minV - span*0.3, hi = maxV + span*0.3;
  const plotH = H - padY*2;
  const baseY = padY + plotH;
  const x = (i) => padX + (i/(points.length-1)) * (W - padX*2);
  const y = (v) => padY + plotH - ((v - lo)/(hi - lo)) * plotH;
  const coords = points.map((p,i) => [x(i), y(p.value)]);
  const linePath = smoothPath(coords);
  const refLine = (opts.reference == null || opts.reference < lo || opts.reference > hi) ? '' :
    '<line x1="'+padX+'" y1="'+y(opts.reference).toFixed(1)+'" x2="'+(W-padX)+'" y2="'+y(opts.reference).toFixed(1)+'" stroke="var(--hair2)" stroke-width="1" stroke-dasharray="3,4"/>';
  const area = !opts.area ? '' :
    '<defs><linearGradient id="'+opts.gradientId+'" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="5%" stop-color="var(--ink)" stop-opacity="0.32"/>'
      + '<stop offset="95%" stop-color="var(--ink)" stop-opacity="0.03"/>'
    + '</linearGradient></defs>'
    + '<path d="'+linePath+' L'+x(points.length-1).toFixed(1)+','+baseY.toFixed(1)+' L'+x(0).toFixed(1)+','+baseY.toFixed(1)+' Z" fill="url(#'+opts.gradientId+')" stroke="none"/>';
  const dots = opts.dots === false ? '' : points.map((p,i) => '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.value).toFixed(1)+'" r="'+(p.current?4:2.5)+'" fill="'+(p.current?'var(--ink)':'var(--fg3)')+'"/>').join('');
  const svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:100px;display:block;overflow:visible">'
    + area + refLine
    + '<path d="'+linePath+'" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    + dots
  + '</svg>';
  // Labels are plain HTML below the SVG, not text inside it. The SVG
  // stretches non-uniformly (preserveAspectRatio="none") to fill
  // whatever width the card ends up at, fine for a line's shape, but it
  // warps SVG text into something too wide at a full-screen viewport and
  // too narrow at a small one. Flexbox gives every label its own real,
  // correctly-proportioned font size regardless of chart width.
  const labels = '<div style="display:flex;justify-content:space-between;margin-top:6px">'
    + points.map((p,i) => {
      const end = i === 0 || i === points.length-1;
      return '<div style="text-align:'+(i===0?'left':i===points.length-1?'right':'center')+';min-width:0">'
        + (end ? '<div style="font-size:11px;font-weight:600;color:var(--fg1);white-space:nowrap">'+esc(opts.formatValue(p.value))+'</div>' : '')
        + '<div style="font-size:10.5px;color:var(--fg3);white-space:nowrap">'+esc(p.label)+'</div>'
      + '</div>';
    }).join('')
  + '</div>';
  return svg + labels;
}

// Pier 4's 6 periods were always real, the card just refused to chart
// them, one point looked like a fake trend even though five closed
// periods already sat in PERIODS. Marina and Airport now carry the same
// history (see PERIODS above), so every site scope, and "all 3 sites,"
// gets the real chart instead of only Pier 4 qualifying. Dotted line,
// grid, and a trend footer, the shadcn line-chart look.
function recapCard(opts){
  const o = opts || {};
  const s = computeStatement();
  if (s.mode === 'estimate'){
    const none = '<div style="font-size:13.5px;font-weight:600;color:var(--fg1);margin-bottom:8px">Coverage over time</div>'
      + '<div style="font-size:13px;color:var(--fg2);line-height:1.6">A typed estimate has no period history behind it. Import your export and six months of real periods fill in here.</div>';
    return o.bare ? none : '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'+none+'</div>';
  }
  const points = PERIODS.slice().reverse().map(p => ({
    value: covForPeriod(p, S.dashScope), label: p.label.slice(0,3), current: p.status === 'open'
  }));
  const avg = points.reduce((a,p) => a+p.value, 0) / points.length;
  const first = points[0].value, last = points[points.length-1].value;
  const pctChange = first ? ((last - first) / first) * 100 : 0;
  const up = pctChange >= 0;
  const inner = '<div data-act="go" data-view="coverage" class="hv-ghost" role="button" title="Open the full history" style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 -6px 12px;padding:2px 6px;border-radius:6px;cursor:pointer">'
      + '<div style="font-size:13.5px;font-weight:600;color:var(--fg1)">Coverage over time</div>'
      + '<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg3)">6-month average '+avg.toFixed(2)+'x'+ic('chevron-right',14,'color:var(--fg3)')+'</span>'
    + '</div>'
    + sparklineChart(points, { reference:1, formatValue: v => v.toFixed(2)+'x' })
    + '<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--fg1);padding:14px 0 4px;border-top:1px solid var(--hair);margin-top:4px">'
      + ic(up?'trending-up':'trending-down',14)
      + 'Trending '+(up?'up':'down')+' '+Math.abs(pctChange).toFixed(1)+'% over 6 months'
    + '</div>'
    + '<div style="font-size:11.5px;color:var(--fg3);padding-bottom:14px">Showing coverage for the last 6 periods</div>';
  return o.bare ? inner : '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 0;overflow:hidden">'+inner+'</div>';
}

// Same data shape as coverage, average fleet duty against declared
// operating hours instead of work against lease cost. Gradient-filled
// area instead of a dotted line, the shadcn area-chart look, no 1.0x
// reference either, utilization has no breakeven, just a rate.
function utilizationCard(opts){
  const o = opts || {};
  const s = computeStatement();
  if (s.mode === 'estimate'){
    const none = '<div style="font-size:13.5px;font-weight:600;color:var(--fg1);margin-bottom:2px">Utilization</div>'
      + '<div style="font-size:13px;color:var(--fg2);line-height:1.6">Needs the robot&#39;s reported duty hours, not just its task count. Available once your export or live connection includes it.</div>';
    return o.bare ? none : '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'+none+'</div>';
  }
  const points = PERIODS.slice().reverse().map(p => ({
    value: utilForPeriod(p, S.dashScope), label: p.label.slice(0,3), current: p.status === 'open'
  }));
  const avg = points.reduce((a,p) => a+p.value, 0) / points.length;
  const inner = '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px">'
      + '<div style="font-size:13.5px;font-weight:600;color:var(--fg1)">Utilization</div>'
      + '<span style="font-size:12px;color:var(--fg3)">6-month average '+Math.round(avg)+'%</span>'
    + '</div>'
    + sparklineChart(points, { formatValue: v => Math.round(v)+'%', area:true, gradientId:'utilAreaFill', dots:false });
  return o.bare ? inner : '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'+inner+'</div>';
}

/** One figure per tile on the Dashboard strip. Each reads the same
 *  calculation its panel does, so the tile and the panel cannot disagree. */
function utilSummary(){
  const s = computeStatement();
  if (s.mode === 'estimate') return { value:'—', unit:'' };
  const pts = PERIODS.map(p => utilForPeriod(p, S.dashScope));
  return { value: Math.round(pts.reduce((a,v) => a+v, 0) / pts.length)+'%', unit:'6-mo avg' };
}
function costSummary(){
  const scope = costScope();
  const rows = scope.rows;
  if (!rows.length) return { value:'—', unit:'' };
  const invoiceSum = rows.reduce((a,r) => a + r.invoice, 0);
  const valueSum = rows.reduce((a,r) => a + r.value, 0);
  const unitSum = rows.reduce((a,r) => a + r.units, 0);
  const keep = keepingFor(rows, S.stallMinutes);
  const human = scope.perUnit ? (unitSum > 0 ? valueSum / unitSum : null) : valueSum;
  const robot = scope.perUnit ? (unitSum > 0 ? invoiceSum / unitSum : null) : invoiceSum + keep.total;
  if (human === null || robot === null) return { value:'—', unit:'' };
  const gap = Math.abs(human - robot);
  const periodGap = scope.perUnit ? gap * unitSum : gap;
  return { value: money(Math.round(periodGap * 100) / 100), unit: human >= robot ? 'less than a person' : 'more than a person' };
}

// The coverage number, its delta, and its methodology, as one dashboard
// card in the same family as Coverage over time, Utilization, Needs
// attention, and Where the work is, not free-floating hero text sitting
// above the grid it belongs in.
function coverageKpiCard(opts){
  const o = opts || {};
  const s = computeStatement();
  const covLabel = s.coverage === null ? '—' : s.coverage.toFixed(2)+'x';
  const tag = s.mode === 'estimate'
    ? '<span style="font-size:12.5px;font-weight:600;color:var(--fg3);background:var(--ghost);padding:3px 8px;border-radius:3px">estimate, not measured</span>'
    : '<span style="font-size:12.5px;font-weight:600;color:var(--fg3);background:var(--ghost);padding:3px 8px;border-radius:3px">open period, still moving</span>';
  // Says what it is in the first line rather than behind a disclosure.
  // "How this number is calculated" was a dropdown holding a paragraph of
  // methodology, and an explainer that has to be opened reads as a warning
  // that the thing is hard. The scope is the part people actually need:
  // whose robots, how many, over what.
  const scopeWord = S.dashScope === 'all' ? 'all 3 sites' : SITES[S.dashScope].name;
  const subhead = s.mode === 'estimate'
    ? (s.manualRevenue > 0
      ? money(s.totalValue)+' of estimated work vs. '+money(s.totalInvoice)+' leased, from '+s.manualCount+' robot'+(s.manualCount===1?'':'s')+' at the numbers you typed in'
      : money(s.totalInvoice)+' of lease cost from '+s.manualCount+' robot'+(s.manualCount===1?'':'s')+'. Add what the work is worth per robot to see a coverage ratio.')
    : 'Your whole fleet across '+scopeWord+', '+s.included.length+' robot'+(s.included.length===1?'':'s')+' averaged together.';
  const under = s.mode === 'estimate' ? ''
    : 'Every $1 of lease bought '+(s.coverage === null ? '—' : '$'+s.coverage.toFixed(2))+' of work a person would otherwise have been paid to do. '
      + money(s.totalValue)+' of work against '+money(s.totalInvoice)+' leased.';
  // In the anchor row this is the figure the whole page is answering with,
  // so it is set at 48px and carries no card of its own: the row's single
  // hairline holds it and the comparison together.
  const figSize = o.big ? '48px' : 'clamp(28px,4.6vw,36px)';
  const inner = '<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px">'
      + '<div style="font-size:'+figSize+';font-weight:600;letter-spacing:-0.03em;line-height:1;color:var(--fg1);font-variant-numeric:tabular-nums">'+covLabel+'</div>'
      + tag
    + '</div>'
    + '<div style="font-size:13px;font-weight:500;color:var(--fg1);margin-bottom:8px">'+subhead+'</div>'
    + (under ? '<div style="font-size:12.5px;color:var(--fg2);line-height:1.65">'+under+'</div>' : '')
    + (s.mode === 'estimate' ? '<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--hair)"><button type="button" data-act="startRealImport" class="hv-dim" style="padding:11px 18px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:pointer;font-size:13px;font-weight:600">Import my export</button></div>' : '');
  return o.bare ? inner : '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'+inner+'</div>';
}

// A robot-level card with nothing to show has two honestly different
// reasons: no robots imported yet, or this demo simply not tracking that
// site per robot. Saying "No robots included yet" for the latter would
// read as if the site has no fleet at all, which is not true.
function noRobotNote(){
  return 'No robots included yet.';
}

// Named "Needs attention," so it has to actually mean that: robots under
// 1x coverage, not the whole fleet ranked. It used to render every
// included robot (the whole point of `sorted` staying separate below was
// just to compute `max` for the bar scale, not to list all of them), which
// looked fine at 6 robots on Pier 4 alone but read as "here's the entire
// fleet" once All 3 sites pulled in the full 13.
function attentionCard(){
  const s = computeStatement();
  const withCov = s.included.filter(r => r.cov !== null);
  const sorted = withCov.slice().sort((a,b) => b.cov - a.cov);
  const flaggedList = sorted.filter(r => r.cov < 1);
  const max = sorted.length ? Math.max.apply(null, sorted.map(r => r.cov)) * 1.05 : 1;
  const rows = flaggedList.map(r => {
    const pct = Math.min(100, (r.cov / max) * 100);
    return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0">'
      + '<span style="width:118px;flex:none;font-size:12.5px;font-weight:500;color:var(--fg1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.name)+'</span>'
      + '<div style="flex:1;height:8px;background:var(--ghost);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+pct.toFixed(1)+'%;background:var(--fg1)"></div></div>'
      + '<span style="width:44px;flex:none;text-align:right;font-size:12.5px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums">'+r.cov.toFixed(2)+'x</span>'
    + '</div>';
  }).join('');
  const flagged = flaggedList[0];
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px">'
      + '<div style="font-size:13.5px;font-weight:600;color:var(--fg1)">Needs attention</div>'
      + '<button type="button" data-act="go" data-view="robots" class="hv-ghost" style="font-size:12px;font-weight:500;color:var(--fg2);background:none;border:none;cursor:pointer">All robots →</button>'
    + '</div>'
    + (flagged ? '<div style="font-size:12px;color:var(--fg3);margin-bottom:12px">'+esc(flagged.name)+' is running under its lease</div>' : '')
    + '<div style="margin-top:6px">'+(rows || '<div style="font-size:13px;color:var(--fg3);padding:6px 0">Nothing under its lease right now, every included robot is covering its cost.</div>')+'</div>'
  + '</div>';
}

function workSplitCard(){
  const s = computeStatement();
  const total = s.totalValue;
  const rows = s.byCategory.map((k, i) => {
    const pct = total > 0 ? (k.value / total) * 100 : 0;
    return '<div style="margin-bottom:14px">'
      + '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px"><span style="font-weight:500;color:var(--fg1)">'+esc(k.work)+' · '+k.count+' '+(k.count===1?'robot':'robots')+'</span><span style="color:var(--fg2);font-variant-numeric:tabular-nums">'+money(k.value)+'</span></div>'
      + '<div style="height:8px;background:var(--ghost);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+(i===0?'var(--fg1)':'var(--hair3)')+'"></div></div>'
    + '</div>';
  }).join('');
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="font-size:13.5px;font-weight:600;color:var(--fg1);margin-bottom:2px">Where the work is</div>'
    + '<div style="font-size:12px;color:var(--fg3);margin-bottom:16px">Share of work serviced, by kind, this period</div>'
    + (rows || '<div style="font-size:13px;color:var(--fg3)">'+noRobotNote()+'</div>')
  + '</div>';
}

// Same reason as every other card here: one calculation (computeTaxShield),
// this card is just a view of it, never its own arithmetic. Rate/method
// inputs live-patch via applyTaxShield below instead of calling set(), same
// reason Setup's inputs do, a full re-render mid-keystroke would blow away
// focus in the very field being typed into.
function taxShieldSummary(){
  return money(computeTaxShield().shieldCents / 100)+' year-1 tax shield';
}

/** The rate tile as figure + unit, like every other tile: the coverage the
 *  assumption produces, then the assumption it rests on. */
function sensParts(){
  const base = sensBase();
  if (!base) return { value:'—', unit:'nothing to test' };
  const min = Math.max(1, Math.round(base.benchUnitsPerHour * 0.5));
  const max = Math.max(min + 1, Math.round(base.benchUnitsPerHour * 2));
  const t = Math.min(max, Math.max(min, S.throughput));
  return { value: calc(t, base).cov.toFixed(2)+'x', unit: 'at '+t+' '+base.unit+'s/hr' };
}

function sensitivitySummary(){
  const base = sensBase();
  if (!base) return 'nothing to test';
  const min = Math.max(1, Math.round(base.benchUnitsPerHour * 0.5));
  const max = Math.max(min + 1, Math.round(base.benchUnitsPerHour * 2));
  const t = Math.min(max, Math.max(min, S.throughput));
  return t+' '+base.unit+'s/hr = '+calc(t, base).cov.toFixed(2)+'x';
}

      + '<div><label for="taxInterestInput" style="display:block;font-size:11px;font-weight:600;color:var(--fg3);margin-bottom:6px">Financing rate</label>'
        + '<div style="display:flex;align-items:center;gap:4px;font-size:14px;color:var(--fg1)"><input id="taxInterestInput" type="text" inputmode="decimal" value="'+S.taxInterestRate+'" style="width:44px;font-size:14px;color:var(--fg1);background:transparent;padding:8px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-variant-numeric:tabular-nums">%</div></div>'

// Every block on the dashboard, keyed once, so the dashboard is just "which
// keys, in what order, hidden or not" rather than a hardcoded page. Adding a
// block anywhere else in the app later means adding one entry here.
const DASH_BLOCKS = {
  kpi:       { label: 'Coverage number',      render: coverageKpiCard },
  cost:      { label: 'Cost per run',         render: costCard },
  recap:     { label: 'Coverage over time',   render: recapCard },
  util:      { label: 'Utilization',          render: utilizationCard },
  attn:      { label: 'Needs attention',      render: attentionCard },
  work:      { label: 'Where the work is',    render: workSplitCard },
  taxshield: { label: 'Tax shield & depreciation', render: taxShieldCard, summary: taxShieldSummary },
  sens:      { label: 'Rate assumption',      render: sensitivityCard, summary: sensitivitySummary },
};
// kpi and cost are no longer blocks: they are the anchor row, which is
// fixed. Customize reorders bands two and three only.
const DASH_ANCHOR = ['kpi','cost'];
// Band three: real work, but not what the page is for. Collapsed to a title
// and its headline figure until asked for.
const DASH_BAND3 = ['taxshield','sens'];
const DASH_ORDER_DEFAULT = ['attn','work','taxshield','sens'];
const DASH_HIDDEN_DEFAULT = [];
let dashDragId = null; // which block is mid-drag; ephemeral, does not need a render (see dragstart/dragover/dragend below)

// The one unified dashboard: which site's telemetry it reads is the scope
// filter next to Customize (S.dashScope), Pier 4, Marina, and Airport all
// carry the same real per-robot detail now, "all 3 sites" sums across
// whichever aren't excluded rather than reading one site's total three
// times over.
function viewDashV2(){
  const layout = S.dashLayout.filter(id => DASH_BLOCKS[id] && DASH_ANCHOR.indexOf(id) < 0);
  const hidden = layout.filter(id => S.dashHidden.includes(id));
  const visible = layout.filter(id => !S.dashHidden.includes(id));
  const band3 = visible.filter(id => DASH_BAND3.indexOf(id) >= 0);
  const band2 = visible.filter(id => DASH_BAND3.indexOf(id) < 0);
  // Real masonry (see layoutDashMasonry below), not a row/column layout.
  // Grid and flexbox both size a whole row by its tallest member, so a
  // short card next to a tall one always leaves a gap somewhere, inside
  // itself if the row stretches, or below it if the row doesn't. A short
  // card's neighbor below has to wait for the tall card to end either way.
  // Masonry places each card in whichever column is shortest right now, so
  // nothing ever waits on a taller sibling. width/position get set by JS
  // after layout; this starting size is just what paints before that runs.
  // The reference's Insights shape: a strip of metric tiles, one selected,
  // and the panel beneath it. Coverage, the comparison, utilization, tax
  // shield and the rate assumption are the five figures the page has; each
  // is a tile, and its full card is the panel. Needs attention and Where
  // the work is stay as cards, beside and below, because they are not one
  // figure each.
  const s = computeStatement();
  const util = utilSummary(), cost = costSummary();
  const pb = computePayback();
  const tabs = [
    { id:'kpi',       label:'Coverage',               value: s.coverage === null ? '—' : s.coverage.toFixed(2)+'x', unit: s.mode === 'estimate' ? 'estimate' : 'this period' },
    { id:'cost',      label:'A person vs your robots', value: cost.value, unit: cost.unit },
    { id:'util',      label:'Utilization',            value: util.value, unit: util.unit },
    { id:'payback',   label:'Payback',                value: pb.rows.length ? pb.paid+' of '+pb.rows.length : '—', unit:'paid back' }
  ];
  const current = tabs.some(t => t.id === S.dashTab) ? S.dashTab : 'kpi';
  const panel = current === 'kpi'
    ? '<div data-split style="display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,1.4fr);gap:32px;align-items:start">'
        + '<div style="min-width:0">'+coverageKpiCard({ bare:true, big:true })+'</div>'
        + '<div style="min-width:0">'+recapCard({ bare:true })+'</div>'
      + '</div>'
    : current === 'cost' ? costCard({ bare:true })
    : current === 'util' ? utilizationCard({ bare:true })
    : current === 'payback' ? paybackDashPanel(pb)
    : coverageKpiCard({ bare:true, big:true });
  // Both cards live in one column, in the owner's own order, so Customize
  // can actually move them: two cards in two different containers had
  // nothing to reorder against each other. Needs attention first by
  // default, Where the work is under it.
  return '<div style="padding:0 0 8px;margin-bottom:40px">'
    + dashToolbar(hidden)
    + '<div data-dash-cols style="display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start">'
      + '<div style="min-width:0">'
        + metricTabs(tabs, current, 'dashTab')
        + metricPanel(panel)
      + '</div>'
      + '<div id="dashGrid" data-dash-single style="position:relative;min-width:0">' + band2.map(dashBlockWrap).join('') + '</div>'
    + '</div>'
    // Band three: real work, not what the page is for. Four tiles is the
    // limit on a strip, so the tax position and the rate assumption live
    // here, collapsed to a title and their one figure until asked for.
    + (band3.length ? '<div style="margin-top:20px">' + band3.map(dashBandRow).join('') + '</div>' : '')
  + '</div>';
}

/** The Dashboard's Payback tile panel. Reads computePayback(), never its
 *  own arithmetic, so the tile and the Payback page cannot disagree. */
function paybackDashPanel(p){
  if (!p.rows.length) return '<div style="font-size:13px;line-height:1.7;color:var(--fg2)">A typed estimate has no contract behind it, so there is nothing to compare a quote against yet.</div>';
  const pct = p.priceTotal > 0 ? Math.round(p.earnedTotal / p.priceTotal * 100) : 0;
  return '<div data-split style="display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,1.3fr);gap:30px;align-items:start">'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:18px">'
      + statRow('Paid back', String(p.paid), 'ahead of the quote')
      + statRow('On track', String(p.track), 'will beat the quote')
      + statRow('Behind', String(p.behind), p.missedCount ? (p.missedCount === 1 ? 'one past its promise' : p.missedCount+' past their promise') : 'still inside the quote')
    + '</div>'
    + '<div style="min-width:0">'
      + '<p style="font-size:14px;line-height:1.7;color:var(--fg2);margin:0 0 16px">Across all '+p.rows.length+' robots you have earned back '+money0(p.earnedTotal)+' of the '+money0(p.priceTotal)+' they cost, '+pct+'%.'
        + (p.fleetPace === null ? '' : ' At the pace of the last three months the fleet as a whole crosses its price in month '+p.fleetPace+' from the first contract.')+'</p>'
      + '<span data-act="go" data-view="payback" class="hv-fade" style="font-size:13px;font-weight:600;color:var(--fg1);cursor:pointer">Open Payback &rarr;</span>'
    + '</div>'
  + '</div>';
}

// One filter button with a dropdown, same pattern as the period picker up
// top: current selection on the button face, chevron, click opens a list
// of every option below it. Shared, literally the same S.dashScope state
// and this same control, by Dashboard, Fleet, and Numbers, so switching
// sites on any one of them moves all three. Loads on "All 3 sites," the
// combined figure, not any one site's own.
function scopeToggle(){
  const scopes = [{k:'all', label:'All 3 sites'}].concat(SITES.map((s,i) => ({k:String(i), label:s.name})));
  const current = scopes.find(sc => sc.k === String(S.dashScope));
  return '<div style="position:relative">'

      + ic('sliders-horizontal',13,'color:var(--fg3)') + current.label + ic('chevron-down',14,'color:var(--fg3)')

        + scopes.map((sc,i) => '<div data-act="setDashScope" data-scope="'+sc.k+'" class="hv-ghost" style="padding:11px 14px;cursor:pointer;font-size:13px;font-weight:'+(sc.k===String(S.dashScope)?600:400)+';color:var(--fg1);border-bottom:'+(i<scopes.length-1?'1px solid var(--hair)':'none')+'">'+sc.label+'</div>').join('')
