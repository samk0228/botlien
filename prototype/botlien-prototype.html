html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
*{box-sizing:border-box}

:root{
  --page:#FFFFFF;
  --page-bg:#FFFFFF;
  --fg1:#16204A; --fg2:#6B7392; --fg3:#9AA1BC;
  --ink:#0A0A0A; --ink-fg:#FFFFFF;
  --hair:rgba(10,10,10,.10); --hair2:rgba(10,10,10,.16); --hair3:rgba(10,10,10,.28);
  --ghost:rgba(10,10,10,.04); --ghost2:rgba(10,10,10,.05);
  --hatch:rgba(10,10,10,.18); --hatch2:rgba(10,10,10,.35);
  --menu:#FFFFFF; --mark:none;
  /* shadcn/ui sidebar tokens (new-york-v4, light), from `shadcn view
     sidebar`. Light on purpose, matches the rest of the app; the
     reference screenshot's structure and behaviour are what we're
     matching, not its dark colour scheme or its blue accent. */
  --sb-bg:hsl(0 0% 98%); --sb-fg:hsl(240 5.3% 26.1%);
  --sb-primary:var(--ink); --sb-primary-fg:var(--ink-fg);
  --sb-accent:hsl(240 4.8% 95.9%); --sb-accent-fg:hsl(240 5.9% 10%);
  --sb-border:hsl(220 13% 91%); --sb-muted:hsl(240 5.3% 26.1% / .65);
}
/* One committed light palette. The page paints its own background and every
   colour explicitly, so it holds whatever theme the viewer is in. */

body{margin:0;background:var(--page-bg);color:var(--fg1);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:var(--fg1)}
@media (hover:hover){a:hover{color:var(--fg2)}}
button{font-family:inherit}
input{font-family:inherit}
@keyframes bl-spin{to{transform:rotate(360deg)}}

/* Every hover affordance below is gated on a pointer that can actually
   hover. A touch screen cannot: tapping leaves the element stuck in :hover
   until you tap something else, so a hover-only state reads as a permanent
   one. That is what turned the brand badge into its collapse icon on a
   phone and left it there. :active is fine and stays ungated. */
@media (hover:hover){
  .hv-ghost:hover{background:var(--ghost)}
  .hv-ghost-fg1:hover{background:var(--ghost);color:var(--fg1)}
  .hv-sb:hover{background:var(--sb-accent);color:var(--sb-accent-fg)}
  .bl-rail:hover{background:var(--sb-border)}
}
/* While actually dragging the rail (not just clicking it), the grid
   column narrows live via direct style writes, not a re-render, so nav
   labels need real overflow clipping to keep up instead of wrapping mid-
   drag, and the resize cursor has to hold even when the pointer strays
   off the 4px strip onto a nav row or the page underneath it. */
body.bl-dragging, body.bl-dragging *{cursor:ew-resize !important;user-select:none}
.bl-dragging [data-nav] *{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* previewDashOrder writes left/top directly on every card crossed during a
   dashboard reorder drag, this transition is what turns those into the
   sliding "make room" animation instead of an instant jump, on every other
   card, the one actually being dragged, its slot animates too while a
   separate native ghost follows the cursor. Also smooths the plain
   hide/show/resize reflow path, which was never why it was added but is a
   fair side benefit. */
.dash-block{transition:left .18s ease, top .18s ease}
/* Sidebar collapse toggle lives on the brand badge itself now, not as a
   button that sits in the header the whole time. Logo and chevron are both
   always in the DOM, only one ever shown, hover flips which. */
.bl-brand-toggle{cursor:pointer}
.bl-brand-toggle .bl-brand-chev{display:none}
@media (hover:hover){
  .bl-brand-toggle:hover .bl-brand-logo{display:none}
  .bl-brand-toggle:hover .bl-brand-chev{display:flex}
  .hv-fg1:hover{color:var(--fg1)}
  .hv-dim:hover{opacity:.86}
  .hv-dim9:hover{opacity:.9}
  .hv-fade:hover{opacity:.7}
}
.press:active{transform:scale(.98)}
.press9:active{transform:scale(.99)}

details.bl-acc summary{list-style:none;cursor:pointer}
details.bl-acc summary::-webkit-details-marker{display:none}
details.bl-acc summary .chev{transition:transform .15s}

.bl-bar-tip{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);min-width:118px;background:var(--menu);border:1px solid var(--hair2);border-radius:6px;padding:9px 11px;box-shadow:0 6px 20px rgba(10,10,10,.14);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease,transform .12s ease;z-index:30;white-space:nowrap}
.bl-bar-wrap:first-child .bl-bar-tip{left:0;transform:translate(0,-6px)}
.bl-bar-wrap:last-child .bl-bar-tip{left:auto;right:0;transform:translate(0,-6px)}
@media (hover:hover){
  .bl-bar-wrap:hover .bl-bar-tip{opacity:1;visibility:visible;transform:translate(-50%,-10px)}
  .bl-bar-wrap:first-child:hover .bl-bar-tip{transform:translate(0,-10px)}
  .bl-bar-wrap:last-child:hover .bl-bar-tip{transform:translate(0,-10px)}
}
details.bl-acc[open] summary .chev{transform:rotate(180deg)}

/* Custom slider track: filled portion up to the thumb, plain past it. The
   fill is a CSS var so one JS line can update it on every drag instead of
   rebuilding the gradient string, native sliders give none of this for free. */
input.bl-slider{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;outline:none;
  background:linear-gradient(to right,var(--ink) 0%,var(--ink) var(--bl-fill,20%),var(--hair) var(--bl-fill,20%),var(--hair) 100%)}
input.bl-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--page-bg);box-shadow:0 1px 4px rgba(10,10,10,.35);cursor:pointer;margin-top:0}
input.bl-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--page-bg);box-shadow:0 1px 4px rgba(10,10,10,.35);cursor:pointer}
input.bl-slider::-moz-range-track{height:6px;border-radius:3px;background:transparent}

/* Below 900px the sidebar becomes a topbar. It used to just squash the nav
   and account rows into two permanently-visible horizontal-scroll strips,
   which is a lot of chrome sitting above the fold before any real content.
   Now they are collapsed into one menu, closed by default, opened by the
   hamburger button that only exists at this width. */
.bl-mobile-toggle{display:none}
/* Menu backdrop exists only at phone widths, where menus become sheets. */
[data-pop-back]{display:none}
/* Coarse-pointer copy is off until a coarse pointer is actually likely. */
[data-hint-coarse]{display:none}
@media (max-width:900px){
  [data-grid]{grid-template-columns:minmax(0,1fr) !important}
  [data-side]{position:static !important;height:auto !important;min-width:0;padding:14px 16px 0 !important;border-right:none !important;border-bottom:1px solid var(--hair)}
  [data-main]{min-width:0}
  .bl-mobile-toggle{display:flex}
  [data-nav],[data-side-foot]{display:none !important}
  [data-side].bl-mobile-open [data-nav],[data-side].bl-mobile-open [data-side-foot]{display:flex !important;flex-direction:column !important;overflow-x:visible !important}
  [data-side].bl-mobile-open [data-nav] > div,[data-side].bl-mobile-open [data-side-foot] > div{white-space:normal}
  [data-main]{padding:14px 16px 32px !important}
  [data-card]{padding:22px 18px 26px !important}
  [data-stage]{padding:40px 18px 56px !important}
  [data-hero]{gap:28px !important}
  [data-figs] > div{padding:20px 0 !important;border-left:none !important;border-top:1px solid var(--hair)}
  [data-figs] > div:first-child{border-top:none;padding-top:0 !important}
  [data-split]{grid-template-columns:minmax(0,1fr) !important;gap:18px !important}
  [data-bars]{min-width:0 !important;flex:1 1 100% !important}
  [data-bars] span[data-barlabel]{width:auto !important;min-width:72px}
  [data-eq]{flex-wrap:wrap !important;gap:16px !important;min-width:0 !important}
  [data-eq] > div:first-child{align-items:flex-start !important}
  [data-eq] > div:first-child > div{flex-wrap:wrap !important}
  [data-setup-row]{flex-wrap:wrap !important;row-gap:6px !important}
  [data-setup-name]{min-width:0 !important;flex:1 1 100% !important}
  [data-setup-row] > span{margin-left:0 !important}

  /* ---- Menus, phone edition -------------------------------------------
     On a desktop a menu is a small popover pinned to whatever opened it,
     which works because a cursor is precise and the pointer is already
     there. A thumb is neither. Below 900px every menu becomes the same
     full-width sheet the marketing site's nav uses: full-bleed rows,
     hairline separators, type at a size you can read at arm's length.
     Anchored to the bottom because that is the half of a phone a thumb
     actually reaches, and the trigger can sit anywhere on the page. */
  [data-pop]{
    position:fixed !important;
    left:0 !important; right:0 !important; bottom:0 !important; top:auto !important;
    width:auto !important; min-width:0 !important; max-width:none !important;
    max-height:72vh !important; overflow-y:auto !important;
    /* The sheet paints its own ground. Three of these menus carry a
       background on the menu element itself, but the calendar's wrapper is
       a bare positioning div whose card provided it, and that card's chrome
       is stripped below, so without this the sheet is see-through. */
    background:var(--menu) !important;
    border:none !important; border-top:1px solid var(--hair2) !important;
    border-radius:16px 16px 0 0 !important;
    box-shadow:0 -10px 34px rgba(10,10,10,.20) !important;
    padding:6px 20px calc(20px + env(safe-area-inset-bottom)) !important;
    z-index:200 !important;
    animation:bl-sheet-up .18s ease-out;
  }
  /* Only genuinely tappable rows get the big treatment. Headers, dividers
     and the calendar widget are left alone so they don't get stretched. */
  [data-pop] > [data-act]{
    padding:17px 0 !important;
    font-size:16px !important;
    border-radius:0 !important;
    border-bottom:none !important;
    border-top:1px solid var(--hair) !important;
    min-height:56px;
    box-sizing:border-box;
  }
  [data-pop] > [data-act]:first-child{border-top:none !important}
  /* The calendar is a widget, not a list, so it keeps its own layout, but
     it stops being a 320px card floating inside the sheet: the sheet is
     the card now, so the inner chrome comes off and the grid spans the
     full width like every other row-based sheet here. */
  [data-pop-panel]{padding:8px 20px calc(20px + env(safe-area-inset-bottom)) !important}
  [data-pop] [data-cal-root]{
    width:100% !important;background:transparent !important;
    border:none !important;border-radius:0 !important;padding:0 !important;
  }
  /* 12.5px numbers in a 30px box is a mouse target. This is a thumb one. */
  [data-pop] [data-cal-day]{padding:15px 0 !important;font-size:16px !important;border-radius:9px !important}
  [data-pop] [data-cal-grid]{gap:3px !important;margin-bottom:16px !important}
  [data-pop] [data-cal-root] > div:first-child{margin-bottom:14px !important}
  [data-pop] [data-cal-root] > div:first-child > div{font-size:17px !important}
  [data-pop] [data-cal-root] > div:nth-child(2) > div{font-size:12px !important;padding:6px 0 !important}
  [data-pop] [data-act="calPrevMonth"],[data-pop] [data-act="calNextMonth"]{
    width:44px;height:44px;align-items:center;justify-content:center;border-radius:8px;
  }
  [data-pop] [data-cal-root] > div:last-child{font-size:14px !important;padding-top:16px !important}
  [data-pop] [data-act="calClear"]{padding:10px 0;display:inline-block}
  [data-pop-back]{
    display:block;position:fixed;inset:0;
    background:rgba(10,10,10,.38);z-index:199;
    animation:bl-fade-in .18s ease-out;
  }

  /* Same row language for the nav behind the hamburger. */
  [data-side].bl-mobile-open [data-nav] > div,
  [data-side].bl-mobile-open [data-side-foot] > div{
    padding:15px 2px !important;font-size:16px !important;min-height:52px;box-sizing:border-box;
  }

  /* iOS zooms the whole page in when you focus a control whose text is
     under 16px, and never zooms back out. Every input is bumped to 16px
     here purely to stop that. */
  input,select,textarea{font-size:16px !important}

  /* Fingertip-sized hit areas for the controls that were built for a mouse. */
  [data-act="toggleDashScope"],[data-act="toggleDashEdit"],[data-act="togglePeriod"],
  [data-act="setTaxDep"],[data-act="toggleMobileNav"]{
    min-height:44px;box-sizing:border-box;align-items:center;
  }
  /* The drag-to-collapse rail has nothing to collapse here: the sidebar is
     a topbar. Leaving it would be a 4px invisible ew-resize strip down the
     side of a touch screen. */
  .bl-rail{display:none !important}
  [data-act="go"]{min-height:36px;display:inline-flex;align-items:center}

  /* Customize mode: swap the drag affordance for step buttons, and give the
     remove control a fingertip-sized box instead of its 24px desktop one. */
  [data-dash-draghint]{display:none !important}
  [data-dash-move]{display:inline-flex !important}
  [data-act="dashHide"]{width:40px !important;height:40px !important;font-size:18px !important}

  /* Tell the reader the gesture that actually works on their device. */
  [data-hint-fine]{display:none}
  [data-hint-coarse]{display:inline}

  /* "Where the rates come from" is a four-column table pinned to 720px, so
     on a phone it survived only as a sideways-scrolling strip: you cannot
     see the wage you are editing and the rate it produces at the same time,
     which is the entire point of the table. Stacked into one column per
     row instead, with each cell carrying the column heading it lost. */
  [data-rate-scroll]{overflow-x:visible !important}
  [data-rate-wide]{min-width:0 !important}
  [data-rate-head]{display:none !important}
  [data-rate-row]{grid-template-columns:minmax(0,1fr) !important;gap:14px !important;align-items:stretch !important}
  [data-rate-row] > div{display:block !important}
  [data-rate-row] > div:nth-child(n+2)::before{
    display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;
    color:var(--fg3);margin-bottom:5px;
  }
  [data-rate-row] > div:nth-child(2)::before{content:"LOADED WAGE"}
  [data-rate-row] > div:nth-child(3)::before{content:"A PERSON DOES"}
  [data-rate-row] > div:nth-child(4)::before{content:"SO ONE UNIT IS WORTH"}
  /* That cell was a flex row with a gap; stacking it turned the two spans
     inline and ran "benchmark" straight into the rate. */
  [data-rate-row] [data-rate-src]{display:block;margin-top:5px}
}
@keyframes bl-sheet-up{from{transform:translateY(14px);opacity:.6}to{transform:translateY(0);opacity:1}}
@keyframes bl-fade-in{from{opacity:0}to{opacity:1}}
@media (max-width:560px){
  [data-main]{padding:12px 12px 28px !important}
  [data-card]{padding:18px 14px 22px !important}
}
</style>

function ic(name, size, style){
  const s = size || 18;
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;'+(style||'')+'">'+(ICONS[name]||'')+'</svg>';
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// complete in an hour, only what the robot did. Everything else on the
// sensitivity card holds still while this one assumption moves, and it only
// applies to the fleet's biggest per-task category, an all-by-the-hour
// fleet (cleaning, laundry) has no such assumption to test.
function sensBase(){
  const s = computeStatement();
  const missionCats = s.byCategory.filter(k => workDef(k.work).basis === 'mission');
  if (!missionCats.length) return null;
  const dom = missionCats[0];
  const domRows = s.included.filter(r => r.work === dom.work);
  const bench = workDef(dom.work);
  return {
    work: dom.work, unit: bench.unit, unitPlural: bench.unitPlural,
    // The owner's own numbers, so the "what if a person did more per hour"
    // slider starts from what they told us a person does, not our default.
    wageCentsHour: Math.round(wageFor(dom.work) * 100), benchUnitsPerHour: throughputFor(dom.work),
    domUnits: domRows.reduce((a,r) => a+r.units, 0),
    domCount: domRows.length,
    fixedWork: Math.round((s.totalValue - dom.value) * 100) / 100,
    totalInvoice: s.totalInvoice,
  };
}
function calc(t, base){
  const rate = Math.round((base.wageCentsHour / 100 / t) * 100) / 100;
  const domWork = Math.round(base.domUnits * rate * 100) / 100;
  const total = Math.round((domWork + base.fixedWork) * 100) / 100;
  return { rate, domWork, total, cov: base.totalInvoice > 0 ? total / base.totalInvoice : null };
}
function breakEven(base){ let t = 1; while (t < 2000 && calc(t, base).cov >= 1) t++; return t - 1; }

// scope is S.dashScope: a site index (0/1/2) or 'all', which weights by
// each site's current robot count, the same weighting computeStatement()
// itself uses to blend sites for "all 3 sites."
function covForPeriod(p, scope){
  // Same rule as utilization: the open period is computed from the fleet as
  // configured right now, so any input that moves the headline moves this
  // chart's last point with it. Closed periods keep what they were
  // computed with, so a statement already sent is never rewritten.
  if (p.status === 'open'){
    const live = computeStatement(true, scope === 'all' ? null : Number(scope));
    if (live.coverage !== null) return live.coverage;
  }
  if (scope !== 'all') return p.siteCov[scope];
  const total = SITE_ROBOT_COUNTS.reduce((a,b) => a+b, 0);
  return p.siteCov.reduce((sum,c,i) => sum + c*SITE_ROBOT_COUNTS[i], 0) / total;
}
function utilForPeriod(p, scope){
  // The open period is computed from the robots as they are configured
  // right now, so cutting a robot's declared operating hours in half on
  // Numbers moves this chart immediately. Closed periods keep the figure
  // they were computed with, the same rule rates already follow: a
  // statement already sent to an accountant does not change after the fact.
  if (p.status === 'open'){
    const live = liveUtilization(scope);
    if (live !== null) return live;
  }
  if (scope !== 'all') return p.siteUtil[scope];
  const total = SITE_ROBOT_COUNTS.reduce((a,b) => a+b, 0);
  return p.siteUtil.reduce((sum,c,i) => sum + c*SITE_ROBOT_COUNTS[i], 0) / total;
}

/** Duty hours actually recorded against declared capacity, for the robots
 * in scope. Capacity is operating hours a day (the editable per-robot field
 * on Numbers) times the days in the period, which is what makes this move
 * when that field does.
 *
 * Over 100% is returned as-is rather than clamped: it means the declared
 * hours are wrong, which the owner should see, not a number to tidy up. */
function liveUtilization(scope){
  const days = daysBetweenInclusive(PERIODS[0].start, PERIODS[0].end);
  let duty = 0, capacity = 0;
  ROBOTS.forEach((r,i) => {
    if (S.excluded[i]) return;
    if (scope !== 'all' && r.site !== Number(scope)) return;
    const d = parseFloat(r.hours);
    const perDay = S.robotHours[i] ?? parseFloat((SETUP[i] || {}).hours || '0');
    if (!(perDay > 0)) return;
    if (Number.isFinite(d)) duty += d;
    capacity += perDay * days;
  });
  return capacity > 0 ? (duty / capacity) * 100 : null;
}

function daysBetweenInclusive(startKey, endKey){
  const a = new Date(startKey+'T00:00:00Z'), b = new Date(endKey+'T00:00:00Z');
  return Math.round((b-a)/86400000) + 1;
}
function dateKey(d){ return d.toISOString().slice(0,10); }
function addDaysKey(startKey, n){
  const d = new Date(startKey+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return dateKey(d);
}

// Deterministic (no Math.random) so the demo is reproducible across loads.
let dailySeed = 7;
function dailyRnd(){ dailySeed = (dailySeed * 1103515245 + 12345) % 2147483648; return dailySeed / 2147483648; }

// A smooth, mildly weekend-dipped random split of `total` across `days`
// days that sums back to exactly `total` (the rounding remainder is pushed
// onto the last day), so aggregating a full period from daily rows can
// never drift from the number CONFIRM already states for it.
function splitAcrossDays(total, days){
  const weights = [];
  for (let d = 0; d < days; d++){
    const weekendDip = (d % 7 === 5 || d % 7 === 6) ? 0.55 : 1;
    weights.push((0.6 + dailyRnd() * 0.8) * weekendDip);
  }
  const wsum = weights.reduce((a,b) => a+b, 0) || 1;
  const rounded = weights.map(w => Math.round((total * w / wsum) * 10) / 10);
  const diff = Math.round((total - rounded.reduce((a,b)=>a+b,0)) * 10) / 10;
  rounded[rounded.length-1] = Math.round((rounded[rounded.length-1] + diff) * 10) / 10;
  return rounded;
}

// robot's CONFIRM.units exactly; each earlier period is scaled from the
// same per-robot daily pattern by that robot's site's already-published
// historical coverage ratio (PERIODS[i].siteCov), so a calendar range
// spanning a whole past period reproduces the number already shown in
// Coverage over time and the old period list, not a new, contradicting one.
const DAILY = CONFIRM.map(c => {
  const series = [];
  PERIODS.forEach((p, pi) => {
    const days = daysBetweenInclusive(p.start, p.end);
    const scale = pi === 0 ? 1 : (p.siteCov[c.site] / PERIODS[0].siteCov[c.site]);
    const target = Math.round(c.units * scale * 10) / 10;
    const daily = splitAcrossDays(target, days);
    daily.forEach((units, d) => series.push({ date: addDaysKey(p.start, d), units }));
  });
  series.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  return series;
});

function unitsInRange(robotIndex, startKey, endKey){
  let sum = 0;
  for (const row of DAILY[robotIndex]) if (row.date >= startKey && row.date <= endKey) sum += row.units;

}

// (minimum wage alone varies by more than 2x across the US) and on what they
// actually load onto it; how many picks a person gets through in an hour
// depends on their aisles, their pick faces, their shift. BENCH above is a
// starting point so a first statement is not blank, never an answer.
//
// Resolution order is the same for both: the owner's value if they set one,
// the published benchmark otherwise, and the UI marks which of the two it
// used everywhere the figure appears.
// What a kind of work IS: its unit, whether it is counted per task or per
// hour, and the fallback economics. BENCH covers the seven we publish
// numbers for; anything else is the owner's own words, and every field they
// have not told us yet falls back to something neutral rather than to
// another category's assumptions.
//
// Every read of a category's shape goes through here, so a robot doing
// "tote consolidation" is not a special case anywhere downstream.
const CUSTOM_WORK_DEFAULT = {
  wageCentsHour: 2400, humanUnitsPerHour: 1, invoiceCentsMonth: 150000,
  unit: 'task', unitPlural: 'tasks', basis: 'mission',
};
function workDef(work) {
  if (BENCH[work]) return BENCH[work];
  return Object.assign({}, CUSTOM_WORK_DEFAULT, S.customWork[work] || {});
}
/** True for a category the owner typed rather than one we publish. */
function isCustomWork(work) {
  return !BENCH[work];
}

/** The people doing one kind of work. Both halves of that work's rate come
 * from them when any are listed. */
function employeesFor(work) {
  return S.employees.filter(e => e.work === work);
}

/** Hours-weighted mean, so somebody on 40 hours moves the blended figure
 * more than somebody on 4. A blank or zero hours still counts as one
 * person's worth rather than vanishing from the average entirely, since a
 * missing schedule is not a claim that they never work. */
function weightedMean(list, pick) {
  let num = 0, den = 0;
  list.forEach(e => {
    const v = Number(pick(e));
    if (!(v > 0)) return;
    const w = Number(e.hoursWeek) > 0 ? Number(e.hoursWeek) : 1;
    num += v * w; den += w;
  });
  return den > 0 ? num / den : null;
}

function wageFor(work) {
  // A roster is a stronger statement than a typed number, so when one
  // exists it IS the wage, and the field above it goes read-only rather
  // than letting the page hold two disagreeing answers at once.
  const fromPeople = weightedMean(employeesFor(work), e => e.wage);
  if (fromPeople !== null) return Math.round(fromPeople * 100) / 100;
  if (S.workWage[work] !== undefined) return S.workWage[work];
  return workDef(work).wageCentsHour / 100;
}
function wageIsOwnSet(work) {
  if (weightedMean(employeesFor(work), e => e.wage) !== null) return true;
  return S.workWage[work] !== undefined;
}
/** Units a PERSON gets through in an hour, the denominator of the rate. */
function throughputFor(work) {
  const fromPeople = weightedMean(employeesFor(work), e => e.unitsPerHour);
  if (fromPeople !== null) return Math.round(fromPeople * 10) / 10;
  if (S.workThroughput[work] !== undefined) return S.workThroughput[work];
  return workDef(work).humanUnitsPerHour;
}
function throughputIsOwnSet(work) {
  if (weightedMean(employeesFor(work), e => e.unitsPerHour) !== null) return true;
  return S.workThroughput[work] !== undefined;
}
/** True when a roster is driving the figure, which is what makes the inputs
 * above it read-only. */
function wageFromPeople(work) { return weightedMean(employeesFor(work), e => e.wage) !== null; }
function throughputFromPeople(work) { return weightedMean(employeesFor(work), e => e.unitsPerHour) !== null; }
/** Rounded to the cent BEFORE it multiplies anything, so the rate an owner
 * checks on a napkin is the rate that gets used. Guarded against a zero or
 * blank throughput while someone is mid-keystroke, which would divide by 0. */
function rateCentsFor(work) {
  const per = throughputFor(work);
  if (!(per > 0)) return null;
  return Math.round((wageFor(work) * 100) / per);
}

// Purchase-equivalent cost per work category, roughly what a mission-basis
// service robot or an active-hour scrubber actually costs to buy, not what
// it leases for. Separate from BENCH's wageCentsHour/invoiceCentsMonth on
// purpose: those price the WORK a robot does, this prices the ASSET itself,
// a different question the tax shield page needs an answer to that nothing
// else on this dashboard ever asks. Same category keys as BENCH, so every
// CONFIRM row already has one to look up by, in cents.
const EQUIP_COST = {
  'Tray delivery':            1800000,
  'Bussing and dish return':  1800000,
  'Floor cleaning':           2800000,
  'Order picking':            3200000,
  'Putaway and replenishment':3200000,
  'Room and guest delivery':  1800000,
  'Laundry handling':         2200000,
};

// S.dashScope as an actual site filter: null for every site, a number for
// one. Shared by every card and by Fleet, so "all 3 sites" only ever means
// one thing anywhere it's read.
function scopeFilter(){ return S.dashScope === 'all' ? null : Number(S.dashScope); }

// The one calculation the whole dashboard reads from. Every card below is a
// different view of this same result, never its own arithmetic, so a
// category or exclude change on the confirm screen can only ever move every
// card in agreement with every other one.
//
// full=true skips the manualApplied and date-range short-circuits below and
// goes straight to the per-robot computation for whichever site(s) scope
// asks for (undefined/omitted defaults to Pier 4, used only by the rare
// caller that has no scope of its own to pass). Fleet and Numbers pass
// S.dashScope's own filter here now, same as Dashboard, so none of the
// three can be at the mercy of an estimate mode or a custom date range
// active on a page they aren't even showing, without being locked to one
// site either.
function computeStatement(full, scope){
  // A manually-typed estimate has no per-robot rows behind it, just a count
  // and two dollar figures, so it cannot honestly fill in byCategory,
  // attention, or work-split. Those cards already know how to say "no
  // robots included yet" for an empty fleet; returning empty here reuses
  // that same honest state instead of inventing rows to fill them.
  if (!full && S.manualApplied){
    const count = Number(S.manualCount) || 0;
    const cost = Number(S.manualCost) || 0;
    const revenue = Number(S.manualRevenue) || 0;
    const totalInvoice = Math.round(count * cost * 100) / 100;
    const totalValue = Math.round(count * revenue * 100) / 100;
    const coverage = revenue > 0 && totalInvoice > 0 ? totalValue / totalInvoice : null;
    return {
      rows: [], included: [], totalValue, totalInvoice, coverage, byCategory: [],
      mode: 'estimate', manualCount: count, manualCost: cost, manualRevenue: revenue,
    };
  }
  // Which site's robots feed the computation below. Every full=true caller
  // (Fleet, Numbers) passes its own live scope now, same filter Dashboard
  // reads below for everything else, including no filter at all for "all
  // 3 sites," every site's robots live in this same table together. The
  // scope===undefined fallback to Pier 4 only matters if a future caller
  // asks for full without one.
  const siteFilter = full ? (scope === undefined ? 0 : scope) : scopeFilter();
  const entries = siteFilter === null ? CONFIRM.map((c,i) => ({c,i})) : CONFIRM.map((c,i) => ({c,i})).filter(({c}) => c.site === siteFilter);
  // A date range only ever applies to Dashboard's own statement, never to
  // Fleet/Setup (full=true, always the current period's real per-robot
  // rows) and never while a manual estimate is active (handled above,
  // before this point). It comes from a custom calendar drag when one is
  // active, otherwise from whichever PERIODS entry is selected, so picking
  // a past period from "jump to a period" recomputes just as genuinely as
  // dragging a custom range does, not just the header label. Lease
  // invoices are prorated to the range's own day count, same "prorated to
  // the same period" rule the header copy already states, so a short range
  // doesn't get charged a full month.
  const range = full ? null : (S.dashRange || { start: PERIODS[S.period].start, end: PERIODS[S.period].end });
  const periodDays = daysBetweenInclusive(PERIODS[0].start, PERIODS[0].end);
  const rangeDays = range ? daysBetweenInclusive(range.start, range.end) : periodDays;
  const rows = entries.map(({c,i}) => {
    const work = S.confirmWork[i] ?? c.work;
    const b = workDef(work);
    // Wage and invoice come from Setup's per-robot overrides when one
    // exists, the category benchmark otherwise, this is what makes an edit
    // on Setup actually move the number here instead of just saving text
    // nobody reads back.
    const wage = wageFor(work);
    const benchmarkWage = !wageIsOwnSet(work);
    // Both halves are the owner's inputs now (see wageFor/throughputFor).
    // A blank or zero throughput mid-edit yields a null rate rather than a
    // division by zero, and every figure downstream reads as unpriced.
    const rateCents = rateCentsFor(work);
    if (rateCents === null) {
      return {
        i, name: (S.confirmName[i] ?? c.name) || c.name, work, basis:b.basis,
        units: range ? unitsInRange(i, range.start, range.end) : c.units,
        unit: b.unitPlural, rate: null, value: 0,
        invoice: Math.round((S.robotInvoice[i] ?? (b.invoiceCentsMonth / 100)) * (rangeDays / periodDays) * 100) / 100,
        excluded: !!S.excluded[i], wage, benchmarkWage, cov: null,
      };
    }
    const units = range ? unitsInRange(i, range.start, range.end) : c.units;
    const value = Math.round(units * rateCents) / 100;
    const invoiceFull = S.robotInvoice[i] ?? (b.invoiceCentsMonth / 100);
    const invoice = Math.round(invoiceFull * (rangeDays / periodDays) * 100) / 100;
    const excluded = !!S.excluded[i];
    return {
      i, name: (S.confirmName[i] ?? c.name) || c.name, work, basis:b.basis,
      units, unit: units === 1 ? b.unit : b.unitPlural,
      rate: rateCents / 100, value, invoice, excluded, wage, benchmarkWage,
      cov: invoice > 0 ? value / invoice : null,
    };
  });
  const included = rows.filter(r => !r.excluded);
  const totalValue = Math.round(included.reduce((s,r) => s+r.value, 0) * 100) / 100;
  const totalInvoice = Math.round(included.reduce((s,r) => s+r.invoice, 0) * 100) / 100;
  const coverage = totalInvoice > 0 ? totalValue / totalInvoice : null;
  const byCategory = {};
  included.forEach(r => {
    (byCategory[r.work] = byCategory[r.work] || { work:r.work, count:0, value:0 }).count++;
    byCategory[r.work].value += r.value;
  });
  return {
    rows, included, totalValue, totalInvoice, coverage,
    byCategory: Object.values(byCategory).sort((a,b) => b.value - a.value),
    mode: 'full',
  };
}

// Same "one calculation" discipline as computeStatement above, every
// figure on the Tax shield page reads from this, nothing recomputes on
// its own. Scope follows S.dashScope, the same site filter Dashboard
// already has, on purpose, so switching sites there and switching here
// stay one idea instead of two. A robot's equipment cost comes from
// EQUIP_COST by work category, same lookup shape as BENCH.
//
// Depreciation: bonus/Section 179 expenses the full cost in year one;
// standard 5-year MACRS uses the IRS half-year-convention first-year
// factor for 5-year property, 20%. Interest: a flat first-year estimate,
// full equipment cost financed at the assumed rate, no amortization
// schedule, deliberately simple for an illustrative figure, not a loan
// calculator. Tax shield is what those two deductions are worth at the
// assumed tax rate; net cost is equipment cost minus that shield.
function computeTaxShield(){
  const siteFilter = scopeFilter();
  // Excluded robots are dropped here too. They were not before, so a fleet
  // with one robot excluded showed a statement built on 12 robots and a tax
  // shield built on 13, on the same screen. Whatever "exclude" means, it
  // cannot mean excluded from the money and included in the tax position.
  // The work a robot does can also be reassigned (see S.confirmWork), and
  // equipment cost is keyed off that, so this reads the live value rather
  // than the imported one.
  const rows = CONFIRM
    .map((c,i) => ({ c, i, work: S.confirmWork[i] ?? c.work }))
    .filter(({c,i}) => !S.excluded[i] && (siteFilter === null || c.site === siteFilter));
  const byCategory = {};
  let totalCostCents = 0;
  rows.forEach(({work}) => {
    const c = { work };
    const costCents = EQUIP_COST[c.work] || 0;
    totalCostCents += costCents;
    const cat = byCategory[c.work] || (byCategory[c.work] = { work:c.work, count:0, costCents:0 });
    cat.count++;
    cat.costCents += costCents;
  });
  const depRate = S.taxDepMethod === 'macrs5' ? 0.20 : 1;
  const depreciationCents = totalCostCents * depRate;
  const interestCents = totalCostCents * (S.taxInterestRate / 100);
  const shieldCents = (depreciationCents + interestCents) * (S.taxRate / 100);
  return {
    robotCount: rows.length,
    totalCostCents, depreciationCents, interestCents, shieldCents,
    netCostCents: totalCostCents - shieldCents,
    byCategory: Object.values(byCategory).sort((a,b) => b.costCents - a.costCents),
  };
}

      + '<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><div style="width:42px;height:42px;border-radius:4px;background:var(--ink);color:var(--ink-fg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">HG</div></div>'
      + '<div style="border:1px solid var(--hair2);border-radius:4px;max-width:280px;margin-left:auto">'
        + '<div style="padding:16px 18px;border-bottom:1px solid var(--hair)"><div style="font-size:14px;font-weight:600;color:var(--fg1)">Sam Ortega</div><div style="font-size:12.5px;color:var(--fg3);margin-top:3px">sam@harborgrill.com</div></div>'
        + '<div data-act="authScreen" data-key="sessions" class="hv-ghost" style="padding:13px 18px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--fg1)">Settings</div>'
        + '<div data-act="logOut" class="hv-ghost" style="padding:13px 18px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--fg1);border-top:1px solid var(--hair)">Log out</div>'
      + '</div>'
      + '<p style="font-size:12.5px;line-height:1.6;color:var(--fg3);margin:24px 0 0;text-align:right">Three items. It is a menu, not a page.</p>';
  }

  if (sc === 'sessions'){
    body += '<div style="font-size:11.5px;font-weight:700;color:var(--fg3);margin-bottom:14px">Settings · Account</div>'
      + '<h1 style="font-size:clamp(24px,4.2vw,30px);font-weight:700;letter-spacing:-0.03em;line-height:1.15;margin:0 0 12px">Signed in on these devices</h1>'
      + '<p style="font-size:14.5px;line-height:1.65;color:var(--fg2);margin:0 0 24px">Signing out one device leaves you here. Signing out everywhere returns you to sign in.</p>'
      + S.authSessions.map((d,i) =>
        '<div style="display:flex;align-items:center;gap:16px;padding:18px 2px;border-top:1px solid var(--hair)">'
        + '<div><div style="font-size:14px;font-weight:600;color:var(--fg1)">'+d.device+'</div><div style="font-size:12.5px;color:var(--fg3);margin-top:3px;font-variant-numeric:tabular-nums">'+d.last+'</div></div>'
        + '<button type="button" data-act="dropSession" data-i="'+i+'" class="hv-ghost" style="margin-left:auto;padding:9px 14px;border-radius:4px;border:1px solid var(--hair2);background:transparent;color:var(--fg1);cursor:pointer;font-size:12.5px;font-weight:600">Sign out</button></div>').join('')
      + (S.authSessions.length === 0 ? '<div style="border-top:1px solid var(--hair);padding:22px 2px;font-size:13.5px;color:var(--fg2)">Only this device is signed in now.</div>' : '')
      + '<button type="button" data-act="logOut" class="hv-dim9" style="margin-top:28px;padding:14px 20px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:pointer;font-size:13.5px;font-weight:700">Sign out everywhere</button>';
  }

  if (sc === 'already'){
    body += '<div style="min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center">'
      + '<img src="'+LOGO+'" alt="Botlien" style="width:26px;height:32px;object-fit:contain;filter:var(--mark)">'
      + '<span data-act="toApp" style="font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Coverage statement</span>'
      + '<p style="font-size:12.5px;color:var(--fg3);margin:0;max-width:44ch;line-height:1.6">A signed-in visit to sign in never renders. It resolves to the statement before anything paints, with no "already logged in" message.</p></div>';
  }

  return '<div data-stage style="padding:72px 40px 80px;display:flex;justify-content:center">'
    + '<div style="width:100%;max-width:440px">' + body
    + '<div style="margin-top:56px;padding-top:24px;border-top:1px solid var(--hair);font-size:12px;color:var(--fg3);line-height:1.6">Nothing is charged until you choose a paid plan. Botlien prices the work your robots performed against what you pay to lease them, and makes no other claim.</div>'
    + '</div></div>';
}

// Menu button sizing/spacing/color below matches shadcn/ui's
// sidebarMenuButtonVariants exactly (rounded-md, p-2, gap-2, text-sm,
// size-4 icons; group-data-[collapsible=icon]:size-8 when collapsed),
// pulled from `shadcn view sidebar`, not eyeballed off a screenshot.
function appRail(){
  // A collapsed icon rail is a desktop idea: it trades labels for width on
  // a screen that has width to trade. Below 900px the sidebar is not a rail
  // at all, it is a topbar behind a hamburger, so a collapsed flag carried
  // over from a desktop session would strip every label and leave a row of
  // unlabelled icons stretched across the full width. Ignored here.
  const collapsed = S.railCollapsed && !isPhoneLayout();
  const nav = (k) => ({
    bg: S.view === k ? 'var(--sb-accent)' : 'transparent',
    fg: S.view === k ? 'var(--sb-accent-fg)' : 'var(--sb-fg)',
    fw: S.view === k ? 600 : 500
  });
  const item = (k, icon, label, extra) => {
    const n = nav(k);
    const justify = collapsed ? 'justify-content:center;' : '';
    const dot = (collapsed && extra) ? '<span style="position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--sb-accent-fg)"></span>' : '';
    return '<div data-act="go" data-view="'+k+'" class="hv-sb" title="'+(collapsed?label:'')+'" style="position:relative;display:flex;align-items:center;box-sizing:border-box;width:100%;height:32px;'+justify+'gap:8px;padding:8px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:'+n.fw+';color:'+n.fg+';background:'+n.bg+'">'
      + ic(icon,16)
      + (collapsed ? '' : label+(extra||''))
      + dot
    + '</div>';
  };
  // Live count, not a number typed once: an edit on Setup that pushes a
  // robot under its lease, or pulls it back over, has to show up here too,
  // the same instant it shows up as a caution mark on Fleet.
  const attnCount = computeStatement(true, scopeFilter()).rows.filter(r => !r.excluded && r.cov !== null && r.cov < 1).length;
  const badge = !attnCount ? '' : '<span data-act="attention" style="margin-left:auto;font-size:12px;font-weight:700;color:var(--sb-accent-fg)">'+attnCount+'</span>';

  // Which site is in view already lives in the dashboard's own scope
  // filter (All 3 sites / Pier 4 / Marina / Airport, next to Customize),
  // so a second site switcher up here was showing the same choice twice.
  // The brand block is identity, not a site picker, no dropdown. Its icon
  // is still a control though: it's the sidebar collapse toggle now (see
  // brandIcon below), not a separate permanent button.

  // shadcn's SidebarRail: an invisible 4px drag-strip along the border, a
  // second way to collapse besides the brand badge, cursor swaps to a
  // resize cursor and the border itself highlights on hover.
  const rail = '<button type="button" data-act="toggleRail" class="bl-rail" aria-label="Toggle Sidebar" title="Toggle Sidebar" style="position:absolute;top:0;bottom:0;right:-2px;width:4px;padding:0;border:none;background:transparent;cursor:ew-resize;z-index:20"></button>';

  // The collapse/expand control used to also live as a bordered chevron
  // button that sat in the header permanently (see appHeader). Now it's
  // just this badge: hover swaps the logo for a sidebar glyph (reads as
  // "toggle the sidebar" more directly than a bare arrow did), click
  // toggles, unhover swaps it back. One control instead of two.
  const brandIcon = '<div data-act="toggleRail" class="bl-brand-toggle" title="'+(collapsed?'Expand sidebar':'Collapse sidebar')+'" style="position:relative;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;flex:none">'
    + '<img class="bl-brand-logo" src="'+LOGO+'" alt="Botlien" style="width:18px;height:22px;object-fit:contain;filter:brightness(0)">'
    + '<span class="bl-brand-chev" style="align-items:center;justify-content:center;color:var(--sb-fg)">'+ic('panel-left',15)+'</span>'
  + '</div>';
  const bizName = S.demoMode ? 'Anchorpoint Fulfillment' : 'Harbor Grill Group';
  const brand = collapsed
    ? '<div title="'+bizName+'" style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px">'
      + brandIcon
    + '</div>'
    : '<div style="flex:1;min-width:0;height:48px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px">'
      + brandIcon
      + '<span style="font-size:14px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sb-fg)">'+bizName+'</span>'
      + '</div>';

  // Hamburger only exists below 900px (.bl-mobile-toggle), everything it
  // opens is the same nav and account rows that already render for desktop,
  // just hidden by default at that width until this flips the open class.
  const mobileToggle = '<div data-act="toggleMobileNav" class="bl-mobile-toggle hv-sb" title="'+(S.mobileNavOpen?'Close menu':'Menu')+'" style="align-items:center;justify-content:center;width:32px;height:32px;flex:none;border:1px solid var(--sb-border);border-radius:8px;cursor:pointer;color:var(--sb-fg)">'
    + ic('equal', 16, S.mobileNavOpen ? 'transform:rotate(90deg)' : '') + '</div>';

  // variant="sidebar" (the default): flush against the edge, no rounding,
  // no shadow, no margin, just a hairline right border. Measured directly
  // off the real component at ui.shadcn.com/docs/components/base/sidebar
  // (padding:0, border-radius:0, box-shadow:none on the container), the
  // floating look from a prior pass was the wrong variant.
  // No padding on the aside itself: the header row, nav, and footer each
  // carry their own 8px (matching shadcn's real SidebarHeader/Content/
  // Footer, each p-2 independently, container itself at padding:0). Aside
  // ALSO having 8px was doubling the inset to 16px a side, which is what
  // was quietly halving every collapsed icon's box and reading as shoved
  // toward the right edge, not a centering bug at all, a padding bug.
  // z-index here, not just on the popups inside it: `sticky` gives the
  // aside its own stacking context, but with none on the aside itself the
  // dashboard's masonry cards (position:relative, later in the DOM inside
  // data-main) win ties in the parent context and paint over it, popups
  // included, so the profile dropdown or period picker read as translucent
  // with the chart bleeding through even though z-index:50 sits right on
  // them. That z-index only wins comparisons inside the aside's own
  // context; it can't out-rank a sibling context that has none at all.
  // Sits above the brand row, not inside it: this is about leaving the
  // demo entirely, a different action than the brand badge's own click
  // (which just toggles the sidebar). '/' is relative to wherever this
  // is served, botlien.com/demo → botlien.com/, so it always resolves to
  // the real marketing site regardless of host.
  const demoBanner = !S.demoMode ? '' : '<a href="/" title="Exit demo, back to botlien.com" style="display:flex;align-items:center;gap:7px;justify-content:'+(collapsed?'center':'flex-start')+';margin:8px 8px 0;padding:7px 8px;border:1px solid var(--sb-border);border-radius:6px;font-size:11px;font-weight:700;color:var(--sb-fg);text-decoration:none;cursor:pointer">'
    + ic('home',14) + (collapsed ? '' : '<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Demo &middot; Home</span>')
  + '</a>';

  return '<aside data-side class="'+(S.mobileNavOpen?'bl-mobile-open':'')+'" style="position:sticky;top:0;z-index:10;display:flex;flex-direction:column;height:100vh;background:var(--sb-bg);color:var(--sb-fg);border-right:1px solid var(--sb-border)">'
    + rail
    + demoBanner
    + '<div style="position:relative;display:flex;gap:8px;align-items:stretch;padding:8px 8px 4px">' + brand + mobileToggle + '</div>'
    // Plain block stacking, not flex: a flex child's cross-axis width is
    // subject to the flex sizing algorithm no matter what display the
    // child itself declares, which is what was quietly shrinking the ul to
    // a fraction of nav's width and pushing every icon toward the right
    // edge instead of centering it. Block guarantees full-width, no quirk.
    // Flattened: no <ul> wrapper. It measured itself as a fraction of
    // nav's own width no matter how explicitly it was told to fill 100%
    // (nav is itself a flex child of the aside, and something about that
    // nesting kept resolving the ul's width against the wrong box), which
    // left every fixed-width collapsed icon overflowing out of a too-narrow
    // ul and reading as shoved toward the right edge. One fewer box in the
    // chain removes the whole problem instead of chasing it.
    + '<nav data-nav style="display:block;width:100%;box-sizing:border-box;padding:8px;overflow-y:auto;overflow-x:hidden">'
      + item('dashv2','equal','Dashboard')
      + item('robots','boxes','Fleet', badge)
      + item('setup','sliders-horizontal','Numbers')
    + '</nav>'
    // shadcn's NavUser pattern: the footer is ONE SidebarMenuButton (the
    // account trigger), not a stack of separate rows. Notifications and
    // Settings used to each get their own permanent row down here; the real
    // component instead folds everything but the account row itself into a
    // dropdown that opens off the trigger, so collapsed mode is one icon,
    // not four.
    + '<div data-side-foot style="margin-top:auto;padding:8px">'
      + '<div style="position:relative">'
      + '<div data-act="toggleProfile" class="hv-sb" style="position:relative;display:flex;align-items:center;'+(collapsed?'justify-content:center;width:32px;height:32px;padding:8px':'height:48px;box-sizing:border-box;padding:8px')+';gap:8px;border-radius:8px;cursor:pointer;background:'+(S.profileOpen?'var(--sb-accent)':'transparent')+';color:'+(S.profileOpen?'var(--sb-accent-fg)':'var(--sb-fg)')+'">'
        + '<div style="position:relative;flex:none">'
          + avatarBadge(32)
          + '<i style="position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--sb-primary);border:2px solid var(--sb-bg)"></i>'
        + '</div>'
        + (collapsed ? '' : '<div style="display:flex;flex-direction:column;line-height:1.25;min-width:0;overflow:hidden;flex:1"><span style="font-size:13.5px;font-weight:600;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(S.demoMode?'Demo Account':'Sam Ortega')+'</span><span style="font-size:11px;color:var(--sb-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(S.demoMode?'demo@botlien.com':S.accountEmail)+'</span></div>')
        + (collapsed ? '' : ic('chevron-down',14,'color:inherit;flex:none'))
      + '</div>'
      + (S.profileOpen
        ? '<div data-pop-back></div><div data-pop style="position:absolute;bottom:calc(100% + 8px);'+(collapsed?'left:0':'left:0;right:0')+';width:240px;background:var(--menu);border:1px solid var(--hair2);border-radius:8px;z-index:50;box-shadow:0 8px 24px rgba(10,10,10,.14);padding:4px;box-sizing:border-box">'
          + '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px 10px">'
            + avatarBadge(32)
            + '<div style="display:flex;flex-direction:column;line-height:1.25;min-width:0;overflow:hidden"><span style="font-size:13.5px;font-weight:600;color:var(--fg1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(S.demoMode?'Demo Account':'Sam Ortega')+'</span><span style="font-size:11.5px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(S.demoMode?'demo@botlien.com':S.accountEmail)+'</span></div>'
          + '</div>'
          + '<div style="height:1px;background:var(--hair);margin:2px 0"></div>'
          + '<div data-act="go" data-view="alerts" class="hv-ghost" style="position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--fg1)">'
            + ic('bell',15,'color:var(--fg3)') + 'Notifications'
            + '<i style="margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--ink)"></i>'
          + '</div>'
          // Settings is safe to expose in demo mode now: every destructive
          // control on it (delete account, invite someone, import usage)
          // already routes through notInDemo, an info-only toggle, not the
          // real action, same pattern used everywhere else in this app.
          // Log out stays gated, that one still drops a visitor into the
          // real sign-in/onboarding flow, exactly what demo mode skips.
          + '<div data-act="go" data-view="settings" class="hv-ghost" style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--fg1)">'+ic('settings',15,'color:var(--fg3)')+'Settings</div>'
          + (S.demoMode ? '' : '<div style="height:1px;background:var(--hair);margin:2px 0"></div><div data-act="logOut" class="hv-ghost" style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--fg1)">'+ic('log-out',15,'color:var(--fg3)')+'Log out</div>')
        + '</div>'
        : '')
      + '</div>'
    + '</div></aside>';
}

// No export entry point anywhere yet (header button, the account-settings
// download section) until there is a real, curated export experience to
// send people to. A button that opens a "CSV or PDF" menu was standing in
// for a page that does not exist; better to have no export affordance at
// all than one that promises more than a demo download.
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
// The calendar can't navigate past what DAILY actually has data for.
const CAL_MIN = { y:2026, m:2 }; // March 2026, PERIODS[5].start
const CAL_MAX = { y:2026, m:8 }; // September 2026, PERIODS[0].end

function fmtDateShort(key){
  const d = new Date(key+'T00:00:00Z');
  return MONTH_NAMES[d.getUTCMonth()].slice(0,3)+' '+d.getUTCDate()+', '+d.getUTCFullYear();
}

// Start/end in chronological order regardless of which day the drag
// started on, dragging right-to-left is just as valid as left-to-right.
function calRangeSorted(){
  if (!S.calDragStart) return null;
  const a = S.calDragStart, b = S.calDragHover || S.calDragStart;
  return a <= b ? { start:a, end:b } : { start:b, end:a };
}

// One shape for "what period are we looking at" whether it came from a
// PERIODS preset or a custom calendar drag, so appHeader and the picker's
// own label never need two separate code paths.
function effectivePeriod(){
  if (S.dashRange){
    const days = daysBetweenInclusive(S.dashRange.start, S.dashRange.end);
    const isOpen = S.dashRange.end >= PERIODS[0].end;
    return {
      label: S.dashRange.start === S.dashRange.end ? fmtDateShort(S.dashRange.start) : fmtDateShort(S.dashRange.start)+' – '+fmtDateShort(S.dashRange.end),
      status: isOpen ? 'open' : 'closed',
      closed: isOpen ? '' : 'Closed '+fmtDateShort(addDaysKey(S.dashRange.end,1)),
      days, isCustom: true,
    };
  }
  const p = PERIODS[S.period];
  return { label:p.label, status:p.status, closed:p.closed, days:daysBetweenInclusive(p.start,p.end), isCustom:false };
}

// The calendar dropdown: a real month grid you can drag a range across,
// plus the 6 fixed periods kept underneath as one-click shortcuts. Replaces
// what used to be just that flat list.
function renderCalendar(){
  const y = S.calYear, m = S.calMonth;
  const startDow = new Date(Date.UTC(y,m,1)).getUTCDay();
  const daysInMonth = new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const todayKey = PERIODS[0].end;
  const active = calRangeSorted() || S.dashRange;
  const atMin = y === CAL_MIN.y && m === CAL_MIN.m;
  const atMax = y === CAL_MAX.y && m === CAL_MAX.m;

  let cells = '';
  for (let i = 0; i < startDow; i++) cells += '<div></div>';
  for (let d = 1; d <= daysInMonth; d++){
    const key = dateKey(new Date(Date.UTC(y,m,d)));
    const isFuture = key > todayKey;
    const inRange = !isFuture && active && key >= active.start && key <= active.end;
    const isEdge = inRange && (key === active.start || key === active.end);
    const bg = isEdge ? 'var(--ink)' : (inRange ? 'var(--ghost2)' : 'transparent');
    const fg = isEdge ? 'var(--ink-fg)' : 'var(--fg1)';
    cells += '<div'+(isFuture?'':' data-cal-day="'+key+'"')+' style="text-align:center;padding:7px 0;font-size:12.5px;font-variant-numeric:tabular-nums;border-radius:4px;background:'+bg+';color:'+fg+';user-select:none;'+(isFuture?'opacity:0.3;':'cursor:pointer;')+'">'+d+'</div>';
  }

  const rangeLabel = active ? (active.start === active.end ? fmtDateShort(active.start) : fmtDateShort(active.start)+' – '+fmtDateShort(active.end)) : '<span data-hint-fine>Drag across days to pick a range</span><span data-hint-coarse>Tap the first day, then the last</span>';

  return '<div style="width:320px;background:var(--menu);border:1px solid var(--hair2);border-radius:6px;padding:16px" data-cal-root>'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'
      + '<button type="button" data-act="calPrevMonth"'+(atMin?' disabled':'')+' style="border:none;background:transparent;cursor:'+(atMin?'default':'pointer')+';opacity:'+(atMin?'0.3':'1')+';padding:4px;display:flex;color:var(--fg2)">'+ic('chevron-down',15,'transform:rotate(90deg)')+'</button>'
      + '<div style="font-size:13px;font-weight:700;color:var(--fg1)">'+MONTH_NAMES[m]+' '+y+'</div>'
      + '<button type="button" data-act="calNextMonth"'+(atMax?' disabled':'')+' style="border:none;background:transparent;cursor:'+(atMax?'default':'pointer')+';opacity:'+(atMax?'0.3':'1')+';padding:4px;display:flex;color:var(--fg2)">'+ic('chevron-down',15,'transform:rotate(-90deg)')+'</button>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px">'
      + ['S','M','T','W','T','F','S'].map(d => '<div style="text-align:center;font-size:10.5px;font-weight:700;color:var(--fg3);padding:4px 0">'+d+'</div>').join('')
    + '</div>'
    + '<div data-cal-grid style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px">'+cells+'</div>'
    + '<div style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--hair);font-size:12px;color:var(--fg2)">'
      + '<span style="font-variant-numeric:tabular-nums">'+rangeLabel+'</span>'
      + (S.dashRange ? '<span data-act="calClear" class="hv-fade" style="cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px">Clear</span>' : '')
    + '</div>'
  + '</div>';
}

function appHeader(){
  const view = S.view;
  const p = effectivePeriod();
  // The "N days on record" line only makes sense on pages that actually
  // show a period-scoped statement. Settings, credentials, notifications,
  // and the UI-states reference page aren't reports, so a date claim
  // there would be about data that page doesn't have.
  const showPeriod = view === 'dashv2' || view === 'robots';
  // The picker itself, the clickable control for switching which period
  // you're looking at, is Dashboard-only. Fleet already always shows the
  // current period's numbers; a switcher there implied you could browse
  // past periods per robot, which isn't a thing this page does.
  const showPeriodPicker = view === 'dashv2';
  const periodPicker = !showPeriodPicker ? '' : '<div style="position:relative">'

// Smooth curve through points, cubic Bezier via Catmull-Rom (tension 1/6),
// the same "natural" interpolation a real charting library defaults to.
// No library here to import that curve math from, so it's reproduced by
// hand, same as every other visual this app draws itself.
function smoothPath(pts){
  if (pts.length < 2) return '';
  if (pts.length === 2) return 'M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1)+' L'+pts[1][0].toFixed(1)+','+pts[1][1].toFixed(1);
  let d = 'M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
  for (let i=0; i<pts.length-1; i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1x = p1[0]+(p2[0]-p0[0])/6, c1y = p1[1]+(p2[1]-p0[1])/6;
    const c2x = p2[0]-(p3[0]-p1[0])/6, c2y = p2[1]-(p3[1]-p1[1])/6;
    d += ' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);
  }
  return d;
}

// One inline chart, hand-drawn SVG, same as every other visual in this
// app (duty bars, condition bars, the sensitivity slider), not a
// charting dependency for six points. points is oldest-to-newest,
// {value, label, current}. opts.reference draws a dashed line at that
// value (coverage's 1.0x breakeven). opts.area fills a gradient under a
// dot-free curve instead, for the area-chart look; without it this
// draws the dotted line-chart look.
function sparklineChart(points, opts){
  opts = opts || {};
  const W = 560, H = 100, padX = 10, padY = 14;
  const vals = points.map(p => p.value);
  const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  const span = (max - min) || 1;
  const lo = min - span*0.3, hi = max + span*0.3;
  const plotH = H - padY*2;
  const baseY = padY + plotH;
  const x = (i) => padX + (i/(points.length-1)) * (W - padX*2);
  const y = (v) => padY + plotH - ((v - lo)/(hi - lo)) * plotH;
  const coords = points.map((p,i) => [x(i), y(p.value)]);
  const linePath = smoothPath(coords);
  const refLine = (opts.reference == null || opts.reference < lo || opts.reference > hi) ? '' :
    '<line x1="'+padX+'" y1="'+y(opts.reference).toFixed(1)+'" x2="'+(W-padX)+'" y2="'+y(opts.reference).toFixed(1)+'" stroke="var(--hair2)" stroke-width="1" stroke-dasharray="3,4"/>';
  const area = !opts.area ? '' :
    '<defs><linearGradient id="'+opts.gradientId+'" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="5%" stop-color="var(--ink)" stop-opacity="0.32"/>'
      + '<stop offset="95%" stop-color="var(--ink)" stop-opacity="0.03"/>'
    + '</linearGradient></defs>'
    + '<path d="'+linePath+' L'+x(points.length-1).toFixed(1)+','+baseY.toFixed(1)+' L'+x(0).toFixed(1)+','+baseY.toFixed(1)+' Z" fill="url(#'+opts.gradientId+')" stroke="none"/>';
  const dots = opts.dots === false ? '' : points.map((p,i) => '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.value).toFixed(1)+'" r="'+(p.current?4:2.5)+'" fill="'+(p.current?'var(--ink)':'var(--fg3)')+'"/>').join('');
  const svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:100px;display:block;overflow:visible">'
    + area + refLine
    + '<path d="'+linePath+'" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    + dots
  + '</svg>';
  // Labels are plain HTML below the SVG, not text inside it. The SVG
  // stretches non-uniformly (preserveAspectRatio="none") to fill
  // whatever width the card ends up at, fine for a line's shape, but it
  // warps SVG text into something too wide at a full-screen viewport and
  // too narrow at a small one. Flexbox gives every label its own real,
  // correctly-proportioned font size regardless of chart width.
  const labels = '<div style="display:flex;justify-content:space-between;margin-top:6px">'
    + points.map((p,i) => {
      const end = i === 0 || i === points.length-1;
      return '<div style="text-align:'+(i===0?'left':i===points.length-1?'right':'center')+';min-width:0">'
        + (end ? '<div style="font-size:11px;font-weight:700;color:var(--fg1);white-space:nowrap">'+esc(opts.formatValue(p.value))+'</div>' : '')
        + '<div style="font-size:10.5px;color:var(--fg3);white-space:nowrap">'+esc(p.label)+'</div>'
      + '</div>';
    }).join('')
  + '</div>';
  return svg + labels;
}

// Pier 4's 6 periods were always real, the card just refused to chart
// them, one point looked like a fake trend even though five closed
// periods already sat in PERIODS. Marina and Airport now carry the same
// history (see PERIODS above), so every site scope, and "all 3 sites,"
// gets the real chart instead of only Pier 4 qualifying. Dotted line,
// grid, and a trend footer, the shadcn line-chart look.
function recapCard(){
  const s = computeStatement();
  if (s.mode === 'estimate'){
    return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
      + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:8px">Coverage over time</div>'
      + '<div style="font-size:13px;color:var(--fg2);line-height:1.6">A typed estimate has no period history behind it. Import your export and six months of real periods fill in here.</div>'
    + '</div>';
  }
  const points = PERIODS.slice().reverse().map(p => ({
    value: covForPeriod(p, S.dashScope), label: p.label.slice(0,3), current: p.status === 'open'
  }));
  const avg = points.reduce((a,p) => a+p.value, 0) / points.length;
  const first = points[0].value, last = points[points.length-1].value;
  const pctChange = first ? ((last - first) / first) * 100 : 0;
  const up = pctChange >= 0;
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 0;overflow:hidden">'
    + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px">'
      + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1)">Coverage over time</div>'
      + '<span style="font-size:12px;color:var(--fg3)">6-month average '+avg.toFixed(2)+'x</span>'
    + '</div>'
    + sparklineChart(points, { reference:1, formatValue: v => v.toFixed(2)+'x' })
    + '<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--fg1);padding:14px 0 4px;border-top:1px solid var(--hair);margin-top:4px">'
      + ic(up?'trending-up':'trending-down',14)
      + 'Trending '+(up?'up':'down')+' '+Math.abs(pctChange).toFixed(1)+'% over 6 months'
    + '</div>'
    + '<div style="font-size:11.5px;color:var(--fg3);padding-bottom:14px">Showing coverage for the last 6 periods</div>'
  + '</div>';
}

// Same data shape as coverage, average fleet duty against declared
// operating hours instead of work against lease cost. Gradient-filled
// area instead of a dotted line, the shadcn area-chart look, no 1.0x
// reference either, utilization has no breakeven, just a rate.
function utilizationCard(){
  const s = computeStatement();
  if (s.mode === 'estimate'){
    return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
      + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:2px">Utilization</div>'
      + '<div style="font-size:13px;color:var(--fg2);line-height:1.6">Needs the robot&#39;s reported duty hours, not just its task count. Available once your export or live connection includes it.</div>'
    + '</div>';
  }
  const points = PERIODS.slice().reverse().map(p => ({
    value: utilForPeriod(p, S.dashScope), label: p.label.slice(0,3), current: p.status === 'open'
  }));
  const avg = points.reduce((a,p) => a+p.value, 0) / points.length;
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px">'
      + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1)">Utilization</div>'
      + '<span style="font-size:12px;color:var(--fg3)">6-month average '+Math.round(avg)+'%</span>'
    + '</div>'
    + sparklineChart(points, { formatValue: v => Math.round(v)+'%', area:true, gradientId:'utilAreaFill', dots:false })
  + '</div>';
}

// The coverage number, its delta, and its methodology, as one dashboard
// card in the same family as Coverage over time, Utilization, Needs
// attention, and Where the work is, not free-floating hero text sitting
// above the grid it belongs in.
function coverageKpiCard(){
  const s = computeStatement();
  const covLabel = s.coverage === null ? '—' : s.coverage.toFixed(2)+'x';
  const tag = s.mode === 'estimate'
    ? '<span style="font-size:12.5px;font-weight:700;color:var(--fg3);background:var(--ghost);padding:3px 8px;border-radius:3px">estimate, not measured</span>'
    : '<span style="font-size:12.5px;font-weight:700;color:var(--fg3);background:var(--ghost);padding:3px 8px;border-radius:3px">open period, still moving</span>';
  // Says what it is in the first line rather than behind a disclosure.
  // "How this number is calculated" was a dropdown holding a paragraph of
  // methodology, and an explainer that has to be opened reads as a warning
  // that the thing is hard. The scope is the part people actually need:
  // whose robots, how many, over what.
  const scopeWord = S.dashScope === 'all' ? 'all 3 sites' : SITES[S.dashScope].name;
  const subhead = s.mode === 'estimate'
    ? (s.manualRevenue > 0
      ? money(s.totalValue)+' of estimated work vs. '+money(s.totalInvoice)+' leased, from '+s.manualCount+' robot'+(s.manualCount===1?'':'s')+' at the numbers you typed in'
      : money(s.totalInvoice)+' of lease cost from '+s.manualCount+' robot'+(s.manualCount===1?'':'s')+'. Add what the work is worth per robot to see a coverage ratio.')
    : 'Your whole fleet across '+scopeWord+', '+s.included.length+' robot'+(s.included.length===1?'':'s')+' averaged together.';
  const under = s.mode === 'estimate' ? ''
    : 'Every $1 of lease bought '+(s.coverage === null ? '—' : '$'+s.coverage.toFixed(2))+' of work a person would otherwise have been paid to do. '
      + money(s.totalValue)+' of work against '+money(s.totalInvoice)+' leased.';
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px">'
      + '<div style="font-size:clamp(28px,4.6vw,36px);font-weight:700;letter-spacing:-0.03em;color:var(--fg1);font-variant-numeric:tabular-nums">'+covLabel+'</div>'
      + tag
    + '</div>'
    + '<div style="font-size:13px;font-weight:600;color:var(--fg1);margin-bottom:8px">'+subhead+'</div>'
    + (under ? '<div style="font-size:12.5px;color:var(--fg2);line-height:1.65">'+under+'</div>' : '')
    + (s.mode === 'estimate' ? '<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--hair)"><button type="button" data-act="startRealImport" class="hv-dim" style="padding:11px 18px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:pointer;font-size:13px;font-weight:700">Import my export</button></div>' : '')
  + '</div>';
}

// A robot-level card with nothing to show has two honestly different
// reasons: no robots imported yet, or this demo simply not tracking that
// site per robot. Saying "No robots included yet" for the latter would
// read as if the site has no fleet at all, which is not true.
function noRobotNote(){
  return 'No robots included yet.';
}

// Named "Needs attention," so it has to actually mean that: robots under
// 1x coverage, not the whole fleet ranked. It used to render every
// included robot (the whole point of `sorted` staying separate below was
// just to compute `max` for the bar scale, not to list all of them), which
// looked fine at 6 robots on Pier 4 alone but read as "here's the entire
// fleet" once All 3 sites pulled in the full 13.
function attentionCard(){
  const s = computeStatement();
  const withCov = s.included.filter(r => r.cov !== null);
  const sorted = withCov.slice().sort((a,b) => b.cov - a.cov);
  const flaggedList = sorted.filter(r => r.cov < 1);
  const max = sorted.length ? Math.max.apply(null, sorted.map(r => r.cov)) * 1.05 : 1;
  const rows = flaggedList.map(r => {
    const pct = Math.min(100, (r.cov / max) * 100);
    return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0">'
      + '<span style="width:118px;flex:none;font-size:12.5px;font-weight:600;color:var(--fg1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.name)+'</span>'
      + '<div style="flex:1;height:8px;background:var(--ghost);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+pct.toFixed(1)+'%;background:var(--fg1)"></div></div>'
      + '<span style="width:44px;flex:none;text-align:right;font-size:12.5px;font-weight:700;color:var(--fg1);font-variant-numeric:tabular-nums">'+r.cov.toFixed(2)+'x</span>'
    + '</div>';
  }).join('');
  const flagged = flaggedList[0];
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px">'
      + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1)">Needs attention</div>'
      + '<button type="button" data-act="go" data-view="robots" class="hv-ghost" style="font-size:12px;font-weight:600;color:var(--fg2);background:none;border:none;cursor:pointer">All robots →</button>'
    + '</div>'
    + (flagged ? '<div style="font-size:12px;color:var(--fg3);margin-bottom:12px">'+esc(flagged.name)+' is running under its lease</div>' : '')
    + '<div style="margin-top:6px">'+(rows || '<div style="font-size:13px;color:var(--fg3);padding:6px 0">Nothing under its lease right now, every included robot is covering its cost.</div>')+'</div>'
  + '</div>';
}

function workSplitCard(){
  const s = computeStatement();
  const total = s.totalValue;
  const rows = s.byCategory.map((k, i) => {
    const pct = total > 0 ? (k.value / total) * 100 : 0;
    return '<div style="margin-bottom:14px">'
      + '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px"><span style="font-weight:600;color:var(--fg1)">'+esc(k.work)+' · '+k.count+' '+(k.count===1?'robot':'robots')+'</span><span style="color:var(--fg2);font-variant-numeric:tabular-nums">'+money(k.value)+'</span></div>'
      + '<div style="height:8px;background:var(--ghost);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+(i===0?'var(--fg1)':'var(--hair3)')+'"></div></div>'
    + '</div>';
  }).join('');
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:2px">Where the work is</div>'
    + '<div style="font-size:12px;color:var(--fg3);margin-bottom:16px">Share of work serviced, by kind, this period</div>'
    + (rows || '<div style="font-size:13px;color:var(--fg3)">'+noRobotNote()+'</div>')
  + '</div>';
}

// Same reason as every other card here: one calculation (computeTaxShield),
// this card is just a view of it, never its own arithmetic. Rate/method
// inputs live-patch via applyTaxShield below instead of calling set(), same
// reason Setup's inputs do, a full re-render mid-keystroke would blow away
// focus in the very field being typed into.
function taxShieldCard(){
  const t = computeTaxShield();
  const m = (cents) => money(cents / 100);
  // "13 robots" alone reads as an unexplained number, tie it to something
  // already on screen: the same site scope Fleet now shares with this
  // page (see viewRobots), matching how onboarding already states the
  // same total ("Pier 4, Marina, Airport · 13 robots"), so opening Fleet
  // in this same scope shows exactly this many rows.
  const scopeName = S.dashScope === 'all' ? 'Pier 4, Marina & Airport combined' : SITES[S.dashScope].name+'&#39;s fleet';
  const depBtn = (id, label) => '<button type="button" data-act="setTaxDep" data-method="'+id+'" style="padding:8px 12px;border-radius:4px;border:1px solid '+(S.taxDepMethod===id?'var(--fg1)':'var(--hair2)')+';background:'+(S.taxDepMethod===id?'var(--ghost2)':'transparent')+';color:var(--fg1);cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap">'+label+'</button>';
  const catRows = t.byCategory.map(k => '<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--hair);font-size:12.5px">'
    + '<span style="color:var(--fg1);font-weight:600">'+esc(k.work)+' &middot; '+k.count+' '+(k.count===1?'robot':'robots')+'</span>'
    + '<span style="color:var(--fg2);font-variant-numeric:tabular-nums">'+m(k.costCents)+'</span>'
  + '</div>').join('');
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:2px">Tax shield &amp; depreciation</div>'
    + '<div style="font-size:12px;color:var(--fg3);margin-bottom:16px">What financing '+scopeName+', '+t.robotCount+' robot'+(t.robotCount===1?'':'s')+', instead of leasing them would be worth at tax time. Illustrative, not tax advice.</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:24px;margin-bottom:18px">'
      + '<div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--fg3);margin-bottom:4px">Year-1 tax shield</div><div id="taxShieldValue" style="font-size:24px;font-weight:700;letter-spacing:-0.02em;color:var(--fg1);font-variant-numeric:tabular-nums">'+m(t.shieldCents)+'</div></div>'
      + '<div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--fg3);margin-bottom:4px">Effective first-year cost</div><div id="taxNetCostValue" style="font-size:24px;font-weight:700;letter-spacing:-0.02em;color:var(--fg1);font-variant-numeric:tabular-nums">'+m(t.netCostCents)+'</div></div>'
    + '</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:16px">'
      + '<div><label for="taxRateInput" style="display:block;font-size:11px;font-weight:700;color:var(--fg3);margin-bottom:6px">Tax rate</label>'

function viewDashV2(){
  const hidden = S.dashLayout.filter(id => S.dashHidden.includes(id));
  const visible = S.dashLayout.filter(id => !S.dashHidden.includes(id));
  // Real masonry (see layoutDashMasonry below), not a row/column layout.
  // Grid and flexbox both size a whole row by its tallest member, so a
  // short card next to a tall one always leaves a gap somewhere, inside
  // itself if the row stretches, or below it if the row doesn't. A short
  // card's neighbor below has to wait for the tall card to end either way.
  // Masonry places each card in whichever column is shortest right now, so
  // nothing ever waits on a taller sibling. width/position get set by JS
  // after layout; this starting size is just what paints before that runs.
  return '<div style="padding:0 0 8px;margin-bottom:56px">'
