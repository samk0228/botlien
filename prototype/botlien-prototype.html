/** Which robots the cost comparison is about. S.costScope is either
 * "work:<category>" or "robot:<index>"; anything stale (a category that no
 * longer exists, a robot outside the current site scope) falls back to the
 * biggest category rather than rendering an empty card. */
/** The whole fleet, one site, one kind of work, or one robot.
 *
 * Reads from every robot rather than from the site-filtered statement, so
 * this card can go BROADER than the site filter as well as narrower. The
 * site filter still drives it: changing site sets this to that site (see
 * setDashScope), and from there you can drill down without the page moving.
 *
 * `perUnit` is false wherever the scope mixes units. Picks and active hours
 * cannot be averaged into one cost per unit, so those levels compare total
 * dollars instead, which is unit-free and says the same thing. */
function costScope(){
  const all = computeStatement(true, null);
  const rowsOf = (pred) => all.rows.filter(r => !r.excluded && pred(r));
  const unitsOf = (rows) => [...new Set(rows.map(r => r.work))];
  const build = (key, label, rows) => {
    const works = unitsOf(rows);
    const perUnit = works.length === 1;
    return { key, label, rows, perUnit, work: perUnit ? works[0] : null, workCount: works.length };
  };
  const whole = () => build('all', 'Your whole fleet · all 13 robots, every kind of work', rowsOf(() => true));

  const raw = String(S.costScope || '');
  if (raw === 'all') return whole();
  if (raw.startsWith('site:')){
    const n = Number(raw.slice(5));
    const rows = rowsOf(r => CONFIRM[r.i].site === n);
    if (!rows.length) return whole();
    return build(raw, esc(SITES[n].name)+' · all '+rows.length+' robot'+(rows.length===1?'':'s')+' at this site', rows);
  }
  if (raw.startsWith('robot:')){
    const i = Number(raw.slice(6));
    const row = all.rows.find(r => r.i === i && !r.excluded);
    if (!row) return whole();
    return build(raw, esc(row.name)+' · one robot, against a person doing '+esc(row.work.toLowerCase()), [row]);
  }
  if (raw.startsWith('work:')){
    const w = raw.slice(5);
    const rows = rowsOf(r => r.work === w);
    if (!rows.length) return whole();
    return build(raw, esc(w)+' · all '+rows.length+' robot'+(rows.length===1?'':'s')+' doing it', rows);
  }
  return whole();
}

/** Four levels, widest first, so the list reads as zooming in. */
function costScopePicker(scope){
  const all = computeStatement(true, null);
  const live = all.rows.filter(r => !r.excluded);
  const works = [...new Set(live.map(r => r.work))];
  const opt = (val, text) => '<option value="'+esc(val)+'"'+(scope.key === val ? ' selected' : '')+'>'+esc(text)+'</option>';
  return '<select data-cost-scope style="width:100%;font-size:12.5px;color:var(--fg1);background:transparent;padding:7px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-family:inherit;cursor:pointer">'
    + opt('all', 'Your whole fleet')
    + '<optgroup label="One site">'
      + SITES.map((st,i) => live.some(r => CONFIRM[r.i].site === i) ? opt('site:'+i, st.name) : '').join('')
    + '</optgroup>'
    + '<optgroup label="One kind of work">'
      + works.map(w => opt('work:'+w, w)).join('')
    + '</optgroup>'
    + '<optgroup label="One robot">'
      + live.map(r => opt('robot:'+r.i, r.name)).join('')
    + '</optgroup>'
  + '</select>';
}

function costCard(){
  const s = computeStatement();
  if (s.byCategory.length === 0) return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'+fig('Cost per task','—',noRobotNote(),'','')+'</div>';
  // The dashboard's biggest category by value, since "cost per task" only
  // means one thing when every included robot bills the same way. A mixed
  // fleet still gets a real number, just for the work that carries it.
  // Whole fleet, one site, one kind of work, or one robot. Per-robot
  // matters because an average hides the one unit that is not paying for
  // itself, which is the finding an owner actually needs.
  const scope = costScope();
  const rows = scope.rows;
  const b = scope.perUnit ? workDef(scope.work) : null;

  // Totals work at every level. Per-unit only works where the scope has one
  // unit: picks and active hours cannot be averaged into a single "cost per
  // unit" without inventing a number.
  const invoiceSum = Math.round(rows.reduce((a,r) => a + r.invoice, 0) * 100) / 100;
  const valueSum = Math.round(rows.reduce((a,r) => a + r.value, 0) * 100) / 100;
  const unitSum = Math.round(rows.reduce((a,r) => a + r.units, 0) * 10) / 10;

  // Reads the owner's own wage and throughput (see wageFor/throughputFor),
  // not the published benchmark, so this agrees with the rate the Numbers
  // page derives rather than quoting our defaults back at them.
  const rc = scope.perUnit ? rateCentsFor(scope.work) : null;
  const human = scope.perUnit ? (rc === null ? null : rc / 100) : valueSum;
  // Robot cost: what was invoiced over what was produced. Deliberately the
  // lease invoice and not the purchase price, so both sides are "cost this
  // period over output this period" and neither needs an assumed useful
  // life on top of everything else.
  const robot = scope.perUnit ? (unitSum > 0 ? invoiceSum / unitSum : null) : invoiceSum;
  const money2 = (v) => v === null ? '—' : money(v);

  // A bar per side, both scaled to whichever costs more, so the gap is seen
  // before it is read. Two numbers in a column make you do the comparison
  // yourself; two bars do it for you, which matters most for the reader who
  // has no feel yet for whether $0.18 a pick is good.
  const worst = Math.max(human || 0, robot || 0) || 1;
  const line = (who, val, deriv, amount, fill) => {
    const pct = amount === null ? 0 : Math.max(2, (amount / worst) * 100);
    return '<div style="margin-bottom:14px">'
      + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:5px">'
        + '<span style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3)">'+who+'</span>'
        + '<span style="font-size:18px;font-weight:700;color:var(--fg1);font-variant-numeric:tabular-nums">'+val+'</span></div>'
      + '<div style="height:7px;background:var(--ghost);border-radius:2px;overflow:hidden;margin-bottom:5px">'
        + '<div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+fill+'"></div></div>'
      + '<div style="font-size:11px;color:var(--fg3);line-height:1.5">'+deriv+'</div>'
    + '</div>';
  };

  // "Your robots" is wrong when the scope is one robot, and the ratio is
  // that robot's coverage, not the whole category's.
  const one = rows.length === 1;
  const subject = one ? 'This robot' : 'Your robots';

  let verdict = '';
  if (human !== null && robot !== null && robot > 0){
    const ratio = human / robot;
    const cheaper = ratio >= 1;
    const gap = Math.round(Math.abs(human - robot) * 100) / 100;
    // Per unit, the gap only means something once multiplied out by what
    // was actually done. At totals it already is the period figure.
    const periodGap = scope.perUnit ? Math.round(gap * unitSum * 100) / 100 : gap;
    // Stated either way round. Robots costing more than people is the
    // finding this product exists to surface, not something to bury by
    // rendering only the flattering case.
    const headline = scope.perUnit
      ? subject+' cost'+(one?'s':'')+' '+money(gap)+' '+(cheaper?'less':'more')+' per '+esc(b.unit)
      : subject+' cost'+(one?'s':'')+' '+money(gap)+' '+(cheaper?'less':'more')+' this period';
    verdict = '<div style="border-top:1px solid var(--hair);padding-top:12px">'
      + '<div style="font-size:13px;color:var(--fg1);font-weight:700;margin-bottom:5px">'+headline+'</div>'
      + (scope.perUnit
        ? '<div style="font-size:12px;color:var(--fg2);line-height:1.6;margin-bottom:8px">'
            + 'Across '+unitSum.toLocaleString('en-US')+' '+esc(b.unitPlural)+' this period, that is <b style="color:var(--fg1);font-weight:700">'+money(periodGap)+'</b> '
            + (cheaper ? 'less than paying people to do it.' : 'more than paying people to do it.')
          + '</div>'
        : '')
      + '<div style="font-size:11px;color:var(--fg3);line-height:1.6">'
        + money(human)+' &divide; '+money(robot)+' = '+ratio.toFixed(2)+'x, '
        + (one ? 'this robot&#39;s' : 'this slice&#39;s')+' coverage.'
      + '</div>'
    + '</div>';
  }

  const subtitle = scope.perUnit
    ? 'What one '+esc(b.unit)+' costs each way'
    : 'What this period cost each way, across '+scope.workCount+' kinds of work';

  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:2px">A person vs your robots</div>'
    + '<div style="font-size:12px;color:var(--fg3);margin-bottom:14px">'+subtitle+'</div>'
    // Labelled, and says its reach. Sitting near the site filter, an
    // unlabelled dropdown invites the assumption that it scopes the page;
    // this one only ever changes this card.
    + '<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3);margin-bottom:5px">Compare</div>'
    + costScopePicker(scope)
    + '<div style="font-size:11px;color:var(--fg3);margin:6px 0 18px;line-height:1.5">'+scope.label+' · this card only</div>'
    + line('A person', money2(human),
        scope.perUnit
          ? (human === null ? 'Set how many '+esc(b.unitPlural)+' a person does in an hour, on Numbers.'
             : money(wageFor(scope.work))+' / hr &divide; '+throughputFor(scope.work)+' '+esc(b.unitPlural)+' per hour')
          : 'What people would have been paid for the same work',
        human, 'var(--hatch2)')
    + line(one ? 'This robot' : 'Your robots', money2(robot),
        scope.perUnit
          ? (robot === null ? 'No '+esc(b.unitPlural)+' recorded this period, so there is nothing to divide by.'
             : money(invoiceSum)+' invoiced &divide; '+unitSum.toLocaleString('en-US')+' '+esc(b.unitPlural))
          : 'Invoiced across '+rows.length+' robot'+(rows.length===1?'':'s'),
        robot, 'var(--ink)')
    + verdict
  + '</div>';
}

// benchmarkVenueCard lived here: a percentile and a cohort median against
// other operators. Removed. With no customers there is no cohort, so every
// figure on it was a sample dressed as a comparison, and the card had to
// admit that in its own footnote. It comes back when the benchmark is real.

function fig(label, value, note, wrap, noteStyle){
  return '<div style="'+wrap+'">'
    + '<div style="font-size:13px;font-weight:600;color:var(--fg3);margin-bottom:10px">'+label+'</div>'
    + '<div style="font-size:clamp(24px,4.4vw,32px);font-weight:700;letter-spacing:-0.03em;color:var(--fg1);font-variant-numeric:tabular-nums">'+value+'</div>'
    + '<div style="font-size:12.5px;color:var(--fg2);margin-top:8px;line-height:1.5;'+noteStyle+'">'+note+'</div></div>';
}

// Consumable condition. Reported by Gausium; Locus and Fetch send nothing of the
// kind, so their robots say so plainly rather than showing an empty meter — a
// missing input is stated as missing, never rendered as a zero.
function conditionBlock(r){
  if(!r.parts) return '<div style="margin-top:14px;font-family:inherit;font-size:11.5px;color:var(--fg3)">consumable life · not reported by '+(r.model||'').split(' ')[0]+'</div>';
  const spent = r.parts.filter(p => p.left <= 0).length;
  const bars = r.parts.map(p => {
    const past = p.left <= 0;
    // Life remaining reads left to right. A part past its rating has no bar to
    // draw, so the whole track carries the hatch this design already uses for
    // the figure that is going the wrong way.
    const fill = past
      ? 'repeating-linear-gradient(135deg,var(--hatch2) 0 2px,transparent 2px 5px)'
      : 'var(--ink)';
    const width = past ? '100%' : Math.max(0, Math.min(100, p.left)) + '%';
    const label = past ? Math.round(-p.left) + '% over' : Math.round(p.left) + '% left';
    return '<div style="display:flex;align-items:center;gap:12px;margin-bottom:9px">'
      + '<span data-barlabel style="width:104px;flex:none;font-family:inherit;font-size:12px;color:var(--fg2)">'+p.name+'</span>'
      + '<span style="flex:1;min-width:60px;height:8px;border:1px solid var(--hair2);position:relative;display:block">'
        + '<i style="position:absolute;left:0;top:0;bottom:0;width:'+width+';background:'+fill+'"></i></span>'
      + '<span style="width:96px;flex:none;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:'+(past?700:400)+';color:'+(past?'var(--fg1)':'var(--fg2)')+'">'+label+'</span>'
      + '<span style="width:104px;flex:none;text-align:right;font-family:inherit;font-size:11.5px;color:var(--fg3)">'+p.used+'</span></div>';
  }).join('');
  const note = spent
    ? 'A part past its rating is work this machine is still doing on borrowed time. Replacing it is not in the figure above.'
    : 'Every part is inside its rated life.';
  // "4 bars" read as "4 robots" until this said otherwise: made explicit
  // that every bar below belongs to this one robot, r.parts.length
  // separate consumable parts, not a fleet count.
  return '<div style="margin-top:22px;padding-top:18px;border-top:1px dashed var(--hair)">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:14px">'
      + '<span style="font-size:12.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--fg2)">Condition</span>'
      + '<span style="font-size:12.5px;color:var(--fg3)">'+r.parts.length+' parts on this one robot, life remaining against the maker&#39;s rating</span></div>'
    + '<div data-bars style="margin-bottom:12px">'+bars+'</div>'
    + '<div style="font-size:13px;line-height:1.6;color:var(--fg2);max-width:86ch">'+note+'</div>'
    + '<div style="margin-top:10px;font-family:inherit;font-size:11.5px;color:var(--fg3)">also reported · '+r.hand+' of active time hand-driven · battery '+r.temp+'</div>'
    + '</div>';
}

function viewRobots(){
  // Coverage, chip, and the equation used to be a hardcoded string per
  // robot. Now they're read off computeStatement(), the one calculation
  // Dashboard already trusted, so a wage or invoice edit on Setup moves
  // this page too instead of only moving the page that made the edit.
  // Duty time and condition stay on ROBOTS: telemetry, not something an
  // invoice edit has any business changing.
  //
  // Scope is S.dashScope, the exact same state and control Dashboard
  // uses (see scopeToggle below), not a second Fleet-only filter that
  // could drift out of sync with it. computeStatement(true, scope) skips
  // the manual-estimate and date-range short-circuits (Fleet always
  // shows the current period's real per-robot rows) but still respects
  // whichever site(s) are in view, so "All 3 sites" here is the same 13
  // robots the Tax shield card counts.
  const scope = scopeFilter();
  const stmt = computeStatement(true, scope);
  // Condition used to be its own page, looping these same robots through
  // the same conditionBlock() every row below already calls. Merged in:
  // the per-robot bars stay exactly where they were, in the row, once.
  // What's added here is only the context that page had and no row does,
  // why condition matters and who isn't reporting it.
  const silent = stmt.rows.map(s => ROBOTS[s.i]).filter(r => !r.parts);
  // Only Pier 4's two Gausium scrubbers are wired to the wear feed (see
  // ROBOTS above), so whether the "Scrubber 75 proves it" story below
  // makes sense at all depends on whether Pier 4 is even in the current
  // scope, not on how many robots are showing.
  const hasConditionReporters = stmt.rows.some(s => !!ROBOTS[s.i].parts);
  const silentOtherGausium = silent.filter(r => r.name.indexOf('Scrubber') === 0 && r.site !== 0);
  // Six full rows, equation and condition bars included, all open at
  // once, was everything about every robot on screen at the same time.
  // One row per robot now, closed by default; opening one is the only
  // way to see that robot's equation and condition.
  //
  // No filter toggle anymore either. It split the fleet into two lists
  // for what's really a one-robot-out-of-six case, and needing a
  // separate view to find the flagged robot was more clicks than the
  // problem deserved. The caution mark on its name in the one list does
  // the same job at a glance, without hiding the other five.
  const rows = stmt.rows.map((s) => {
    const r = ROBOTS[s.i];
    const i = s.i;
    const short = s.cov !== null && s.cov < 1;
    const open = S.openRobot === i;
    const spentParts = (r.parts || []).filter(p => p.left <= 0).length;
    const chip = short ? 'under its lease' : (s.benchmarkWage ? 'benchmark rate' : 'covered');
    const chipFg = short ? 'var(--fg1)' : 'var(--fg2)';
    const dutyFill = short ? 'repeating-linear-gradient(135deg,var(--hatch2) 0 2px,transparent 2px 5px)' : 'var(--ink)';
    const covLabel = s.cov === null ? '—' : s.cov.toFixed(2)+'x';
    const unitsPhrase = s.basis === 'active_hour'
      ? s.units.toFixed(1)+' active hours'
      : s.units.toLocaleString('en-US')+' '+s.unit;
    // A stepped block rather than a label column with numbers stranded on
    // the far right: each step is the number first, then where it came
    // from underneath it, so the eye reads down one edge instead of
    // ping-ponging across the card.
    //
    // Source is stated per step, because the difference between "the robot
    // reported this" and "you typed this" is the difference between a
    // measurement and an assumption, and nothing on screen said which.
    const step = (label, val, src, srcKind) =>
      '<div style="padding:9px 0;border-top:1px solid var(--hair)">'
      + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">'
        + '<span style="font-size:12.5px;color:var(--fg2)">'+label+'</span>'
        + '<span style="font-size:15px;font-weight:700;color:var(--fg1);font-variant-numeric:tabular-nums">'+val+'</span></div>'
      // Three states, not two: measured by the robot, entered by the owner,
      // or worked out from the other two. Calling a derived figure
      // "you set this" would be a lie about where it came from, which is
      // exactly the confusion these badges exist to remove.
      + '<div style="display:flex;align-items:center;gap:6px;margin-top:4px">'
        + '<span style="flex:none;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1.5px 5px;border-radius:3px;'
          + (srcKind === 'telemetry' ? 'background:var(--ghost2);color:var(--fg2)'
             : srcKind === 'derived' ? 'background:transparent;color:var(--fg3);border:1px dashed var(--hair2)'
             : 'background:transparent;color:var(--fg3);border:1px solid var(--hair)')
          + '">'+(srcKind === 'telemetry' ? 'from the robot' : srcKind === 'derived' ? 'worked out' : 'you set this')+'</span>'
        + '<span style="font-size:11px;color:var(--fg3);min-width:0">'+src+'</span></div>'
    + '</div>';
    const eq = step('Work the robot did', unitsPhrase, 'Counted by the robot itself, from your usage import', 'telemetry')
      + step('What a person costs for one', s.rate === null ? '—' : money(s.rate),
          money(s.wage)+' / hr &divide; '+throughputFor(s.work)+' '+esc(workDef(s.work).unitPlural)+' per hour', 'set')
      + step('So the work is worth', s.rate === null ? '—' : money(s.value), unitsPhrase+' &times; '+(s.rate === null ? '—' : money(s.rate)), 'derived')
      + step('You paid to lease it', money(s.invoice), 'Your invoice, charged for the same days', 'set')
      + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 0 0;margin-top:4px;border-top:2px solid var(--fg1)">'
        + '<span style="font-size:12.5px;font-weight:600;color:var(--fg1)">Every $1 of lease bought</span>'
        + '<span style="font-size:19px;font-weight:700;color:var(--fg1);font-variant-numeric:tabular-nums">'+(s.cov === null ? '—' : '$'+s.cov.toFixed(2))+'</span></div>'
      + '<div style="font-size:11px;color:var(--fg3);margin-top:3px">of work a person would have been paid for. That is '+covLabel+'.</div>';
    // Same wording the fully-reported condition block already uses for
    // an all-clear ("Every part is inside its rated life"), and the same
    // per-part count the row header used to show as its own chip, so
    // this line isn't a third way of saying either thing.
    const conditionLine = !r.parts
      ? 'condition not reported by '+(r.model||'').split(' ')[0]
      : spentParts
        ? spentParts+(spentParts === 1 ? ' part past life' : ' parts past life')
        : 'all parts within rated life';
    const caution = !short ? '' : '<span title="Under its lease" style="display:inline-flex;color:var(--fg1)">'+ic('triangle-alert',15)+'</span>';

    const summary = '<div data-act="toggleRobot" data-i="'+i+'" class="hv-fade" style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:20px 4px;cursor:pointer">'
      + '<div style="min-width:180px"><div style="display:flex;align-items:center;gap:7px;font-size:15.5px;font-weight:'+(open||short?700:600)+';color:var(--fg1)">'+r.name+caution+'</div>'
        + '<div style="font-size:12px;color:var(--fg3);margin-top:3px">'+r.model+'</div></div>'
      + '<div style="min-width:130px"><span style="font-size:11.5px;font-weight:700;color:'+chipFg+'">'+chip+'</span></div>'
      + '<div style="min-width:80px;font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'+r.duty+'</div>'
      + '<div style="min-width:170px;font-size:12.5px;font-weight:'+(spentParts?700:500)+';color:'+(spentParts?'var(--fg1)':'var(--fg3)')+'">'+conditionLine+'</div>'
      + '<span style="margin-left:auto;display:flex;align-items:baseline;gap:10px">'
        + '<span style="font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">'+ROBOT_DELTA[r.name]+' vs July</span>'
        + '<span style="font-size:22px;font-weight:700;letter-spacing:-0.02em;color:var(--fg1);font-variant-numeric:tabular-nums">'+covLabel+'</span></span>'
      + '<span style="font-size:13px;color:var(--fg3);width:12px;text-align:center">'+(open?'–':'+')+'</span>'
    + '</div>';

    const detail = !open ? '' : '<div style="padding:0 4px 26px">'
      + '<div data-split style="display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:28px;align-items:start;margin-bottom:4px">'
        + '<div>'
          + '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg2);margin-bottom:8px"><span>Time it actually ran</span><span style="font-variant-numeric:tabular-nums">'+r.duty+'</span></div>'
          + '<div style="height:8px;border:1px solid var(--hair2);position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:'+r.dutyPct+';background:'+dutyFill+'"></div></div>'
          + '<div style="display:flex;align-items:center;gap:6px;margin-top:8px">'
            + '<span style="flex:none;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1.5px 5px;border-radius:3px;background:var(--ghost2);color:var(--fg2)">from the robot</span>'
            + '<span style="font-size:11px;color:var(--fg3)">'+esc(r.hours)+'</span></div>'
          // The bar's full width is the schedule the owner declared on
          // Numbers, not anything the robot said, and the two being
          // different things is the whole point of the measure.
          + '<div style="font-size:11px;color:var(--fg3);margin-top:6px;line-height:1.5">Measured against the '+(S.robotHours[i] ?? parseFloat((SETUP[i]||{}).hours||'0'))+' h a day you scheduled it for. Raise the schedule and this reads lower, because the robot ran the same hours either way.</div>'
        + '</div>'
        + '<div style="min-width:0">'+eq+'</div>'
      + '</div>' + conditionBlock(r) + '</div>';

    return '<div style="border-top:1px solid var(--hair)">' + summary + detail + '</div>';
  }).join('');

  // First flagged robot, computed fresh every render instead of a robot
  // name and its dollar figures typed once, so an edit that pushes a
  // different robot under its lease, or pulls this one back over, doesn't
  // leave a paragraph that's still describing whichever robot needed
  // attention when this was written.
  const flagged = stmt.rows.find(s => !s.excluded && s.cov !== null && s.cov < 1);
  const flaggedR = flagged ? ROBOTS[flagged.i] : null;
  const flaggedUnitsPhrase = flagged && (flagged.basis === 'active_hour'
    ? flagged.units.toFixed(1)+' active hours'
    : flagged.units.toLocaleString('en-US')+' '+flagged.unit);

  // Same phrasing the Tax shield card uses for the same S.dashScope, so a
  // "Pier 4, Marina & Airport combined, 13 robots" on one page and this
  // page's own count of rows never say two different things.
  const scopeName = S.dashScope === 'all' ? 'Pier 4, Marina & Airport combined' : SITES[S.dashScope].name+'&#39;s';
  const silentNote = !silent.length ? '' : silent.length+' of these robots report nothing about condition: '+silent.map(r => r.name).join(', ')+'. Locus and Fetch do not expose it at all'
    + (silentOtherGausium.length ? ', and Gausium scrubbers outside Pier 4 are not wired to it yet' : '') + ', so those rows carry no bars rather than an estimate guessed from hours run.';

  return '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:16px">'+scopeToggle()+'</div>'
    + '<div style="padding:0;margin-bottom:56px">'
      + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:26px">'
        + '<h2 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--fg1)">Fleet</h2>'
        + '<span style="font-size:13px;color:var(--fg3)">'+scopeName+' '+stmt.rows.length+' robot'+(stmt.rows.length===1?'':'s')+'. Open one for the equation and condition behind its number.'+(hasConditionReporters ? '' : ' Gausium&#39;s wear feed isn&#39;t wired up at this site yet, so condition won&#39;t show below.')+'</span></div>'
      + (stmt.rows.length ? rows : '<div style="padding:24px 4px;font-size:13.5px;color:var(--fg3)">'+noRobotNote()+'</div>') + '</div>'
    + '<div style="padding:0;margin-bottom:48px">'
      + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:8px">'
        + '<h2 style="font-size:18px;font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--fg1)">Why condition sits next to the money</h2></div>'
      + (hasConditionReporters
        ? '<p style="font-size:14px;line-height:1.7;color:var(--fg2);margin:0 0 16px;max-width:88ch">Gausium is the only vendor that reports consumable wear directly, the difference between a scrubber that cleans and one pushing dirty water around while still logging active hours. Scrubber 75 proves it: all four parts under 8% of rating, and the lowest coverage of Pier 4&#39;s two scrubbers, a connection the invoice alone wouldn&#39;t show. It&#39;s also what a lender reads for resale value, visible here months before it shows up in a payment.</p>'
        : '<p style="font-size:14px;line-height:1.7;color:var(--fg2);margin:0 0 16px;max-width:88ch">No robot at this scope reports consumable wear yet. Pier 4&#39;s two Gausium scrubbers do, switch scope to include Pier 4 to see them.</p>')
      + (silentNote ? '<p style="font-size:13px;line-height:1.7;color:var(--fg3);margin:0;max-width:88ch">'+silentNote+'</p>' : '')
    + '</div>'
    + (!flagged ? '' : '<div style="padding:0">'
      + '<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:12px">'
        + '<h2 style="font-size:18px;font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--fg1)">'+esc(flagged.name)+' is under its lease</h2>'
        + '<span style="font-size:13px;color:var(--fg3)">'+flagged.cov.toFixed(2)+'x · '+esc(flaggedR.duty)+' of '+esc(flaggedR.hours.split(' of ')[1])+'</span></div>'
      + '<p style="font-size:14.5px;line-height:1.7;color:var(--fg2);margin:0 0 20px;max-width:86ch">'+flaggedUnitsPhrase+' in 30 days came to '+money(flagged.value)+' of '+esc(flagged.work.toLowerCase())+' against a '+money(flagged.invoice)+' invoice. Either it needs more shifts, or it belongs somewhere else. This is what buying the work costs, not what it earned.</p>'
      + '<button type="button" data-act="go" data-view="setup" class="hv-ghost" style="padding:12px 18px;border-radius:3px;border:1px solid var(--hair2);background:transparent;cursor:pointer;font-size:13px;font-weight:700;color:var(--fg1)">Check this robot&#39;s inputs</button></div>');
}

// The values themselves already apply the moment they're typed, computeStatement()
// reads live state, not a saved copy. This button is reassurance, not a
// commit step: something to press that says "done with this one" and
// answers back, so editing a field doesn't leave you wondering whether it
// took. Resets to "Save" the moment this row is touched again, see the
// setupSaved reset in the input/change handlers below.
/** Every category on offer: the seven we publish numbers for, plus any the
 * owner has already named, so a second robot doing the same custom work is
 * picked from the list rather than retyped. */
function workOptions(){
  const known = new Set(WORK_CATEGORIES);
  Object.keys(S.customWork).forEach(w => known.add(w));
  // Whatever robots actually do stays on the list even if it was removed,
  // so a category can never be in use and unpickable at the same time.
  const inUse = new Set(CONFIRM.map((c,i) => S.confirmWork[i] ?? c.work));
  inUse.forEach(w => { if (w) known.add(w); });
  return [...known].filter(w => inUse.has(w) || !S.hiddenWork.includes(w));
}

/** "What it does": a real dropdown, plus a way out of it.
 *
 * This was briefly a text input with a datalist, which failed the obvious
 * test: a datalist filters its suggestions against what is already in the
 * field, and the field always arrives pre-filled, so opening it showed one
 * option or none and the seven categories were effectively invisible.
 *
 * A select shows every option on click, and the last one swaps in a text
 * field, so naming your own work is discoverable instead of a thing you had
 * to already know you could do. */
function workInput(id, i, value){
  const typing = !!S.workEntry[i];
  const open = S.workMenu === i;
  // A custom menu rather than a <select>, because a native option cannot
  // hold a control and a mistyped category otherwise sticks around in every
  // dropdown forever. Same pattern the site filter already uses.
  const row = (w) => '<div data-act="pickWork" data-i="'+i+'" data-work="'+esc(w)+'" class="hv-ghost" style="display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13px;font-weight:'+(w===value?700:500)+';color:var(--fg1)">'
      + '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(w)+'</span>'
      // Every row, ours included: a warehouse has no use for "Laundry
      // handling" cluttering the list it picks from every time. Removing
      // one of ours only hides it (see S.hiddenWork), so it can come back;
      // removing an owner's own name deletes it. Either way it is refused
      // while a robot still does that work, or those robots would point at
      // a category that no longer exists.
      + '<span data-act="deleteWork" data-work="'+esc(w)+'" title="Remove &quot;'+esc(w)+'&quot; from this list" role="button" aria-label="Remove '+esc(w)+'" class="hv-ghost" style="flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;color:var(--fg3)">'
        + ic('trash-2',13) + '</span>'
    + '</div>';

  return '<div style="position:relative">'
    + '<div id="'+id+'" data-act="toggleWorkMenu" data-i="'+i+'" class="hv-ghost" style="display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid var(--hair2);cursor:pointer;font-size:13.5px;color:var(--fg1)">'
      + '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(value)+'</span>'
      + ic('chevron-down',14,'color:var(--fg3);flex:none')
    + '</div>'
    + (!open ? '' :
        '<div data-pop-back></div><div data-work-menu data-pop style="position:absolute;top:calc(100% + 4px);left:0;right:0;min-width:220px;max-height:280px;overflow-y:auto;background:var(--menu);border:1px solid var(--hair2);border-radius:5px;z-index:60;box-shadow:0 8px 24px rgba(10,10,10,.14)">'
        + workOptions().map(row).join('')
        + '<div data-act="startWorkEntry" data-i="'+i+'" class="hv-ghost" style="padding:9px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--fg1);border-top:1px solid var(--hair)">+ Type my own…</div>'
      + '</div>')
  + '</div>'
    + (!typing ? '' :
        '<input id="workNew-'+i+'" data-work-new="'+i+'" type="text" autocomplete="off" value="" placeholder="Name the work, then press Enter"'
        + ' style="width:100%;margin-top:8px;font-size:13.5px;color:var(--fg1);background:transparent;padding:8px 2px;border:none;border-bottom:1px solid var(--fg1);outline:none;font-family:inherit">');
}

/** The people behind one kind of work's rate, collapsed under its row.
 *
 * Roles rather than names on purpose: the arithmetic needs what a job pays
 * and what it produces, and naming staff would turn a rates table into
 * personal data without making a single figure more accurate.
 *
 * Both halves of the rate come from here when anyone is listed, weighted by
 * hours, so a 40-hour picker moves the blend more than a 4-hour one. */
function rosterBlock(work, b, perLabel, people){
  const open = !!S.rateOpen[work];
  const head = '<div data-act="toggleRoster" data-work="'+esc(work)+'" class="hv-fade" style="display:flex;align-items:center;gap:9px;padding:8px 4px 14px;cursor:pointer">'
    + '<span style="font-size:12px;color:var(--fg3);width:10px;text-align:center">'+(open?'–':'+')+'</span>'
    + '<span style="font-size:12px;font-weight:600;color:var(--fg2)">'
      + (people.length ? people.length+' role'+(people.length===1?'':'s')+' doing this work' : 'No people added, so this rate is still a benchmark')
    + '</span></div>';
  if (!open) return head;

  const cell = (attr, id, value, w, step) =>
    '<input data-emp-'+attr+'="'+id+'" type="'+(attr==='role'?'text':'number')+'"'+(attr==='role'?'':' min="0" step="'+step+'" inputmode="decimal"')
    + ' value="'+esc(value)+'" style="width:'+w+';font-size:12.5px;color:var(--fg1);background:transparent;padding:6px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-family:inherit'+(attr==='role'?'':';font-variant-numeric:tabular-nums')+'">';

  const rows = people.map(e =>
    '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:9px 0;border-top:1px solid var(--hair)">'
    + cell('role', e.id, e.role, '150px', '')
    + '<span style="display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--fg2)">$'+cell('wage', e.id, e.wage, '62px', '0.25')+'<span style="font-size:11px;color:var(--fg3)">/ hr</span></span>'
    + '<span style="display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--fg2)">'+cell('units', e.id, e.unitsPerHour, '54px', 'any')+'<span style="font-size:11px;color:var(--fg3)">'+esc(perLabel)+' / hr</span></span>'
    + '<span style="display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--fg2)">'+cell('hours', e.id, e.hoursWeek, '46px', '1')+'<span style="font-size:11px;color:var(--fg3)">hrs / wk</span></span>'
    + '<button type="button" data-act="removeEmployee" data-id="'+e.id+'" title="Remove this role" class="hv-ghost" style="margin-left:auto;padding:5px 9px;border-radius:4px;border:1px solid var(--hair2);background:transparent;color:var(--fg2);cursor:pointer;font-size:11.5px;font-weight:600">Remove</button>'
  + '</div>').join('');

  return head
    + '<div style="padding:0 4px 18px">'
      + (people.length ? '<div style="display:flex;gap:14px;font-size:10.5px;font-weight:700;color:var(--fg3);padding-bottom:2px"><span style="width:150px">Role</span><span>Loaded wage</span><span>Output</span><span>Hours</span></div>' : '')
      + rows
      + '<button type="button" data-act="addEmployee" data-work="'+esc(work)+'" class="hv-ghost" style="margin-top:12px;padding:8px 14px;border-radius:4px;border:1px dashed var(--hair2);background:transparent;color:var(--fg1);cursor:pointer;font-size:12px;font-weight:600">+ Add a role</button>'
      + '<div style="font-size:11px;color:var(--fg3);margin-top:10px;line-height:1.6">'
        + '<b style="color:var(--fg2);font-weight:600">Loaded wage</b> is pay plus taxes and benefits, what the hour really costs you. '
        + '<b style="color:var(--fg2);font-weight:600">Output</b> is what one person gets through in an hour of this work. '
        // Hours only ever acts as a weight, so with one role it genuinely
        // does nothing and looks broken. Say so rather than leave someone
        // typing into a field that appears dead.
        + '<b style="color:var(--fg2);font-weight:600">Hours</b> decides how much each role counts toward the average: someone on 40 hours moves it more than someone on 4.'
        + (people.length === 1 ? ' With only one role it changes nothing yet, since an average of one is just that one. Add a second and it starts to matter.' : '')
      + '</div>'
    + '</div>';
}

/** The division spelled out, one line per work category in use. Same
 * arithmetic the table above performs, written the way an owner would check
 * it by hand. */
function rateDerivationLines(works){
  return works.map(work => {
    const b = workDef(work);
    const per = throughputFor(work);
    const rc = rateCentsFor(work);
    const perLabel = b.basis === 'active_hour' ? 'hour' : b.unitPlural;
    if (rc === null) return esc(work)+': set how many '+esc(perLabel)+' a person does in an hour to derive a rate.';
    return money(wageFor(work))+' / hr &divide; '+per+' '+esc(perLabel)+' per hour = '+money(rc/100)+' per '+esc(b.unit);
  }).join('<br>');
}

/** What one robot costs per unit: its own invoice over its own output.
 * The counterpart to the person figure beside it, and the number an owner
 * assumes "replacement rate" means until told otherwise. */
function robotUnitCost(s){
  return s.units > 0 ? s.invoice / s.units : null;
}
function robotUnitCostLabel(s, b){
  const c = robotUnitCost(s);
  return c === null ? '—' : money(c)+' / '+b.unit;
}
function robotUnitCostDerivation(s, b){
  const c = robotUnitCost(s);
  if (c === null) return 'No '+b.unitPlural+' recorded, so there is nothing to divide by.';
  const n = s.basis === 'active_hour' ? s.units.toFixed(1) : s.units.toLocaleString('en-US');
  return money(s.invoice)+' ÷ '+n+' '+b.unitPlural;
}

// The change-email flow, a real state machine like sign-in's own
// email-link screens, not a "here's what this would do" stub: enter the
// new address, we simulate sending a 6-digit code, entering the right
// shape of code (demo has no real inbox to check against) flips
// S.accountEmail over and every place it's shown reads the new value.
function emailChangeBlock(){
  if (S.emailChangeStage === 'idle') return '';
  if (S.emailChangeStage === 'form'){
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.emailChangeNew.trim());
    const disabled = S.emailChangeSending || !valid;
    return '<div style="margin:0 0 24px;padding:16px 18px;border:1px solid var(--hair2);border-radius:6px;max-width:420px">'
      + '<div style="font-size:12.5px;font-weight:700;color:var(--fg3);margin-bottom:8px">New email</div>'
      + '<input id="emailChangeInput" type="text" inputmode="email" autocomplete="email" placeholder="you@company.com" value="'+esc(S.emailChangeNew)+'" style="width:100%;font-size:14px;color:var(--fg1);background:transparent;padding:10px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;margin-bottom:14px">'
      + '<div style="display:flex;flex-wrap:wrap;gap:10px">'
        + '<button type="button" data-act="sendEmailChangeCode"'+(disabled?' disabled':'')+' style="padding:10px 16px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:'+(disabled?'default':'pointer')+';opacity:'+(disabled?0.5:1)+';font-size:13px;font-weight:700">'+(S.emailChangeSending?'Sending…':'Send verification code')+'</button>'
        + '<button type="button" data-act="cancelEmailChange" style="padding:10px 14px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--fg2)">Cancel</button>'
      + '</div>'
    + '</div>';
  }
  if (S.emailChangeStage === 'code'){
    return '<div style="margin:0 0 24px;padding:16px 18px;border:1px solid var(--hair2);border-radius:6px;max-width:420px">'
      + '<div style="font-size:13px;color:var(--fg2);line-height:1.6;margin-bottom:14px">We sent a 6-digit code to <b style="color:var(--fg1);font-weight:700">'+esc(S.emailChangeNew)+'</b>. Enter it below to confirm the change.</div>'
      + '<input id="emailChangeCodeInput" type="text" inputmode="numeric" maxlength="6" placeholder="123456" value="'+esc(S.emailChangeCode)+'" style="width:100%;font-size:16px;letter-spacing:0.3em;font-variant-numeric:tabular-nums;color:var(--fg1);background:transparent;padding:10px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;margin-bottom:'+(S.emailChangeCodeErr?'6':'14')+'px">'
      + (S.emailChangeCodeErr ? '<div style="font-size:12px;color:var(--fg1);margin-bottom:14px">That code doesn&#39;t look right. It&#39;s 6 digits, check your email and try again.</div>' : '')
      + '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">'
        + '<button type="button" data-act="confirmEmailChangeCode"'+(S.emailChangeVerifying?' disabled':'')+' style="padding:10px 16px;border-radius:4px;border:none;background:var(--ink);color:var(--ink-fg);cursor:'+(S.emailChangeVerifying?'default':'pointer')+';opacity:'+(S.emailChangeVerifying?0.5:1)+';font-size:13px;font-weight:700">'+(S.emailChangeVerifying?'Verifying…':'Confirm')+'</button>'
        + '<button type="button" data-act="sendEmailChangeCode" style="padding:10px 12px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--fg2)">Resend code</button>'
        + '<button type="button" data-act="cancelEmailChange" style="padding:10px 12px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--fg2)">Cancel</button>'
      + '</div>'
    + '</div>';
  }
  // 'done'
  return '<div style="margin:0 0 24px;padding:14px 18px;border:1px solid var(--hair2);border-radius:6px;max-width:420px;display:flex;align-items:center;gap:10px">'
    + ic('check',16)
    + '<div style="font-size:13px;color:var(--fg2);line-height:1.6">Email updated to <b style="color:var(--fg1);font-weight:700">'+esc(S.accountEmail)+'</b>.</div>'
  + '</div>';
}

// Setup and Rates used to be two separate nav destinations. Both are the
// same job, what to assume when computing coverage, so they're one page
// now: per-robot inputs first, then the work-type rates those per-robot
// replacement figures are themselves derived from, one Save for the form.
function viewSetup(){
  // Scope follows S.dashScope now, the same control Dashboard and Fleet
  // already share (see scopeToggle below), so editing a robot's wage or
  // invoice here always happens against the same set of robots you can
  // currently see the money for on those pages.
  const scope = scopeFilter();
  const stmt = computeStatement(true, scope);
  // These five fields used to be static divs styled to look like inputs,
  // nothing to click into, nothing typed ever went anywhere. Real inputs
  // now, reading and writing the same per-robot overlays computeStatement()
  // reads, so what's typed here is the number Fleet and Dashboard show,
  // not a second copy of it that only this page believes.
  const rows = stmt.rows.map((s) => {
    const r = SETUP[s.i];
    const i = s.i;
    const open = S.openSetup === i;
    const b = workDef(s.work);
    const hoursVal = S.robotHours[i] ?? parseFloat(r.hours);
    const summary = s.work+' · '+money(s.invoice)+' / mo · '+money(s.rate)+' / '+b.unit+' · '+hoursVal+' h / day';
    let panel = '';
    if (open){
      panel = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:24px;padding:4px 4px 28px">'
        + '<div><label for="confirmWork-'+i+'" style="display:block;font-size:11.5px;font-weight:700;color:var(--fg3);margin-bottom:6px">What it does</label>'
          + workInput('confirmWork-'+i, i, s.work)
          + (S.workDeleteBlocked
              ? '<div style="font-size:11px;color:var(--fg1);font-weight:600;margin-top:6px;line-height:1.5">&ldquo;'+esc(S.workDeleteBlocked)+'&rdquo; is still what some robots do. Move them to something else first, then delete it.</div>'
              : '<div style="font-size:11px;color:var(--fg3);margin-top:6px;line-height:1.5">'+(isCustomWork(s.work) ? 'Your own category. Set what a unit of it is called, and its rate, below.' : 'Type your own if none of these fit.')+'</div>')
          + '</div>'
        + '<div><label for="setupInvoice-'+i+'" style="display:block;font-size:11.5px;font-weight:700;color:var(--fg3);margin-bottom:6px">Monthly invoice</label>'
          + '<input id="setupInvoice-'+i+'" data-i="'+i+'" type="number" min="0" inputmode="decimal" value="'+s.invoice.toFixed(2)+'" style="width:100%;font-size:13.5px;color:var(--fg1);background:transparent;padding:10px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-variant-numeric:tabular-nums"></div>'
        // Both sides of the comparison, side by side and labelled by WHO,
        // because "Replacement rate: $0.40 per pick" on a robot's own panel
        // reads as what the robot costs. It is the opposite: what a person
        // costs, which is the thing being replaced.
        + '<div><div style="font-size:11.5px;font-weight:700;color:var(--fg3);margin-bottom:6px">A person costs</div>'
          + '<div id="setupRate-'+i+'" style="font-size:13.5px;color:var(--fg1);padding:10px 2px;border-bottom:1px solid var(--hair2);font-variant-numeric:tabular-nums">'+(s.rate === null ? '—' : money(s.rate)+' / '+b.unit)+'</div>'
          + '<div id="setupDerive-'+i+'" style="font-family:inherit;font-size:11.5px;color:var(--fg3);margin-top:6px">'+money(s.wage)+'/hr ÷ '+throughputFor(s.work)+' '+b.unitPlural+' per hour</div>'
          + '<div style="font-size:11px;color:var(--fg3);margin-top:6px;line-height:1.5">Set below, from the people who do this work.</div></div>'
        + '<div><div style="font-size:11.5px;font-weight:700;color:var(--fg3);margin-bottom:6px">This robot costs</div>'
          + '<div id="setupRobotRate-'+i+'" style="font-size:13.5px;color:var(--fg1);padding:10px 2px;border-bottom:1px solid var(--hair2);font-variant-numeric:tabular-nums">'+robotUnitCostLabel(s, b)+'</div>'
          + '<div id="setupRobotDerive-'+i+'" style="font-family:inherit;font-size:11.5px;color:var(--fg3);margin-top:6px">'+robotUnitCostDerivation(s, b)+'</div>'
          + '<div style="font-size:11px;color:var(--fg3);margin-top:6px;line-height:1.5">Its invoice over what it actually did.</div></div>'
        + '<div><label for="setupHours-'+i+'" style="display:block;font-size:11.5px;font-weight:700;color:var(--fg3);margin-bottom:6px">Operating hours / day</label>'
          + '<input id="setupHours-'+i+'" data-i="'+i+'" type="number" min="0" step="0.5" inputmode="decimal" value="'+hoursVal+'" style="width:100%;font-size:13.5px;color:var(--fg1);background:transparent;padding:10px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-variant-numeric:tabular-nums"></div>'
        + '<div><div style="font-size:11.5px;font-weight:700;color:var(--fg3);margin-bottom:6px">&nbsp;</div>'
          + setupSaveButton(i)
        + '</div>'
      + '</div>';

    return '<div style="border-top:1px solid var(--hair)">'
      + '<div data-act="toggleSetup" data-i="'+i+'" data-setup-row class="hv-fade" style="display:flex;align-items:center;gap:16px;padding:20px 4px;cursor:pointer">'

  }).join('');

  // Same phrasing Fleet and the Tax shield card use for the same

  const scopeName = S.dashScope === 'all' ? 'Pier 4, Marina & Airport combined' : SITES[S.dashScope].name+'&#39;s';

  const usedWorks = [...new Set(stmt.rows.map(r => r.work))];

  return '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:16px">'+scopeToggle()+'</div>'
  + '<div style="padding:0;margin-bottom:48px">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:26px">'
      + '<h2 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--fg1)">Five inputs per robot</h2>'
      + '<span style="font-size:13px;color:var(--fg3)">'+scopeName+' '+stmt.rows.length+' robot'+(stmt.rows.length===1?'':'s')+'. Everything is prefilled. Accept it as-is, or correct the two you care about.</span></div>'
    + rows
  + '</div>'

  + '<div style="padding:0;margin-bottom:56px">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:26px">'
      + '<h2 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--fg1)">Where the rates come from</h2>'
      + '<span style="font-size:13px;color:var(--fg3)">Derived, never asserted. Both inputs are yours: correct either one and every figure built on it moves.</span></div>'
    + '<div data-rate-scroll style="overflow-x:auto;min-width:0"><div data-rate-wide style="min-width:720px">'
      + '<div data-rate-head style="display:grid;grid-template-columns:1.2fr 1fr 1.2fr 1.2fr;gap:20px;padding:0 4px 14px;font-size:11.5px;font-weight:700;color:var(--fg3)"><div>Work</div><div>Loaded wage</div><div>A person does</div><div>So one unit is worth</div></div>'
      + usedWorks.map(work => {
          const b = workDef(work);
          const rc = rateCentsFor(work);
          const own = wageIsOwnSet(work) || throughputIsOwnSet(work);
          const perLabel = b.basis === 'active_hour' ? 'hour' : b.unitPlural;
          const people = employeesFor(work);
          return '<div data-rate-row style="display:grid;grid-template-columns:1.2fr 1fr 1.2fr 1.2fr;gap:20px;padding:18px 4px;border-top:1px solid var(--hair);align-items:center">'
          + '<div><div style="font-size:14.5px;font-weight:600;color:var(--fg1)">'+esc(work)+'</div>'
            + '<div style="font-size:11.5px;color:var(--fg3);margin-top:4px">'+stmt.rows.filter(r => r.work === work).length+' robot'+(stmt.rows.filter(r => r.work === work).length===1?'':'s')+'</div>'
            // A category we publish numbers for already knows what one of
            // its units is called and how it is counted. One the owner named
            // does not, and guessing would put "tasks" on a statement they

            + (!isCustomWork(work) ? '' :

            + '</div>'

            : '<div style="display:flex;align-items:center;gap:5px;font-size:14px;color:var(--fg1)">$'

              + '<span style="color:var(--fg3);font-size:12.5px">/ hr</span></div>')
          + (throughputFromPeople(work)
            ? '<div style="font-size:14px;color:var(--fg1);font-variant-numeric:tabular-nums"><span data-rate-through-out="'+esc(work)+'">'+throughputFor(work)+'</span> <span style="color:var(--fg3);font-size:12.5px">'+esc(perLabel)+' / hr</span>'
              + '<div style="font-size:10.5px;color:var(--fg3);margin-top:3px">averaged from '+people.length+' role'+(people.length===1?'':'s')+'</div></div>'

function viewConfirm(){
  const excludedCount = Object.keys(S.excluded).filter(k => S.excluded[k]).length;
  const included = CONFIRM.filter((c,i) => !S.excluded[i]);
  const allSameWork = included.length > 1 && included.every(c => c.work === included[0].work);
  // Reviewing is the one required action, not typing. A robot counts as
  // reviewed the moment its "kind of work" select is opened, whether or not
  // the value changes, because looking is what proves the default was seen,
  // not agreed with by accident. Excluded robots do not need review, they
  // are not being priced.
  const needsReview = CONFIRM.map((c,i) => i).filter(i => !S.excluded[i]);
  const reviewedCount = needsReview.filter(i => S.confirmSeen[i]).length;
  const allReviewed = reviewedCount === needsReview.length;
  const left = needsReview.length - reviewedCount;

  const row = (c,i) => {
    const excl = !!S.excluded[i];
    const seen = !!S.confirmSeen[i];
    const work = S.confirmWork[i] ?? c.work;
    const name = S.confirmName[i] ?? c.name;
    return '<div data-split style="border-top:1px solid var(--hair);padding:20px 4px;display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:28px;align-items:start;opacity:'+(excl?0.5:1)+'">'

        + '<input id="confirmName-'+i+'" type="text" value="'+esc(name)+'" style="width:100%;font-size:14px;color:var(--fg1);background:transparent;padding:8px 2px;border:none;border-bottom:1px solid var(--hair2);outline:none;font-family:inherit">'
        + '<div style="font-size:12px;color:var(--fg3);margin-top:6px;font-variant-numeric:tabular-nums">'+c.seen+'</div></div>'
