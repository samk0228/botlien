function calc(t){
  const rate = Math.round((WAGE / t) * 100) / 100;
  const trayWork = Math.round(TRAY_RUNS * rate * 100) / 100;
  const total = trayWork + CLEAN_WORK;
  return { rate, trayWork, total, cov: total / TOTAL_INVOICE, trayCov: trayWork / TRAY_INVOICE };
}
function breakEven(){ let t = 30; while (t < 400 && calc(t).cov >= 1) t++; return t - 1; }
function utilAt(pct){
  const scale = (pct / 100 * DECLARED_HOURS) / DUTY_HOURS;
  const c = calc(30);
  const trayWork = c.trayWork * scale;
  return (trayWork + CLEAN_WORK * scale) / TOTAL_INVOICE;

/* A button should name what pressing it does. These two keep step 3's primary
   action honest as the form fills in. */
function invitesReady(){
  return FIRST_RUN_ROLES.map((r,i) => i).filter(i => S.invites[i] && VALID.test((S.inviteEmail[i]||'').trim()));
}
function inviteCta(){
  const chosen = FIRST_RUN_ROLES.map((r,i)=>i).filter(i => S.invites[i]);
  if (chosen.length === 0) return 'Continue';
  const ready = invitesReady();
  if (ready.length === 0) return 'Add their email to send it';
  return ready.length === 1
    ? 'Send 1 invite and continue'
    : 'Send ' + ready.length + ' invites and continue';
}
function inviteNote(){
  const ready = invitesReady();
  if (ready.length === 0) return 'Nothing is sent until an email is filled in. You can add people later from Settings.';
  return 'Each person gets their own sign-in link and lands on this statement with the limits above. They never see your wage or your invoices unless their role allows it.';
}

  if (sc === 'sessions'){
    body += '<div style="font-size:11.5px;font-weight:700;color:var(--fg3);margin-bottom:14px">Settings · Account</div>'
      + '<h1 style="font-size:clamp(24px,4.2vw,30px);font-weight:700;letter-spacing:-0.03em;line-height:1.15;margin:0 0 12px">Signed in on these devices</h1>'

  return '<div data-stage style="padding:72px 40px 80px;display:flex;justify-content:center">'

function appHeader(){
  const view = S.view;
  const p = PERIODS[S.period];
  const showExport = view === 'dash' || view === 'dashv2' || view === 'robots' || view === 'rates' || view === 'sites';
  let ex = '';
  if (showExport){
    ex = '<div style="position:relative">'
      + '<button type="button" data-act="toggleExport" class="hv-dim press" style="display:inline-flex;align-items:center;gap:9px;padding:12px 18px;border-radius:4px;border:none;cursor:'+(S.exporting?'default':'pointer')+';font-size:13.5px;font-weight:700;color:var(--ink-fg);background:var(--ink);opacity:'+(S.exporting?0.8:1)+'">'
        + (S.exporting ? spinner(13) : '') + (S.exporting ? 'Building your file…' : 'Export statement') + '</button>'
      + (S.exportMenu
        ? '<div style="position:absolute;top:48px;right:0;width:300px;background:var(--menu);border:1px solid var(--hair2);border-radius:4px;z-index:40">'
          + '<div data-act="exportCsv" class="hv-ghost" style="padding:14px 18px;cursor:pointer;border-bottom:1px solid var(--hair)"><div style="font-size:13.5px;font-weight:700;color:var(--fg1)">CSV</div><div style="font-size:12px;color:var(--fg3);margin-top:3px;line-height:1.5">One row per robot, with an arithmetic column.</div></div>'
          + '<div data-act="exportPdf" class="hv-ghost" style="padding:14px 18px;cursor:pointer;border-bottom:1px solid var(--hair)"><div style="font-size:13.5px;font-weight:700;color:var(--fg1)">PDF</div><div style="font-size:12px;color:var(--fg3);margin-top:3px;line-height:1.5">The statement as printed, equations included.</div></div>'
          + '<div data-act="toggleSchedule" class="hv-ghost" style="padding:14px 18px;cursor:pointer;border-bottom:1px solid var(--hair)"><div style="font-size:13.5px;font-weight:700;color:var(--fg1)">'+(S.scheduled?'Stop the monthly email':'Email it every month')+'</div><div style="font-size:12px;color:var(--fg3);margin-top:3px;line-height:1.5">'+(S.scheduled?'On the 1st to Sam and Priya, the morning after a period closes.':'Sends itself when a period closes, so nobody has to remember.')+'</div></div>'
          + '<div data-act="shareLink" class="hv-ghost" style="padding:14px 18px;cursor:pointer"><div style="font-size:13.5px;font-weight:700;color:var(--fg1)">'+(S.shareMade?'Link copied':'Give my accountant a link')+'</div><div style="font-size:12px;color:var(--fg3);margin-top:3px;line-height:1.5">Read only, closed periods, no sign-in. Revocable from Settings.</div></div></div>'
        : '')
      + '</div>';
  }

  let banner = '';
  if (S.exportDone){
    banner += '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 18px;border:1px solid var(--hair2);border-radius:4px;margin-bottom:32px">'
      + ic('check',16,'color:var(--fg1)')
      + '<span style="font-size:13.5px;color:var(--fg1);font-variant-numeric:tabular-nums">Downloaded '+S.exportFile+'</span>'
      + '<span style="font-size:12.5px;color:var(--fg3)">Includes the arithmetic column.</span>'
      + '<button type="button" data-act="dismissExport" class="hv-ghost" style="margin-left:auto;padding:8px 12px;border-radius:3px;border:1px solid var(--hair2);background:transparent;color:var(--fg1);cursor:pointer;font-size:12.5px;font-weight:600">Dismiss</button></div>';
  }
  if (S.exportFailed){

function sparkline(){
  const vals = PERIODS.map(p => p.cov).slice().reverse();
  const w = 132, h = 38, min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  const pts = vals.map((v,i) => {
    const x = (i / (vals.length - 1)) * (w - 4) + 2;
    const y = h - 4 - ((v - min) / (max - min || 1)) * (h - 8);
    return x.toFixed(1) + ',' + y.toFixed(1);
  });
  const last = pts[pts.length - 1].split(',');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="flex:none;overflow:visible" aria-hidden="true">'
    + '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>'
    + '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="3" fill="var(--ink)"/></svg>';
}

      + '<button type="button" data-act="saveThroughput" class="hv-ghost" style="padding:11px 18px;border-radius:3px;border:1px solid var(--hair2);background:transparent;cursor:pointer;font-size:13px;font-weight:700;color:var(--fg1);white-space:nowrap">Use '+t+' as my number</button>'

}

function varianceBlock(){
  const scale = Math.max.apply(null, VARIANCE.effects.map(e => Math.abs(e.n)).concat([0.01]));
  const row = (e) => {
    const w = Math.min(50, (Math.abs(e.n) / scale) * 50);
    return '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:14px 4px;border-top:1px solid var(--hair)">'
      + '<div style="min-width:190px;font-size:14px;font-weight:600;color:var(--fg1)">'+e.name+'</div>'
      + '<div style="flex:1;min-width:180px;height:10px;position:relative;display:flex;justify-content:center">'
        + '<div style="position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--hair2)"></div>'
        + (e.n !== 0 ? '<div style="position:absolute;top:0;bottom:0;'+(e.n>0?'left:50%':'right:50%')+';width:'+w+'%;background:'+(e.n>0?'var(--ink)':'repeating-linear-gradient(135deg,var(--hatch2) 0 2px,transparent 2px 5px)')+';border:'+(e.n>0?'none':'1px solid var(--ink)')+'"></div>' : '')
      + '</div>'
      + '<div style="width:64px;text-align:right;font-size:14px;font-weight:700;color:'+(e.n===0?'var(--fg3)':'var(--fg1)')+';font-variant-numeric:tabular-nums">'+e.value+'</div>'
      + '<div style="flex:1 1 100%;font-size:12.5px;color:var(--fg3);line-height:1.5">'+e.note+'</div></div>';
  };
  return '<div style="padding:0;margin-bottom:56px">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:8px">'
      + '<h2 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--fg1)">Why it moved</h2>'
      + '<span style="font-size:13px;color:var(--fg3)">The channels sum to the whole change, with nothing left in a residual.</span></div>'
    + '<p style="font-size:14px;line-height:1.7;color:var(--fg2);margin:0 0 14px;max-width:88ch">Coverage rose from <b style="color:var(--fg1);font-weight:600">'+VARIANCE.from+'</b> to <b style="color:var(--fg1);font-weight:600">'+VARIANCE.to+'</b> against the period before, a move of '+VARIANCE.delta+'. Work performed is rate x hours online x work per hour online, so a change in coverage can only come from those three and the invoice.</p>'
    + VARIANCE.effects.map(row).join('')
    + '<div style="margin-top:26px">'
      + '<div style="font-size:12px;font-weight:700;color:var(--fg3);margin-bottom:12px">Which robots carried it</div>'
      + VARIANCE.robots.map(r => '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;padding:12px 4px;border-top:1px solid var(--hair)">'
        + '<span style="font-size:13.5px;font-weight:600;color:var(--fg1);min-width:170px">'+r.name+'</span>'
        + '<span style="font-size:13px;color:var(--fg1);font-variant-numeric:tabular-nums">'+r.amount+'</span>'
        + '<span style="font-size:12.5px;color:var(--fg3)">'+r.how+'</span></div>').join('')
    + '</div>'
    + '<div style="margin-top:22px;padding:16px 18px;border:1px solid var(--hair2);border-radius:4px;font-size:13px;line-height:1.7;color:var(--fg2);max-width:92ch">Hours online is availability: the robot was reachable or it was not. Work per hour online is what it got through while it was up. The rate channel reads 0.00x here because your replacement rate did not change between these two periods, which is a reading rather than a limitation: rates are dated, so a change in March would show up in March and closed periods keep the rate they were computed with.</div>'
  + '</div>';
}

/* Draft redesign, v2: v1 (see git history / the diff that added this file)
 * cut the word count but was still one giant number and two bars, which is
 * closer to a receipt than a dashboard. This pass replaces that with a real
 * time-series recap (day/week/month, real month data from PERIODS, day/week
 * interpolated since this mock has no raw daily rows) plus two cards an
 * owner opening this daily would actually want: which robot needs attention
 * right now, and where the work is coming from. Card language and layout
 * lifted from ui.shadcn.com's block patterns, small caps label, big number,
 * one thin line of context, nothing paragraph-length. */

/* Newest-first, and only as many bars as have actually happened. The open
 * period is 30 real days old, so day view gets 30 real bars and week view
 * gets the 4 real weeks inside it, dense, like an actual usage chart. Month
 * view gets exactly one bar, because exactly one month has happened, that
 * is not a bug to hide, it is the honest shape of a brand new account. Every
 * bar is real or a fair reading of a real range, none of it is invented
 * future history. Index 0 is always the current point, on the left; the
 * next real point lands there and pushes everything else one slot right. */
function recapSeries(grain){
  if (grain === 'month'){
    const p = PERIODS[0];
    return [{ label: p.label.split(' ')[0], value: p.cov }];
  }
  const n = grain === 'week' ? 4 : 30;
  const start = grain === 'week' ? 2.10 : 2.22;
  const end = 2.38;
  const out = [];
  for (let i = 0; i < n; i++){
    const t = i / (n - 1);
    const wave = Math.sin(i * (grain === 'week' ? 1.1 : 0.85)) * (grain === 'week' ? 0.05 : 0.08);
    out.push({ label: grain === 'week' ? 'W'+(i+1) : String(i+1), value: Math.max(0.5, start + (end - start) * t + wave) });
  }
  out[out.length - 1].value = end;
  return out.reverse();
}

/* Plain bar chart, no library, this file has none and stays that way. Every
 * shadcn/Recharts bar example in their own gallery skips gridlines entirely:
 * one confident bar color, generous top rounding, bars sitting straight on
 * an implied baseline, nothing else competing for attention. Copied that
 * directly rather than dressing the chart up with lines it does not need.
 * The one thing this chart has that theirs don't, a breakeven reference at
 * 1.00x, stays, but as close to invisible as it can be while still reading. */
function barChart(points, opts){
  opts = opts || {};
  // Compact is the default footprint now, the same scale as the utilization
  // area chart next to it, not a full-bleed hero. Only widen it on purpose.
  const compact = opts.compact !== false;
  const w = 340, h = compact ? 92 : 168, padL = 2, padR = 26, padB = compact ? 18 : 26, r = compact ? 3 : 5;
  const fAxis = compact ? 9.5 : 11, fLine = compact ? 9 : 10;
  const vals = points.map(p => p.value);
  const max = Math.max.apply(null, vals) * 1.14;
  const baseline = h - padB;
  const bw = (w - padL - padR) / points.length;
  const barW = Math.max(3, bw * (points.length > 15 ? 0.56 : 0.5));
  const yFor = (v) => baseline - (v / max) * baseline;
  const lineVisible = max > 1;
  const lineY = yFor(1);

  // A label under every bar, like the reference, would be unreadable at 30
  // bars, so it thins to roughly six evenly spaced ticks the way minTickGap
  // does in Recharts. The current bar always keeps its label.
  const labelStep = Math.max(1, Math.round(points.length / 6));

  // Axis labels stay in the background SVG, that text scales safely because
  // the viewBox matches the element's own aspect-ratio exactly (see below).
  // The current period sits at index 0, on the left; the hover card on the
  // bar itself carries its value now, so nothing needs to sit above it.
  let axisText = '';
  points.forEach((p, i) => {
    if (i === 0 || i % labelStep === 0){
      const x = padL + i * bw + bw / 2;
      axisText += '<text x="'+x.toFixed(1)+'" y="'+(h-6)+'" font-size="'+fAxis+'" fill="var(--fg3)" text-anchor="middle">'+esc(p.label)+'</text>';
    }
  });

  // The bars themselves are real HTML, not SVG, positioned in percent so
  // they track the background exactly. That is what lets each one carry a
  // proper hover card, shadcn's HoverCard pattern, styled with real CSS
  // instead of the slow, plain native title tooltip this used to lean on.
  let bars = '';
  points.forEach((p, i) => {
    const x = padL + i * bw + (bw - barW) / 2;
    const y = yFor(p.value);
    const barH = Math.max(2, baseline - y);
    const rr = Math.min(r, barW / 2, barH);
    bars += '<div class="bl-bar-wrap" style="position:absolute;left:'+(x/w*100).toFixed(2)+'%;width:'+(barW/w*100).toFixed(2)+'%;top:'+(y/h*100).toFixed(2)+'%;height:'+(barH/h*100).toFixed(2)+'%">'
      + '<div style="position:absolute;inset:0;background:var(--fg1);border-radius:'+rr.toFixed(1)+'px '+rr.toFixed(1)+'px 0 0;cursor:default"></div>'
      + '<div class="bl-bar-tip"><div style="font-size:12px;font-weight:700;color:var(--fg1)">'+esc(p.label)+'</div>'
        + '<div style="font-size:11.5px;color:var(--fg2);margin-top:2px">'+p.value.toFixed(2)+'x coverage</div></div>'
    + '</div>';
  });

  // No preserveAspectRatio="none" on a mismatched box here: that was
  // stretching X and Y by different factors whenever the card was wider
  // than the chart was drawn for, which is what fattened the bars and
  // smeared the month labels sideways. The viewBox matches this element's
  // own locked aspect-ratio, so the scale stays uniform as it resizes.
  return '<div style="position:relative;width:100%;aspect-ratio:'+w+'/'+h+'">'
    + '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="100%" preserveAspectRatio="none" style="position:absolute;inset:0;overflow:visible;display:block">'
      + (lineVisible ? '<line x1="0" y1="'+lineY.toFixed(1)+'" x2="'+w+'" y2="'+lineY.toFixed(1)+'" stroke="var(--hair2)" stroke-width="1"></line>'
          + '<text x="'+w+'" y="'+(lineY-5).toFixed(1)+'" font-size="'+fLine+'" fill="var(--fg3)" text-anchor="end">1.00x</text>' : '')
      + axisText
    + '</svg>'
    + bars
  + '</div>';
}

/* Utilization has no history surfaced anywhere in the app today, just the
 * current 36%. An area chart (the exact shape ui.shadcn.com's chart gallery
 * leads with) is the right shape for "one continuous quantity over time",
 * versus the bar chart above, which is right for "discrete comparable
 * periods". Same reasoning shadcn's own docs give for picking area vs bar. */
function utilSeries(){
  const days = 14, end = 36;
  const out = [];
  for (let i = 0; i < days; i++){
    const t = i / (days - 1);
    const wave = Math.sin(i * 0.7) * 5.5;
    out.push({ label: 'D'+(i+1), value: Math.max(4, Math.min(100, 24 + 10*t + wave)) });
  }
  out[out.length - 1].value = end;
  return out;
}

function areaChart(points, opts){
  opts = opts || {};
  const w = 340, h = 88, padB = 4;
  const domainMax = opts.max || Math.max.apply(null, points.map(p => p.value)) * 1.2;
  const stepX = w / (points.length - 1);
  const yFor = (v) => (h - padB) - (v / domainMax) * (h - padB);
  const coords = points.map((p, i) => [i*stepX, yFor(p.value)]);
  const line = coords.map((c,i) => (i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area = line + ' L '+w+' '+h+' L 0 '+h+' Z';
  const gid = 'ag'+Math.round(domainMax);
  const last = coords[coords.length-1];
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="aspect-ratio:'+w+'/'+h+';overflow:visible;display:block">'
    + '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0%" stop-color="var(--fg1)" stop-opacity="0.16"></stop>'
      + '<stop offset="100%" stop-color="var(--fg1)" stop-opacity="0"></stop>'
    + '</linearGradient></defs>'
    + '<path d="'+area+'" fill="url(#'+gid+')"></path>'
    + '<path d="'+line+'" fill="none" stroke="var(--fg1)" stroke-width="1.75"></path>'
    + '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3" fill="var(--fg1)"></circle>'
  + '</svg>';
}

// Badge, shadcn's small status-pill pattern: a filled variant for the state
// that needs attention, an outlined one for everything settled.
function badge(text, tone){
  const filled = tone === 'open';
  return '<span style="display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2.5px 7px;border-radius:3px;'
    + (filled ? 'background:var(--ink);color:var(--ink-fg)' : 'border:1px solid var(--hair2);color:var(--fg3)')
    + '">'+text+'</span>';
}

// Closed periods only, the open one is still moving and would misstate an
// average or a "best" claim while it settles.
function periodStats(){
  const closed = PERIODS.filter(p => p.status === 'closed');
  const avg = closed.reduce((s,p) => s + p.cov, 0) / closed.length;
  const best = closed.reduce((a,b) => b.cov > a.cov ? b : a);
  return { avg, best, open: PERIODS[0] };
}

function statRow(label, value, note){
  return '<div><div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--fg3);margin-bottom:4px">'+label+'</div>'
    + '<div style="font-size:18px;font-weight:700;color:var(--fg1);font-variant-numeric:tabular-nums;line-height:1.2">'+value+'</div>'
    + (note ? '<div style="font-size:11.5px;color:var(--fg3);margin-top:2px">'+note+'</div>' : '')
  + '</div>';
}

function recapCard(){
  const grain = S.recapGrain;
  const series = recapSeries(grain);
  const stats = periodStats();
  // shadcn's Tabs: an inset muted track, the active trigger raised on its
  // own chip rather than the track itself changing color.
  const tabs = ['day','week','month'].map(g =>
    '<button type="button" data-act="setRecapGrain" data-grain="'+g+'" style="padding:6px 13px;border:none;border-radius:4px;cursor:pointer;font-size:12.5px;font-weight:600;background:'+(grain===g?'var(--page-bg)':'transparent')+';color:'+(grain===g?'var(--fg1)':'var(--fg3)')+';box-shadow:'+(grain===g?'0 1px 2px rgba(10,10,10,.10)':'none')+'">'+g[0].toUpperCase()+g.slice(1)+'</button>'
  ).join('');
  const rangeNote = grain === 'month' ? 'One period on record so far'
    : grain === 'week' ? 'The 4 weeks inside the open period'
    : 'All 30 days on record, newest on the left';
  // Card-sized now, the same footprint as Utilization next to it and Needs
  // attention/Where the work below, not a full-bleed hero fighting them for
  // visual weight. Stats sit in a wrapping row below the chart, not a fixed
  // 3-column grid, so the card holds up at any width in that pairing.
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">'
      + '<div><div style="font-size:13.5px;font-weight:700;color:var(--fg1)">Coverage over time</div>'
        + '<div style="font-size:12px;color:var(--fg3);margin-top:2px">'+rangeNote+'</div></div>'
      + '<div style="display:inline-flex;background:var(--ghost);border-radius:6px;padding:2px;gap:2px">'+tabs+'</div>'
    + '</div>'
    + barChart(series)
    + '<div style="display:flex;flex-wrap:wrap;gap:20px;margin-top:14px;padding-top:14px;border-top:1px solid var(--hair)">'
      + statRow('This period', stats.open.cov.toFixed(2)+'x', badge('Open','open'))
      + statRow('6-mo avg', stats.avg.toFixed(2)+'x', 'closed only')
      + statRow('Best closed', stats.best.cov.toFixed(2)+'x', stats.best.label.split(' – ')[0])
    + '</div>'
  + '</div>';
}

function utilizationCard(){

function attentionCard(){
  const sorted = ROBOTS.slice().sort((a,b) => parseFloat(b.cov) - parseFloat(a.cov));
  const max = Math.max.apply(null, sorted.map(r => parseFloat(r.cov))) * 1.05;
  const rows = sorted.map(r => {
    const v = parseFloat(r.cov);
    const pct = Math.min(100, (v / max) * 100);
    return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0">'
      + '<span style="width:118px;flex:none;font-size:12.5px;font-weight:600;color:'+(r.short?'var(--fg1)':'var(--fg2)')+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.name)+'</span>'

      + '<span style="width:44px;flex:none;text-align:right;font-size:12.5px;font-weight:700;color:var(--fg1);font-variant-numeric:tabular-nums">'+r.cov+'</span>'
    + '</div>';
  }).join('');
  const flagged = ROBOTS.find(r => r.short);
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'

    + '</div>'
    + (flagged ? '<div style="font-size:12px;color:var(--fg3);margin-bottom:12px">'+esc(flagged.name)+' is running under its lease</div>' : '')
    + '<div style="margin-top:6px">'+rows+'</div>'
  + '</div>';
}

function workSplitCard(){
  const vals = KINDS.map(k => parseFloat(k.work.replace(/[$,]/g,'')));
  const total = vals.reduce((a,b) => a+b, 0);
  const rows = KINDS.map((k, i) => {
    const pct = (vals[i] / total) * 100;
    return '<div style="margin-bottom:14px">'
      + '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px"><span style="font-weight:600;color:var(--fg1)">'+esc(k.kind)+'</span><span style="color:var(--fg2);font-variant-numeric:tabular-nums">'+k.work+'</span></div>'
      + '<div style="height:8px;background:var(--ghost);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+(i===0?'var(--fg1)':'var(--hair3)')+'"></div></div>'
    + '</div>';
  }).join('');
  return '<div style="border:1px solid var(--hair);border-radius:6px;padding:22px 24px 18px">'
    + '<div style="font-size:13.5px;font-weight:700;color:var(--fg1);margin-bottom:2px">Where the work is</div>'
    + '<div style="font-size:12px;color:var(--fg3);margin-bottom:16px">Share of work serviced, by kind, this period</div>'
    + rows
  + '</div>';
}

const DASH_BLOCKS = {
  kpi:       { label: 'Coverage number',      render: coverageKpiCard },
  cost:      { label: 'Cost per run',         render: costCard },
  recap:     { label: 'Coverage over time',   render: recapCard },
  util:      { label: 'Utilization',          render: utilizationCard },
  attn:      { label: 'Needs attention',      render: attentionCard },
  work:      { label: 'Where the work is',    render: workSplitCard },
  sens:      { label: 'Rate assumption',      render: sensitivityCard },
  ownbench:  { label: 'Trend vs your own past', render: benchmarkOwnCard },

let dashDragId = null; // which block is mid-drag; ephemeral, does not need a render

function viewDashV2(){
  if (S.site !== 0) return viewDash();
  const hidden = S.dashLayout.filter(id => S.dashHidden.includes(id));
  const visible = S.dashLayout.filter(id => !S.dashHidden.includes(id));
  // Real masonry (see layoutDashMasonry below), not a row/column layout.
  // Grid and flexbox both size a whole row by its tallest member, so a
  // short card next to a tall one always leaves a gap somewhere, inside
  // itself if the row stretches, or below it if the row doesn't. A short
  // card's neighbor below has to wait for the tall card to end either way.
  // Masonry places each card in whichever column is shortest right now, so
  // nothing ever waits on a taller sibling. width/position get set by JS
  // after layout; this starting size is just what paints before that runs.
  return '<div style="padding:0 0 8px;margin-bottom:56px">'
    + dashToolbar(hidden)
    + '<div id="dashGrid" style="position:relative">'
      + visible.map(dashBlockWrap).join('')
    + '</div>'
  + '</div>';
}

function dashToolbar(hidden){
  return '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:16px">'
    + (S.dashEdit ? hidden.map(id => '<button type="button" data-act="dashShow" data-id="'+id+'" class="hv-ghost" style="font-size:12px;font-weight:600;color:var(--fg2);background:var(--ghost);border:1px dashed var(--hair2);border-radius:5px;padding:7px 12px;cursor:pointer">+ '+DASH_BLOCKS[id].label+'</button>').join('') : '')
    + (S.dashEdit ? '<button type="button" data-act="dashReset" class="hv-ghost" style="font-size:12px;font-weight:600;color:var(--fg3);background:none;border:none;cursor:pointer;padding:8px 6px">Reset layout</button>' : '')
    + '<button type="button" data-act="toggleDashEdit" class="hv-dim press" style="font-size:12.5px;font-weight:700;color:'+(S.dashEdit?'var(--ink-fg)':'var(--fg1)')+';background:'+(S.dashEdit?'var(--ink)':'transparent')+';border:1px solid var(--hair2);border-radius:5px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px">'
      + ic('sliders-horizontal',14) + (S.dashEdit?'Done':'Customize')
    + '</button>'
  + '</div>';
}

// Native HTML5 drag-and-drop, drag handle is the whole card in edit mode.
// Reorder happens once, on drop, not live while dragging over neighbors,
// that is the version that does not fight its own re-render mid-gesture.
function dashBlockWrap(id){
  const block = DASH_BLOCKS[id];
  if (!block) return '';
  const edit = S.dashEdit;
  // Width and position are set by layoutDashMasonry after this paints, not
  // here. A real strip above the card, not floated on top of it, is what
  // fixed the other overlap: absolute positioning over the corner was
  // landing on whatever the card already had there, "All robots →", the
  // Day/Week/Month tabs, take your pick, this pushes the card down instead.
  return '<div class="dash-block" data-dash-id="'+id+'" draggable="'+(edit?'true':'false')+'" style="box-sizing:border-box;'+(edit?'cursor:grab;':'')+'">'
    + (edit
      ? '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;margin-bottom:8px;background:var(--ghost);border:1px dashed var(--hair2);border-radius:6px">'
        + '<span style="display:inline-flex;align-items:center;gap:7px;color:var(--fg3);font-size:11.5px;font-weight:600">'+ic('equal',14)+'Drag to reorder</span>'
        + '<button type="button" data-act="dashHide" data-id="'+id+'" title="Remove from dashboard" style="flex:none;width:24px;height:24px;border-radius:5px;border:1px solid var(--hair2);background:var(--menu);cursor:pointer;font-size:14px;line-height:1;color:var(--fg2)">&times;</button>'
      + '</div>'
      : '')
    + '<div style="'+(edit?'pointer-events:none;':'')+'">'+block.render()+'</div>'
  + '</div>';
}

// Same interactive slider as the page above, same card frame as everything

  const t = S.throughput;

    + '<div style="font-size:12px;color:var(--fg3);margin-bottom:18px">Every figure here assumes 30 runs/hr. Drag it and they move with you.</div>'
    // Slider and result stack in one row, badge and math trace stack below

    // half-width tile instead of demanding the whole row to itself.
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:16px">'
      + '<input id="sensRange" class="bl-slider" type="range" min="15" max="60" step="1" value="'+t+'" style="flex:1;min-width:120px;--bl-fill:'+fill+'%" aria-label="Tray runs a person completes per hour">'
      + '<div style="text-align:right;flex:none">'

        + '<div style="font-size:11px;color:var(--fg3);white-space:nowrap">= <b id="sensCovBig" style="color:var(--fg1);font-weight:700">'+c.cov.toFixed(2)+'x</b> coverage</div>'
      + '</div>'
    + '</div>'
    + '<div style="padding:12px 14px;border-radius:6px;background:var(--ghost);font-family:inherit;font-size:12px;color:var(--fg1);line-height:1.85;overflow-x:auto;white-space:nowrap">'
      + '$22.00 / hr ÷ <span id="sensT2">'+t+'</span> runs = <span id="sensRate">'+money(c.rate)+'</span> per run<br>'
      + '12,060 runs x <span id="sensRate2">'+money(c.rate)+'</span> + $4,530.00 cleaning = <span id="sensWork">'+money(c.total)+'</span><br>'
      + '<span id="sensWork2">'+money(c.total)+'</span> / $5,596.00 invoiced = <span id="sensCov">'+c.cov.toFixed(2)+'x</span></div>'
    + '<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;align-items:center;gap:16px">'
      + '<div style="flex:1;min-width:260px;font-size:12.5px;line-height:1.6;color:var(--fg2)">Coverage falls to 1.00x at <b style="color:var(--fg1);font-weight:700">'+be+' runs/hr</b>, one tray every '+secs+'s for a whole shift, which nobody does.</div>'
      + '<button type="button" data-act="saveThroughput" class="hv-ghost" style="padding:9px 15px;border-radius:5px;border:1px solid var(--hair2);background:transparent;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--fg1);white-space:nowrap">Use '+t+' as my number</button>'
    + '</div>'

// Consumable condition. Reported by Gausium; Bear and Pudu send nothing of the
// kind, so their robots say so plainly rather than showing an empty meter — a
// missing input is stated as missing, never rendered as a zero.
function conditionBlock(r){
  if(!r.parts) return '<div style="margin-top:14px;font-family:inherit;font-size:11.5px;color:var(--fg3)">consumable life · not reported by '+(r.model||'').split(' ')[0]+'</div>';
  const spent = r.parts.filter(p => p.left <= 0).length;
  const bars = r.parts.map(p => {
    const past = p.left <= 0;
    // Life remaining reads left to right. A part past its rating has no bar to
    // draw, so the whole track carries the hatch this design already uses for
    // the figure that is going the wrong way.
    const fill = past
      ? 'repeating-linear-gradient(135deg,var(--hatch2) 0 2px,transparent 2px 5px)'
      : 'var(--ink)';
    const width = past ? '100%' : Math.max(0, Math.min(100, p.left)) + '%';
    const label = past ? Math.round(-p.left) + '% over' : Math.round(p.left) + '% left';
    return '<div style="display:flex;align-items:center;gap:12px;margin-bottom:9px">'
      + '<span data-barlabel style="width:104px;flex:none;font-family:inherit;font-size:12px;color:var(--fg2)">'+p.name+'</span>'
      + '<span style="flex:1;min-width:60px;height:8px;border:1px solid var(--hair2);position:relative;display:block">'
        + '<i style="position:absolute;left:0;top:0;bottom:0;width:'+width+';background:'+fill+'"></i></span>'
      + '<span style="width:96px;flex:none;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:'+(past?700:400)+';color:'+(past?'var(--fg1)':'var(--fg2)')+'">'+label+'</span>'
      + '<span style="width:104px;flex:none;text-align:right;font-family:inherit;font-size:11.5px;color:var(--fg3)">'+p.used+'</span></div>';
  }).join('');
  const note = spent
    ? 'A part past its rating is work this machine is still doing on borrowed time. Replacing it is not in the figure above.'
    : 'Every part is inside its rated life.';
  return '<div style="margin-top:22px;padding-top:18px;border-top:1px dashed var(--hair)">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:14px">'
      + '<span style="font-size:12.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--fg2)">Condition</span>'
      + '<span style="font-size:12.5px;color:var(--fg3)">life remaining against the maker&#39;s rating</span></div>'
    + '<div data-bars style="margin-bottom:12px">'+bars+'</div>'
    + '<div style="font-size:13px;line-height:1.6;color:var(--fg2);max-width:86ch">'+note+'</div>'
    + '<div style="margin-top:10px;font-family:inherit;font-size:11.5px;color:var(--fg3)">also reported · '+r.hand+' of active time hand-driven · battery '+r.temp+'</div>'
    + '</div>';
}

/* ─────────────────────────  RENDER  ───────────────────────── */

function render(){
  const active = document.activeElement;
  const keepId = active && active.id ? active.id : null;
  const selStart = keepId && 'selectionStart' in active ? active.selectionStart : null;

  const onAuth = S.stage === 'auth';
  const inner = onAuth ? authStage() : appRail() + appStage();

  /* The app keeps its rail, because navigation between Coverage, Robots, Rates
     and Settings is the product. Auth has nowhere to navigate to, so it gets
     the whole width and the card centres in it. */
  const cols = onAuth ? 'minmax(0,1fr)' : (S.railCollapsed ? '72px minmax(0,1fr)' : '264px minmax(0,1fr)');

  document.getElementById('root').innerHTML =
    '<div style="position:relative;min-height:100vh;background:var(--page);color:var(--fg1)">'
    + '<div data-grid style="position:relative;display:grid;grid-template-columns:'+cols+';align-items:start;min-height:100vh">'
    + inner + '</div></div>';

  applySensitivity();
  layoutDashMasonry();

  if (keepId){
    const el = document.getElementById(keepId);
    if (el){
      /* selectionStart reads null on input types the selection API does not cover
         (email, number). Without the fallback the caret lands at 0 after every
         re-render and the field fills in backwards. */
      try {
        el.focus();
        if (el.type !== 'range' && 'setSelectionRange' in el){
          const at = selStart != null ? selStart : (el.value ? el.value.length : 0);
          el.setSelectionRange(at, at);
        }
      } catch(e){}
    }
  } else if (S.stage === 'auth' && ['signin','signin-new','signin-failed','signedout'].includes(S.screen)){
    const el = document.getElementById('authEmail');
    if (el) { try { el.focus(); } catch(e){} }
  }
}

/* The slider patches the statement in place. A full re-render on every input
   event would replace the range element mid-drag and the thumb would stop
   tracking the pointer. */
function applySensitivity(){
  const c = calc(S.throughput);
  const put = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  put('sensT', S.throughput);
  put('sensT2', S.throughput);
  put('sensRate', money(c.rate));
  put('sensRate2', money(c.rate));
  put('sensWork', money(c.total));
  put('sensWork2', money(c.total));
  put('sensCov', c.cov.toFixed(2) + 'x');
  put('sensCovBig', c.cov.toFixed(2) + 'x');
  const slider = document.getElementById('sensRange');
  if (slider) slider.style.setProperty('--bl-fill', ((S.throughput - 15) / (60 - 15) * 100) + '%');
  put('heroWork', money(c.total));
  put('heroCov', c.cov.toFixed(2) + 'x');
  put('barWork', money(c.total));
  put('figWork', money(c.total));
  put('kindRate', money(c.rate));
  put('kindWork', money(c.trayWork));
  put('kindCov', c.trayCov.toFixed(2) + 'x');
  const bar = document.getElementById('barLease');
  if (bar) bar.style.width = Math.min(100, (TOTAL_INVOICE / c.total) * 100).toFixed(1) + '%';
  const sent = document.getElementById('heroSentence');
  if (sent) sent.textContent = 'Your six robots performed ' + money(c.total) + ' of work over 30 days, valued at what that same work costs to buy from a person or a service. You paid $5,596.00 to lease them.';
  const btn = document.querySelector('[data-act="saveThroughput"]');
  if (btn) btn.textContent = 'Use ' + S.throughput + ' as my number';
}

/* Real masonry for the dashboard grid. Grid and flexbox both size a row by
 * its tallest member, whatever else is in that row either stretches to
 * match it (dead space inside the short card) or stops short of it (dead
 * space below the short card, waiting for the row to clear). Neither is
 * fixable without changing what "a row" means, so this drops rows
 * entirely: each card gets measured at its real width, then placed at the
 * top of whichever column is shortest right now. A short card's neighbor
 * lands right under it, it never waits on a taller card two columns over. */
function layoutDashMasonry(){
  const container = document.getElementById('dashGrid');
  if (!container) return;
  const cards = Array.prototype.slice.call(container.children);
  if (!cards.length){ container.style.height = '0px'; return; }

  const gap = 20, minColWidth = 320;
  const width = container.clientWidth;
  if (!width){ return; } // not laid out yet (display:none ancestor, etc.)
  const cols = Math.max(1, Math.min(cards.length, Math.floor((width + gap) / (minColWidth + gap))));
  const colWidth = (width - gap * (cols - 1)) / cols;

  cards.forEach(card => {
    card.style.position = 'absolute';
    card.style.width = colWidth + 'px';
  });
  const colHeights = new Array(cols).fill(0);
  cards.forEach(card => {
    let ci = 0;
    for (let i = 1; i < cols; i++){ if (colHeights[i] < colHeights[ci]) ci = i; }
    card.style.left = (ci * (colWidth + gap)) + 'px';
    card.style.top = colHeights[ci] + 'px';
    colHeights[ci] = colHeights[ci] + card.offsetHeight + gap;
  });
  container.style.height = (Math.max.apply(null, colHeights) - gap) + 'px';
}
// Column count depends on viewport width, so a resize can change it. No
// masonry library here to subscribe to, a short debounce on window resize
// is the whole mechanism.
let dashResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(dashResizeTimer);
  dashResizeTimer = setTimeout(layoutDashMasonry, 120);
});

/* ─────────────────────────  BEHAVIOUR  ───────────────────────── */

function startResendClock(){
  clearInterval(timers.resend);
  S.resendLeft = 30;
  timers.resend = setInterval(() => {
    if (S.resendLeft <= 1){ clearInterval(timers.resend); set({ resendLeft: 0 }); return; }
    set({ resendLeft: S.resendLeft - 1 });
  }, 1000);
}

function toCheck(again){
  set({ screen:'check', sending:false, sentAgain: !!again });
  startResendClock();
}

function signInAs(kind){
  clearTimeout(timers.signin);
  set({ screen:'signingin' });
  timers.signin = setTimeout(() => set({ screen: kind === 'new' ? 'landed-new' : 'landed-returning' }), 1400);
}

function submitEmail(){
  const email = S.email.trim();
  const valid = VALID.test(email);
  if (!valid || S.sending){ set({ touched:true }); return; }
  set({ sending:true, screen:'signin' });
  clearTimeout(timers.send);
  timers.send = setTimeout(() => {
    if (S.failNext) set({ sending:false, screen:'signin-failed', failNext:false });
    else toCheck(false);
  }, 1000);
}

function runUpload(){
  clearInterval(timers.upload);
  set({ view:'start', upload:'loading', upPct:0 });
  timers.upload = setInterval(() => {
    const next = S.upPct + 12;
    if (next >= 100){ clearInterval(timers.upload); set({ upPct:100, upload:'read' }); return; }
    set({ upPct: next });
  }, 260);
}

function download(kind){
  clearTimeout(timers.export);
  set({ exportMenu:false, exporting:true, exportDone:false, exportFailed:false });
  timers.export = setTimeout(() => {
    if (kind === 'pdf' && !pdfRetried){
      pdfRetried = true;
      set({ exporting:false, exportFailed:true });
    } else {
      set({ exporting:false, exportDone:true, exportFile: kind === 'pdf' ? 'harbor-grill-coverage-aug-2026.pdf' : 'harbor-grill-coverage-aug-2026.csv' });
    }
  }, 900);
}

function goView(view, extra){
  set(Object.assign({ stage:'app', view, profileOpen:false, exportMenu:false, exportDone:false, exportFailed:false, exportFile:'', mobileNavOpen:false }, extra || {}));
}

const ACTIONS = {
  setRecapGrain: (el) => set({ recapGrain: el.dataset.grain }),
  toggleRail: () => set({ railCollapsed: !S.railCollapsed }),
  toggleMobileNav: () => set({ mobileNavOpen: !S.mobileNavOpen }),
  toggleDashEdit: () => set({ dashEdit: !S.dashEdit }),
  dashHide: (el) => set({ dashHidden: S.dashHidden.concat(el.dataset.id) }),
  dashShow: (el) => set({ dashHidden: S.dashHidden.filter(id => id !== el.dataset.id) }),
  dashReset: () => set({ dashLayout: DASH_ORDER_DEFAULT.slice(), dashHidden: [] }),
  /* auth */
  authScreen: (el) => {
    const key = el.dataset.key;
    if (key === 'check') return toCheck(false);
    if (key === 'signingin') return signInAs('returning');
    if (key === 'signin-failed') return set({ screen:'signin-failed', sending:false });
    if (key === 'signedout') return set({ screen:'signedout', email:'', touched:false, sending:false });
    set({ screen:key });
  },
  submitEmail,
  googleStart: () => signInAs(S.email ? 'returning' : 'new'),
  resend: () => { if (S.resendLeft === 0) toCheck(true); },
  differentEmail: () => { clearInterval(timers.resend); set({ screen:'signin', sentAgain:false, touched:false }); },
  openLinkReturning: () => signInAs('returning'),
  openLinkNew: () => signInAs('new'),
  goExpired: () => set({ screen:'expired' }),
  sendNewLink: () => toCheck(true),
  onboardPick: (el) => set({ onboardPicked: Number(el.dataset.i) }),
  onboardContinue: () => { if (S.onboardPicked >= 0) set({ screen:'first-run-2', picked:S.onboardPicked }); },
  siteCount: (el) => set({ siteCount: el.dataset.v }),
  firstRun3: () => set({ screen:'first-run-3' }),
  toggleInvite: (el) => {
    const i = Number(el.dataset.i);
    const inv = Object.assign({}, S.invites);
    inv[i] = !inv[i];
    set({ invites: inv });
  },
  firstRun4: () => set({ screen:'first-run-4', invitesSent: invitesReady().length }),
  skipInvites: () => set({ screen:'first-run-4', invites:{}, inviteEmail:{}, invitesSent:0 }),
  toggleBenchmark: () => set({ benchmarkOptIn: !S.benchmarkOptIn }),
  finishFirstRun: () => goView('start', { upload:'idle' }),
  requestAccess: () => set({ screen:'check', sentAgain:false }),
  sampleData: () => goView('dash'),
  notInDemo: (el) => set({ notInDemo: S.notInDemo === el.dataset.what ? '' : el.dataset.what }),
  dropSession: (el) => {
    const i = Number(el.dataset.i);
    set({ authSessions: S.authSessions.filter((_, j) => j !== i) });
  },

  /* bridge */
  toApp: () => goView('dash'),
  logOut: () => {
    clearInterval(timers.resend); clearInterval(timers.upload);
    set({ stage:'auth', screen:'signedout', email:'', touched:false, sending:false,
          onboardPicked:-1, picked:-1, profileOpen:false, view:'dash', authSessions: SESSIONS.slice(1) });
  },

  /* app */
  go: (el) => goView(el.dataset.view),
  attention: () => goView('robots', { robotFilter:'attention' }),
  allRobots: () => goView('robots', { robotFilter:'all' }),
  setupBenchmark: () => goView('setup', { openSetup:4 }),
  toggleProfile: () => set({ profileOpen: !S.profileOpen, siteMenu:false, periodMenu:false }),
  toggleSite: () => set({ siteMenu: !S.siteMenu, profileOpen:false, periodMenu:false }),
  pickSite: (el) => goView(S.view === 'sites' ? 'dash' : S.view, { site: Number(el.dataset.i), siteMenu:false }),
  togglePeriod: () => set({ periodMenu: !S.periodMenu, profileOpen:false, siteMenu:false }),
  pickPeriod: (el) => set({ period: Number(el.dataset.i), periodMenu:false }),
  toggleRateHistory: () => set({ rateHistory: !S.rateHistory }),
  toggleSchedule: () => set({ scheduled: !S.scheduled, exportMenu:false }),
  shareLink: () => set({ shareMade:true, exportMenu:false }),
  howTo: (el) => set({ howTo: S.howTo === el.dataset.k ? '' : el.dataset.k }),
  saveThroughput: () => set({ savedThroughput:true }),
  toggleExport: () => { if (!S.exporting) set({ exportMenu: !S.exportMenu, profileOpen:false, siteMenu:false, periodMenu:false }); },
  exportCsv: () => download('csv'),
  exportPdf: () => download('pdf'),
  dismissExport: () => set({ exportDone:false, exportFailed:false }),
  toggleSetup: (el) => { const i = Number(el.dataset.i); set({ openSetup: S.openSetup === i ? -1 : i }); },
  save: () => {
    if (S.saving) return;
    set({ saving:true });
    clearTimeout(timers.save);
    timers.save = setTimeout(() => set({ saving:false, view:'dash' }), 800);
  },
  uploadGood: () => runUpload(),
  uploadBad: () => set({ upload:'bad' }),
  resetUpload: () => set({ upload:'idle', upPct:0 }),
  toggleExclude: (el) => {
    const i = Number(el.dataset.i);
    const ex = Object.assign({}, S.excluded);
    ex[i] = !ex[i];
    set({ excluded: ex });
  },
  pick: (el) => set({ picked: Number(el.dataset.i) }),
  businessContinue: () => { if (S.picked >= 0) set({ view:'start', upload:'idle' }); },
  sendCreds: () => {
    if (S.credSending) return;
    set({ credSending:true });
    clearTimeout(timers.cred);
    timers.cred = setTimeout(() => set({ credSending:false, credSent:true }), 900);
  }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest && e.target.closest('[data-act]');
  if (!el) {
    if (S.stage === 'app' && (S.profileOpen || S.exportMenu)) set({ profileOpen:false, exportMenu:false });
    return;
  }
  const fn = ACTIONS[el.dataset.act];
  if (fn){ e.stopPropagation(); fn(el); }
});

document.addEventListener('input', (e) => {
  if (!e.target) return;
  if (e.target.id === 'authEmail'){ set({ email: e.target.value, touched:true }); return; }
  if (e.target.id === 'siteName'){ S.siteName = e.target.value; return; }
  if (/^invite\d+$/.test(e.target.id)){
    const i = Number(e.target.id.slice(6));
    S.inviteEmail[i] = e.target.value;
    // Only the button label depends on this, so patch it rather than
    // re-rendering and stealing focus mid-typing.
    const cta = document.querySelector('[data-act="firstRun4"]');
    if (cta) cta.textContent = inviteCta();
    return;
  }
  if (e.target.id === 'sensRange'){
    S.throughput = Number(e.target.value);
    S.savedThroughput = false;
    const note = document.getElementById('savedNote');
    if (note) note.remove();
    applySensitivity();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target && e.target.id === 'authEmail') submitEmail();
});

/* Dashboard block reordering. Reorder happens once, on drop, not live on
   every dragover, this build has no virtual DOM so a re-render mid-drag
   would tear down the very node the browser is tracking as the drag
   source. One render at the end is the version that cannot get that wrong. */
document.addEventListener('dragstart', (e) => {
  const el = e.target.closest && e.target.closest('.dash-block');
  if (!el) return;
  dashDragId = el.dataset.dashId;
  if (e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dashDragId); } catch(err){} }
});
document.addEventListener('dragover', (e) => {
  if (!dashDragId) return;
  if (e.target.closest && e.target.closest('.dash-block')) e.preventDefault();
});
document.addEventListener('drop', (e) => {
  const dragged = dashDragId;
  dashDragId = null;
  if (!dragged) return;
  const el = e.target.closest && e.target.closest('.dash-block');
  if (!el) return;
  e.preventDefault();
  const targetId = el.dataset.dashId;
  if (targetId === dragged) return;
  const order = S.dashLayout.slice();
  const from = order.indexOf(dragged);
  const to = order.indexOf(targetId);
  if (from === -1 || to === -1) return;
  order.splice(from, 1);
  order.splice(to, 0, dragged);
  set({ dashLayout: order });
});
document.addEventListener('dragend', () => { dashDragId = null; });

/* Every screen the sign-in rail used to list, still addressable, just not
   advertised. `?screen=expired` opens the dead-link screen, `?view=rates` opens
   a page of the app. An unknown key is ignored rather than blanking the page,
   because the one thing a demo link must never do is open to nothing.
   `?screen=` also survives a reload, which the old rail did not. */
function bootScreen(){
  let q;
  try { q = new URLSearchParams(location.search); } catch(e){ return; }

  const screen = q.get('screen');
  if (screen && AUTH_SCREENS.some(([k]) => k === screen)){
    S.stage = 'auth';
    S.screen = screen;
    return;
  }

  /* COPY is keyed by view, so it is the list of views by construction and a new
     page cannot be added without becoming addressable. */
  const view = q.get('view');
  if (view && Object.prototype.hasOwnProperty.call(COPY, view)){
    S.stage = 'app';
    S.view = view;
  }
}

bootScreen();
render();
