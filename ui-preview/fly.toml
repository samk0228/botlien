# Isolated static-file host for the polished-UI prototype only. Deliberately
# a separate Fly app from the real backend (botlien-preview): this serves one
# static HTML file with no server logic, no database, no account data, so it
# never needs to touch the real app's Dockerfile, volume, or deploy config.

app = "botlien-ui-preview"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
