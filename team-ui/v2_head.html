<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Botlien Coworker</title>
<style>
:root{--bg:#F8F8F8;--side:#F4F4F4;--bub:#E8E8E8;--line:#E6E6E6;--hair:#ECECEC;--sel:#E2E2E4;--mute:#8E8E93;--mute2:#6E6E73;--ink:#0A0A0A;--blue:#1A6FDB;--green:#2FA85A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.37;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
#app{--rw:327px;display:grid;grid-template-columns:304px minmax(0,1fr) var(--rw);height:100vh;background:var(--bg);transition:grid-template-columns .35s cubic-bezier(.2,.8,.2,1)}
#app.wide{--rw:min(52%,780px)}
/* ---------- sidebar ---------- */
#side{background:var(--side);border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0}
.stop{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px}
.brand{font-size:13px;color:var(--mute);font-weight:500;letter-spacing:.01em}
.iconbtn{width:28px;height:28px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:#55555A}
.iconbtn:hover{background:#E8E8EA}
.iconbtn svg{width:16px;height:16px}
.search{margin:0 12px 6px;display:flex;align-items:center;gap:8px;background:#E6E6E6;border-radius:9px;height:33px;padding:0 10px;color:var(--mute)}
.search svg{width:14px;height:14px;flex:none}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink)}
.search input::placeholder{color:var(--mute)}
#list{flex:1;overflow:auto;padding:2px 8px 8px}
.glabel{color:var(--mute);font-size:13px;margin:14px 0 4px 12px}
.emp{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:11px;padding:0 12px;height:56px;margin:2px 0;animation:fade .3s ease}
.emp:hover{background:#ECECEE}
.emp.on{background:var(--sel)}
.av{width:38px;height:38px;flex:none;display:block}
.eb{flex:1;min-width:0;display:block}
.en{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:500;font-size:15px;line-height:1.25}
.en small{font-weight:400;color:var(--mute);font-size:12.5px;white-space:nowrap}
.ep{display:block;color:var(--mute2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;margin-top:1px}
.ub{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}
.star{color:#E0A100;font-size:12px;margin-left:4px}
.sbot{padding:8px 12px 14px;display:flex;flex-direction:column;gap:2px}
.srow{display:flex;align-items:center;gap:12px;border:0;background:none;padding:6px 8px;border-radius:9px;font-size:14.5px;text-align:left;width:100%}
.srow:hover{background:#ECECEE}
.srow .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#55555A}
.srow .ic svg{width:15px;height:15px}
.me{width:26px;height:26px;border-radius:50%;background:#0A0A0A;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.menuwrap{position:relative}
#demoMenu{display:none;position:absolute;left:0;top:34px;width:260px;background:#fff;border:1px solid #DADADD;border-radius:12px;padding:6px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.14)}
#demoMenu.open{display:block}
#demoMenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;font-size:14px}
#demoMenu button:hover{background:#F2F2F4}
#demoMenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.demo{border:1px solid #D8D8DC;background:#fff;border-radius:8px;padding:4px 10px;font-size:12.5px;color:#3A3A3F}
.demo:hover{border-color:#0A0A0A}
#conn{display:none;position:absolute;left:12px;bottom:64px;width:268px;background:#fff;border:1px solid #DADADD;border-radius:12px;padding:12px 14px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.14);font-size:13.5px}
#conn.open{display:block}
#conn b{display:block;margin-bottom:6px}
#conn div{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid #F0F0F2}
#conn small{color:var(--mute2)}
/* ---------- chat ---------- */
#chat{display:flex;flex-direction:column;min-height:0;background:var(--bg);min-width:0}
#chead{height:44px;display:flex;align-items:center;gap:8px;padding:0 20px;flex:none}
#chead .av{width:18px;height:18px}
.cn{font-weight:500;font-size:14.5px}
.cr{color:var(--mute);font-size:13px;margin-left:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.green{background:#15A34A}.dot.amber{background:#D99A00}.dot.red{background:#DC2626}.dot.gray{background:#B5B5B5}
#thread{flex:1;overflow:auto;padding:6px 17px 8px;display:flex;flex-direction:column;gap:8px;min-height:0}
.ts{align-self:center;color:var(--mute);font-size:13px;margin:10px 0 4px}
.row{display:flex;flex-direction:column;max-width:86%;animation:fade .25s ease}
.row.you{align-self:flex-end;align-items:flex-end}
.row.ai{align-self:flex-start;align-items:flex-start}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bub{padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.37}
.bub.ai{background:var(--bub);border-top-left-radius:18px}
.bub.you{background:#080808;color:#fff;border-radius:20px;padding:9px 16px}
.bub p{margin:0 0 10px}.bub p:last-child{margin:0}
.bub a{color:var(--blue)}
.bub b{font-weight:600}
.typing{align-self:flex-start;display:flex;gap:4px;padding:14px 16px;background:var(--bub);border-radius:18px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9A9AA0;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.kvc{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kvc span:nth-child(odd){color:var(--mute2)}
.choice{background:var(--bg);border-radius:12px;margin-top:10px;overflow:hidden}
.choice .ch{padding:12px 14px 8px;position:relative}
.choice .ch b{display:block;font-weight:500}
.choice .ch small{display:block;color:var(--mute2);font-size:13.5px}
.choice .x{position:absolute;right:8px;top:8px;border:0;background:none;color:#9A9AA0;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.choice .x:hover{background:#ECECEC}
.opt{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid #EEEEEE;background:var(--bg);text-align:left;padding:0 14px;height:40px;font-size:15px}
.opt:hover:not(:disabled){background:#EFEFF1}
.opt .k{width:20px;height:20px;border-radius:5px;background:#EDEDED;color:#9A9AA0;display:grid;place-items:center;font-size:12px;flex:none}
.opt .t{flex:1}
.opt .ck{width:15px;height:15px;color:#6E6E73;display:none}
.opt.picked{color:#8E8E93}
.opt.picked .ck{display:block}
.opt:disabled{cursor:default}
.opt.gone{display:none}
.snap{margin-top:6px;border:0;padding:0;background:none;display:block;text-align:left}
.snap .mini{border-radius:8px}
.file{display:flex;align-items:center;gap:10px}
.file i{width:34px;height:34px;border-radius:9px;background:#FBE9E9;color:#DC2626;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;flex:none}
.file b{display:block;font-size:14px;font-weight:600}.file small{color:var(--mute2);font-size:12.5px}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 17px 6px}
.chip{border:1px solid #DADADD;background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px}
.chip:hover{border-color:#0A0A0A}
.chip.on{background:#0A0A0A;color:#fff;border-color:#0A0A0A}
#composer{margin:2px 17px 16px;height:46px;display:flex;align-items:center;gap:8px;border:1px solid #E4E4E6;border-radius:23px;padding:0 8px 0 9px;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.plus{width:28px;height:28px;border-radius:50%;border:0;background:#EEEEF0;display:grid;place-items:center;color:#6A6A70;font-size:18px;line-height:1;padding:0}
#input:focus-visible,#input:focus{outline:none}
#composer:focus-within{border-color:#0A0A0A}
#input{flex:1;border:0;outline:0;background:none;min-width:0;height:100%}
#input::placeholder{color:#A0A0A6}
.send{width:30px;height:30px;border-radius:50%;background:#0A0A0A;color:#fff;border:0;display:grid;place-items:center;padding:0}
.send svg{width:15px;height:15px}
.send .mic{display:block}.send .up{display:none}
#composer.has .mic{display:none}#composer.has .up{display:block}
/* ---------- right panel ---------- */
#right{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:var(--bg);border-left:1px solid var(--hair)}
#rtop{height:44px;display:flex;align-items:center;gap:6px;padding:0 14px 0 17px;flex:none}
#rtop .t{font-size:14px;font-weight:500}
#rtop .sp{flex:1}
#rtop .iconbtn svg{width:17px;height:17px}
#narrow{padding:6px 17px 0;display:block}
#thumbf{height:183px;border-radius:8px;background:#ECECEC;overflow:hidden;position:relative;border:0;width:100%;padding:0;display:block}
#thumbf .mon{position:absolute;inset:0;display:grid;place-items:center;color:#A5A5AA}
#thumbf .mon svg{width:20px;height:20px}
#cap{text-align:center;color:var(--mute);font-size:13px;margin:12px 0 18px}
.mini{overflow:hidden;position:relative;background:#F8F8F8;pointer-events:none}
.mini .mi{transform-origin:0 0;position:absolute;left:0;top:0}
#wide{display:none;flex:1;min-height:0;flex-direction:column;padding:0 16px}
#app.wide #narrow{display:none}
#app.wide #wide{display:flex}
#screen{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
#tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto;background:#FBFBFB;flex:none}
.tab{border:0;background:none;padding:8px 13px;color:var(--mute2);border-bottom:2px solid transparent;white-space:nowrap;font-size:13.5px}
.tab:hover{color:#0A0A0A}
.tab.on{color:#0A0A0A;border-bottom-color:#0A0A0A;font-weight:600}
.tab .pin{font-size:10.5px;color:var(--mute);margin-right:5px;text-transform:uppercase;letter-spacing:.03em}
#cells{display:flex;flex-wrap:wrap;gap:6px 16px;padding:9px 14px;border-bottom:1px solid #F0F0F2;font-size:12.5px;flex:none}
.cell{display:flex;align-items:center;gap:6px}
.cell small{color:var(--mute2)}
#viewbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 14px 0;flex:none}
#viewbar .note{color:var(--mute2);font-size:12.5px}
#viewbar .sp{flex:1}
.btn{border:1px solid #CFCFD4;background:#fff;border-radius:999px;padding:6px 13px;font-size:13px}
.btn:hover{border-color:#0A0A0A}
.btn.primary{background:#0A0A0A;color:#fff;border-color:#0A0A0A}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{color:#3A3A3F}
#history{margin:8px 14px 0;border:1px solid var(--line);border-radius:10px;padding:6px;display:none;flex:none}
#history.open{display:block}
#history button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:6px;font-size:12.5px}
#history button:hover{background:#F3F3F5}
#history button.cur{font-weight:700}
#history .t{color:var(--mute);min-width:60px}
#view{flex:1;overflow:auto;padding:14px 14px 16px;min-height:0}
#routines{padding:0 17px 8px;flex:none}
#app.wide #routines{padding:10px 18px 6px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
#app.wide .rhead{margin:0 6px 0 0;gap:6px}
#app.wide .rt{width:auto;padding:5px 10px;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px}
#app.wide .rt b{display:inline;font-size:13px}
#app.wide .rt small{font-size:12px;margin-left:6px}
#app.wide .rt span{display:flex;align-items:baseline}
.rhead{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:13px;margin-bottom:6px}
.rhead button{border:0;background:none;color:var(--mute);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.rhead button:hover{background:#ECECEE}
.rt{display:flex;gap:10px;align-items:center;padding:8px 0;border:0;background:none;width:100%;text-align:left;border-radius:8px}
.rt:hover{background:#F0F0F2}
.rt .ic{width:16px;height:16px;flex:none;color:var(--green)}
.rt.off .ic{color:#B5B5BD}
.rt b{display:block;font-size:14.5px;font-weight:400;line-height:1.3}
.rt small{color:var(--mute2);font-size:13.5px}
#foot{margin-top:auto;padding:10px 17px 12px;font-size:12px;color:var(--mute);flex:none}
#side ::-webkit-scrollbar,#thread::-webkit-scrollbar,#view::-webkit-scrollbar,#rdetail::-webkit-scrollbar{width:8px;height:8px}
#side ::-webkit-scrollbar-thumb,#thread::-webkit-scrollbar-thumb,#view::-webkit-scrollbar-thumb,#rdetail::-webkit-scrollbar-thumb{background:#D4D4D8;border-radius:8px}
#list{overflow-x:hidden}
.fld .ic{width:16px;height:16px;color:var(--green);flex:none}
/* routine detail */
#rdetail{display:none;flex:1;min-height:0;overflow:auto;padding:0 17px 16px}
#right.detail #narrow,#right.detail #wide,#right.detail #routines{display:none!important}
#right.detail #rdetail{display:block}
.rdh{display:flex;align-items:center;gap:8px;height:44px}
.rdh .ttl{flex:1;text-align:center;font-weight:500;font-size:14.5px;margin-right:28px}
.rdrow{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
.tog{width:36px;height:22px;border-radius:11px;background:#0A0A0A;position:relative;border:0;padding:0;flex:none}
.tog i{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:all .2s}
.tog.off{background:#C9C9CE}.tog.off i{right:auto;left:2px}
.rdrow .sp{flex:1}
.lab{color:var(--mute2);font-size:13px;margin:12px 0 5px}
.fld{background:#fff;border:1px solid #E2E2E6;border-radius:10px;padding:9px 12px;font-size:14.5px;line-height:1.45}
.runs{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.runs svg{width:14px;height:14px;color:var(--green)}
/* ---------- widgets ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.w{border:1px solid var(--line);border-radius:14px;padding:13px;min-width:0;background:#fff;animation:fade .3s ease}
.w.wide{grid-column:span 2}
.w h3{margin:0 0 9px;font-size:11.5px;letter-spacing:.03em;color:var(--mute2);font-weight:700;text-transform:uppercase}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.01em}
.kpi .s{color:var(--mute2);font-size:12.5px;margin-top:2px}
.money,.hrs{border-bottom:1px dotted #8E8E93;cursor:help}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:700;color:var(--mute2);font-size:11.5px;padding:6px 8px;border-bottom:1px solid #DADADD}
td{padding:8px;border-bottom:1px solid #F0F0F2}
th.r,td.r{text-align:right}
tr.tot td{font-weight:700;border-bottom:0}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid #DADADD}
.tl li{position:relative;padding:0 0 13px 14px;font-size:13px}
.tl li:last-child{padding-bottom:0}
.tl li:before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;background:#DC2626;border:2px solid #fff}
.tl li.ok:before{background:#B5B5B5}
.tl .ts2{color:var(--mute2);font-size:12px}
svg text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px}
.legend span.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.empty{border:1px dashed #D8D8DE;border-radius:14px;padding:34px 22px;text-align:center;color:var(--mute2);background:#fff}
.empty b{display:block;color:#0A0A0A;font-size:15.5px;margin-bottom:6px}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.demo:focus-visible,.emp:focus-visible,.rt:focus-visible,.money:focus-visible,.opt:focus-visible,.iconbtn:focus-visible,.srow:focus-visible{outline:2px solid #0A0A0A;outline-offset:2px}
#tip{position:fixed;display:none;z-index:60;max-width:340px;background:#fff;border:1px solid #0A0A0A;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;box-shadow:0 8px 28px rgba(0,0,0,.14);pointer-events:none}
#tip b{display:block;margin-bottom:4px}
#tip .row{display:flex;justify-content:space-between;gap:14px;max-width:none;animation:none}
#tip .row span:last-child{white-space:nowrap}
#tip hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#tip .mut{color:var(--mute2)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0A0A0A;color:#fff;border-radius:12px;padding:10px 14px;display:none;gap:14px;align-items:center;z-index:70;font-size:13.5px}
#toast.open{display:flex}
#toast button{background:none;border:1px solid #fff;color:#fff;border-radius:999px;padding:3px 11px}
@media (max-width:1100px){
 #app{grid-template-columns:76px minmax(0,1fr)}
 #right{display:none}
 #app.wide #right{display:flex;position:fixed;top:0;bottom:0;right:0;width:min(92vw,720px);z-index:30;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
 .eb,.search,.glabel,.brand,.sbot .lbl{display:none}
 .emp{justify-content:center;padding:0}
 .stop{justify-content:center;padding:0}
}
@media (max-width:640px){
 .grid{grid-template-columns:1fr}.w.wide{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <aside id="side" aria-label="Your team">
  <div class="stop">
   <div class="menuwrap"><button class="demo" id="demoBtn" aria-haspopup="true" aria-expanded="false" type="button">Demo</button>
    <div id="demoMenu" role="menu">
     <button type="button" data-d="setup">1. Setup by conversation</button>
     <button type="button" data-d="messages">2. Employee messages</button>
     <button type="button" data-d="ask">3. Ask anything</button>
     <button type="button" data-d="build">4. Build a dashboard</button>
     <button type="button" data-d="pause">5. Pause and resume with Undo</button>
     <hr>
     <button type="button" data-d="viewer">View as a teammate (Sam)</button>
     <button type="button" data-d="reset">Reset demo</button>
    </div>
   </div>
   <button class="iconbtn" id="newEmp" type="button" aria-label="New employee" title="New employee"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
  </div>
  <label class="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg><input id="q" type="text" placeholder="Search" aria-label="Search your team"></label>
  <div id="list"></div>
  <div class="sbot">
   <button class="srow" id="connBtn" type="button"><span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v3M10 2v3M4.5 5h7v3a3.5 3.5 0 0 1-7 0V5ZM8 11.5V14"/></svg></span><span class="lbl">Connections</span></button>
   <button class="srow" type="button" tabindex="-1"><span class="me">A</span><span class="lbl">Antonio D'Angelo</span></button>
  </div>
  <div id="conn"><b>Connections</b><div><span>Universal Robots</span><small>Read only</small></div><div><span>Slack #production</span><small>Messages out</small></div><div><span>Email</span><small>Daily summary</small></div></div>
 </aside>
 <section id="chat" aria-label="Chat">
  <header id="chead"></header>
  <div id="thread" aria-live="polite"></div>
  <div id="chips"></div>
  <form id="composer" autocomplete="off">
   <button class="plus" type="button" aria-label="Attach" tabindex="-1">+</button>
